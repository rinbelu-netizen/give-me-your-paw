<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey buddy, give me your paw! 絵日記帳 - 2017年9月</title>
<style>
  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --border: #e8dfd0;
    --text: #4a4238;
    --text-muted: #9a9082;
    --accent: #c98a5e;
    --accent-bg: #f5e6d8;
    --accent-text: #8a5a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 16px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .controls {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-btn {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
  }
  .tag-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .count {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .entry-title {
    font-size: 16px;
    font-weight: 500;
  }
  .entry-date {
    font-size: 12px;
    color: var(--text-muted);
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
    margin-bottom: 12px;
  }
  .photo-grid a {
    position: relative;
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: var(--accent-bg);
  }
  .photo-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-grid .num {
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 1px 5px;
    border-radius: 8px;
  }
  .no-photo {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .truncated-note {
    font-size: 12px;
    color: var(--accent-text);
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 6px 10px;
    margin: 0 0 12px;
    display: inline-block;
  }
  .entry-text {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 12px;
    white-space: pre-line;
  }
  .entry-text b {
    color: var(--accent-text);
    font-weight: 500;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--accent-bg);
    color: var(--accent-text);
    cursor: pointer;
    border: none;
  }
  .comments {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .comments-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .comment {
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-bg);
  }
  .comment-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .comment-meta .author {
    color: var(--accent-text);
    font-weight: 500;
  }
  .no-results {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    display: none;
  }
</style>
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#c98a5e">
</head>
<body>

<header>
  <h1>Hey buddy, give me your paw! 絵日記帳</h1>
  <p>ウィペットのぽー＆バド（＆うめ）と暮らす日常あれこれ ― 2017年9月 ― 徳島 夏休み記録その１（全文復元） ※so-netブログ・archive.orgより復元／写真は保存されておらず未掲載</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="キーワードで探す（例: 震災、ドッグラン、うみちゃん）">
  <div class="tag-filter" id="tagFilter"></div>
</div>
<div class="count" id="count"></div>

<main id="main"></main>
<p class="no-results" id="noResults">該当する記事が見つかりません。</p>

<script>
const entries = [
  {
    "date": "2017.09.05",
    "title": "ぽバドと夏休み〜その１。",
    "tags": [
      "ぽー",
      "バド",
      "ume",
      "徳島",
      "夏休み",
      "2017年9月"
    ],
    "images": [],
    "photosLost": true,
    "text": "爽やかな空気になり季節は秋めいてきたけれど、\nまだまだこれからが夏本番だった暑い7月1日のこと。\nぽバドの目前に広がるのは瀬戸内海と明石海峡大橋。\n続きはこちらから〜↓\n世のなかよりもひとあし早い夏休み。\n7月1日〜14日を徳島にて過ごしておりました。\n四国へ上陸したのはお昼すぎ。夜ご飯調達のため徳島市内へGO！\nぽバドを迎える前からの、10年来の行きつけのお店。\nモツに関してはここのしか食べられなくてーって、あれ？閉まってる？！\nそれどころか「体調不良のため閉店します」なんて張り紙が・・\nとても気になってそのままでは帰る気になれず、図々しくもご自宅を訪問。\n会えました〜(*´∇｀*)ひとまずご夫婦ともにお元気とのことで一安心。\nあれこれお話もできて、横浜土産も渡すことができマシタ。\nあろうことか、逆にお肉を頂いちゃって夜は予定通りBBQができる〜♪\n半年ぶりの徳島の自宅は、カビも生えず爽やかなままでこちらも一安心。\n横浜へ越すちょうどその日に蹴破った障子の前でくつろぐのはバド（笑\n徳島でのBBQスタイルは、土間の灯を点けて犬走りに七輪でというのが定番。\nなのだけれど、この日は七輪を庭の中央まで移動させマシタ。\nなぜならば。\n軒下では燕、シャッターボックスでは雀が巣を作り子育て真っ最中だったから。\nモクモクと煙が立ちのぼり、ヒナの燻製ができそうで。。。(;ﾟ∇ﾟ)\nいつものように、ぽーがしびれを切らし始めたところで部屋のなかへ。\nお待たせ〜ちゃんとぽバドの分も焼いてたさ〜〜♪\nそして翌日の7月2日には、午前中に可愛いあのコが里帰り♪\n耳ぺったんこでたっつーに甘えて、\nうめママにも甘えまくりなうめコさん♪\nお昼ご飯を食べに「climbing」に移動しますょ〜！\nシンクロする、ぽー&うめ。\n後ろから見てもほぼ相似（笑\n愛さんの声に、おいしいもの想像してむくっと起きあがる。\nそれはクライミングに来るほぼ全てのイヌたちの共通点やね（笑\nきた、きた。お待ちかねの、おやきが来ましたょ〜♪\nだが、しかし。この後、うめの表情はどよ〜んと一転しマス。\nなぜならば。\nトリマーのRyokoさんに確保され、爪切りされちゃうから〜（笑\n始めは椅子の下に潜り込んで抵抗するけれど、結局はされるがままなうめ（笑\nRyokoさんともパピーの頃からのおつきあいだもんね〜♪\nこの日はうめとはここで一旦お別れして、午後からは砂浜へGO!\n大きなエイに会いました。続きはまた次回へ〜〜\n<おまけ>\nジタバタして３頭並べてうまく写真撮れず苦戦するの図（笑",
    "truncated": false,
    "comments": [
      {
        "author": "うめママ",
        "date": "2017-09-08 22:02",
        "text": "はや、２ヶ月経った事にビックリ！ ぽーさんとのシンクロ、やっぱり兄妹やな～♪ それにしても、捕獲されてから爪切られてる間もシッポは超内巻きやな(笑)"
      },
      {
        "author": "micky",
        "date": "2017-09-20 14:27",
        "text": "＞うめママ すでにさらに日数が経過していく〜^^; 次のブログ用の写真は用意しているのに・・ うめの表情がおかしくて、おかしくて・・あはは笑 もうほんと分かりやすいよね〜！うめの次の写真も早く記録しなくちゃ♪"
      }
    ]
  },
  {
    "date": "2017.09.20",
    "title": "6年。",
    "tags": [
      "バド",
      "2017年9月"
    ],
    "images": [],
    "photosLost": true,
    "text": "2017年9月20日の本日。バドと暮らし始めてまるっと6年になりマシタ♪\n真剣な表情で6歳のバドが見つめているもの、それは・・・\n続きはこちらから〜↓",
    "truncated": true,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
