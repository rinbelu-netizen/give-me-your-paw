    "text": "カラっと晴れた１７日の金曜日。再びルーク＆レイルとPREMIREへ。\n看板犬のトトちゃんとも会えました。\n苦手だという駐車場の砂利を恐る恐る歩く姿と、\nディスクを追うこの眼差しとのギャップがなんとも可愛い。[1]\n前回と違ってとっても良い天候！さぁ、遊ぶのだっ！[2]\nよーく見ると、一緒に走っている風ではなかったりする。\nそりゃあね～、今までは年に一度会うくらいだったのだもの。\nこれから慣れてくれるといいなぁというのが飼主たちの願望。\nそれにしても、走り方に体型にふとした表情だったり。\nやっぱり似ていて楽し過ぎ。[3]\nほんの僅かな時間だけれど、遊ぶ素振りを見せたこのふたり。\nこれからにちょこっと期待しちゃう。[4]\n湿度は低めでも、やはり陽射しがしっかりなこの日。\n水を与えようとしたけれど、レイルに夢中なぽーを見て、\n「かまわん！かけちゃえ～っ！」と、ルーレイママをけしかける。[5]\nが、一向に気にしないぽーにレイルが自ら抗議する。[6]\nさぁ、弟レイルのピンチです。\n頼れる兄ちゃんルークの登場に、ぽーに一瞬緊張が走る。（が、虹が出ていてちょっと感動～）[7]\nぽーとルーク、お互いに挨拶を交わし・・[8]\n喧嘩になることはなく、無事に回避するルーク＆ぽー。[9]\nちょこっと前まで、ぽバドと同じく未去勢♂だったルーク。\n以前は彼らをフリーでなんて、到底できる状況ではなかったのです。\n少しずつ関係の変わってきているぽー＆ルーク。\nそれでも小競り合いはあるけれど。\nこの下の写真、ぽバドで似た光景をよく見るけれど、\nぽーとルークの場合は色々とチガウのですょ。[10]\nほんとはこうなる前に、止めなくちゃいけない。\nましてや写真を撮ってる場合じゃないんだけれども。（それもこれもルーレイ家との、あれやこれやのお付き合いのおかげなのです）\n彼らのボディランゲージを読み取り、\n先行して対処できるようになりたい私。\nそもそもイヌや動物の観察が趣味だもんね～（しかしこうやって写真に残せると興味深い発見ができるかも！）\nさて、兄ちゃんたちが大人の事情でややこしい頃、\n我が家のお笑い担当バドくんはというと。[11]\n「ボール投げてっ」とおねだりしては、大喜びでかけまわり。[12]\nレイルのカラーを試着させられたり、[13]\nルークのカラーを試着させられたりしておりました。[14]\n散歩の仕方が今までと変わり、\nすでにぽーの筋肉がすこーし落ちつつあるけれど、\n大丈夫。飼主と同じく、ぽバドはどこに行ってもやっていけマス。[15]\n暑いのと嬉しいのとで、\nもはやイヌではなくなったりもするけれど。[16]\nぽバドとルーレイの関係がどう変化していくのか。\n飼主たちも非常に楽しみな『これから』なのです。[17]",

    "text": "怒濤の転勤騒動から間もなく1ヶ月。\n記録を兼ね引越から今日までを振り返ってみようかと。\nとはいえ、私の記憶が既に定かでなかったりするし、\nオチも無しの正真正銘の何の変哲もない回顧録なり。\n先ずは引越前日、4月24日のこと。\n車がないと生活できない田舎のこと、我家も１人１台の所有率。\nが、新居ではそうもいかないわけで。たっつーの愛車が運ばれていくのを、涙をこらえて見送ります。[1]\nなーんて、大切な愛着たっぷりビートくん。\n売ったりなぞするものか。実家の両親に託します。（義父母のデートに使ってもらうんだ～という名目でおしつける）\n家に残していくもの、新居に運ぶもの。\nお任せパックの意味があるのか、と思うほどに片付けられた荷物たち。（それでも、鍋の蓋を忘れきていたりとかするのよね～。）\nようやく腰を落ち着けた私たちに安心したのか、\n夜にはこんな顔して寝ちゃうぽーさん。[2]\nが、翌朝。\n搬出作業の邪魔にならぬよう、部屋の隅っこで待機なぽバド。\nいつもなら屋内に入ったヒトならば、歓迎モードのぽバド。\nだけれども、やはり引越作業は別らしい。\nぽバド協力体制で、忙しく出入りする作業スタッフを見張る。（ちなみにぽーは庭側、バドは屋内担当らしいです）[3]\nぽバドやうめが走り回っても、破られることのなかった障子。\n搬出作業が終わりに近づく頃・・・\nやっぱ記念に残しておかなくちゃ、だよね～バドくん。[4]\nご近所さんに美味しいパンを頂いたり、\nひなはる父と再会の約束を誓い合ったり。\nその後、車を走らせ向かった先は、\nアクアペンションクチェッタ。→はじまりの旅（料理写真をしっかり撮っていないうえに、センスのない加工だよぅ・・）[5]\nのんびり宿に泊まり、オマール海老のパエリアに舌鼓を打つ。\nあまりの快適さに、全く転居するという実感がわかない夜。\n4月２６日。不動産業者に立寄り新居の鍵をget。実は私、この時が初見だったりする。\n（会社都合で内見可能日も二転三転し、イヌの預け先にも苦労する日々。\n結局、両親が来てくれたけれど諸事情により内見叶わずで。しかし両親と四国日帰り旅行ができたじぇ～な、裏事情。）\n３時間弱で搬入作業も終わり、弟の手も借り一応寝床も確保。\n徒歩数分でスーパーに行けちゃうことや、\n２２時を過ぎても人が歩いていることに感動しつつ、\n長い引越の旅は閉じる。（食器棚の組立がそれはもう大変だったのだー）[6]\n引越回顧録はまだまだつづく・・・（は、早めに終わらせよう、うん。）",

    "text": "犬連れ引越回顧録のつづき。\n引越後の数日は、片付けに追われてご飯を作る余裕はナシ。\nだけど大丈夫。ちょっと歩けばお店があるのだ。\n散歩のついでに牛丼だって買えちゃうではないか～。[1]\n田舎、愛してます。だけどね、やっぱ便利な地域も好き。\n見慣れぬ風景に、馴染みのない地名。どこへ散歩に出かけても楽しい。\nのんびりたっぷり２人＆２匹で散歩。[2]\nが、やっぱ緑があると落ち着くな。[3]\nと、そんなのんびり散歩をようやく出来たという安堵感か。\n引越し後３日目という節目だったからか。\n溢れ出す疲労感に、飼主２人は撃沈。\n翌日は「何もしない」ことを努力して行ってみる。\n一方、ぽバドはいつもと同じ・・というわけでもないようで。\nバドに踏まれても、ぽーが珍しく怒らなかったり。（決してヤラセではなく。ほんとにこんな状態で。。しかも、寝ていたバドw）[4]\n仲良し度が以前よりもUPしていたり。[5]\nぽーがバドを〆たり。・・・と、これはいつもと一緒だな。[6]\n4月30日。初めてぽバドに留守番を課してみる。\nどきどきわくわくな帰宅。\nはてさて、足元の惨状はどちらの成果？それとも共同作業デスカー？[7]\nと、ちょうど同じ頃。うめも留守番中で。\nそして彼女は、家の改築を行おうとしていたらしい。[8]\nあぁ、うめちん。\n「モノを破壊するくらい構わないさ。健康ならば！」\nと、悟りをひらいたある日を思い出したョ。\n散歩と片付けに明け暮れる日々。\n荷物を持ち上げようとした途端、軽く腰に違和感。\n痛みはあるがまだなんとか歩ける。\n同じく疲労しているだろうたっつーを連れ整骨院へ。\n怪我の功名って、ケガのことだっけ？（←いや、チガウでしょー）\nともかく、良い病院を見つけられたもんね～。\n５月１日より、たっつーは新部署での仕事開始。\nエンジンフル稼働で動く私たちのことを予見していたに違いない。\nほっと一息ついてね、と健康茶セットが届けられる。\n美味しい健康茶にのんびりまったり。\nそして、友人からの電話で口はフル稼働（注：たっつーは仕事中～）[9]\nGW後半、引越前から地図で確認していた公園へ。\nやはりどこへ行ってもヒトはいるけれど、\nそれでも森は心やすらぐ場所。というか、整備されていて超快適。[10]\nあ～。ぽバドのその表情。それが見たかったのだょ。[11]\nしっかりのんびり歩いたけれど、ドライブがてら海の方へも。\nあの海岸のように走りまわることはできないけれど。\n波の音と潮の香りがなんだかすでに懐かしい。[12]\nその日の夜、いつにもましてぐっすりと眠るぽバド。\n夢に見ているのは今日のことか、はたまた四国の海か。\n「半開き」 口はぽー、目はバドが担当でオヤスミ～。[13]\n引越回顧録、もうすこしつづく・・かもしれません。",

    "text": "引越回顧録はお休みして、昨日のことを。\nトレッキング・・・否。ハイキング好きな私たち。\n転居してから、たっつーと共に２回訪れた自然公園。\nこちらでの運転、そろそろ私も慣れなくちゃね～。（会いたいヒトが、イヌが沢山いる。高速にも挑戦せねば。電車も乗らにゃー）\nというわけで、ぽバドを連れてぷぃ～んと行ってみました。[1]\n今回で３度目というに、まだまだ全体像は不明なこの森。\nというのも、かなり広大でルートも様々だから。\nつまりこれからも楽しみがたっぷりなのだよね～。\nハイカーやトレイルランナーにより踏み固められた道を行く。\n地図は携帯しておいた方が無難だが、\n道も整備されているので余程でない限り迷うことはないかも。[2]\nなだらかな路もあれば、狭く急な階段が続いたりもする。\n起伏に富んだ路が続くのでなかなかに面白い。[3]\n標高156mの山頂。さすがに物足りなかったけれど、\nここでちょっとした嬉しく貴重な出来事がありました。（リードがつんつんでちと苦しそうやな～）[4]\n生後５ヶ月のラブラドールを連れたご家族と出会う。\nうっかり写真を撮らせて頂くことを忘れてしまったけれど、\nそのコがまぁなんと、うめとそっくりだったのです。\n毛質も、色の入り方も、そして顔の雰囲気までもが。\nなんだか嬉しくて、うめの写真を見ていただいたりして。\n「似てますよね～！ラブも入ってるのかしら」\nなんて、静かな山頂で大盛り上がり。\nそのうめの写真というのが、先週もらったばかりのコレ。（むふ～見直してはにまにましちゃう）[5]\nところで、そのラブとぽバド。\n上手に挨拶もでき問題なさそうだったのだけれど、\n私がそのコに触れた途端、ぽーが怒ってしまった。\n飼主さんは「このコが気に障ることをしたのかも」と。\nきっと私のせいなのです。\nうめと似ている嬉しさなどから、\n気持ちが昂ったままそのコを撫でようとしたのだもん。\nさらにその方は飼主さんというよりも、パピーウォーカーでした。\nつまり、そのラブの女のコは盲導犬候補生。\nヒトや環境など様々なことに触れさせるべく、\n子犬時期の１年ほどだけ自宅で預かるというボランティアさん。\nあと半年もすれば訓練のためにお別れになるわけで・・\nぽーや私とのやりとりが、良い経験の一つになればいいなぁ。。\nそして何より私にとって嬉しい貴重な体験になりました。\nさてさて、山頂を離れ再びテクテク歩く。\n小腹がすいてきたし、そろそろお昼ご飯にしようかな。\n私はコンビニ弁当。ぽバドにはおやつを持ってきたョー[6]\nぽーは「写真を撮り終えるまで貰えないんでしょ」な感じか。\nそしてバドは・・・食べてるイメージトレーニングかしらね～\n少しのんびりしてから再び出発。\n地図には「池」と表示されていたけれど、そこはまるで湿原。\n鉄板や木板の細い路がすこしだけ続く。これは渡るの嫌がるだろな～と懸念しつつ、進ませてみる。\nさすがのバド。平気ですたすたと渡り終える。\nぽーに至ってはなんと、鉄板部分を全てジャンプでクリア。[7]\nとはいえ、ぽバドが泥よけ用の踏板を歩いてくれるわけもなく、\n足先をしっかりと汚しながらさらに歩を進める。\nと、次なる試練がやってきた。\n遊歩道を塞ぐ倒木を不気味がり、ふたり揃って近寄らない。[8]\nぽバドの前を行き「何でも無いょー」と、倒木をげしげし蹴ってみる。\n剥がれた木皮がぽーに命中。余計にびびらせることになる。[9]\nそれでも気分を盛り上げ、一気にジャンプ。\nと、そんなことをしたりしつつ、\n予定通りの２時間強で今回のぽバドと行くハイキングは完了。\n次はたっつーも一緒に行こう。うん、そうしよう。[10]\nその日の夜・・・爆睡モードなぽバド。\nそしていつものように、ソファに座れない飼主なのデシタ。（ちなみにたっつーは四国出張で不在でした～）[11]",

    "text": "ぽバドのごはんが出来上がるまでは、「座って待つ」のが我が家でのルール（というのを目指している）。\nだけれども、\nごはんの行方をしっかり見ておきたいのがバド。\nついついカウンターにへばりついてしまう、対面キッチンな四国の家。（だぁれ？テーブルに足をかけているコは?!）[1]\n新居の台所は壁で仕切られ、出入り口はこんなスペースだけ。\n残念なことに、ごはんの出来上がる様子はよく見えない。[2]\nお利口バドは「下がれ。スワレ。」 で、この通り。[3]\nごはんに夢中でも、ちゃんと聴きます。・・まじで。\nでもね。飼主たちが油断していると、こうなる。[4]\nごはんに集中していても、指示には従います。シャキっとね。[5]\nちなみにぽーは、呼ばれるまで座ってます。\n半端ない目力を発揮して、待ってます。[6]\nごはんに集中していても、指示を聴いているバド。\n指示を聴くけれど、ごはんに夢中なバド。\n呼ばれるまでじっと座って待つぽー。\nぽバドにとっては、ごはんと直接結びついてないルールかもしれない。\nそれでも、何かには繋がるかもと続けているルール。\n試行錯誤していくのも「しつけ」なのだ。きっと。\n一つだけ、解った気がすることがある。\nそれは、バドの首や舌がちょっと長めな理由。[7]",
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
