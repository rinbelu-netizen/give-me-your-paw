    "text": "数いるぽバドのトモダチわんこたち。そのなかでも、体力と必要運動量が断トツなのはこのコでしょう。それは、ボーダーコリーのNEOちゃん～。[1]\nそして、年齢を感じさせない体力の持主といえば、ワイマラナーのむぅちゃん～（間もなく７歳だっけ？？）⇧訂正：なんと９歳だった！！[2]\n持久力はないけれど、アドレナリン放出量は任せろ、なのは、みんなのアイドル ぽー＆バド。午後から雨予報だった水曜日。強風に煽られた砂に目をやられつつ、そんな４頭でテクテク散歩を楽しんできました～[3]\nイヌたちはそれぞれに探検を楽しみ、飼主たちは有酸素運動をしながらひたすら歩く。おっ。バドが何かを発見したようですょっ。[4]\nん～パイプに靴がひっかかってるのが不気味なのか？と、思っていたら、どうもバドの視線の先は靴ではないヨウダ。[5]\nん～なんじゃそれは？？ていうか、バドくんそんなに頑張らんでええよぅ～私も近づいて確認してみる、っと・・・[6]\nあー、あれですね～。ヘッドマネキンというやつですね。しかも、程よく焦げてます。・・ってか、怖いわっ！この場所、ホンモノが落ちていてもおかしくない雰囲気だもんねぇ ちなみにこの頭部に反応したのはバドだけでした。ぽーとNEOちゃんを行かせたら、一瞥しただけでスルー。さてさて、ひとしきり盛り上がったところで海のそばへ。泳ぐのも、木の枝（時には丸太）も大好きなむぅちゃん。さっそく海へと枝を放ってもらう。[7]\nすると案の定、投げられた物を追いかけたくなる彼が、ずずい～っとやって来る。[8]\nそして果敢に飛びこみますよっと。[9]\nそうそう。やはり、一度は沈んでおかないとね～[10]\nみなに出迎えられながら、レトリーブ成功だじぇ～[11]\n危ないものだといけないからね。兄ちゃんが確認しなくちゃね。むぅちゃんの枝を取り合うぽバドを眺めるNEOちゃんと、しょぼーんと海を見つめる不憫なむぅさん。[12]\nこの後、もう遊ばないだろうと根拠のない判断で、飼主はおもむろにぽバドの服を脱がせるのだった。その結果、あふぉ走りを開始するぽー＆バド。（すっ裸になった開放感かもネ）ウィペット２頭が、本気で砂浜を駆け回ると何が起きるか・・ニンゲンの頭上から砂が降ってきま～す。つまり、そこまで砂を蹴りながら走っちゃうんですよね～。みんなごめんよぉぉぉ。（ちなみに、NEOちゃんはあふぉ走りなどしません）[13]\nイヌたちの砂を落とし、タオルで拭き拭き。飼主は顔に砂をまぶしたまま、カフェ・クライミングへ。と、その前に。久しぶりにトティに会ったのだ～父とトレイルランニングに励むトティ。（ぽーを捕獲しながら撮ったら、こんな写真しかないー）ぱぴぱぴだった表情も、すっかりおっさん男のコになって、まぁ～[14]\nさてさて。カフェでは、おなかがすいたり、眠かったりそれぞれなイヌたち。[15]\nあ、起きてた。[16]\nうとうとするんだけど、皆が気になって観察してたよね～しばらくすると、新たにお客さんが来た気配足音がする。そう。この足音と、見なくても伝わる明るい雰囲気は・・・[17]\n意外にかなり久しぶりのうみちゃ～ん。ぽーとは幼馴染み、というより、もはや姉弟的存在なのです。おなかすかせたイヌたちのごはんがとうちゃく。ぽバドには、今日はチャーハンだぞ～。（写真撮れなかったから、うみちゃんとこから勝手に画像を盗ってきた）[18]\n２頭いるとね、大変なのだ。右手にぽー用のお皿、左手にはバド用。先ずはオスワリさせなくちゃ、っと。フライングするバドに苦戦していたら、ずしっと右手にかかる重み。なんとそこには、皿をすっぽりと覆う黒い後頭部。これこれ、と言ってる間に左手にも加わる重み。うんうん。私の初動ミスだな。もー、好きなように食べたまえ。ぽーは途中で、むぅちゃんのを貰いにいってたね～[19]\nそうそう、柔らかい光をバックに、良い雰囲気な写真が撮れたょ～。（↑なぜこのタイミングで登場なのでしょね～）[20]\nヒトもイヌもおなかいっぱい。この記事も写真いっぱい、そろそろお開きにしましょうか。むぅママ、スマホを忘れないようにしないとね～ポケットに入れて、・・・って、そのポケットは何なんだ？[21]\n艶つや毛並みのポケットは、むぅちゃんの皮デシタ。去年からのこつこつダイエットで、４kgは痩せたかもなむぅちゃんの余った皮なのデシタ～。この時、どんな顔してたんだろなぁ～\nと、そんなこんなの、飼主＆ぽバドの楽しい１日と、長いブログ記事はこれにておしまい～",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
