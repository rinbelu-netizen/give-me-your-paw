    "text": "みなさんお気づきかもですが、私はイキモノ観察が趣味です。ましてやイヌ観察となると・・・むふふ。\n身近に接している犬種としては、牧羊犬のボーダーコリーに使役犬のバーニーズたち。仕事内容は大きく異なるけれど、狩猟犬のワイマラナーとウィペット。\n一緒に遊んだり散歩をしていると、そのグループ毎の特徴や違いがよくわかりひじょーにオモシロイ。先日書いたようにぽバドは「冒険散歩」を好みます。\n冒険を始めると、軽く１時間以上は歩くわけだけれども。さらにそれ以上の時間をかけて探索＆冒険を好むコ。ワイマラナーむぅさんと、金曜＆日曜と続けて冒険散歩に行ってきました。[1]\n今まで、ヒト見知りイヌ見知りと、紹介してきたむぅさん（実は本名はムギ）分析の結果、性格は簡単にいうと乙女だとオモウ。\n恥ずかしいのと（ぽバドの）遊び方が分からない日々だったむぅさん。会うたびに変化が現れ、そしてこの日はかなりノリノリ。[2]\nバドとむぅさんの相性が合っているらしいことや、遊び慣れている場所ということも後押しになったのかも。砂埃を巻き上げながら走るぽバドと、[3]\nノリノリ、わふわふ。[4]\n走ってばかりでなく、冒険散歩もしたけれどね。たっぷり遊んだ後は、カフェ／クライミングにておやつを見つめる。[5]\n片時もmitomonさんと離れたくないむぅさん。冒険散歩中でも彼女が飼主と離れられる距離は数メートルなのです。それなのに、むぅさんを置いてどこかへ行ってしまった。リードを引きちぎってでもmitomonさんの元へと行きたいのだけれど、私の「オスワリ＆マテ」コマンドにどきどきしながら答える。[6]\n怒られるかもしれないのが怖くて、ひたすら耐える。（もちろん、私は怒ったりしてないょー）小さな声で泣くむぅさんを気にするぽー。いちおうバドもね。[7]\nあぁ、むぅちゃん。ごめん。その今にも泣きそうな表情も可愛いんだけど。[8]\nむぅちゃんにとって長い長い３分間だったよね。よくがんばった～。前日もトモダチと遊んでおつかれむぅさん。[9]\n私たちもいるのにこの姿。ちょっと、めっちゃ嬉しいのだけど。[10]\n今回の記事で伝えきれたかどうか不明だけれど。とにかく、むぅちゃんは飼主命なのである。が、日曜の冒険散歩、たっつーの登場でこれまた状況が変わるのだ。その様子はまた改めて～◀おまけ▶帰宅後にシャンプーをされようとしているぽバド。[11]",

    "text": "ワイマラナーのむぅちゃんと、ウィペットのぽバド。どちらも狩猟犬なのですが、猟の内容は全く異なります。（以下、私のしょぼーい知識がベースになっとります）\n猟師が仕留めた獲物の場所を示したり、回収をしたりなど、何でもこなす元祖「狩猟犬」なワイマラナー。クマやイノシシとも闘えちゃったりします。\n一方、ドッグレースで有名なウィペット。ウサギ狩りや、小動物を探して捕らえるのも仕事。農家などでは害獣退治を担っていたそうな。\n庭先で放し飼いにされ、ご飯や休憩時に自分の意志で家に戻る、そんな姿を想像しちゃう。（たっつー曰く、まるでルンバやね～。・・・確かに！！）\n要するに、ワイマラナーは猟師の指示に忠実に従いながら狩りを行う。ウィペットは自らの判断で探索し獲物を捕らえる。わけですな。\nということを念頭に置きながらの、独断と偏見な観察日記。金曜日には３頭＆２人でひたすら歩く散歩を楽しんで、日曜にはたっつーも一緒でさらにノリノリだったむぅさん。[1]\nむぅちゃんがさらにノリノリだったワケ。それは、たっつーが「枝を投げる⇨むぅが取りにいく」遊びを、飽きることなく永遠に、永遠と続けてくれるから。[2]\n前回の記事にも書いたけれど、むぅちゃんは飼主の側から離れられないコなのである。はずだったのだけれど・・・もはや、飼主が誰なのか不明になっているむぅさん。コマンドを出さずとも、たっつーにぴったりついて歩く。[3]\nこの様子を見て、ふとオモッタ。狩猟犬としての、ワイマラナーの血が働いているのではないかと。たっつーが投げる枝は獲物。そして、それをレトリーブする。むぅちゃんにとって、この時のたっつーは猟師（飼主）なのかも。だから、次の指示を与えられるまでぴったりついて待つ。アイコンタクトまで取っちゃって、まぁ！（私の方が会う回数は多い。が、こんな関係は築けてましぇん）[4]\nさてさてここで。お待ちかねの（←このブログの主役だもんね！）、「自分で考えて猟をする」ウィペットたちを見てみましょう～え～・・・こんな感じになってます。[5]\nぽバドと飼主の名誉のために言っておくとですねぇ。「つけ」→意識させれば出来る。「呼戻し」→もちろん出来る。たとえ飼主のすぐ後ろにつかなくても、飼主の存在を意識して距離を保つので、逃亡することはない。鳥やネコなど小動物がいたとしても、追いかける前に「マテ」をさせれば問題ないのだ。猟師とともに行きますなむぅさんはテクテク、そしてぽバドは探索に精を出しますよ、と。[6]\nちなみに、探検隊ぽバドの後について行くとこうなっちゃう。（mitomonさんのこの台詞、私の後について来たときのものなのだけどね）[7]\n走る姿は壮観だけれど、走ってばかりじゃ足を痛める。けっきょくはヒトが、私が、後付けした妄想かもしれないけれど。ウィペットらしさを尊重した散歩をしてやりたいとオモウ。（田舎暮らしだからできることなのだけれどね～）[8]\n犬種特性に、もちろん個体差もあるだろうけれど。楽しそうにしてるから、とりあえずはこれも正解なのだとオモウ。[9]\nむぅちゃんにとっては、これも楽しみの一つなのよね～[10]",

    "text": "ぽーがぽそっと呟いていた通り、１月２６日の土曜日、桃が届きました～。もとい、桃ちゃんが遊びに来てくれたのだ。たっつーにとっては後輩で、私にとっては仕事仲間だった彼女。あ・・知り合ってから、もう１０年近くになるのかも。\nもちろん、ぽバドとは初対面。先ずは、疾走をご覧いただこう。ということで、冷たい風が吹く海岸へ。[1]\nヒト嫌いではないけれど、自ら甘えにいくことはしないぽー＆バド。撫でようとすると、ふいっと逃げてしまうぽバド。覗き込みながら目を合わせると吠えることのあるぽー。\n等々、このブログに書き綴っていた、ぽバドの癖あれこれを熟読してくれたという桃ちゃん。なんとなんと、初対面から１時間も経っていないというに、ぽーが特別なヒトにしかしない足元すりすりをしちゃいました。\n共に海岸を歩いている私たちも、なんだかいつも一緒に散歩しているような、そんな気になる程に自然に振る舞ってくれる桃ちゃん。バドなんてば、夜は彼女の膝を占領して眠ったりなんかして。（来客中にぽバドがここまでリラックスしてるの初めて見たかも）[2]\nさてさて、遠路はるばる来て貰っておいて、ぽバドの相手ばかりじゃ申し訳ない。というわけでちょこっと観光へ出掛けてみる。国の天然記念物にも指定されている、「阿波の土柱」へ。土柱とは、砂礫層が風雨により浸食され柱状になったもののことだそうな。\n写真から大きな蟻塚のようなものを想像していたら・・・とんでもない規模デシタ。南北約90m、東西約50mの範囲に立ち並ぶ土柱。柱の高さは10mほどらしいので、崖の高さは50mはあるかも。麓と中腹の２カ所に展望台があり、中腹側からの眺めを撮影。（広角レンズを忘れたことが悔やまれるー）[3]\nココはドコ？日本じゃないみたいやね。実はここ、去年の５月にチェルブリも訪れているのです。ほめ家のブログを拝見すると苔と霧で、これまた良い雰囲気。広角レンズ持って、違う季節にまた来ようっと。\nこの土柱、正面から眺められるだけではないのだ。崖の上にまで登れちゃう。しかも、柵がない。で、真上から撮ってみたけど・・・わかんないね～[4]\nもいっちょ、だめ押し。ちなみに夜はライトアップしているらしい。（私なら落ちるかも）[5]\nさてお次ぎは、来客時の恒例になりつつある「鳴門の渦潮」見物。うず潮は瀬戸内海と太平洋の潮位差により生じるため、大潮の時期にもっとも渦が大きくなる。そして、見頃は満干潮時刻の前後１～２時間。\n桃ちゃん、やったね！大潮で干潮時刻12:40なこの日、私たちは13:30発の船に乗込む。お陽様も出てるし、ぽバドは車内でぬくぬくお留守番。[6]\n一昨年の渦潮見物時には満員御礼だった船も、季節外れな冬の週末だからなのか４組だけを乗せて出航。満面の笑みを浮かべてはいたけれど、、、やっぱ寒かったョ。[7]\n次から次へとあちらこちらで出来ては消えていく大きな渦。ん～高Hくんと行った時よりも、大きくしっかり渦を巻いてたかもー それにしても、何度行っても楽しいナ。（←案内する側が最も歓んでるw）[8]\nぽバドに会うために遊びに来てくれた桃ちゃん。将来、いつか、バーニーズと暮らすことが夢だそうなのです。（ウィペットじゃないんだってさー）バニ友のみなさぁぁ～ん～みんなのブログ、楽しみに見てるんだって～しかし、桃ちゃんは生バニに会ったことがないそうな。というわけなので、次に遊びに来た時には、彼女にバニの魅力をたっぷり伝えてやってくださいな～桃ちゃん、また遊びにきてね～[9]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
