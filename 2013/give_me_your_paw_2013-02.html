      "https://stat.ameba.jp/user_images/20130216/16/rinbelu/7a/1e/j/o0400029812422036559.jpg",

    "text": "ぽーはお利口で、うめちゃんはとても賢い。そして、バドは・・・天才なのである。[1]\n天才とは、生まれつき備わっている並外れて優れた才能。あぁ、もうほんとその通り！そして、天才の考えや行動には計り知れないものがあるのだ。\n予想不可能なバドの天才ぶりは、うめちゃんと暮らした１ヶ月の間にも沢山見られた。ぽーがうめを叱ると、「ぽー兄、もう堪忍してあげてっ」、という感じで間に割って入ってみたり。かと思うと「うひゃひゃ～」と茶化しにいってみたり。ぽーも困惑していたから、犬同士でも謎な行動なのかもしれない。[2]\nとはいえ、体格差も気にせず威嚇するうめを、叱ることも怯むことも・・いや、怯むことは度々あったな。。とにかくバドがよく遊んでくれたおかげで、甘噛みも減り、うめは野犬から家犬になっていったようにオモウ。[3]\n食べることに関して、凄まじい集中力を発揮するバドくん。うめとよく遊び、ぽーとも遊ぶからおなかもよく減るのだろうか。ご飯の時間外でも鳴いて猛烈アピールをするようになった。目覚ましが鳴るまでの、朝の貴重なまどろみタイムも、バドのあぅあぅぴぃぴぃ、ふんすんで妨害されることしばしば。そんな賑やか元気いっぱいもバドなのだ。[4]\nところが、ある日の深夜、消え入りそうな微かな声に目を覚ました私。バドが体を強張らせながら、小さな、小さな声で鳴いている。慌てて庭に出したところ、おなかを壊していたバド。（ぽバドのトイレは庭なのです～）私が気づくまでしばらく我慢していたらしい。その数時間後にもまた庭に出なくちゃいけないほどで、待っている時間はとてもとても辛かったとおもう。しかし、どうしてご飯のときみたいにしっかり鳴かないの？と、思ったけれど気がついた。バドにとってはおなかを壊したことよりも、おなかがすいてることの方が辛いのかもしれません。[5]\nただでさえ分からないことだらけのイヌたち。バドはさらに飼主の予想を超えた突拍子のないことをしたりする。（いや、ほとんどが予測不能かも）そして必ず「笑い」を誘う。寝ぼけながらもうめの相手をしてみたり。おなかすいたと鳴き続けたり。[6]\n大人になったのか、子犬のままなのか・・・とにかく、バドは天才なのです。[7]",

    "images": [
      "https://stat.ameba.jp/user_images/20130219/13/rinbelu/45/40/j/o0400026612426025467.jpg",
      "https://stat.ameba.jp/user_images/20130219/14/rinbelu/0a/a0/j/o0400027912426072444.jpg",

      "https://stat.ameba.jp/user_images/20130219/14/rinbelu/86/2c/j/o0400030012426108550.jpg",

    "text": "うめと飼主さんたちの新生活がスタートしてから、すでに４日目の朝を迎えております。久しぶりな犬との暮らしなうえ、と～っても活発なうめちゃん。うめちゃん一家はてんやわんやしつつも楽しそうですよん。（お迎え当日、飼主さんの手にじゃれるうめちん）[1]\n実は・・野良犬の保護、うめちゃんが初めてではないんです。当時は今ほど様々な犬種のイヌたちに触れる機会もなかったし、何よりもうめとは正反対のタイプのコでした。だから、里親探しなどもかなり気楽に行えたように思います。（まぁ、3日前のこと忘れるほどだからね。記憶は不鮮明だけど）\nぽバドはブリーダーさんから迎えたコたちで、親犬や親戚犬と遊んだり、叱られたりしながら暮らしていました。そして、ヒトに優しく撫でられたり、声をかけて貰えたりすることを知っていました。リンとベルについては、ペットショップから迎えたのですが、私は小学生だったこともあり子犬時代の記憶はあやふや。彼らの躾は母が本を読みつつ行ってくれていました。\n一緒に暮らしたイヌは４頭だけだけれど、友人たちのイヌを観察したり話を聞いたりしていたこと。うちで預からせてもらったことなど、様々な経験がうめとの生活に役立ったと改めて思っています。うめとの生活を振り返って思うこと。全てが面白かったぁ～\nさてっと、ここからは私とたっつーの感じた、うめの野良犬から家犬への変貌と思い出を綴っていきます。（素人の勝手な推測ですから、ただの憶測もあるかもしれないけれど）ぽバドと私たちが暮らした「うめの観察日記」スタート～。\n2013年1月16日 12:40頃「車のそばに子犬がーどうすんねん、どうすんねん」と、実況中継メールをたっつーに送ったときの写真。[2]\n尻尾を振りつつお座りをして、私の顔を見つめていたうめ。悩む私に知性溢れる目で「ねっ？」と言うかのように、ぽんっと前足でタッチしてきたうめちゃん。この時は人に甘え慣れている、人懐こいコだと思ったんです。病院では看護士さんたちにも尻尾ふりふり、愛嬌もふりまくり。これなら里親さんもすぐに見つかりそうよね、な～んて、話していたのだけれどね・・・初対面の時には、ぽバドに本気で威嚇していたうめ。体格差もあるし怖いのかもねと、とりあえず成り行きを見守ってみて、こんな感じで対面終了。[3]\nバドを迎えたとき、困り顔はよくしていたけれど、叱ることはほとんどしなかったぽーさん。ところが、うめに対しては叱ることが多くなんだか不機嫌ぽー。（その理由も追々分かってくるわけなのですが。。。）独りで生活していて寂しさを知らないからなのか、初日の夜は子犬を迎える際によく聞く「夜鳴き」は全くせず。ケージに入れられることに戸惑いながらも、照明を完全に落とすと、直ぐに寝息を立てていました。翌日の1月17日。ぽバドと一緒に、庭へと出してみる。数回のやりとりの後、ぽーにはお腹を見せるようになった。[4]\nまだこの頃はぽバドと遊ぶことはなく、遊び相手は私たち。子犬のうちに甘咬みは止めさせよう、なんて言うけれど・・彼女のは甘咬みなどではなく、常に全力投球の本気咬み。同日の夜、のんびりくーすか寝ていたバドを、ここにあるのは虎模様のクッションですね～的な様子で、ガシガシ踏みながら乗り越えたうめちゃん。[5]\nなんとなく感じていた違和感と、バドの存在を無視したあまりの行動に、あることを確信する。このコは、親犬や兄弟犬と一緒に暮らしていないかも。早いうちから離されたのかもしれない。そしてこれも徐々に感じていったことだけれど、ニンゲンについても認識していなかったように思う。上手に表現する言葉を見つけられないのだけれど・・「おねだりすれば食べ物が出て来る物体」そんな感じ。そして、２日目からは私たちにも威嚇するようになった。おもちゃで１人遊びをしているときに手を出すと威嚇。ご飯中に撫でると食べるスピードを上げながら唸る、などなど。そうして、ぽバドと一緒に、私たちなりに彼女に指導していく毎日が始まったのです。（素人だし、訓練士でもないので、その方法はヒ・ミ・ツ）[6]\nつり目な美人系なのできつく見えがちな顔でもあるうめちゃん。連れ帰った翌日に撮ったものだけれど、推定生後２ヶ月の子犬なわりには、キツイ表情をしているかもしれない。[7]\nこの後も、彼女が独りだったことを伺わせる出来事がちらほら。だけれども独りでいることの寂しさや、ヒトやイヌと遊ぶ楽しさを知ってしまうのです。それらは後編にてぽちぽちと～。（どぞ、またおつきあいくだされ～）",

    "text": "餌や安全な寝床を探し歩き、敵から身を守る。そんな生活から一転、常に暖かい寝床と定期的に提供される食べ物。闘う戦士から、とつぜん箱入り娘にされたうめ。[1]\n私たちの感じる時間とは比較にならないほどの速さで、イヌたちが環境に順応していくことを、うめと、そしてぽバドが教えてくれました。そんなことも記録として残したい、伝えたい。というわけで長編な後編スタート～\n遊びを邪魔されたり、悪戯を注意された場合に、威嚇をしたわけだが、もうひとつ、不思議な行動も見せていたうめ。お腹を見せたまま大きく口を開け、叫び続けるのです。泣き叫ぶというよりも、その声はもはや「悲鳴」。（そのうちご近所から通報されるかとオモタ）数秒の後、それ以上邪魔されないことを知ると、けろっとしておもちゃで遊んだり、悪戯などを再開する。その様子は恐怖のせいでもなく、てんかんなどでもなさそう。ひじょーに乏しい経験しかないけれど、こんな行動する子犬には出会ったことないぞ。一体、何が遭ったのだ？？\n出会ったとき、痩せ過ぎでもないし汚れてもいなかった。（迷子かと考えたけれどそれらしき情報は得られずで）食べ物をおすわりしてねだる術も知っている。そんなことなどから、私とたっつーは妄想してみた。彼女は拾われ保護されていたのではないか。何かの拍子に威嚇や悲鳴をあげ、その行動に保護主が怯む。賢いが故に、威嚇や悲鳴で自由になると覚えてしまった。そしてその行動が保護主の手に負えなくなり、また捨てられたのかもしれない。・・・という、妄想。もしそうならば、威嚇や悲鳴をあげる必要がないことを、何よりそんなことをしてもムダということを教えれば良いわけだ。[2]\nヒトにとっては遊びでも、イヌにとっては獲物の奪い合い。そのため、注意が必要といわれる「引っ張りっこ遊び」。私たちからも、ぽバドからも、「離してなるものかー」な状態だったうめ。（真似しちゃだめー）[3]\n私たちと遊んだり、ぽーに怒られたり、バドに取り上げられたりしながら、[4]\n独り占めしない方が楽しいことを知る。[5]\n私たちに叱られたり、バドとの遊びから、咬む加減を知る。[6]\nむせながらがっつていたご飯も、唸ることはしなくなり、のんびりとあり得ない程に安心して食べるように。（落ち着きすぎ）[7]\n玄関では、ぽバドにならって足を拭くまで「待つ」ことを覚えた。[8]\n独りで生きる必要がなくなり、群れとしての意識が芽生えたのか、実は、ぽバドと一緒にフリー散歩もこなしていたりする。（オイデも覚えつつあったけれど、はぐれることはなく、ついてくるのです）[9]\nいつの間にか、威嚇も悲鳴もしなくなっていて、猛スピードで走り廻るぽバドから逃げる先はたっつーの足元。[10]\n初日から数日の間は、夜鳴きもせず部屋に独り残しても鳴くことはなかったうめ。それが、留守番やぽバドの姿が見えないことで鳴くようになり、何よりも私たちの帰宅を喜ぶようになる。（日毎にトイレシートぐしゃぐしゃにしたりも増えていくけどね）[11]\n子犬なら、当たり前だと考えていた行動。ようやく私たちが思う「子犬らしい」姿を少しずつ見せ始め、全力で楽しそうに駆け回る姿を初めて見たのは、２週間以上経ってからのことだったかも。[12]\nうめが賢かったから、ぽバドがいてくれたから、たった３０日間で見ることができた変化だと思っています。うめだけにたっぷり愛情を注いでくれる飼主さんに出会って、さらに家犬らしくなり、箱入り度も上がることだろう。[13]\n飼主さんと出会う頃には、個性を現し始めたうめ。どちらかというと、行動その他諸々がバドっぽいんだよね～[14]\n私と出会ったときにはたったの2kgだった体重が、昨日計ったら5kgになっていたそうな。水槽に興味深々な、最近のうめ画像もらったど～[15]\nうめちゃん、３０日間ありがとう。楽しかったよー イヌについての知識が増えたし、犬友達が増えたことが嬉しい。そしてそして、改めて。里親探しに協力してくれたみんな、ほんとにありがと～うめのHappyわんLifeは、これからがスタートなのだ～[16]\nあ、実家の父、母もありがとー（まだまだ野良気分のころに連れて帰省したもんね～）",

    "text": "ときおり舞う雪がきらきらと輝く、木洩れ日さす静かな森。[1]\nかなたより聞こえてくる、その静寂をやぶる蹄の音。[2]\nその正体は馬ではなく、馬並みに走る犬たち。[3]\n３ヶ月ぶりの再会を果たしたお相手は、ウィペットのランちゃん＆ダルメシアンのムウちゃん姉妹週末はランムウ家と一緒にハイキング散歩でした～。しかもお弁当を作ってもらったぞ～（しあわせなのだ～）[4]\n四輪駆動なイヌたちは、息を切らしながら歩く飼主たちの横を行ったり来たり。[5]\n飼主の元へ戻ってきたり、道草したりしつつ、なんやかやで４頭揃って行動していたりするのも面白い。そんなだから、先頭が立ち止まると追突事故が起きるっと。[6]\n飼主にとっては厳しいけれど、起伏も距離も良い感じだし、とてもよく整備されていて楽しすぎる散歩道。ランムウちゃんも一緒だしで、ぽバドも笑顔全開になるよね～[7]\n猛スピードで走るウィペット達について行けないのか、たびたびこうして皆を眺めていたダルメシアンなムウちゃん。（放心してるコは、はしゃぎすぎで休憩中なり）[8]\nちなみに、ダルメシアンは馬車の伴走をしながら、野犬や盗賊などから馬を守る「馬車犬」として活躍していたそうな。それから、えーと、馬をリードして走る能力もあり・・ちょっとムウちゃん～っ?!ぽバドたちと走って疲れたのだと思ってたけど、走る速さもあるし、ウィペットより体力もあるってことやん！[9]\nそんな行動や性格が気になっちゃうのか、「ムウ」と名のつくコたちに惹かれるのか（←真の理由は聞いておきますw）たっつーがムウちゃんをlock-on！[10]\nたっつーと遊んで、ムウちゃんもたちまちにこの笑顔。[11]\nランムウ家の姉上に「イケワン」と紹介してもらったぽバド。（まぁ、たしかにふたりともオトコマエなんだけどね～）やっぱり、ランちゃんが大好きなぽーさん。なんとバドまでもがランちゃんにアピールを始める始末。（要するに、ぽバドと二頭でマウントしようとするんですよー）そんなぽバドの様子はイケワンなどではなく、どう見ても、ただの「ウザワン」です。[12]\nあと３ヶ月でバドも２歳。やはり目覚めてしまったのか。。と、考えていたら・・バドの場合はちょっと違った。ぽーを係留した途端に、バドのランちゃんへの興味がぱったりとなくなった。どうやらぽーの真似をしている、というか遊びの一環だと思っているらしい。ならばなおさらヤメテおくれよ、バドくん。相乗効果でぽーのテンションがさらにクルっちゃう。ランちゃん達にはとてもとても申し訳ないし、平常心でいられないぽーが不憫でしかたないんだから・・とはいえ、今までの経験から、何度か会い続けると落ち着いてくるのよね～。今はデヘ顔だけど、そのうち「たのしー♪」に変わるはずっ[13]\nランムウ家のみなさま、ぽバドが落ち着いて遊べるようになるまで、たっぷりお付き合いよろしくです～（もちろんっ、落ち着いてからも～）ラストは集合写真で〆。なんだけど・・３０枚撮って一番いいのがこれでしたっ[14]",
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
