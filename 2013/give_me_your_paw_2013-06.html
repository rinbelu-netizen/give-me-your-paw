    "text": "写真、少ないです。文章長いです～絶対読みづらい。。\n2013年６月９日。\n運動会メールに添えられていた地図を握りしめ、\nわくわくうきうき気分で車に乗込む日曜日。\n最寄ICからのルートと、目印などが詳細に記された地図。（こんなところまで至れり尽くせりだなぁと密かに感動してマシタ）[1]\nすでに集まっているイヌ達と、賑やかな雰囲気にぽバド大興奮。\nほどなくして隣には２年ぶり再会なアシュポル家も到着。先ずは荷物降ろすか～と、リアハッチを勢いよく開ける。\nと、何か大きな塊が荷物室から飛び出した。\n続けて茶色の流線型した塊も目の前をかすめていく。。\nそう、実はしょっぱなにやらかしてマシタ。\n脱走ぽバドが勝手に挨拶したのは、すぐ側にいたラン＆スズ姉妹。（驚かせてしまって、ほんとすみませんでした・・）\nこんなこと言える立場じゃ全くないけれど、\n女のコのおうちでヨカッター。\n基本はイヌ好きぽー。が、もし未去勢男のコだったら・・・（この失敗で浮かれぽんちになりかけていた気分を引き締める）\n受付を済ませ、ランの隅っこから周囲を見渡す。（リーダーほめさん、サブリーダーアロママの赤チームで頑張るぞ～）\nと、思わず叫びたくなるほどに知らないヒト＆イヌだらけ。参加した４４家族のうち、知っているのはほんの数家族。\nしかもそのほとんどが一度お会いしたきりだったり。\n集合写真。改めて見ると凄い人数＆頭数！（photo by ラキつば父さん）[2]\nタープ未所持の私たち。これまた２年ぶり再会な、\nルチア家のタープにお邪魔させて頂く。（ずーっと一緒にいたのにルチアの写真を撮ってなかった・・）[3]\n写っているのは玉三郎・ゆか・りん家。さらに、モヒート・テキーラ家、スポック家などと大所帯に。\nぽーを連れて他のタープへ挨拶に、というのは気軽にできない私たち。\nだから、数家族とのんびりお話ができる嬉しい場所でした～。\n開会式後、先ずは『大玉順送』から。\n各チーム毎に2列に並び、片手にはイヌのリード。\n空いた手で大玉を順に送りゴールを競う。（全員参加だから写真はもちろんナイ！）\n１位獲得は白組さん～！練習では赤チーム早かったのだよー\n続いては、『早飲み早食いリレー』\nビール→サブレ→コーラ→豆腐→パピコ→お玉＆ボール。\n各チーム毎に担当を決め、上の順でお玉をバトンにしてリレーを行う。食物についてはそれらを食べ終えてから、バトンを渡すというルール。\nビールに手を挙げたのだけど、\n「運転は任せた。」とたっつーに権利を奪われる。（が、ゆうこさんたちの勇姿を見て、やめて良かったと思ったー）\n各ポイントに４人ずつだから、計４周することになるわけで。\n４人目となるとレースはさらに白熱。\nそんな飼主達とは対照的に、しれっとしているイヌたち。[4]\nちなみに、私の担当は「豆腐」（味付けはナイ！真っ白トウフ）\n１走目と４走目はパール・ジル家の長男＆次男くん。\n２走目はアロママ、そして３走目が私。\nアロママの食べる様子を見てコツを掴もうとするものの、\n大人の私でも途中「醤油と箸くださいー」な感じ。\n彼らにはさぞかし大変だったろうに残さず完食。（がんばったぁー）[5]\n赤組奮闘するものの、大玉に続きこれまた白組の勝ち～\n競技の合間の小休止中には、イヌたちの可笑し可愛い姿を眺める。\n同じ赤チームのコーク・アーリー・スライゴ家のこのコ。コークパパがシェードに連れていこうとするものの、\n何度もここに戻ってはちょこんとオスワリ。[6]\n隣に座れば彼（彼女）と同じ風景が見えたかしらん。\n初対面のイヌには必ず一声「わんっ」と吠えるクセのあるバド。\nだから誤解されることも多いが、今のところ攻撃性は皆無なバド。\nとはいえ、自ら進んでぽー以外のコとも遊ぼうとはしないバド。\nだったのだけれども。\nランの中央で走り回るイヌたちを見て「ボクも行きたい」風。\nというわけで、バドだけ離してみる。（この写真には既にぽーもいるけれど）[7]\nもちろん一緒に参加したがる、遊び大好きぽー。\nバドと遊ぶイヌたちの様子から大丈夫そうだな。\nと、ほんの少しだけぽーも参加させてもらう。\n１～２周だけどぽーを遊ばせてやることができた。[8]\nよくよく見れば１歳集団に混ざる、２歳と３歳１０ヶ月のぽバド。ヒトに換算すれば、teensと戯れる２０代と３０代・・・\nこの後バドが写真には写っていないコを吠えながら追いかけだす。はい、タイムアウト。というわけで、バドもそこで係留。\n後で知ったのだけれど、バドが追ったコは、\n大人しくて少し他のイヌが怖いコだったらしい。\nほんの僅かな時間とはいえ、ごめんね。\nそして、\nぽバドには「お利口にしていれば自由に（フリーで）遊べる」、\nということを今回のことで教えられていれば良いなぁ。（と、さすがにこの１回じゃムリかしらん）[9]\nそれしにしても、ぽバドともに飼主が心配していよりも、\n上手にイヌ同士の挨拶ができていたりして。\nこのことも含めて参加を決めて良かった運動会。\n続きはまた次回に～",
    "truncated": false,
    "comments": []
  },

      "https://stat.ameba.jp/user_images/20130617/16/rinbelu/04/16/j/o0400028412578959095.jpg",
      "https://stat.ameba.jp/user_images/20130617/16/rinbelu/92/db/j/o0399026712578965288.jpg",

    "text": "運動会のつづき。\nこれまた写真が少なく、そして完結させるためひたすらに長いです。\nもしお時間ありましたら、おつきあいしてやってくださいませ～\n先ずは『マテマテゲーム』。\n一列にイヌを並ばせ、各家庭毎の方法で「マテ」をさせる。\n開始３０秒後からは、飼主とイヌの間に張られた\nロープの移動に合わせイヌから離れていく。\n２分間、ラインからイヌが動かず「マテ」れば勝ち！\n一生懸命にイヌを見つめてマテをさせる飼主さんたち。\nやってると真剣なんだけど、見てるとオモシロイ・・・。[1]\n我が家からはバドのみ参加。（フリーになるから念のためぽーは休憩でした）\nロープが移動し、私が離れるにつれ不安気な表情になるバド。（バドの顔見て必死に「マテ」させてるから写真はナイ！）\n2mほど私が離れたところで周囲を見渡し始め、\nバドの前を横切ったコに付いていきましたとさ～。\n赤組の得点には貢献できなかったけれど、\n全くできないと思っていたから飼主としては大満足だったぞー（次回にむけてまた散歩中に練習するぞ～）\n最終結果は、白組が７頭残りこれまた圧勝～\n午前中の最終種目は『パン食い競争』の予選。\nこれまた私とバドのペアでがんばります！\n１位になれば午後の決勝に出られるのだ。（実はね、走るの苦手なんですょ。\nだからこれならいけるかと思ったの・・）\nスタートの合図で勢い良く走り出す私とバドっ！！\nって、すでに出遅れてるやん。しかも、前見て走って、私。。。[2]\nなかなかパンが取れないうえに、\n揺られたあげく、ひとりで吹っ飛んでいくパン。。。\n皆の背中を見つめながらパンを拾い走ろうとしたところで、\nトラップとして置かれていたフードにようやく気がつくバド。\n・・・私もバドも、鈍臭いらしい。\n帰宅後に写真を見返しながら、\n「チョットー、こんなに写真撮っててぽーはどうしたのょ～」\nなんて、やつあたりをしていたら・・・\n次のコマには、ぽーのリードを握るアシュポル母の姿。\n「チョットー、アシュポルはどうしてたのょ～」←これまた、やつあたり（いやいや、ぽーを持ってくれてありがとー）[3]\n赤組奮闘するものの、一人も決勝に残れず惨敗。\nと、落ち込んでいたけれど、次はおまちかねのランチタイム～\n処狭しと並べられる、参加者それぞれが持ち寄った食べ物たち。\nグリーンカレーやそうめん、ミートボール、いなり寿司、\nおにぎりに餃子ソーセージ、フルーツにスイーツ、etc...\n見るだけでも楽しめちゃう豪華なランチでした～。（いつものように食べることに専念し、写真はナイ！）\nお昼休憩中に『チャリティコーシング』に参加。\nそして、午後からは先ず『パン食い競争』の決勝戦。\n赤組は出れないからね、\n白と黄のビブスを後ろから羨まし気に眺めてマシタ。\nお次ぎは、『借り犬競争』。\nランのフェンスに係留されるイヌたち。\n１人ずつくじを引き、書かれた名前のイヌを連れて来るのだ。（自分のチーム以外のコたちが対象）\n制限時間内に各チームどれだけ正解できるかを競う。\n現時点で勝っているチームから行うので、赤組は一番最後。\n順番がくるまでチーム内で、イヌの名前と特徴の確認。そしてさらに、隣に居たまーchanに、\n「あのコは誰？じゃあ、○○ちゃんはあのコ？」と確認していく。\n数頭答えてくれたところで、\n「あっ。mickyは敵チームやん！！」と。・・あー、バレたぁ～[4]\n隣になるコとの相性など気になることも多いので、\nとりあえず毎回一番隅っこに係留。（見づらくてスミマセンでしたー）\nそしてもし誰かがぽバドを引いた場合に、\n大人しくついていくのだろうかという期待と不安もあったのだが、\n残念ながら選ばれることはなく。\nと、楽しみでありつつも緊張しながらだったのだけれど、\nこれまた周りのイヌ達との間で興味深い姿も見られました。\nボルゾイのルディくんと並んだときには、ぽーは一度吠えたものの、\n穏やかな彼のおかげでそれ以降は何も反応せずだったり。（願わくは、彼を見習って穏やかに・・いや、飼主がガンバルょ～）\n前足でチョーダイ、チョーダイをしているような、\nそんな仕草が可愛いスキッパーキのラヴィ・アクセル兄妹。[5]\n隣に並んだときにバドに向かってし始め、\nバドは答えるかのように合わせて「わんっ！わんっ！」。（動画を撮れば良かった～あまりに可愛くて見つめ続けてマシタ）\nさてところで、私たちの成果はというと。私が引いたのは、トイマンチェスターテリアのこはるちゃん。\nたっつーは誰やったけかな。・・とにかく２人そろってダメダメ。\nが、ここで赤組は巻き返し、３位から２位へ浮上！\nさて、競技内容も残り２種目となり、先ずは『選抜リレー』。\nたっつーがぽーを連れて走るので、タープで寛ぐルチアパパに（半ば強引に）バドを任せて応援に向かう。\nとはいえ、バドは飼主が離れるとギャン鳴きするからなぁ～\n煩いし困っているのではないかと、振り向いてみる。と、・・[6]\nあら、戯れていらしゃる。\nあ～しかも、顔をベロベロンに舐められてる・・\nていうか、パパさん！ルチアが見てますよぅ～（次回も同じチームだったら、またお任せしてもいいですか？）[7]\nというわけで、完全にお任せして応援に専念する。\n第一走者たっつー、がんばれー！[8]\n第二走者はパール・ジル家の長男くん、そして第三走者ルチアママ！[9]\nバトンパスも息ぴったりに、快走で盛り上がり！！\n第４走者スポックパパ、\nそしてアンカーは我らが赤組リーダーほめさん！[10]\nほめさんにバトンが渡ってからは、\n手を叩き歓声を上げていたから、以降の写真はナイ！（こればっかりー）\nトップで戻ったほめさんに、ブリしゃんが祝福のKiss。（正確には、顔面ベロンベロン祝福だけど）\nそしてラストには再び『大玉順送』。\n後ろから迫る黄組から逃げ、なんとか２位をもぎ取った赤チーム！\n最終結果は、白組の圧勝デシタ！\nおめでとうございま～す。[11]\nそれにしても楽しかったなぁ～♪次回はもっとチームに貢献できるよう頑張らねば。\n改めて、ゆうこさん、ロンママ、ありがとうでした！\nそして赤組リーダーほめさん、\nサブリーダーのアロママお世話になりました！\nそしてそして皆様、ありがとうございました♪\n参加した皆で協力し、楽しみ作り上げる運動会。\n次回には初参加ではなくなる私たち、\n共に盛り上げたいと思っています。よろしくです～（たっつーの仕事が入りませんようにー）",

    "text": "犬種によって気質や特性は様々あるわけで。\nそして同じ犬種でも♂と♀で違いがあったりもする。\nウィペットの場合、\n♀の方が早い時期に自立心が芽生え落ち着くようになる。\n一方、♂はいつまでも甘えん坊で遊び好き。\nというような話はよく耳にするし、\n実際に目にしてそう感じることが多々あったり。\nでは、そんな甘えん坊♂を、\n２頭で飼っているとどんな具合なのだろうか。[1]\n「ぽー ３歳１０ヶ月」＆「バド ２歳」の場合\nソファでうたた寝しているバドを可愛いなぁ～と激写。\n奥で寝ていたはずのぽーさん。\nいつの間にか起きていて、さらに拗ねてるぽぃ。[2]\nと、ぽーが突然、ソファから飛び降りた。\nその勢いにつられたバドが、同じくソファから降り、\nなんだなんだと周りを見渡す。\nその隙に、先ほどまでバドが座っていた場所に座り直すぽー。\nそして、私に向かってこの表情。[3]\nバドは仕方なしに、先ほどぽーが居た場所に座っている。\nそしてこちらの様子を伺うバドくん。[4]\n結論から言うと、\nぽバドともにしっかり甘えん坊な♂デシタ。\nで、さらに。\nぽーは輪をかけて甘えん坊デシタとさ。[5]",

    "text": "ぽバドの、室内でのとある遊び方。\nひとつのおもちゃを引張り合って遊ぶこともあるけれど、\n飼主とぽバドが一緒に楽しめる遊び方があります。\n先ずはロープの両端にひとつずつおもちゃをつけます。\nすると、ぽバドはまるで話し合ったかのように、\nそれぞれ決まった側のおもちゃに注目します。[1]\n次に、飼主が中央のロープの塊を持ち、ひたすらに振り回します。\n油断しているとぽバドに足を踏まれるため飼主も必死です。（足先が細いので痛いのです。すでに足の甲に青アザできてます。）[2]\nしばらくすると、必ず飼主が先に疲れます。\nぽーがおもちゃに夢中であることを確認したうえで、\n写真のようにおもちゃを置きます。（ここでぽーが飽きてしまった場合は、室内遊び終了となります）\nそして後は、にやにやしながら観察するだけ～。\n飼主の思惑通り、バドが気をとられています。[3]\nちなみにぽーはおもちゃを取られた場合、遊ぶ気を無くすだけです。[4]\nもしや、この緊張感も遊びのうちなのか。[5]\nあかん。。笑っちゃう・・・[6]\nあら、バドが珍しく（←ヒドい飼主ダ）知恵を働かせている。[7]\nチョット、なにそのコント的な展開。[8]\n・・・２０秒後。\n飽きてきたぽーと、本来の目的を忘れ夢中になっているバド。[9]\nおしまい。[10]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
