<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey buddy, give me your paw! 絵日記帳 - 2018年10月</title>
<style>
  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --border: #e8dfd0;
    --text: #4a4238;
    --text-muted: #9a9082;
    --accent: #c98a5e;
    --accent-bg: #f5e6d8;
    --accent-text: #8a5a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 16px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .controls {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-btn {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
  }
  .tag-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .count {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .entry-title {
    font-size: 16px;
    font-weight: 500;
  }
  .entry-date {
    font-size: 12px;
    color: var(--text-muted);
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
    margin-bottom: 12px;
  }
  .photo-grid a {
    position: relative;
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: var(--accent-bg);
  }
  .photo-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-grid .num {
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 1px 5px;
    border-radius: 8px;
  }
  .no-photo {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .truncated-note {
    font-size: 12px;
    color: var(--accent-text);
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 6px 10px;
    margin: 0 0 12px;
    display: inline-block;
  }
  .entry-text {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 12px;
    white-space: pre-line;
  }
  .entry-text b {
    color: var(--accent-text);
    font-weight: 500;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--accent-bg);
    color: var(--accent-text);
    cursor: pointer;
    border: none;
  }
  .comments {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .comments-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .comment {
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-bg);
  }
  .comment-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .comment-meta .author {
    color: var(--accent-text);
    font-weight: 500;
  }
  .no-results {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    display: none;
  }
</style>
</head>

    "text": "2018年10月5日 今朝のこと。\n布団を片付けるために、寝室へ向かうとケモノが2匹。\nこれは・・呼ばれている気がする。\nというわけで、間に寝転がって、\n続きはこちらから〜↓\nつんつん、ちょっかいをかけていたら、お互いに調子が出てきて、\nそうしたら、当然バドも参加するわけで。\nわちゃわちゃするのをしばし眺めていたら、「そうだ、雨の降っていない今のうちだ！」と気がついて、\nぽバドに声をかける。「散歩に行く？」\n午後はしっかり雨予報だから、今のうちに散歩を堪能しよう〜♪\n・・・あれ、そういえば。寝室に何をしに行ったんだっけ？\n散歩後はかならず昼寝をするぽバド。今日は寝室へと一直線に向かう・・・あ、思い出した！",

    "images": [],
    "text": "僧帽弁閉鎖不全症の投薬を約3年前から行っているウィペットのトモダチ。彼の検査値、ブログに書いていいよーとのことでご紹介。（ほんとうに、ほんとうにありがとう！！）\n投薬開始前後、投薬を始めるきっかけになった日の数値を、少し説明を加えながら載せていきたいと思いマス。同じく投薬のタイミング等で悩む誰かのためになれればいいなぁ。\n僧帽弁閉鎖不全症の治療に用いる様々な薬。その中には、心臓の働きを助ける効果を期待して用いられるものがあります。\n心臓はその薬に頼って動くことになるわけで、それはつまり、一度使い始めるとやめられないということ。\nだからこそ「投薬をいつ始めるか」飼主はとてもとても悩む。\nエコー画像の判断は担当医にお任せするしかないけれど、数値を比較してみることは私たちでもなんとか可能デス。ウィペットに特徴的な値を考慮しつつ、イヌ全般の基準値と並べて考える。\n担当医の経験、知識、診断結果、イヌの年齢、性格、活動の程度、状態、家庭の事情その他諸々を考慮して悩む。トモダチとぽバドの数値がその悩みの解消に少しでも繋がればいいなぁ。\nでは、本題へ。\n続きはこちらから〜 ↓\nさてさて、トモダチの・・仮名：blueくん。\n彼が僧帽弁閉鎖不全症と診断されたのは約９年前、若さ輝き体力も満ち溢れる、そんな年齢の頃デシタ。とはいえ、日常生活に支障なく投薬も不要、激しい運動もOK！\nそれからは定期的な検査を続け、元気いっぱいにシニア期を迎えるblueくん。\nそして弁膜症の診断を最初に受けてから約6年後のある日のこと。飼主さんが心雑音のわずかな変化に気がついて予定を早めての検査。結果、少し進行していることがわかり投薬開始となりました。\n2018年の現在。blueくんの症状・検査値に大きな変化はなく、投薬を続けながら元気にまったりと楽しい日々を過ごしています♪\n僧帽弁閉鎖不全症が進行していくことで起こる心臓の変化の一部と、その変化に対応するエコー検査の項目を表にまとめるとこんな感じ（左心房の拡張・心臓の肥大 → LA/LO・VHS・LVDd、左心室流入速度の変化 → E波・E/A、左心室の収縮率の低下 → FS、詳しくは「心臓。その４」参照）。\nさてここで、ウィペット（もしくはサイトハウンド）オーナーの皆さまへ！\nウィペットでは一般的な基準値と異なる傾向にある項目がいくつかあります。それは、VHS、LVDd、FSの３つ。心臓は基準値より大きく、収縮率は低いことが多い。\nそれを踏まえた上でblueくんの4年前（投薬前）の数値をご紹介（LA/LO 1.85、LVDd(mm) 48.6、E波(m/s) 1.16、E/A 1.78、FS(%) 24。参照値：LA/LO 1〜1.5、LVDd 39〜、E波 0.73、E/A 0.5〜1.5、FS 33〜46、ウィペット参照値：LA/LO 1.32〜1.5、LVDd 33.8〜48.4、FS 27.7）。\n参照値と比較すれば、心臓と左心房はやや大きめかもしれません。ただしそれらの項目は、エコー検査ではイヌの体勢や測り方などで変化します。そしてさらにウィペットの参照値については、論文からの抜粋でまだ基準値とはいえず判断つかぬところ。E波については、田口先生のレポートでは中等度の評価になる。\nさて、どう判断すれば良いのか。\nblueくんにはこれまで定期的に検査してきた数値がある！そして経験豊かな先生がついている！！\nエコー画像やその他数値は以前とほぼ変わりなしで。結果、投薬はまだ見送ってこのまま現状維持となりました。\nそして3年前。飼主さんが心雑音の変化に気がついた日。検査の結果、E波は2.08m/sになり、E/Aは2.8とわかり投薬開始へ。\nそれから、もちろん検査は継続。そして、直近の検査結果では（LA/LO 2.57、LVDd 48.8、E波 1.48、E/A 1.8、FS 38）。\n2.08m/sあったE波が遅くなっている！これら数値だけなく、その他の診断においても経過良好とのこと♪\n投薬以降、改善されたなぁと感じられる身体的な症状もあるそうです。ちなみにblueくんの担当医が言うには、老化による脱水のおかげで弁の閉じが改善される子も多いとか。\nぽバドも、blueくんも病院は大の苦手。定期検診が負担になっているのではないか、とてもとても悩む。だけれど、blueくんの結果を見せてもらって必要だと改めて思いマシタ。\nぽバドにとっても検査結果の積み重ねは、今後、必ず役に立つと感じています。できるなら、blueくんちのように些細な変化に気づきたい。\n最後にぽバドとblueくん、今年の数値を並べてみます（blue：LA/LO 2.57、LVDd 48.8、E波 1.48、E/A 1.8、FS 38 ぽー：LA/LO 1.5、LVDd 43.6、E波 0.95、E/A 0.94、FS 24.8 バド：LA/LO 1.42、LVDd 50.9、E波 0.68、E/A 1.05、FS 27.5）。\nぽバドはエコー画像ではまだ左心房の拡張などは見られません。\nそれでも、参照値と比較すると心臓は大きく、収縮率は低い。LVDdだけを見ればblueくんと変わらない。\n同じ僧帽弁閉鎖不全症で通院しているウィペットオーナーの皆さん。もしよければこの数値を受診の際にお使いくださいませ。基準値にあてはまらない場合があること先生に伝えてみてください。\n今後の方針のお手伝いになれるかも。いや、なれれば良いなぁと。\nウィペットの特異性について、より正確な情報を飼主と獣医で共有していくきっかけになればとも考えています。\nそこで、ですね。表にある数値を測定したことのあるウィペットの皆さん。よければその数値を教えて頂けないでしょうか。\n当ブログのコメント欄、各SNSのダイレクトメールなんでもOKです。匿名もちろんOK。Twitter Instagram\n可能なら、心臓病の有無、犬の年齢、性別などもあれば助かります。\nもしある程度集まれば、一覧にして当ブログで紹介したいと思います。ウィペットの参照値をみんなで作ってみませんかー？",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
