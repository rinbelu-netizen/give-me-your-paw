記録。\nウィペットの数値が基準値と異なるため、より判断が難しいこともここで判明したんですよねぇ・・・\n続く。\n*1.Frank-Starlingの法則",

    "text": "今回は心臓を知るための検査の一部と、具体的なデータについてを記録。\nと、その前に...ぽバドの飼主は医学を学んできておりません。ほんの少し分子生物学について知っているのみです。\nここに記録していることは、ぽバドの担当医から聞いたこと、論文などで知った情報を理解したつもりになってまとめているだけです。\nですので、「間違い」は必ずあります。\n鵜呑みにせず、必ず担当医としっかりご相談なさってください。特に参考にした文献を本文の最後に記しますのでそちらも読んでみてくださいネ。\nではでは改めて、\n1-1.心臓を知るための検査の一部と、それらから得られる情報について\n・聴診・触診：心雑音、むくみなどの有無を確認\n・レントゲン：心臓の大きさ(VHS)や、肺のうっ血などを確認\n・血液検査：心不全の診断や重症度の判断指標(ANPやBNPなどの心臓バイオマーカーを用いる)\n・心電図：心拍数の確認、不整脈や心筋症、狭心症、心房心室の拡大所見などの確認\n・心臓エコー：リアルタイムでの心臓の全体像を確認 心臓収縮能力や弁膜症の有無などを確認\nぽーは聴診での心雑音、バドはBNP検査から心臓エコーを行いました。より正確な診断のために、心臓エコーと心電図検査を同時に行うことが理想のようです。\nですが、ぽバドともに心電図は受けていません。なぜならば。\n大暴れするから。。。クリップ引きちぎって怪我しかねないから・・orz\nただ、飼主がそばに居ると比較的おとなしくなることもあり、保定の手伝いをしつつ検査に付き添わせてもらっています。そのため、リアルタイムなぽバドの心臓を飼主も見ることができています。\n今後いつか、心電図検査ができそうな時には挑戦したいと考えています。\nさてさて、ところで。心雑音とはどういう音なのでしょうか？\n続きはこちらから〜↓\n病院で聴かせてもらったのですが・・鼓動は聞こえるけれど、心雑音に関しては激しいパンティングでわからない。。。\nそこで、友人が自宅にて心音の変化を見抜いたことも知って、聴診器を購入してみました。暇さえあれば、ぽバドとお医者さんごっこなり♪\n1,000円強の安価なものですがそれなりに聴こえています。鼓動の間にザーというノイズ音。 ただし、こんな風に、すぐ側で手を舐められたりするとその音も拾ってしまう。不定期だったり、わずかな心雑音の場合にはこの聴診器では聞き逃してしまうかも。あの雑音多い中での聴診、やはり先生の聴診器はかなりの高性能でした！\nここからは、一般的な心臓エコー画像の見方と基準値についてを記録。主に下記の3点についてを前提に読み進めてやってください。\n・これから挙げる心臓エコーの検査項目は、ごく一部である\n・心臓エコーの正確な判断には知識・経験が必須\n・それら項目にはウィペットでは当てはまらない傾向にあるものが一部ある\nところで、そもそも。基準値とは、どうやって決めているのでしょうか？\n臨床検査における基準値は、ヒトでもイヌでも同じで、健常と判断された個体の検査値を多数集め、その集計結果から平均値を出しばらつきを加え、健康なヒト(イヌ)の95%が含まれる範囲、それが基準値となります。\nということは、つまり。性別や年齢はもちろん、様々な条件に分けて基準値を求めることが大切で。ましてや、イヌやネコたちは品種ごとに決めてよ！となるわけで。\nそこが、上述のウィペットでは当てはまらない傾向にあるに繋がるわけです。それはウィペットだけでない可能性は大いにあり得ると思います。\nでもね、研究者の方々、頑張ってくれています。犬種別データは次々と報告され、体重別で求める方程式などもあります。ウィペットについても同様にデータ集めが進みつつあります。\n長い前置きになったけれど、いよいよ実際の心臓エコー図と基準値を紹介。\n2-1.心臓エコー検査図*2*3*4*5と見方、そして基準値\n・VHS(胸骨心臓サイズ） 10.5以下\n・LA/Ao(左心房径/大動脈径) 1〜1.5\n・LVIDd(左心室拡張末期径) 39mm〜 *体重17kgの場合\n・FS(左心室内径短縮率) 33〜46%\n・E波(拡張早期波) 1〜10歳 0.73m/s 11歳〜 0.63m/s\n・E/A(拡張早期波/心房収縮波) 6〜10歳 0.5〜1.5\n・カラードプラ法と連続波ドプラ法\n＊ウィペットの基準値が異なる傾向にある項目を赤文字で示しています。上記の基準値よりVHS,LVIDdは大きく、FSは低くなる傾向にあるようです。詳細な参考数値については後述します。また、E波、E/Aについては論文等見つけられてません。(発見された方、連絡くださいー）\n・VHS\nこれはレントゲン検査で求められる項目。心臓の拡大程度を評価。「ウィペットの心臓は大きい」ということが一目瞭然でわかる検査でもあります。\nぽバドのかかりつけ医院ではウィペットの患畜はぽバドだけだそうで。初めて検診を受けた数年前、「やっぱりウィペットの心臓は大きいー！」と、先生達みなで大盛り上がしてくれたそうです(笑\n・LA/Ao*6\nAo(大動脈)とLA(左心房)の大きさの比較により左心房の拡張の程度を評価。\nこの数値が大きくなるほど、左心房の拡張が顕著であるといえます。ぽバドともに、左心房の拡張はみられません。\n・LVIDd ・FS*10\nLVIDdとは最も拡張した時の左心室の大きさ(内径)、FSは左心室の収縮率。\nこれらは基準値との比較で評価するため、ウィペットでは・・悩みます。\nこの検査モードでは、心筋の厚さや収縮能力などもみることが可能です。拡張型心筋症などの場合には、拡張期と収縮期の大きさに差がなくなり、また僧帽弁閉鎖不全症の場合、FSは重症度により変化します。\n・E波・E/A*7*8\nここではLV(左心室)とLA(左心房)間の血液流入をみることができます。また僧帽弁などの弁膜の実際の動きや状態も確認することができます。\nE波： 左心室が拡張し左心房から血液を引き込むことによって生じる血流\nA波：左心房が収縮し左心室へ押し出されることによって生じる血流\n波形グラフの縦軸は血流速度を現しており、E波A波が交互に並び拡張収縮期それぞれでの動きが現されています。\nこれらE波とA波の血流は、年齢により変化していきます。\n心機能の良い若い頃では、E波の流速は速く、A波が遅い。約10歳以上になってくると、E波の流速が低下しA波が相対的に高くなる。僧帽弁逆流がある場合には、E波が速くA波が遅くなります。\n若い頃でもE波は1m/s以下で、1.2m/sを超えることは正常例ではほとんどなく、また、A波がE波の1/2以下になることは正常例では少ないそうです。\n上の例はぽーの結果ですが、さらに担当医との相談を重ねる予定です。ウィペット、年齢、逆流...様々な要素があるため先生の意見必須〜\n・カラードプラ法と連続波ドプラ法*9\nカラードプラ法では血流を赤と青で色付けすることで、異常血流やその発生箇所などを観察することができます。また、連続波ドプラ法では逆流速度や波形をみることができます。\nこれらについて写真とデータはあるのですが、担当医に確認したいことがあるのでそれから載せることにします。\n長くなったなぁ〜ひとまず、今回はこのあたりで・・・次回は、いよいよウィペットと他犬種の違いについてを記録。\nPDFで読めます。講義用ということもありとてもわかりやすいですー\n↓\n*2.田口大介(2010)「心臓エコー図検査ーその1」Vol.36(No.4),166-167,岩獣会報\n*3. 田口大介(2012)「心臓エコー図検査ーその6」Vol.38(No.1),13,岩獣会報\n*4.田口大介(2012)「心臓エコー図検査ーその7」Vol.38(No.2),64-65,岩獣会報\n*5.田口大介(2013)「心臓エコー図検査ーその8」Vol.39(No.1),25-26,岩獣会報\n*6.田口大介(2013)「心臓エコー図検査ーその9」Vol.39(No.2),61-62,岩獣会報\n*7.田口大介(2014)「心臓エコー図検査ーその10」Vol.40(No.1),15-16,岩獣会報\n*8.田口大介(2014)「心臓エコー図検査ーその11」Vol.40(No.2),49-50,岩獣会報\n*9.田口大介(2015)「心臓エコー図検査ーその12」Vol.41(No.2),52-53,岩獣会報\n*10.田口大介(2016)「心臓エコー図検査ーその13」Vol.42(No.1),18-19,岩獣会報",

    "text": "続きを心待ちにしてくれている方がいらっしゃるかも..と思いつつ、これから新たに２報ほど論文を読む予定です。\nぽバドのため、というのはもちろんですが、ここに記録してどなたかの参考になるかもしれないと考えると、ちょっと情報量が乏しくて何か他に出ていないかと探してマシタ。\nそんな言い訳の理由も兼ねて今回は、実際のウィペットに関する論文を使いながら、学術論文の読み方などについて書いてみようかなとー。\nペットが病気になった時などにネットで検索しているうち、論文らしきものが引っかかることありませんか？...ないかなぁ（;´▽｀A``\n最新だったり、より的確な情報を得ることができる場合があるのです！\n続きはこちらから〜↓\n学術論文とは、研究者や獣医などが新しく発見した知見を、材料や方法、結果など特定の構成でまとめ学術雑誌に掲載したものです。\n雑誌に投稿すればすぐ掲載されるわけではなく、審査をうけ追加実験を求められる場合もあり掲載までは茨の道です。\nどの論文でもネット上で概要を読むことはできますが、全てを読むためには雑誌の購読が必要な場合がほとんどです。（Freeの場合もあり、その論文は全て読めますー！）\nとはいえ概要だけでそれなりの情報を得ることができます。\nですが、論文タイトルと結果だけを見て、「論文に書かれていたからこうなんだ！」と思ってはいかんのです。\nどんな条件や材料でその研究が行われたかなどの詳細を読まないと、自分が必要としていた内容ではない場合があるためです。可能ならば全文を読みたい。読みたくなるのデス。\nちなみに、前回、前々回ことあるごとに、「ウイペットでは〜の傾向にある」と書いていたのもそのためデシタ！\nではでは、まずは論文検索サイトのひとつをご紹介。→ PubMed\n例えば、「whippet」でserchしてみましょー\nすると、タイトルや概要に「whippet」が含まれる論文の一覧が表示されます。そこから読みたい論文のタイトルをクリックするだけ！\nではさらに、具体的にとある論文を例にしてみます。\n「Echocardiographic reference values in Whippets」*11 ウィペットの心臓エコー検査の参照値\nこれはまさしく、私たちが知りたい内容の論文ではないデスカ！！\n大抵はどの論文でも同じで上からこのように表示されます。・掲載されている雑誌名や号、頁番号(著者の後に書かれている場合もあり）・論文のタイトル・著者・概要\n(参照リンク：https://www.ncbi.nlm.nih.gov/pubmed/17508509）\nどれどれ〜と辞書を片手に読み進めましょー\n概要にはまず、この研究の目的が書かれています。次に実験の方法や材料が示され、結果と結論や考察と続きます。\n上の論文で書かれていることを、ごくごく簡単にまとめるとこんな感じ。\n研究目的:ウィペットの心臓エコー検査値の確立 今までの一般的な基準値との比較 性別やbreeding lineで値に影響するかどうかを決める\n方法：＊専門的すぎるので省略\n結果：1.収縮期、拡張期において左心室径が著しく大きい 左心室壁、心室中隔の暑さの増加 2.体重差を考慮し、雌雄で比較するとメスの方が左心室径が大きい レース血統とショー血統の違いはminorである\n結論：エコー検査において、品種別の基準値が必要とされる ウィペットにおいて、心臓の拡張や肥大の過剰解釈を避けるため、本研究の参照値を参考にすることができる\nさてここで、「うちのイヌもそうなんだ！」と結論づけてはならぬのデス。\nこの概要を読むと、気になることがたくさんあります。それら気になることのうちの2点を挙げてみます。\n1.いったい何頭のウィペットで測定を行っているのか\n2.レース血統とショー血統、それぞれ何頭ずつ測定したのか\n10~20頭だとかの結果で参照値にしてね！と言われても困ります。（実際にはそんな少数で論文になることはほぼないけれど・・）\nまた、海外ではビジネスとしてもドッグレースが行われていて、さらにレースのために定期的な訓練を受けている、と聞いています。\nレース血統とショー血統のウィペット。\n体格はもちろん筋肉や心臓などの内臓も異なりそう。「違いはminor」とあるけれど、これまた実際に何頭ずつで測定したのでしょう？\nそう、そしてぽバドはショー血統。定期的な訓練もしていない。遊びたい時に遊び寝たい時には寝る、お気楽ぅ〜な毎日を送っております。\nこの研究で言っていることは、ぽバドにどれくらい当てはまるのだろうか。\nだから全文を読みたくなる、というわけなのです。\nで、この論文。担当医のおかげで全文を読むことができております。\nちなみに学術論文の複製と著作権についてですが、私的使用の場合には著作者の承諾を必要としません。\nというわけで、コピーをいただきました！全部で９頁ありまして、測定一つ一つの方法や計算と結果その考察が詳細に書かれており、また測定結果などは表やグラフなどで示されています。\nそして気になる測定に用いた検体数やその内訳はといいますと。\n・総数 105頭（オス51頭 メス54頭） レース血統 89頭 ショー血統 10頭 レース血統とショー血統の交雑血統 6頭\n・月齢 10~169か月 体重 9.3~17.2kg(13.2±2.1kg)\nほぼ、レース血統やないかーい！！(ﾉﾟ⊿ﾟ)ﾉ\nね？全部を読まないと判断できない。せめて測定に使った条件を知る必要がある。だけれども、\n・ほぼ、レース血統のウィペットの結果であること\n・ほぼ、定期的な訓練を受けているウィペットの結果であること\nこれらの条件を知ることができたならば、この条件を前提にしてこの研究で得られた数値を参考にすることは可能です。\nそしてさらに興味深いことも書かれていました。僧帽弁逆流症についての結果。\nこの症状の重症度をtrivial<mild<moderate<severe の４段階で表現するらしく。（具体的な区分けの基準はただいま調べ中。ご存知の方、ぜひ連絡くださいー）\n測定に使われたのはmoderateとsevereの状態を除いたウィペット105頭。それら105頭の心臓エコー検査での結果。\n総数105頭 36頭(34.3%)肺動脈弁逆流：mild 1頭 trivial 35頭 45頭(42.9%)僧帽弁逆流：mild 12頭 trivial 33頭 29頭(27.6%)右房室弁逆流：mild 4頭 trivial 25頭 彼らは「心疾患」の診断は受けておらず、「健康」という前提で集められたイヌ達です。\nここから何を考えればよいでしょう。（上に書いた条件を前提として・・）\n弁膜症について、他犬種とウィペットではスタートラインが異なるのではないか。ということを私は考えました。\n一般的に弁膜症は、カラードプラ法だけでなく実際の弁の状態や、その他の心臓エコー検査値などから総合的に判断して診断を行うそうです。\n他犬種の場合には弁からの逆流が発見されると、「弁膜症」である可能性が高くより早い対応が必要、かもしれない。\nけれども、ウィペットでは（上に書いた条件を前提として）、不安になりすぎず、元気でも弁逆流のコがそれなりにいるみたい〜と、考えても良いのかもしれない、という感じ。\nまわりくどいのはなるべく誤解を与えないように、という考えからですー(;´▽｀A``\n「ウィペットの心臓は他犬種より大きい」という認識に近い感覚かも。\nとはいえ、油断は禁物。逆流がわかったら定期的な検査をすべきだと思います。\n逆流している状態から始まっている可能性があるため診断はより難しく、その他の検査値などとの総合的な判断がより重要になってくると思います。\nしかも、この論文だけじゃぽバドの状態を判断できない。ショー血統での測定結果も含め、もっともっと情報が欲しい！！\nというわけで、面白そうな論文を見つけたのでこれから読みます。ひとつは健康なウィペットの心雑音と僧帽弁逆流の罹患率を調べたぽいもの。もうひとつはウィペットの心電図参照値について。でも、こちらは心電図の勉強を全くしていないので後回しにするかもです。\nでは、最後に。ぽバドの検査値や身体的所見と、上の論文のデータを並べてご紹介。（別の論文から拾ってきた数値が一部あります）\n↓ウィペットの参照値については、これらの条件を前提に考えましょうー・ほぼ、レース血統のウィペットの結果であること・ほぼ、定期的な訓練を受けているウィペットの結果であること\n＊赤文字はウィペットで異なる傾向にあるもの ＊VHSのウィペット参照値 L及びRは測定時の臥位の向き 文末の参照を検索していただくと、ウィペット以外の犬種でのVHSもあります\n・身体症状(咳、呼吸の異常、ふらつき等）：ぽバドともに無\n・心雑音：ぽー有、バド無\n・弁膜の逆流：ぽー僧帽弁と三尖弁、バド僧帽弁\n補足\n・ぽーの心雑音について\n常にあるわけではなく、強度も日によって異なる。深呼吸をした際にも有。（自宅でのんびりしている時の聴診オススメですよー）\n・逆流について\nぽー→僧帽弁逆流と三尖弁より逆流有り。三尖弁逆流は僅かだが、僧帽弁逆流の流速は6m/s バド→僧帽弁逆流が僅かにみられる\n・弁膜、心筋の状態\nぽバドともにはっきりとした変化や異常はみられない\nつづく・・・\n*11 Bavegems V,Duchateau L,Sys Su,De Rick A. Echocardiographic reference values in Whippets Vet Radiol Ultrasound.2007 May~Jun;48(3):230-8.\n*12 James W. Buchanan, DVM, M Med Sci, DACVIM 111 Vertebral Heart Size(VHS) The James Buchanan Cardiology Library.October 14, 2009 (published)",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
