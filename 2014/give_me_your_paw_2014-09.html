<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey buddy, give me your paw! 絵日記帳 - 2014年9月</title>
<style>
  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --border: #e8dfd0;
    --text: #4a4238;
    --text-muted: #9a9082;
    --accent: #c98a5e;
    --accent-bg: #f5e6d8;
    --accent-text: #8a5a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 16px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .controls {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-btn {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
  }
  .tag-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .count {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .entry-title {
    font-size: 16px;
    font-weight: 500;
  }
  .entry-date {
    font-size: 12px;
    color: var(--text-muted);
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
    margin-bottom: 12px;
  }
  .photo-grid a {
    position: relative;
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: var(--accent-bg);
  }
  .photo-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-grid .num {
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 1px 5px;
    border-radius: 8px;
  }
  .no-photo {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .truncated-note {
    font-size: 12px;
    color: var(--accent-text);
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 6px 10px;
    margin: 0 0 12px;
    display: inline-block;
  }
  .entry-text {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 12px;
    white-space: pre-line;
  }
  .entry-text b {
    color: var(--accent-text);
    font-weight: 500;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--accent-bg);
    color: var(--accent-text);
    cursor: pointer;
    border: none;
  }
  .comments {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .comments-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .comment {
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-bg);
  }
  .comment-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .comment-meta .author {
    color: var(--accent-text);
    font-weight: 500;
  }
  .no-results {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Hey buddy, give me your paw! 絵日記帳</h1>
  <p>ウィペットのぽー＆バド（＆うめ）と暮らす日常あれこれ ― 2014年9月 ※so-netブログ・archive.orgより復元（記事は末尾で途切れ）</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="キーワードで探す（例: 震災、ドッグラン、うみちゃん）">
  <div class="tag-filter" id="tagFilter"></div>
</div>
<div class="count" id="count"></div>

<main id="main"></main>
<p class="no-results" id="noResults">該当する記事が見つかりません。</p>

<script>
const entries = [
  {
    "date": "2014.09.03",
    "title": "うみちゃーん！！",
    "tags": [
      "記憶",
      "友人",
      "2014年9月"
    ],
    "images": [],
    "text": "ぽーにとっては幼馴染のような姉弟のような、バドにとっては気長に遊んでくれる優しいお姉ちゃんなうみちゃん。\n彼女が旅立ってしまった。\n天真爛漫でヒトにもイヌにもフレンドリーで。ウィペットのぽバドと一緒に走れちゃうバーニーズマウンテンドッグのうみ。\n何度か預からせてもらったおかげで、大型犬と暮らす、そんな疑似体験もさせてもらえて。\n遠慮しがちで気を遣うようなそんな一面もあって。散歩が好きで飛び跳ねて大喜びしていても、「おすわり」の合図でスチャッと座れるそんなお利口なうみちゃん。\nうみちゃんのことを考えると、元気いっぱいの姿しか思い出せなくて今でも実感がわかない。\nほんとうはここには書かずにひっそりと見送るつもりでした。だけれど、うみちゃんと過ごした日々の記録を順に読み返してみたら、しっかりと遺しておきたくなった。\nどの記事を読み返してみても、イヌたちはもちろん、友人飼主たちも一緒になって、その瞬間を心から楽しんでいる、そんな記録ばかりだったから。\nうみちゃんと一緒に、その時間、その一瞬一瞬を大切に過ごしていた記録。\nうみちゃんといえば、いつも笑顔で元気いっぱいなコ。\nそんな記憶をこれからもずっと残しておきたくて。（「続きを読む」に今までの記事をまとめました）\n虹の橋はあると思っているから、うみちゃん また会おう。みんなで一緒に遊ぼう！\nうみちゃんとの記憶。",
    "photosLost": true,
    "truncated": true,
    "comments": []
  },
  {
    "date": "2014.09.05",
    "title": "8月24日といえば？",
    "tags": [
      "バド",
      "Family",
      "2014年9月"
    ],
    "images": [],
    "text": "この世の形あるものいずれ別れの時が来る。過ぎていく時間を巻き戻すことも、再び経験することもできない。だからこそ、その出会いその瞬間を大切にしていつも前を見て。\nそんなことを、常に意識しているわけではないけれど。実践できているのかと問われるとひじょーに困っちゃうけれど。でもなるべくそうありたい。後悔はしたくない、しないぞー。\nと、らしくない書き出しにしてしまったけれど、うん。限りある時間をこれからも楽しもう。\nさてさて、そして過去に遡るっと。\n2014年8月24日のこと。\nたしか去年もこの日がちょうど都合が良くて。そして、今年も同じ日に集まりマシタ。\n何の集まりかと言いますと、誕生日会ですョー＼(*^▽^*)/ →去年の おたんじょうび会。\nレイルとぽーが8月18日、たっつーが24日生まれなものでして。（ちなみに、なんとうめママも24日生まれなのよね〜♪）\n準備をしている間、キラっキランな顔で台所に張り付いていた盛り上げ担当バド（笑\n6月のルーク&バドの誕生会ではケーキもどきを作って、案の定、主役のバドにフライングされ大笑い、ということがあったな〜 →3歳と9歳。\n今回はケーキではなく、ふつーのイヌ用ごはんにしてみるなり。\n何を作った？",
    "photosLost": true,
    "truncated": true,
    "comments": []
  },
  {
    "date": "2014.09.10",
    "title": "飼主の時間。",
    "tags": [
      "バド",
      "ぽー",
      "我が事",
      "2014年9月"
    ],
    "images": [],
    "text": "これはね、たっつーの足に顎を乗せて甘えてるトコロ。\n８月締めくくりの週末とやらに、バドとぽー兄は留守番をさせられたんだよー\nだから、もうどこにも行かないよにこうしてるんだ。\nどこ行ってたか？",
    "photosLost": true,
    "truncated": true,
    "comments": []
  },
  {
    "date": "2014.09.12",
    "title": "迷子札と旅行。",
    "tags": [
      "goods",
      "足柄運動会",
      "2014年9月"
    ],
    "images": [],
    "text": "2014年夏の足柄運動会にて、たっつーが頂いた賞品が届きました〜♪ →足柄運動会2014夏ー後編。\nもとい、届いてマシタ！！（受け取ったのは確か、先月末だったかしらん・・）\n嬉しいその賞品とは・・・じゃーんっ！！コレですっ♪♪♪\n迷子札なり〜♪（裏面に電話番号が刻印されてます）\nアメリカのアーティストさん作製によるものでして、他にも素敵なデザインがたくさんで選ぶのに悩みました〜\nモデル犬にも注目なこの迷子札の取扱店はこちら →Modern Dog\nそして、続きはこちらから〜↓\n着心地はどうょ？",
    "photosLost": true,
    "truncated": true,
    "comments": []
  },
  {
    "date": "2014.09.26",
    "title": "えくすとりーむっ！！",
    "tags": [
      "バド",
      "ぽー",
      "dog sports",
      "2014年9月"
    ],
    "images": [],
    "photosLost": true,
    "text": "以前から気になっていたドッグスポーツのひとつ。それは『エクストリーム』という競技。\n各地で体験会が行われているのだけれど。ヒトやイヌがたくさんいる場所でいきなり参加してみる・・・と、いうのは、私達にとっては容易ではないのが正直なところ。(´･ω･`; )ｳｰﾝ\nだが、しかーし！私たちには心強い友人、且つエクの先輩がいるのだもんね〜♪\nと、いうわけで。9月20日 お試し練習に行ってまいりましたーっ！＼(≧∇≦)/彡ﾜｰｲ♪\nと、その前に。飼主たちの腹ごしらえをば。（色んな意味で）知る人ぞ知る名店へGO！\n続きはこちらからっ ↓",
    "truncated": true,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
