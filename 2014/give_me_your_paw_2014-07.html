    "text": "突然ですが、問題です！！「ぽー or バド、　　　どちらのほうがより飼主のコマンドに従うでしょうか？」正解は・・・『バド』でした〜！ちなみに、ぽーはここらで従っておかないと叱られるかも、というぎりぎりのタイミングを計ってマス。(=￣∇￣=)\nさて、いつも素直で従順なバドですが、チョット直ぐには従いたくないコマンドがひとつだけあるらしい。それは、「ハウス」の指示。しかも留守番の場合の「ハウス」コマンド。\nさてさて、台風８号が沖縄に居座っていたころのこと。\n留守番時の定位置は、ぽーがソファでバドがサークル。（そこがそれぞれにとって落ち着いて留守番できる場なのです）というわけなので、サークルを広げて「バド、ハウス」と声をかけますよっと。そうしたならば、いきなりに。カクッと寝た（ふり）バドくん。\nもう一度、「バド、ハウス♪」と言ってみる。と、まだ何も指示していないのに、自ら定位置に行き私の様子を伺うぽー。そしてバドは、ごらんのとおり私と目を合わせないよにガンバル。\n残念ながら、バドの小さな抵抗が成功するはずもなく、無情な飼主はきゃっきゃとお出かけなり〜。ε=ε=ヽ(=ﾟ▽ﾟ)ﾉ ｲｯﾃｷﾏｰｽ♪\n続きはこちら〜↓\n可愛いぽバドを放って飼主が出かけた場所、それはトウキョウ駅。２０１２年に復元工事が完了した赤レンガ駅舎。テレビ番組などで特集が組まれたりしていたけれど、自分のためにもおさらい。\n東京駅丸の内駅舎が建てられたのは大正３年。つまり今からちょうど１００年前！（最近、世界最高齢となった百井さんは、その当時１１歳ですな。）\n関東大震災でもほぼ被害を受けなかった鉄骨煉瓦造りの３階建て駅舎は、1945年太平洋戦争でドーム部分をはじめ３階部分を焼失。戦後に補修・復元工事が行われるものの、予算や資材などが足りず３階建てから２階建てになり、ドーム部分は八角形の寄棟屋根として修復されたそうな。\nところで、・・・余談ですが。永遠の６歳ペコちゃんが誕生したのは1950年なのですって。一番街にて友人と記念撮影〜（作り立てアーモンドめちゃ美味デシタ♪）\nそれはさておき、そしてー2007年。\n焼失した３階部分やドーム型屋根、内装などを当時の姿そのままに、文献などから忠実に再現・復元するための工事が始まる。それは、現在失われつつある左官や板金技術の継承と、創建当時の姿を後に残していくことなどが目的だそうな。\nそれはステキ！！なのだけれど・・・ナゼ、戦後の混乱時に修復された外観部分も遺そうとしなかったのかしら？なーんて、天邪鬼な私は思ってしまったのだけれど。。。\n丸の内南口前にあるビル、KITTEの屋上庭園から眺めてみれば。現代のビル群と、新しいはずなのにレトロな雰囲気の駅舎。なんとも不思議な世界になって、これもまたいいかも♪　　　　　　　（iPhoneパノラマ撮影。一部乱れております・・）\nちなみにKITTEとは２０１３年３月にオープンした、日本郵便が初めて手がけた商業施設だそうな。ここにも面白いものがあったんですよね〜。それは後ほど。。。\n外観とともに目を引くのが、南北に配置されたドーム天井のレリーフ。鷲や鳳凰、剣に、そして干支。当時のものと復元したものは色で分かるらしい。　　　　（下からじゃ遠くてぶっちゃけ細部まではよく見えなーい）\nちなみに干支レリーフ、８枚しかありませぬ。\nなんでだっけ〜？と友人と話しつつ帰宅後に調べてみたら。それぞれ方角を表しているとかで、東西南北の４頭が旅に出ているらしい。なんとその旅先は、九州の温泉地らしい。　（検索するとニュース記事がたくさん出てきたぞぅ）\nほかにも東京駅の見所はたくさんあったけれど、ここらでKITTEに移動しましょかね。商業施設なのだけれど、なかなか面白いものが入っておりマシタ。\nひとつは、旧東京中央郵便局の郵便局長室。創建時の内装が復元されていて、床や漆喰、照明の雰囲気にほっとする。。。そして窓からは東京駅を眺めることができちゃう。\nそして、たっつーを連れてまた訪れたいと強く思っているのが、2Fと3Fにある『JPタワー学術文化総合ミュージアム』。\n東京大学所蔵の学術標本や研究資料などが展示されているのです。写真撮影禁止なのでなんとかその面白さを文章で伝えたい！　が、きっとムリ（笑）でも、ガンバル！\nなにせ展示されているのは「学術文化財」。\n先に書いた郵便局長室のようなレトロな雰囲気いっぱいの部屋に入れば、カエルやキリンなど動物の骨格標本に、海外の鳥や哺乳類の剥製標本がずらり。\nかと思えば、その隣には数理模型が棚一杯に並べられていて。（数理模型：平面図形や立体図形を模型にしたもの。微分幾何学とか難しそうなアレ）\nキラキラと光る鉱物・鉱石標本の隣には、9.5ミリなどの映写機たち。そして柱にはマリ共和国のリュートがかけられている。\nと、こう書くと雑多なように感じさせてしまいそうだけれど。\nなんといいますかね、子供の頃のわくわくするような、あんな感じ。秘密基地に、あちらこちらで見つけた宝物を並べたような。そしてちょっと異世界に迷いこんだようなそんなミュージアム。\nしかも、展示されているのは「学術文化財」。とはいえ学術に縁のない私ですから、まるで高級なおもちゃ箱のようデシタ♪そしてなんと入場は無料だという。\nもちろん、好みも色々あるでしょう。爬虫類が苦手だという友人は困っていたし♪（テンション上がる私にかもやけどw）でも、ちょっと時間が空いた時などに寄ってみるのおすすめです。\n友人をあちらこちらへと引っ張り回した後は、キリンシティでちょこっとお茶をしてトウキョウ観光は大興奮で終了♪\n＜おまけ＞この日の嬉しいもうひとつの収穫。(*´∇｀*)",

    "text": "強めの風もあり涼しくて、いつ雨が降ってもおかしくないような。この時期ならば散歩日和な嬉しい天候だった日曜のこと。\n島に行きたい！島へ旅行に行きたーい！！と、ネットサーフィンをしながら仮想旅を楽しんでいたら。\n『八景島』へ連れて行ってもらえマシタ〜＼(≧∇≦)/ﾔｯﾀｧｰ!!\nんー思っていたのとはチョット違う『島』な気もするけれど。それでも確かにまぎれもなくそこは島〜〜っ！＼(≧∇≦)/ﾜｰｲ♪\nというわけで、続きはこちら〜↓\nさて、八景島とは何ぞや？\n横浜市にある人口島で、島全体が横浜市港湾計画の更生施設となっており、横浜・八景島シーパラダイス、ヨットハーバーなどが整備された市民のための憩いの場。\nそして八景島シーパラダイスとは、水族館・アトラクション・ショッピングモール・ホテル・マリーナなどで構成した複合型遊園地であーる。　　　　　　　　　　　　　　　　　　　　　　　　　（Wikipediaより抜粋）\nぽバドを連れて行っているということは、つまり！ペット可だということでして。\nアトラクションや水族館などの施設はもちろん利用不可ですが、島内をのんびり歩くのはO.K.という嬉しいびっくりな遊園地！（私信：うっちー＆みっちー、他にも見つけたから涼しくなったら一緒に行こね〜♪）\n入園直後はアトラクションの音や園内の音楽、あまり馴染みのない子供たちの楽しげな声に落ち着きを無くすぽー＆バド。\nお座りさせてみて、ぼーっと周りを観察させてみたりして。\nおっかなびっくりだったバドは、意外と早く慣れて落ち着きを取り戻す。そしてぽーは、楽しくなってきたらしく、始終「♪」をふりまいておりマシタ（笑　　　　（イルカ風船がぽーの頭から生えているみたいダ♪）\n敢えてスリルを求めてしまうニンゲンのことを、イヌたちがどう感じているのか尋ねてみたい（笑\n初めて見るジェットコースターに、・・・というよりも。今までに聞いたことのない大勢のヒトの絶叫。しかもどことなく楽しそうな絶叫に、ぽバド揃って「ぽかーん(・－・)？」。\nイベント広場ではマーチングバンドがそれぞれのパートに分かれて練習中。\nなんだか楽しげなぽーと比較すると、バドはなんとなく複雑そうな表情。バドがそんな、ぽーとは対照的な表情をしているそのワケは。\nこの写真を撮る数分前まで。写真奥で練習していたドラム隊の音にびっくりしていたからなのです。　　　　（ちなみに、ぽバドともに雷も花火の音も平気デス）\n上の写真の数分前は、さらに対照的だったぽー＆バド（笑\n面白いことに、どちらか片方が平気だとそのうち慣れるのです。(*￣∇￣*)\nさてさて、奥に見える建物内にはドーム型の水槽があり、泳ぐイルカたちの姿を様々な角度からのんびり眺めることができるらしい。\nぽバドにイルカを見せたらどんな反応をするのかしら。そういえばトモダチのNEOちゃんもイルカを見に行ってたなぁ。しかしここでは見せられる場所は無さそうだなーなどと、思っていたら。\n見れた♪（寒い時期にはペンギンに出会えるという情報も頂きマシタ！）\n暫くは興味津々で、隙間から覗いたり、柵に手をかけてまで眺めていたぽバドだったけれど。\n近くでイルカが大きくジャンプし水飛沫をあげた途端に、何かヤバイと思ったのかそそくさとその場を離れようとするぽー＆バド。もう一度、怖くないことを教えたくて抱えてみたけれど・・\nとっても迷惑そうな顔をするので、諦めマシタ。・・・(ﾟ×ﾟ*)\n八景島は意外とヒトが少ない、という美容師さんからの情報通り、確かに少なくて大きめなぽバドを連れていても歩きやすかったデス。\nそれにしても、１年前の横浜に越してすぐの頃にはこんな所に来れるなんて思いもせずで。だってヒトの多さに家の前の歩道ですら歩くの緊張してましたもん。\n八景島では声をかけてくれた高校生グループに、ぽバドともに撫でてもらったり、（私たちの手持ちの）おやつを与えて貰ったり。走りまわる子供たちに吠えることも一切なく。あー〜、幸せ♪（もちろん、それらはその時の周囲の環境などなど、　　　　　　　　　　良い要因が重なってのことだろうけれど）もっと良いイメージを増やして、色んなところに一緒に行けるようになりたいな〜♪\nだから。島への旅行もそのうち計画するぞ〜♪\n八景島は近いし、また散歩に行こう。うん。",

    "text": "梅雨があけた途端、近所では蝉たちが存在を主張し始めマシタ。\nつまり、暑い。ひじょーにあつい。\n膝に乗ったり、飼主にぴとりとくっついたりを好むぽー＆バド。　　だが、しかし。暑い時期になると体温高めな私の人気はさらにがた落ち。...(´･ω･`)　（ちなみに真夏でもたっつーの膝は大人気なのさっ！）\nそれなのに、ぽーが体を直角にしてまで私に密着していたのは先週のこと。\n写真を撮るために身じろぎをすると、飼主のココロを鷲掴みな可愛い表情で見つめてくる始末で。(*´∀`*)〜♪\nぽーのらしからぬ行動のワケを私は知っている。\nそれは・・・月曜から毎日欠かさず留守番をしていたから。（主婦が専業の私なので、連日の留守番は稀なことなのです・・）\nどこで何をしていたかと言いますと、ある日は「半田そうめん」食べてマシタっ！！ヽ(*^^*)ノ\n続きはこちら〜↓\n「半田そうめん」とは何ぞや？\nずばり、徳島県の特産品でございます。特筆すべきは麺の太さ。ひやむぎに近い太さなのですが、あくまでも製法は「手延べ」。だから太めの麺でも、しっかり素麺なのです。歴史としては、江戸時代に奈良県の三輪から製法が伝えられたとか。（余談ですが、私の実家から三輪そうめんの地域も近いのだ〜）\nさて、徳島県内ではスーパーの乾麺コーナーでも、ごくごく当たり前に、普通に陳列されている「半田そうめん」\nしかし関東ではデパートですら流通していない、らしい。\nそんな貴重な、珍しい素麺がっ。なんと、奥さんっ！！ここ関東でも食べられるんですって！！\nというわけで、友人３人でランチにと向かったのがココ。　　　　　　『阿波や壱兆』\nちなみに、友人達の前任地はもちろん「徳島」♪\n素麺なのでお腹いっぱいに、というのはもちろん厳しいけれど。一つ選ぶだけでも悩んじゃうほどに豊富なそうめんメニュー。\n私は日替わりメニューの「牛肉と茄子の煮浸し」\nこちらも日替わり「コーンと豆乳、ジェル寄せ」　　（正確なメニュー名忘れマシタ）\nそして定番メニューの「すだちそうめん」\n徳島名物のすだちをごくごく薄ーくスライスしているため、皮も種もなんの抵抗もなく全部食べちゃえます。\n出汁の濃さは好みに応じて調節してくれるのですが、そのままで充分に美味しゅうございましたっ！（３種類ともそれぞれに美味しかった〜。少しずつシェアしたの(*´∇｀*)）\nカウンターとロフト席のみの小さな店ですが、夜には居酒屋さんとしてお店を開けているそう。しかも、半田そうめんだけでなく、その他の徳島名物も味わえちゃう。\n身の柔らかさや甘みが特徴の地鶏「阿波尾鶏」や「竹ちくわ」、そして徳島ならではのローカルフード「フィッシュカツ」まで！\n徳島に住んでいた期間、実はたったの５年なのですけどね。それでも、なかでも、半田そうめんはかなり好き。暖かいのもお勧めだけれど、暑い夏にこそぜひいかがっすか？\nさてさて、美味し懐かしランチを堪能したあとは、なるべく涼しい場所を選んで歩いて友人宅へとお邪魔しまーす♪\n子供の頃に14階建団地の13階に住んでいたことがあったけれど。友人宅はそれのさらに２倍以上の階数ときたもんだ。\nこれ、エレベーターの階数表示です。写真を途中で切ったけれど、上階がさらにありますですョ！\n都会って、すごいーっ！！∑ヾ(≧□≦*)ﾉ\nさらにさらに、ベランダからの眺めは気分爽快〜〜っ＼(≧∇≦)/ ｷｬｧ♪　　夜景がそれはもう素晴らしいそうなっ！\nあぁ〜ペット可だったらなぁ〜。ぽバドも連れてきてベランダで夜景を眺めつつビールを飲んで。そのまま泊まって、朝焼けをベランダから眺めてコーヒー飲んで・・・　（友人のおうちですょー。あなたの家ではありませんょーヾ(~∇~;) ｺﾚｺﾚ）\n写真だとほぼ見えないのだけれど、矢印の箇所に東京タワーも見えたの。隣のビル群は品川あたり？？チガウ？？　　　　　（説明してくれてたのに忘れちゃった(´ε｀*)ゝﾃﾍｯ）\nいつまでも、友人たちとのんびりお喋りを楽しみたいけれど。\n私には待っている ヒト イヌがいるのだ！というか、日中に連れ出せないのを良いことに遊びまわっているのが真実なのですけどネ。しかし、こうも暑いと、エアコンが切れていないだろうかなどとっても気になる。\nサンダルが崩壊したから、友人のビーチサンダルを借りて履いて（笑電車音痴の私を、友人たちに見送ってもらって。ｱﾘｶﾞﾄｰ(*≧∇≦)/\n急いで横浜の自宅へと戻れば、玄関では珍しく私にトンっと飛びついてくるぽーさん。\nバドはサークル内でいつものようにお利口留守番完了で。\nそしてその日は一日中、ぽバドに見張られていて。翌日には最初の写真に戻る、というわけなのデシタ♪\n連休はたっつーも一緒にたっぷり楽しむょ〜(*´▽｀*)ノ゛",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
