    "text": "来年の６月は健康第一で乗り切りるじぇーっ！！\n何を今から１年も先の目標を立てているのかと言いますと。わたくし先々週に未だ咳の残る厄介な風邪をひきまして、その週末からはたっつーにしっかり伝染してしまいまして。\nそしてさらにこの月曜からはぽバドともにお腹を壊し、体調不良月間となったためでありますデス。\n軽症だったぽーはすでにすっきり完治。バドもほぼ８割程度まで快復し、今日はおもちゃを投げてくるほどに調子も良くなっておりマス♪\nいやいや、それはまだムリねー。台所に張付く元気が出たのはとっても嬉しいけどねん♪\n横浜に来てから初の通院。しかも病気知らずのバドの通院。そんなわけなので、かる〜くそれらをここに記録。（絶対、長くなるよねー。しかも食事中の方、スミマセヌー）\n続きはこちらから〜↓\n月曜日頃から粘膜混じりのナンベンになったぽバド。\nあぁ、大腸からきてるわね。きっと食べ過ぎの消化不良だわね。\n原因にあれこれと思い当たる節がある飼主は、即座にお腹壊した時用の特別療法食をぽバドに開始。ほんとは絶食させて腸を休めるのが良いとは知っているけれど、なにせ空腹になるとすぐに胆汁を吐いてしまうもんね。\nだからお粥やすりおろしりんご、お腹に良いハーブなど、その時の状態に合わせたものをごく少量ずつ数回にわけて与えております。　（今回は友人に教えてもらった食材も使ってミタ！ありがとね〜♪）\n翌日の火曜。ぽーは回復の兆しが見え始めたものの、バドの調子がよろしくない。\n痛むのか、腹部に違和感があるのか。私が立ち仕事をしているとウロウロしたり、啼いて訴えてきたり。しかし座って用事をしていると隣で落ち着いて眠ったりなんてことも。\nうーむ・・波がありそのタイミングが合っただけなのか、それとも甘えていたり安心できるからなのか。\nなにせ私にとってもバドにとっても、一緒に暮らし始めて初の病気。とにかく、しっかりよく観察してサインを見逃さないようにしないとネ。（正確には以前にもお腹壊したこともあるけれど、　　一回きりのハイベンですっきり治ったので悩まずだったのデス）\n幸いにも食欲はしっかりあるし、元気もあるのでもう少し様子を見ることに。が、夜には血が混じるようになり、夜中にはしっかりケツベンに。（辛そうなんだけど、あいかわらずこんな調子なバド。まぁ、暑かったのよネー。）\n水曜の朝を迎えて直ぐに、６時に回収したてのベンを持ち病院へ。　（向かったのは、診察時にはイヌを預けちゃういつものトコロ）実はその時にはほんのすこーし回復傾向にあったけれど病院へ。\n病院苦手なぽーとは違ってバドはそうでもなく、伏せてのんびりな待合室。飼主から離される診察時には、今まではぽバド揃ってワンワン啼いていたけれども。今回はバド独りきり、さてどうかしらと思っていたら・・・\n「はぁう〜ふぅぅぅーえ〜ん」と、か細い弱気な声が一度聞こえただけデシタ。\nさてさて、検査の結果は。熱もなく細菌感染もしておらず、やはり消化不良などによる大腸炎とのこと。念のための抗生剤の注射と整腸剤や大腸炎用の薬などの処方。ハイベン回数も多くケツベンも出ていたため、点滴で水分補給を受けることに。\nこの場合の点滴とは『皮下点滴』というものらしく。私もバドもこれまた初体験。\n「点滴」と聞き、静脈しか考えていなかったので処置の早さに先ずびっくり。背中から注入された輸液は300mlほど。肩周りに溜まったぷょぷょたぷたぷは、これからのんびり吸収されていくそうな。\n自宅に戻った頃には、重力に従い脇腹近くまで降りてきているたぷたぷ。\n夕方には1/3ほどの量に減り、胸の下でたぷたぷっと。そしてこの頃には薬も効いてきたのか、熟睡できるようになったらしく顔色も良くなってきて。（表情というべきかしら）\n木曜の朝にはケツベンや泥状ベンはすっかり消えチワワサイズの細さと形になり。昨晩はさらにかなりぐっすりと眠れたらしく。（私もね〜ヽ(´▽｀)ノﾜｰｲ♪）今日はしっかりとつまめるブツになったじぇ〜♪\n調子はかなり良さそうなので、夕方にはぽバド揃って少しだけ長めの散歩。溝に住んでるネコを探してみたり、道草を食べてみたり。\nうむ。やっぱ、バドはその表情、その行動なのよネ〜。(*´∇｀*)\nというわけで、来年の６月もこれからも健やかに暮らすぞー！\n＜覚書＞診察料　　　　　　　　　　　　　　　　　　　　　¥　500\n身体検査(体重・体温・視診・聴診・触診)　　　　　　　　¥1,500\n便検査(直接法)　　　　　　　　　　　　　　　　　　　　¥　800\n　　(浮遊法)　　　　　　　　　　　　　　　　　　　　　¥1,000\n皮下点滴(250~500ml)　　　　　　　　　　　　　　　　　¥3,000\n皮下・筋肉注射(15~20kg)　　　　　　　　　　　　　　　¥1,750\nX2処方料　　　　　　　　　　　　　　　　　　　　　　　¥　800\n調剤料　　　　　　　　　　　　　　　　　　　　　　　　¥　500\n内服薬(ビオイムバスター・リーダイ・スラマX５日分)　　　¥2,520\n合計(内税¥1,129)　　　　　　　　　　　　　　　　　　¥15,249\n支払い(保険適用)　　　　　　　　　　　　　　　　　　　¥7,624\n・・・か、家計のためにも健やかに暮らすぞー！！",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
