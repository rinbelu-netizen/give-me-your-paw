    "text": "ケガにすっかり慣れてしまった飼主。ついつい経過報告を怠っていました。。「ぽーちゃん、どう？」と友人たちからのメールや電話。報告してなかった～と焦っているところです（みんな、ありがと～～～）砂浜へは行ってないけれど、ぽーさんすでに走ってます～屋内ではケガをした翌日から、バドとがうがうはしゃいでいたりして。とはいえ治りが遅くなってもいけないので、本気走りは禁止～ケガを機に、ぽバドひとりづつで散歩に行ったりもしています。（バドのへたれ対策なのです。ぽーの威を借る虎なもので）ケガの翌日にはさすがに若干行動が控えめだったぽー。ですが、昨日は歩き慣れた散歩道でこんな様子も披露（この先にあるのは山と果樹園です。誰もいないことは確認済、かつ、車通りではないのでご安心を～）[1]１日２回の消毒とガーゼ交換をしているけれど、傷口を見せると舐めているけど、こんなこと言ってマス。[2]うむ。しかし、今週いっぱいは本気走りはやめておこうね～さて、昨日は午後からぽバドを置いて出掛けていた飼主。帰宅後はぽーさん恒例「伸びをしながらおかえりー」と、同時にこっそりボディチェックを受ける飼主[3]やっぱり、ばれた～～～ぽバドから、ふんすんふがふがと執拗なボディチェック入りましたっ[4]やはり、ぽバドの知らない子に会うとチェックが激しいなぁ飼主がこっそり（１時間も！）寄り道してきた浮気のお相手は・・・[5]ママはコーギー＆ビーグルmix、パパは和犬という成長具合が未知数＆楽しみなココアちゃん（♂）ただいま生後５ヶ月で、こんなスタイルなのだ～[6]「番犬にならない～～」と友達が嘆くほどの人懐っこさ撫でまわしーの遊びまくりーのさせてもらったせいか、私の帰宅後には爆睡していたとかそういえば、すでに途中で寝ようとしていたような。。。[7]まだ他の犬には会ったことがないそうなのだけど、これだけヒトに従順なら番犬にならずともそれだけで良いよね～次はぽバドと会ってみようか～。砂浜もいつかどうかしらん。楽しい子たちがたくさんいるぞ～",

    "text": "さて、前の記事で予告していた、カビおやつに関しての続報と、新たな情報についてです。長くなりますが大切なペットを守るための話なので、ぜひ読んでやってください。・・・先ずは、友人一家に起きた出来事を要約・・・・カビが生えていたおやつを食べ、５頭の犬が揃って体調を崩した。その中の１頭は耳血腫になり現在も治療中。新たな被害が出ないようにと問合せをしたが、クレーマー扱いをされ、送った商品の検査すら行われない。業者が誠意のある対応をしてくれないため、自分たちに起きた出来事をブログに記したところ、弁護士をたてられさらに脅迫まがいの文章で削除要請をうける。・・・・・・・・・・・・・・・・・・・・・・と、ごくごく簡単にまとめ過ぎているかもですが。。。もう少し詳しい内容は私が書いたこちらの記事で↓→イヌのために。→ペットはモノではない。その業者について連想させるから書くなと言われ、スマイル（耳血腫になってしまったコ）の病状ですら、彼女は自分のブログで書けない状態です。幸い耳血腫になったスマイルくんの経過は良いようです。けれど耳の変形は避けられず、完治まで気が抜けない状態は続いています。もちろん、黙って言いなりになってるわけではないのでご安心を。スマイル達のためにも泣き寝入りする気はないですものねただその商品、検品も販売業者へ知らせた形跡もなく、現在もネットや実店舗で販売されているようです。しかも大幅に安売りされている場合もあるようです。なので、今回は商品の写真を載せることにします。彼女のところから戴いた写真。[1]ヒト用でもそうですが、叩き売りされた商品を買う気にはならないけれども。食品は特に。全ての包装に問題があるわけではないかもしれません。しかしペットのことを考えているとは思えない、そんな対応をした業者の商品を私は選ぶことはありません。さて、次は上の商品とは別のおやつの話。と言っても、全く関係がないわけでもないのですが。情報源は何かとお世話になっているSMILES@LAから。皆さんと共有したい内容はコチラ。→アメリカ食品医薬品局からチキンジャーキーについての警告ほぼその記事から得た内容になりますが、現在アメリカで中国産チキンササミジャーキによる、犬の腎臓や肝機能障害による被害報告が出ているそうです。死亡例もあるようです。食品サンプルの調査では有力な毒性を示す結果が出ず、リコールなどは行われていないそうです。しかし症例はさらに増え、上の記事が書かれた2日前の報道では約６００件の報告があると。それらの商品のメーカーはネスレピュリナ社にデルモンテ社など。誰でも知ってる社名ですよね・・何かと悪いうわさの耐えない中国産食品。私は元々ヒト用でも添加物などを気にかける方です。ペット用でも最近は「国産」だとか、「無添加」だとかの文字が目立つようになりました。だけどそれらを信用する根拠もないのが現実で。何か問題が起きたときに業者側が誠意ある対応をしてくれるのか？その答えはすでにスマイルたちの件で示されてしまいました。（もちろんそんな業者ばかりでない、と思いたい）何か起きたとき辛い思いをするのはペットたち。そして飼主はしてもしきれないほどの後悔をしてしまう。そうなる前に少なくとも、不安要素のあるものに手を出す必要はないと私は考えます。みなさんはどう思われますか？最後に気分転換を兼ねて・・うみちゃん達との散歩中に土手で見つけた春の便り[2]",

    "text": "散歩コースの途中によく吠えるラブがいます。今日はなんだか吠え方がおかしいのでよく見たら、水が飲めるのか心配になるような口輪をがっちりと装着以前からちょっと気になっていたのですょ・・・子供とお父さんとで散歩している姿をたまに見かけます。ラブくんはぴょんぴょん飛び跳ねてとても嬉しそう。なのだけれど、お父さんはしかめっ面でいつも怒っている。口輪だとか道具はあくまでも「補助」として使う物だと思うのだ。根本的な改善をしないと一生外せなくなっちゃうもの散歩時はお座りをさせたりして、落ち着くことを教えればよいのに。吠え声対策も犬小屋の場所を変えてみればよいのになぁ。人や車が最もよく通る位置の、庭の角がラブくんの居場所。昼寝しようにも周囲が気になって仕方ないのよね、きっと。散歩が上手にできないのも、悪いのは犬じゃないのにーーーーと、ネガティブな内容で始めてしまいスミマセン。さて・・・・、と気分を入れ替えて、本来書く予定だったものを２泊して前回よりも、すっかり我家に馴染んだ風のうみちゃん。うみちゃんが落ち着けるようになったためか、ぽーも安心してのんびり。いつもの我家と変わらない、穏やかな土曜の朝。（若干１名１匹、何かやっておりますが）[1]そんな私達とは対照的に高速バスを乗継ぎ、予定より５時間程遅れて到着したうみちゃんパパ。とーってもお疲れだったけれど、おかげで遊びに来たぽー大好き夫婦もうみちゃんに会えました[2]会った直後は彼女の大きさに驚いていた友人たちだったけれど、うみちゃんの人懐っこさと甘えん坊ぶりに「かぁわいぃ～」ぽーを触ろうとする人は選ばせてもらっちゃうけれど、（怖がりながら触る人に、ぽーは吠えるのです）うみちゃんは全く心配いらずのフレンドリーなコだもんね～そしてブログで表現しきれないバドの可愛さと、こっけいな行動を味わってもらいました。（会ってこそわかる、変さがあるのですょ。このコは（笑）もちろん、目的のぽーとは夜も一緒に寝たりなんかして、たっぷりまったりいちゃいちゃしていただきました～（また近いうちに会おうね～）[3]（sa@coさん～！この写真のバド、ちょっとニロくんぽくない？？）うみちゃん滞在中は、こんなことをして遊んでみたり。（ぽーの手と大きさ比較～）[4]こーんな寝方をしてみたり（うみちゃんは困った顔をしていたとか、していなかったとか・・・）[5]前回はうみパパに連れて来られ、うちに置いて行かれたうみちゃん。落ち着くまでに時間が少々かかりました。そして今回は、私達が迎えに行き強制連行それが良かったのかどうか、そわそわすることもなく始終まったり。次回は再びうみパパに連れて来られます。さーて、どうなるかな。すぐ落ち着けるといいなぁ～。そしてその次回がいつかというと、今晩だったりするさてさて、おせっかいかと思いつつ、お知らせしますsoraumiさんは無事手術も終わり退院もまもなくです。（15:00追記：退院のお知らせきました～）メールは戴いているけれど、たぶんブログ書くほどの体力もないと思うので・・・うみちゃんのことも、うみパパのことも気になるだろうなぁ。うみパパの世話は本人に自分でしてもらうとして（笑）、今日明日のうみちゃんのことは心配せずにお任せあれ～今回は半分くらい私信になってしまいましたねぇ。さぁ！明日は相方と一緒にみなで散歩行くぞ～[6]",

      "https://stat.ameba.jp/user_images/20120330/14/rinbelu/8c/a0/j/o0480048011883818076.jpg"
    ],
    "text": "暖かく天気が良いので日光浴。ぽーはいつもの場所[1]そして、バドは…[2]クッションを用意しているのに、わざわざそんなトコロなのがバドらしい",
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
