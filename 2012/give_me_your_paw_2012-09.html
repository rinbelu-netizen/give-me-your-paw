    "text": "お互いにかなり慣れてきた、ぽバドうみ３頭生活。うみちゃんを預かるにあたって、私には外すことのできない「楽しみ」があるのです。まずはやっぱり、これでしょう。⇨『３頭引き』この写真は朝に撮ってもらったもの。寝ボケている朝は注意力も足りないので主人と一緒。けれど夕方にはこんな感じで散歩に出ています。[1]主人の帰宅を待ってからでもよいのだけれど、暗くなるとマムシに猿、正体不明の野生生物が出没するからキケンなのですよね～さて、もう一つの楽しみはこれ。⇨『ブラッシング』短毛なぽバドもしっかり抜けるのだけれど、やはり長毛種のブラッシングは抜け心地がチガウ！[2]先代犬ベルのおしり周りをとくのが好きだったのですょーそして嫌がられ、逃げられる。もちろん、うみちゃんにも逃げられる。試しにごくごく軽～くぽバドにブラシをあててみた。さて、彼らは何と言っているのでしょうねぇ。[3][4]それにしても、３頭いるとあっという間に時間が過ぎる。ボディチェックしているだけで朝から夜になっている！と、流石にそこまでではないけれど。私がずーっと世話できるのはやはり２頭かなと改めてオモウ（なんの話だ？いったい、何の？？）うみちゃんのお泊まりは色々な意味で貴重なのだ。何よりも写真を撮るタイミングを逃しちゃう。（それか？それが最も大事なことなのか？！朝からくしゃみ連発うみちゃん。鼻をひん曲げヘン顔だったのに、これしか撮れなかったー[5]それでも、ほんの一瞬だったけれど、こんな姿を残せたり。[6]うみちゃんお得意の寝姿もばっちり撮れました。[7]今までのように窓の外を眺めたりもせず、自分の落ち着く場所もできてきたかしら。いないなーと思ったら、こんな場所で笑っていたり。（仲良し兄弟は何をしているのでしょねー）[8]犬種差か、性格の違いなのか。うみちゃんが居るからこそのシーンがこれ。主人への「おかえりなさい」祭り。ぽバドもつられてか、いつもの数倍でお出迎え。[9]ラストは動画をつけてみました～毎朝、おもちゃを私たちやぽーの側へ持って来るバド。今のターゲットは、もちろんうみちゃん。バドの激しい遊ぼうアピールに、うみちゃん困惑気味。今ではしれっとしているぽーも、１歳の頃にはわさわさだったんだけどね～うみちゃん、毎度ごくろうさまですっ。＊音量注意バドがわんわん言うてますー",

    "text": "こんな光景がデフォルトのような気分になる、ぽバドうみ３頭生活も3日目に突入。[1]みうちゃんが用事のついでに立ち寄ってくれました。車酔いと緊張でよだれがつつーっとこぼれる蘭丸。[2]いやーな予感は的中。さっそくぽバドに襲われる蘭丸。（キミタチ、目がコワイんですけど・・）[3]そして飼主みうちゃんは、うみちゃんに襲われる。あっ！みうちゃん⇄うみちゃん。語呂がオモシロイではないかっ。[4]涼しくなった頃、またまたひなはるランへ～ひなた＆はるた兄弟、ぽバドを見ると腕の中へと避難。あ”・・もしやトラウマになりつつある？？[5]この日はご近所友達、ゴールデンのハッピーちゃんも一緒。[6]彼女も元気いっぱい遊ぶの大好きなのだけれど、なかなか思うように輪に入れない。[7]さらに上をいく遊び大好き犬が３頭も揃っちゃったものねぇ。バーニーズは空を飛んじゃうし、[8]細い犬は野獣と化した挙げ句、３頭徒党を組んで追いかける。今回とくにハイテンションだったぽバドうみ。これに懲りずまた次回、遊ぼうねぇ。[9]そして3日目の夜はこんな感じでまったりと。ちょっと可哀想な雰囲気のバドくん。写真を撮るため膝の上からどかされた、やっぱり可哀想なコでした。[10]本日ラストの写真は２枚～とーっても可愛く撮れた～っと自画自賛中な写真。[11]そしてLet's dancing風なぽー＆バド。ウィペットって、寝姿とかシンクロすること多いのですよね～[12]ぽバドうみ生活もあとわずか。金曜の夜にはうみパパ＆ママがお迎えに来ますょ～慌てずのんびり帰っておいでね～",

    "text": "昨晩ひゃうひゃぅ言いながらの、パパママと嬉しい帰宅をしたうみちゃん。[1]え？ん？？何か違和感ありますかねーうみちゃんお預かり最終日、やっぱやっておかないとね～。[2]ぷはは。もいっちょ！！[3]あぁ、嫌がってる。すんごい迷惑そう～～。うみちゃん、すぐに下をむいて落としちゃうんだもん。かぶせるのに苦労したー。もうちょいセットしたかったのにーと、さてストレスが溜まったようなので（誰のせいだ？誰の？？）この日もひなはるランにお邪魔しました～３頭引きは楽しいのだけど、気力体力かなり必要になるのです。必要運動量も異なるぽバドうみなので、連日利用で仕事の邪魔＆近所迷惑かと思いつつも・・有難かった～～メインで遊んだわんず揃った唯一の写真がコレ。（皐ちゃんと、ひなはる見えないねー）[4]息ぴったりにいたずらバドを叱る、和坊＆皐ちゃん兄妹。と、ぼーぜんとその様子を見守る、はるちゃんのおしり。[5]連日ランと初めましてのヒト＆イヌばかりで、ちょっとお疲れモードなうみちゃん。（おっ！うみちゃんと和坊、色の組み合わせが同じ～）[6]お疲れなんだけど、初めましてな和坊＆皐ママへのご挨拶はきちんとこなします。（ぽバドにその愛嬌をちょこっとでいいから分けてー）[7]これだけの頭数が集まると、相性の良さというか、遊べるコ、遊べないコ同士がはっきり分かれてくるわけで。昨日はうまく輪に入れなかったハッピーちゃん。この日は度々バドを誘ってくれて、楽しく追いかけっこ。と、ぼーぜんとその様子を見守る、はるちゃん。[8]ほんとは大きいコ大好きな、ひなた＆はるた。だけれど、ぽーに追いかけられてからちょっとトラウマに。はるちゃんは腕から降りてくれたりもするのだけど、ぽーが近づくとやっぱり怖くて「抱っこー」ぽーちゃん、たぶんねぇ。そもそもその接近の仕方に問題あるとオモウのだー[9]大好きな皐ちゃんを見てるときはこんな顔なのにー。（これは飼主のしつけとか育て方の問題ちがうよね？ねっ？）[10]と、様々なイヌ模様が繰り広げられた金曜日のひなはるラン。ひなはるパパとうみちゃんは、「今度はうみのパパママを連れてくるわ～」と約束の握手を交わす。（ほんとはおっきな肉球を堪能されているだけだったり）[11]そしてこの日、唯一の大型犬同士なハッピー＆うみ。遊んでる写真がうまく撮れず、なんじゃこりゃな写真になりました。[12]４日間、あっという間だったなぁーうみちゃんが帰ると、部屋が静かになったよー（色んな意味で）またいつでもどうぞ～[13]",

    "images": [
      "https://stat.ameba.jp/user_images/20120913/13/rinbelu/9a/47/j/o0399030212185649941.jpg",

    ],
    "text": "後１週間でバドを迎えてからちょうど1年。ぽーの時も感じたけれど、まだ、たったの１年しか一緒に暮らしていなかったらしい！ぽーとうまくやれるのか、それだけが気がかりだった去年の今頃。そんな心配は杞憂に終わり、今ではおもちゃの引っ張りこ遊びもできちゃうほどに。[1]犬自身の性格や年齢、環境などによっても変わってくる多頭飼い事情。それでもウィペット♂多頭飼い先輩方の、経験＆アドバイスはとても心強く励みになっています。ぽーの威を借るバド対策として時々試していた、バドの「ひとりで散歩」や「ひとりで留守番」。[2]雨戸が風に揺れる音で驚き飛び上がる。常にきょろきょろ背後の確認まで必要なひとりで散歩。後ろ足は常にぷるぷる振動なぽーのいない散歩。トモダチわんこと一緒でも、ぽーと一緒にしか遊ばない。興味を示したと思ったら、それはぽーの真似をしただけだったり。ぽーのケガを理由に、「ひとりで散歩＆留守番」訓練試練が強化された１歳直前。写真を見返すとずいぶんと顔つきに変化が。飼主の体力がもたないので、「ひとりで・・」はお休みだった夏。そして先日のひなはなるラン。その時は全く気がついていなかったのだけれど、なんとバドが！！ぽー以外のコと遊んでいたのだった！[3]どうりで帰宅後にやたら疲れを感じたはずだー今までは同じ方向に走るぽバドを見守れば良かっただけ。それがこの日は、あっちこっちで走るぽーとバドを見ていたからなのね～そして「ひとりで留守番」も問題なくこなせます。出掛ける時には泣くこともしないから、ぽーの時より安心かも。しかしバドの上手な留守番には必要な物がある。それはサークルとベッド。ぽーのようにフリーで居ることは逆に不安になるらしく、ここに入ってさえいればひとりでも安心なのだ。（動かしちゃうけどね～）[4]というわけで、バドは分離不安にはならずに済んだようです。（＞アシュポル母さん あのコメントレスでバドの変化に気がついたのです～）ただし、それはぽーに対しては、というお話。じゃあ、誰に？その対象は私でございます。と言ってもその程度は軽く、これまたサークルがあれば回避できるくらいのものですが。バドがどんなことしちゃうのかについては、またの機会にでも。それにしても、バドくん。成長したね～生後４ヶ月の頃と、今の写真を並べてみました。[5]全く性格の異なる、ぽー＆バド。これからもそれぞれで面白いことしてくれるのだろうなぁ～見逃さないぞー。ぽバド観察永遠続行中ー",

    "text": "２週間ぶり砂浜遊びな昨日のぽー＆バド。先日の帰省時に父から借りたカメラで撮影してみました～そのカメラとは、大切に棚に飾らていたコンパクトカメラ。（要するに使ってもらえていない可哀想なカメラさん）[1]愛用していたコンパクトカメラが随分前に壊れ、ずっとiphoneかデジタル一眼での撮影で、久しぶりのコンデジ撮影。（コンデジ。。うーん、デジイチとか、いまいちこの表現に慣れないー）[2]慣れていないせいもあるけれど、撮るの難しー「ペット」モードなるものがあったので、指示通りに名前と生年月日を入力してみる。なるほど、ペットの年齢が写真にデータとして残るらしい。ぽーなら『３歳０ヶ月２８日』とな。日数までとは、面白いな～。２頭分登録できないのがざんねん。[3]コンパクトカメラといえば、ソニーがフルサイズのコンパクトカメラを発売するそうですねぇ。どういった用途で、どんな方が買うのだろ～超高画質でコンパクト、そして超高級と。面白い。フルサイズのNEXも出しちゃうのかしら。。。[4]日進月歩なデジタルカメラ世界だけれど、私は４年前のデジタル一眼を極めるまでがんばろう。と、ひじょーにだらけたブログでお粗末さまでした。",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
