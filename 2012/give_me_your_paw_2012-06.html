    "text": "楽しいことだらけなぽバドとの週末、まずは砂浜でひとっ走り。砂浜へ行くだけで大喜びなのだけれども、たっつーが一緒なのでとっておきのはしゃぎぷりを披露するぽー[1]波に向かって飛び込みばしゃばしゃ遊ぶぽバド。ぽーが川だと水に入りたがらないのは、足場が悪いこともあるのかも。バドが川でどうするかは、もうそろそろ判明させようさていよいよ、水曜日から漬込んでいた鹿肉を燻製だ。前日に塩抜きしたり乾燥させたりして、日曜の朝からモクモクと。ついでにチーズと、ぽバド用にささみもスモーク。[2]スモークささみが大好物のぽーは、チップの香りがするだけで目の色が変わっちゃうほど。バドは初スモーク体験となるわけだが、大喜びするに決まっているチーズは燻製直後の温かいままを食べるのが最高に旨い。外側は水分が抜けたことにより少し固め、そして中はとぉーってもクリーミーなのだ～我家ではスモークチーズと卵をぽーのそばで食べるときは要注意。油断していたら、ぱくっとやられちゃうのだ（他の食べ物ではしないのに）[3]鹿肉とささみは、しばらく風にさらすためおあずけ。届きそうで届かない、そんな場所に美味しいものを置かれたぽバド。バドの口が開いているのは暑いからではなく、美味しい香りに興奮しているせい[4]さすがは慣れたもの。「いつか貰える」と分かっていて、涼しい顔してひたすら機を待つぽーさん。ただし、口の端にはしっかりと涎が溜まっている[5]「いやいや、機は自らつくるもの」と言わんばかりのバドくん。狙いを定めジャンプを数回。挙げ句、私を踏んづけ怒られる[6]「諦めるなんて言葉、ボクの辞書にはありません」私が動くたび、たっつーが移動するたびについてまわるバド。様子を見るため網に近づこうものなら、期待いっぱいこの笑顔[7]これだけ待ったのだもの、バドの涎は溜まるどころじゃない。ヨダレ風船どころじゃない。文字通り、これがほんとの「垂涎」。だーだーこぼれ落ち、風になびくほどに。[8]そんなこんなの楽しくて美味しい、ぽバドの週末なのでした～[9]",

    "text": "朝から続いた雨がやみ、散歩に出掛けた昨日の夕方。ご近所のトモダチ兄妹に出会いましたビーグルの和坊とは、ぽーがパピーの頃からのおつきあい。お庭で遊ばせてもらったりもしているのだよね～。それなのに、今まで写真を撮っていなかったという衝撃の事実[1]何度も散歩中に出会うし、ブログも見てもらっているほどのおつきあい。それなのに、ブログに登場するのが初めてという衝撃の事実ようやく、登場なのだ～っ和坊の妹、ミニチュア・ピンシャーの皐（さつき）ちゃん。バドとほぼ１ヶ月しか歳が変わらないのだ。パピーの頃はパパさんの前ポケットに入っちゃう大きさだったのよね～（あーっ！その頃にナゼ写真を撮らなかったのだー私のバカ）[2]あ、ちなみに写真にかぶっているモヤは前を横切ったバドですところで、ぽーが（バドも）ちょっと大きめウィペットなのは有名なこと。（それはあくまでも標準サイズを基準にしての話だけれども）さっちゃんもちょっと標準ではなかったりする。さーて、大きいのか小さいのか、どちらでしょ～ちなみにミニピン女子は標準で４～５kgだそう。[3]遠近法でさっちゃん、大きく見えちゃいますね～和坊もたしかビーグルにしては小さい方だったはず。では、ぽーと一緒の写真をどぞ。[4]ぽーと一緒だとみんな小さく見える、なんてことは言わないでネ実は、さっちゃんの体重は2kgちょいなのです。食欲旺盛なんだけど太れないそう。バドと同じで活発だからかしらん。そう、さっちゃんは、ちょっと小さめミニピンなのでした～[5]元気いっぱい遊び盛りなさっちゃん。バウスタイルで遊びに誘う。そして一緒に跳ね回るのはバド。（写真に写ってるのはぽーの鼻。バドは私の後ろで跳んでマス）[6]飛び跳ねているときのさっちゃんの顔が、それはもう可笑しくって可愛くってたまらんのだだけれど、さすがにiPhoneではうまく撮れなかった・・[7]今度は一眼でふたりを撮らせてもらお～っと。またよろしくでーす",

    "text": "梅雨入りしたのを忘れてしまうくらいの晴天な１４日mitomonさんと和菓子屋さんで待ち合わせ。駐車場に車を停め、そのまま車内にてiPhoneを手に取る。するとパラパラと大粒の雨音が聞こえた。「こんなに晴れてるのに？」 顔をあげると・・・苦笑いしながら車を降り、正面から愛車を眺めてみる。あぁ、なんということか。被害はフロントガラスだけではなかったヨウダ [1]数分後、店に到着したmitomonさんが見たのは、ナゼか和菓子屋さんでせっせと洗車をしている私の姿（お店でぞうきんとバケツをお借りしちゃいました～）いちご大福を持って向かった先はsoraumi邸。来客大歓迎のうみちゃん、車の音を聞いて家の中を走り回っていたそうな。玄関に入ればそれはもうタイヘンな大喜びでお出迎え女３人よれば、美味しい和菓子に絶品ピザの話題で盛り上がる。しかし普通のガールズトークと異なるのは、話題の９９％が「犬」関連になっちゃうということうみちゃんの元気っぷりは、いつでもどこでも変わらずで私も今日はウンがついた日だったけれど、うみちゃんもラッキーを引き寄せがんばろうネ[2]不良専業主婦は家の主より、かなり遅れての帰宅ぽバドのごはんも世話も全て済んでいたりして・・注文していたフリスビーが届いており、チョット遊んでみる。予想以上にぽーが気に入ったようで、バドに取られることを阻む程というわけで翌日（つまり今日）朝からnewフリスビー持って砂浜へ。どんなフリスビーなのかはまた後日改めて。たっぷり遊んで帰宅すると、庭の砂利の上に一匹の蝶。ふらふらよたよたと、今にも風に飛ばされそう・・・可哀想に、弱っているのかしらと思ったが、チガウ！！羽化したばかりだっ先週末くらいから玄関脇にぶらさがっていた蛹がいたのだ。羽根が乾く途中で風に煽られたのか。このままではぽバドの餌食になっちゃう（敵は鳥だけではない）[3]調べてみたら、ツマグロヒョウモンの♂らしい。なんと幼虫時代にもよく見かけていたあのコではないか。スミレの葉をもしゃもしゃ食べていた、黒地にオレンジライン、刺のあるゴス系の幼虫羽化直後に出会えるなんてやはり運が良いそーっと木陰に移しておく。目立つところで蛹になっていたけれど、こうして羽化できたのだ。この蝶にも運がついていたのかもね[4]",

    "text": "台風４号が去り、続けてやってこようとしていた５号。４号の別名はグチョル。ミクロネシア語で「ウコン」だそうな。そして５号の別名タリムは、フィリピン由来で意味は「鋭い刃先」。鋭い刃先は消滅し、今朝から絶え間なく雨を降らせている。そんな荒れ模様１週間。その合間に訪れた、散歩日和な昨日。今のうち、今のうち、というわけで砂浜へ行ってきました～[1]去年のような被害もなく海岸は穏やか。漂流物もほとんどなく、波による浸食もわずか。と言っても、ふだんは来ない場所まで波はきていたモヨウ。こちらは月曜に撮った写真。養浜工事のために積み上げられた砂山。[2]押し寄せた波に寄って削られ、ちいさーくなっていました。[3]うん。でもこれくらいで済んでほんと良かった。去年は砂浜を修復するたび台風に襲われ、海水浴場はクローズのままシーズンが終わってしまったもの。（犬たちを遊ばせるにはヒトが少なくてよかったけどネ）１枚目の写真で気がついた方もいらっしゃるかもですが、昨日は久しぶりにNEOちゃんと一緒だったのだぽーの怪我、そしてNEOちゃんのヒートと続き、遊ぶのはいつぶりだというくらい久しぶり。（２ヶ月以上かしら？？）３頭ともモチロン大喜び なんだけど、早々にぽーは休憩モード。[4]NEOちゃんと遊べばよいのに、座っているぽーに体当たりをするバド。もしかして・・・久しぶりすぎて照れていたのか、バドくん？？バドに煽られては走り出す、を繰り返すぽー。ううむ。。。ぽーがいないと遊べなくなったのか、バド？？（見えにくいけど、NEOちゃんとバドの後ろにぽーがいる）[5]バドとNEOちゃん、このまま一緒に遊べそうなのだけれども・・真っすぐ私の方へと向かって走って来るバド。そしてNEOちゃーん！！どこへ行くのん？？（ちなみに見えにくいけどふたりの遥か後方にぽーがいる）[6]そうなのだ。NEOちゃんが見ている先には、かーさんがいるのだ。バドとNEOちゃん、実は似ているのかもしれないネ元気なバドと持久力のあるNEOちゃんが遊べば、ぽーはマイペースに休憩できるのにね～実は疲れに気づかず遊ぶバドこそを、制せねばいけなかったりするのだけれども次は川遊びかな～。またよろしくね、NEOちゃん[7]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
