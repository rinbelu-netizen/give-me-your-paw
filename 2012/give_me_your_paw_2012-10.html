    "text": "さて、チェルブリを迎えての翌朝。うどんを食べよう！と思っていたけれど開店時間まで待てず、Climbingにて朝ゴハン。（8:00からの営業嬉しすぎー）４人揃って朝からがっつり『焼きチーズカレー』を選択。二日酔いではないけれど、呑み明けって濃いもの選んじゃうよね～。[1]君たち、お行儀が悪いですょー。[2]と、こちらにも「くだしゃい」なコが。[3]（カフェでボーダーコリーのパールちゃんに久しぶりに会ったょー）飼主たちが食べ過ぎなくらいお腹を満たした後は、犬たちが満足する（はずの）時間。砂浜へ行きますょ～すでに前日にほぼ同じ場所で遊んだというチェルブリ。知っている場所だったからか、ぽーが落ち着いたためか。砂浜に到着するなり、テンション高めのチェルさん。（ぽバドは遊べる場所ならいつでもテンションupだからね～）[4]これは、やはり期待通り４頭で走っちゃうかも～[5]わくわくしながら眺める飼主の目の前で、見事にクロスしそれぞれ兄弟／姉妹ではしゃぐ４頭。（ぽーはブリしゃんを追うつもりがバドに阻まれた感があるけどね～）[6]ま、実はね。遊び慣れたトモダチわんことでも、揃って追いかけっこになることはあまりないものね～それでも誰かが走れば追いかけたくなるのが、ウィペット。[7]走るぽバドをブリしゃんが追いかけたり、バド＆ブリジットで追いかけっこをしてみたり。[8]そんな３頭にいつ混じろうか、考え眺めるレイチェルねーさん。[9]ウィペットの走る姿に惚れたニンゲンとしては、やはり４頭並んで走っているところを写真に収めたいのだょー というわけで、なんとか揃って走っているふうの写真を。やっぱこのシルエットがたまらんのよねぇ～～さて、予想以上に遊んでくれた砂浜。まだまだ載せたい写真があるわけで、観覧船の話も残っているわけで。。というわけで、次回へつづく～[10]",

    "text": "期待通りに、そして予想以上に遊んでくれた砂浜。暑かった５月には草で涼をとっていたチェルさんも、しっかり砂浜を楽しんでくれたりして。（体柔らかいね～）[1]姉妹、兄弟問わずに２頭目は似たキャラになるのだな～、と、改めて感じたり。[2]まぁ、ぽーも穴堀り＆ずりずりやるんだけどね～。（しかも激しい！）[3]兄or姉が下のコをしめるのも同じだなぁと感じつつも、レイチェルがブリしゃんの後ろ足をカジカジする姿は、私たちにはかなりツボだったりします。（あ、奥でバドが・・・）[4]そして遂には、ブリしゃんからぽーに近づいてくれたりと。遊ばないかもな～と思いながら来てみた砂浜だから、もうね～。始終にやにやうひゃうひゃしていたと思うの～。[5]と、そんな嬉し楽しな気分のまま、徳島市内へと移動。至るところに「島」という地名がつく徳島県。徳島市内を縦横無尽に川が流れており、なかでも徳島市内の一部はひょうたん形の島になっている。そんな市内をくるりと一周３０分で巡る「ひょうたん島クルーズ」。NPO法人により運営されていて、嬉しいことにわんこO.K.なのだ。ぽーは今回で２度目。初めのときはそれはもう大変だったのよねー共に乗船する他のお客さまの許可も得て、犬連れクルーズ出発～。[6]ブリしゃん。左手の建物が県庁で、正面は映画にもなった眉山なのょ。（実はその映画、私たちは見てなかったりするけれど）[7]と、船の上から眺める景色も良いのだけれど。。。潮の干満により水位の変化する川だから、時間帯によってはスリル満点なクルージングを楽しめちゃうのだ。橋の下を通過する度に、頭上注意な観光船。ここまで頭を下げないといけないのは、私たちも初めてだったからかなり楽しんじゃいました～[8]涼しいクルーズの後は、lanancafeにてお茶タイム。（ずっと会いたかったワイマのシェリーちゃんに会えたりしてかなり嬉しかった私。お馴染みのむぅちゃんの同胎クラウスくんの妹なのですー）四国滞在を楽しんで頂くつもりが、私たちが楽しんじゃってるかもなチェルブリ家の訪問。近い場所ではほとんど会うことのないウィペット。なので何かとこうしてみなさんが会いに来てくれること、言葉では言い尽くせないほどに嬉しいのです。そろそろ、私たちの方から会いに行かないとね～ほめさん、ゆうこさん、レイチェル、ブリジット、ありがとう～まだもう少し続く旅、楽しんでねー＜おまけ＞犬たちを温かく見守る、オトコマエゆうこさん。かっこよすぎ！！[9]",

    "text": "昨日の続きではなく昨晩の出来事を。先ずは結果から。バドはとっても元気です！バドくんてば、何をしたのでしょうねぇ～って、正しくは100%飼主の不注意なんですー バドは昨日、ホウ酸団子を齧りました。。。[1]◀ホウ酸の毒性▶ イヌ 致死量 3g/kg 中毒 0.33-0.5g/kg ヒト 致死量 5~6g/kg 2-3g/kg（乳幼児） 中毒 1-3g/kg ＊色んなとこから引用してきているので数値は目安程度で。そして、もちろん個体差も考慮にいれてください。バドが齧ったホウ酸団子は、1包装 2g（内:ホウ酸量0.7g）（新品と並べてみた。どちらが齧った方かは一目瞭然）[2]幸いにも薬剤はほとんど残っていて、食べたとしてもごく僅か。しかもバドの体重は17kg。上に示した値から考えると、８個程度で下痢や嘔吐などの中毒症状が出る計算となります。（但し、玉ねぎ入りのホウ酸団子が多いのでそちらにも注意が必要）と、これらのことがわかれば慌てずにとりあえず様子を見る。という落ち着いた行動がとれるわけですね～わかってたんだけど、実際にはかなり動揺してました。昨日の午後19時頃。網戸にした玄関を背にして訪問者の応対をしていた飼主。姿が見えそばに居るにも関わらずぴーぴー鳴いていたバド。[3]泣きやみどこかへ行ったかと思うと、何かを放り投げながら遊んでいる音が聞こえました。そう。おもちゃで遊んでるわ～と放置していたものが、まさかのホウ酸団子だったわけなのです。（ぽバド立ち入り禁止の台所から持ってきたらしい）怒ることもせず頭を抱えているのが怖かったのか、バドが伏せをしたまま少し震えていたのが、今となってはちょっと可愛かったり・・・致死量等はネットで調べて分かったが、ホウ酸の含有量が不明のまま。薬剤のパッケージ正面には「ホウ酸含有量230%」なんじゃそりゃっ?!（見直したら理解した。同じメーカー比で230%UPした、という意味でした）ほとんど食べてないだろうけれど、不安が拭えない。[4]かかりつけ医は木曜休診、友人が通っている病院も木曜午後休診。私にとって魔の木曜日なのだ。（春先にぽーがパッドを負傷したのも木曜日）19時半まで診療している病院を見つけ電話をかける。「体重17kgの犬がホウ酸含有量は不明ですが、１包装2gのものを齧りました。ただ食べたとしてもごく僅かです」⇧これだけ言えるのに病院に尋ねているあたりが動揺の現れ 獣医さんは即答で「それなら大丈夫だろー。」（ホウ酸団子には玉ねぎが入っていることもこの時教えて頂きました）・・・で、バドにはその後も異変は起きず。今朝も元気いっぱいにぽーと海岸を走ってきました～。思い起こせば・・・マッサージチェアのコードを齧ったときも、パジャマのボタンを全部食いちぎったときも、全て私が忙しさにかまけていてバドを放置していた時。バドくん・・・そういう主張はヤメテ。そりゃね、私が悪いのだけどね・・・[5]今朝、仲良く日光浴をしているぽバドが、いつも以上に可愛く感じた、そんなかぜっぴきの長い２日間でした・・[6]",

    "tags": [

      "健康",

    ],
    "images": [
      "https://stat.ameba.jp/user_images/20121030/21/rinbelu/76/3e/j/o0399027312262417792.jpg",
      "https://stat.ameba.jp/user_images/20121030/17/rinbelu/cd/bb/j/o0400027012262018473.jpg",
      "https://stat.ameba.jp/user_images/20121030/17/rinbelu/49/14/j/o0400027112262018472.jpg",

    "text": "ホウ酸団子の毒性について調べていた時に、ふとあることを思い出しました。まだ暑かった夏のある日、友人から聞いた話。誤食すると非常に危険な保冷剤があること。しかも甘みがあり犬たちが誤食しやすいものであること。で、調べてみたらそれって犬だけの話じゃない。ヒトもイヌも動物種関係なく注意が必要なものでした。[1]それは、エチレングリコール。と、その反応副生成物であるジエチレングリコール。（ヒトでも多数の死亡例が報告されていました）実は様々なものの溶媒として使われていたりする。それらは全て経口摂取（食べたり、飲んだり）しないことが前提。（それらを使うことが問題ではありません。誤解を避けるためにも、以下からは保冷剤についてのみ記していきます）上記の物質が用いられている可能性の高い保冷剤は、冷凍庫で冷やしても固まらず柔らかいゲル状のもの。かぜっぴきたっつーも使っていましたね～ただし、その他の保冷剤にも、抗菌剤や防腐剤などが含まれていることが多いので注意が必要。というか、そもそも保冷剤は食べ物ではないもんね。[2]さて、具体的にはどのような症状が現れるのか。エチレングリコールの誤食事故は、そこが非常に厄介なのだ。しかもぺろっとひと舐めしただけでも、体重の小さな個体にとってはさらに危険だったりする。＊以下はイヌの保冷剤誤飲によるいくつかの症例報告から、私が勝手にまとめた内容です。エチレングリコールが生体内に取り込まれると、その代謝産物により様々な症状が起こる。（代謝産物とは、体内である物質が分解などされて出来た物質のこと）そして重度の場合は死亡。助かったとしても慢性腎不全になる可能性がある。処置法としては体内に吸収される前なら、吐かせたり、胃洗浄などを行う。また代謝産物の生成を抑制、あるいは未代謝のまま排出させる。その後は腎不全に対する治療を行う。これって、症状が出たら助かる見込みがかなり低いことを示しているのだ。つまり、とにかく迅速に、代謝される前に処置を行うことが重要なわけだ。ちなみにLD50はイヌで6mg/kgとけっこうシビアな量。（LD50とは投与した動物の50%が死亡する用量のこと）[3]で、私の結論。保冷剤を誤食した場合は直ぐに病院へ向かう 初めの症状は30分～12時間で現れるそうです。何かしら症状が出るということは、つまり代謝されつつあるということなのだ。先日のホウ酸団子と違って、様子見なんかしてられない。夏場だけでなく、風邪などの発熱で使う事もあるわけで。熱出してぼーっとしてたら、その辺にぽいっと置きそうだし。みなさんも保管場所など、重々気をつけましょう。防げたはずのことから起きてしまった不幸は、悔やんでも悔やみきれないことになると思うのです・・・[4]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
