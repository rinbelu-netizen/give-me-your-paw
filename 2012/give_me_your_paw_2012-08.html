    "text": "昨日ぽバドが出没した場所は、ドッグカフェ「climibing」さん。ご一緒したのは、なんとちょうどその日、８月６日が誕生日なマースくん。（４歳になった記念すべき日に会えて嬉しかったょ～）[1]mitomonさんの太ももをむぎゅっと踏みながら、「おやきはまだかしら？」と言っているのは、むぅさん～[2]「誰かきたー！or美味しいものきたー！」と、バドと一緒に店員さんをお迎えしているのは・・・[3]みんなのアイドルうみちゃん～[4]うみさーん。お鼻になんかついてますょー（アイドル扱いしてないじゃないか～）[5]ゆったりとしたソファに、女性４人集まればお喋りは止まらない。気がつくと、状況にすっかり飽きたぽーがバドを顎枕にしていた。[6]いつもならカフェに行く前はひとっ走りしてからだけど、暑くて出来なかったもんね～しかも初めての場所で落ち着きのなかったぽバド。（いつもか？？）次に皆と会うときは外で遊ぼうか。だから、、、ここのカフェもまた行かせてね。というわけなので、今回一緒した友人たち、一緒できなかった友人たち、よろしくね～",

    "text": "ぽー＆バドは未去勢♂同士ですが、とても仲良しなのです。踏まれたり、牙があたると怒ったりもしますが、それはその時だけのこと。[1]ぽーがあくびをしたら、[2]バドもあくびをしちゃうほど、仲良しなのです。[3]一階の居間にぽバドを残し車庫で用事をしていた今日の午後。家に入るため玄関先に戻ると、網戸が２０cmほど開いている。閉め忘れて出ちゃったかなー（←やりかねないから気にしなーい）と、玄関内に入ったのだがなんとなく違和感を覚える。・・そうだ。ぽバドの気配がしないのだ。よくよく見ると、居間の障子がこれまた２０cmばかり開いている。・・・・うむ。状況を把握した。庭の方へと振り返ると、仲良く並んで私を見ているぽバドが居た。バドは笑顔全開で嬉しそうに私を見つめている。[4]ぽーに目を合わせると、緊張のあくびをひとつ。（さすがやね、ぽーさん。怒られることをした自覚があるのだなー）[5]居間の障子を開けられるのは、ぽー。玄関の網戸を開けられるのは、バド。凄いなぁ、君たち！二頭でなら、なんだってできるではないか！！って、感心してる場合じゃないのだー。脱走する心配はないが（色々と、家や庭の仕組みからね）、網戸がいつか破れてしまう。ぽーは鼻を使って障子を開けるのだけれど、バドは前足を使うので網目が広がってきているのだ。（↑それを知っているならば止めれば・・、というアドバイスはナシで）まぁ、いいか～。いざというときには、網戸の張替えに慣れている友人に教えてもらおう。犬飼いには、ナゼか網戸の張替えが上手な人が多いらしい。あなたの周囲にもいらっしゃるのではないかしら～？[6]",

      "https://stat.ameba.jp/user_images/20120816/10/rinbelu/40/5e/j/o0333047512137484707.jpg",
      "https://stat.ameba.jp/user_images/20120816/16/rinbelu/8e/47/j/o0400026012138045074.jpg",
      "https://stat.ameba.jp/user_images/20120816/16/rinbelu/5d/ed/j/o0399026712138032910.jpg",
      "https://stat.ameba.jp/user_images/20120816/16/rinbelu/0b/b7/j/o0399026712138032909.jpg",

    "text": "去年は快適設備なキャンプ場で、ぽーと一緒にバンガロー泊をしてみた私達。バドが仲間入りした今年は10~11日の一泊で、設備がなーんにも無いこんな場所でのテント泊に挑戦。[1]テントを張ったら先ずは川遊び～。いつもの砂浜と、沖縄でのカヤックを除けば、これが今年初めての本格的な水遊び体験なぽー＆バド。ぽーは去年、わんこトモダチと数回の川遊び体験済み。そもそも水に濡れることを嫌うし、水泳向きではない体型。ちゃんと泳げるけれど自ら好んで川に入ることはないぽー。（川が嫌過ぎてヘンな顔・・ではなく、アブを見ている時のヘンな顔）[2]カヤック体験では自由奔放ぶりを発揮したバド。やはりやはり、期待通りにバドらしさを見せてくれました。片時も目を離すことなく、川岸からじっと飼主を見守るバド。そしてもし、飼主に何か異変が生じようものならば、、、[3]急いで川へと入り、浮かんでいる飼主の元へと泳いでいく。私の肩を前足でぐいっと掴み無事を確認したら、そそくさと岸へと戻っていくのだ。岸へ戻る途中では私が来ていることを振り返って確認したりして、それがまた可愛いのだよな～（決して虐めてるわけでは。。。ごにょごにょ）[4]カヤック効果だろうか、バドはあることに気がつく。【水に浮くもの】に乗れば泳がなくてよいことを。しかし、水中からボートに乗るのはヒトでも難しいのです。飛び乗ろうとしては安定せずに落ちる、を繰返す。[5]そんなバ飼主と無邪気なバドの様子をぽーは岸から眺める。川に入って泳ぐこともするけれど、バドと比べると確実にその回数は少ない。[6]そんなぽーの行動から「バドの方が強いかもー」と、思ったのかどうかはわからないけれど。。。ボートの上からぽーに対して強気な態度を取り始めるバド。[7]さぁ、そんなことはぽーのプライドがさすがに許さない。水中であることも構わずに、反撃にでるぽーさん。と、とばっちりを受けるわたし。[8]そしてこの後、どぼんと川の中へ落とされるバド。と、とばっちりを受けるわたし。[9]この小競り合いは陸地でも続けられ、バドの顔にはこんな勲章が。[10]何が起きたのかはだいたい予想がついちゃうけれど、その様子は次回につづく～～",

    "text": "さてさて、バドのハナによだれ迷彩ができた理由なのですが。ボートでもみ合った、ぽー＆バド。その勢いのまま、ふたりは陸地へと走り出す。バドはこんな感じでぽーに応戦してみるのだけれど、[1]陸地ではまだまだぽーには勝てないバド。ぽーの周りでやけっぱち気味に穴堀りをし始めて、、[2]ひたすら穴を掘り堀り、ほりほり・・・[3]気がついたら、よだれ迷彩の出来上がり。というわけなのでした～[4]ちなみに、ぽーはこんな状態。（実は自分でずりずりしただけ～）[5]たっぷり遊んだら、いよいよBBQっ！[6]オスワリすれば貰えると思っているバド。[7]おねだりを続ければ貰えると思っているバド。[8]このヒトがダメなら、あのヒトに訴え・・・って、バド～っ！[9]そして・・待っていればいつか貰えると知っているぽー。（遠いなー）[10]私たちが指先でつまんだ食べ物を、指をかまないよう上手に受け取ることができるぽー＆バド。とうもろこしだって、なかなか器用に食べちゃうのだ。[11]但し、バドにとうもろこしは注意なのだ。指もがしがし食べられる。とっても上手に芯を残して食べるのだけどね～[12]一泊二日のぷちキャンプは瞬く間に時間が経ち、帰りはちょこっと滝を見に行ったりなんかして。[13]二日間、バドはいつもと全く変わらず自由奔放で。ぽーはといえば、川の様子を見にきた若者に威嚇吠え。テントを張って寛いだことで、そこがなわばりになったのかしら。とにかく、つまりだ。ぽバドは飼主さえ居れば、どこへだって行けるっ！！ということで、キャンプも川遊びも、飼主は味を占めたぞ。というかね、既に翌日にはうみちゃん達とキャンプの予定だったりする。なかなかに濃厚な楽しい夏休みの始まりなのだー（ボートに乗ったぽーの表情は楽しくなさそうだけれどね～）[14]",

    "text": "８月１２－１３日はsoraumi家とキャンプ！・の予定を変更して、県内での川遊び＆BBQ～。お気に入りの精肉店でうまーい肉を調達中な私を（肉を？）、まだかまだかと待つぽー＆バドの写真からスタート～[1]川原についたら、タープ張ってテーブルを出して・・・（その間、ずっとボートに空気入れてた非協力的な私。）炭に息を吹きかける動作が苦手で、肉を狙いたいが近づけないバド。（奥のピンクテントでぽーは早々にお休み中）[2]すでにひとっ風呂川（？）浴びてきたうみちゃんも、食べごろを伺い中。[3]川遊びを楽しむsoraumi家をぱぱらっち。[4]曇り空や時々雨のせいもあってか水温は低め、流れもあって泳ぐの大好きなうみちゃんもやや苦戦。そんな状況でも川に入る私たちを見て、ただでさえ泳ぎたくないぽーは「うぇーー」と思ったのかもしれない。[5]流れは早いが浅瀬の続く川。何やら気になる物体を発見し、川向こうへと渡ってゆく男性陣。そんな彼らを慌てて追いかけようとする、うみちゃん＆バド。[6]川岸でぴたりと止まり、ご主人さまを見守る２頭。・・・・バドくん、良い姿勢だね～～[7]実はバド。こうしていれば川へ入れると思っているのである。１４日の川遊びでも岸に置いた浮き輪に、こうして乗ったりなんかして。仕方ないので、船頭さんつきで出航～[8]バドだけだと、ぽーが拗ねるので揃って出航～[9]冷えた体をマッサージでほぐされまどろむ、うみちゃん。[10]日が暮れるまでたっぷり遊んだら、ヒトもイヌもかなりお疲れモード。うーむ、キャンプできたかもね・・本来キャンプを予定していた場所は高知県。しかし不安定な天候が続いており、この日は特に高知で大雨予報。前々日の野宿では深夜、雷雨に襲われていた私たち。安全な場所にテントを設営したとはいえ、２時間ほど続く雷雨のなか全く眠れずで・・・という事情で、変更させてもらったのでした。実際は・・・キャンプできたかもだよねぇ。ごめんねぇーよし、来年行こう！というわけで、来年のお盆の時期に皆さんもご一緒にいかがー？（全く何もsoraumi家に相談せず、勝手に言ってマス）ラストの写真は片付け風景。（私、写真を撮ってまたさぼってるー）ちゃーんと、うみ、ぽー、バドの３頭とも写ってます。どこにいるかわかりますかー？[11]",

    "text": "盆休み前から予定していた川遊び＆BBQ。びみょーな天候に思案しつつも、川遊び決行となった14日。[1]先日のカフェでもご一緒したバーニーズのマースくん。少し前まで泳がなかったなんて、信じられないほどの見事な泳ぎっぷりを披露～[2]そして、お馴染みワイマラナーのむぎちゃんと、初めましてのイングリッシュコッカースパニエルのルイちゃん。黙々と泳ぎ続けていたりと、話に聞いていた通り、なんだかとても良く似た熟女なふたり。[3]そしてまたまたお馴染みの、バーニーズのうみちゃん。実はできなかったらしい【水中レトリーブ】に挑戦中の図[4]そしてその後、枝をとられないよう頑張るが、いつの間にか枝を落としちゃっている、うみちゃんの図。[5]さて、実は前日の早朝からおなかを壊していたぽーさん。原因は遊び疲れか、食べ過ぎか・・・思い当たることありすぎ。（ナゼそうなったかは、後日過去記事として更新します～）できれば泳ぎたくないけれど、私達が川に入れば渋々ついて来るぽー。なので泳ぐ準備はせずに川の様子見と、皆に会うためちょこっと参加な気分で合流した私たち。って、こらバド。今日は水に入る予定じゃないんだってば。（むぅちゃんの枝が、ルイちゃんのことが気になり川に入るの図）[6]ぽーはほとんど水に入らず、河原でエクストリームごっこ。[7]と、あれこれ可愛い様子を見せてくれるわんず達。しかし、それ以上に可笑しかったのが男性２名。武器を手に、わんずに挑戦するのはうみパパことしんぺーちゃん。ぽバド以外は既に体験済みのため、すでに相手にしてもらえない。そこで、なんとかぽバドの興味を惹こうと頑張る。[8]（決して虐めてるわけじゃなくて、飛びかかるとか水をかぷかぷ食べるとか、要するに遊んで欲しいわけなのですw）バドなら遊ぶかな～と飼主も予想したけれど、残念ながら逃げられ、ぽーにはそっぽを向かれる始末。[9]不人気ぶりに口をへの字に曲げ仕方なく、妻を打ってみるの図。（soraumiさんのカメラがgunに見える・・・）[10]そして、初めての川遊びに大はしゃぎなmitomonさんの旦那ちゃん。大喜び、大はしゃぎのまま、独り彼方へ流されて行く。。。そんな彼は子供達の憧れの的、プロテニスプレーヤーなのだ。私たちも指導してもらったのだけれど・・ギャップが大き過ぎ～[11]皆より先においとましてしまったけれど、面白かった～次回は一緒に川の中へ入っちゃうのでよろしくです！（１人でぽバドふたりを見る自信がないので、主人も居る時限定ですが）本日ラストの写真は、くつろぐマース＆うみの隣にぽバドを必死に並ばせるの図。（うみちゃんの目線は明らかにmicky何してるの？と言ってますネ）[12]",

    "text": "明け方にザッと雨が降り、その後も曇り空orぱらっと雨降りな水曜日。これはチャーンスっ！というわけで、湿って程よく硬くなった砂を期待して砂浜へ。[1]案の定、砂の具合はばっちり。そしてこの天候のせいか、海岸に居るのは２人のサーファーと私達だけ。彼方に人影発見！ 「ゆっきーが来たょ～」と、ぽーに告げる。指差す方角を眺め、はっ！と耳を立てると同時に、[2]実は、里帰りをしていた友人と待合せをしていたのです。ぽーはやはりゆっきーのことを覚えてるのだねぇ。彼女とはぽーが生後２ヶ月半の頃から何度も会っていて、引越をしてからも里帰りの度に会いに来てくれているのです。なんやかやで半年に一度は会えてるかも。前回会ったのはバドが生後半年の頃。１歳になったバドの成長ぶりと、ぽバドの疾走を見てみたいと言ってくれたのだ～。意外にも、屋外でぽバドに会うのは初めてだったりする彼女。早速のお迎え疾走で、既に驚いていたわけだけれども・・[3]屋内でのぽーといえばまったりのんびりしているか、ぐて～～と寝ていること多いものねぇ。（バドはもちろん、わーぃわーぃと何かやっている。）半年ぶりの再会に、尻尾をぶんぶん振りゆっきーに甘えて、、、、なーんてことは絶対に全くしないぽー。（そんな行動は飼主に対してだけなのだな～）そんなぽーだけれども、嬉しいのだ。だから、敢えてゆっきーの周りではしゃいでは、バドを引き連れ猛スピードで走り抜けて行く。[4]真っ正面から走って来ても犬達が避けるから、我慢して動かないでね～♪（動くと逆に衝突しちゃうのです）と、強引なアドバイスに頑張って耐えるゆっきー。[5]モザイクで見えないけれど、ぽバドの迫力にゆっきーの表情はずーっとこんな感じ。全く知らないヒトのそばでフリーにして遊ばせることは、絶対にありえないし、決してすることはない。けれどもそれでも、ゆっきーの驚きっぷりに、もっと注意しないといけないなーと改めて思いマシタ。ぽバドのスピードや行動にかなり慣れてしまっていたんだなぁー[6]バドを迎えてからさらに迫力が増してるかも。＜業務連絡＞最近パーマをかけて欧陽菲菲になったらしい友人へ。（↑例えが古いとオモウ・・というわけなので、また遊びに来てね。まったりな屋内での様子もウィペットらしさなのだけれど、屋外での俊足・俊敏さを見てもらえて大満足な飼主なのだ～（速かったでしょーかっこいいでしょ～っ）ゆっきーの里帰りをいつでも待ってるょ。いつもありがと～。[7]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
