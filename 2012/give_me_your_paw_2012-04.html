    "text": "風も穏やかになり、洗濯日和な昨日のこと。ということは、ということは？そうです、その通り。たぶんみなさんのご想像通り砂浜なのだ～[1]この日の砂浜には子供連れのファミリーが一組。小さな子もいるので安全な距離をとってぽバドと遊ぶ。そしてこの後、とても素敵な出会いが待っていたりする[2]と、その「出会い」の時間がやってくるまでは、ぽバドのお尻がかっこかわいいな～、とか。[3]こんなに強く、地面を蹴っているのか～とか、[4]のんびり砂浜遊びを満喫しておりました。お。２歳くらいの男の子とお母さんが、どうやらぽバドに興味を持ってくれているようすちいさな子とは何度か接する機会があったぽー。そして、バドは１度あったかないかの経験。わくわくしつつ、ゆっくりと歩く。（もちろん、リードに繋いで）顔が見える距離まで近づいたところでコンニチワと、ヒト同士の挨拶までは良かったのだけれど。バドが吠え、それに重ねてぽーまでが吠えてしまった。（実はバドの緊張する様子に、私も若干緊張してしまったのです）あーぁ、しまったなぁ・・・と思っていると、お母さんが「ごめんねー、怖かったよね」と。えぇぇぇ～吠えたのに、そんなこと言ってくれるなんて～さらに男の子が触りたかったのにぃ～と哀しそう。あぁ、もうそれだけで嬉しすぎです。幸せです。（ナゼここまで喜んでいるのかは後述することにして・・）少し距離をとり会話を続けていると、ぽバドが落ち着いてきた。というわけで、触ってもらえるか尋ねると、喜んで側に来てくれた二人。ぽーは若干まだ警戒が解けていないので、バドを触ってもらう。なのに、なのに、男の子はぽーを撫でたいらしい吠えたのに触ってもらえて、それだけでも嬉しいのに～[5]さてさて、私が感動して喜んでいる訳なのですけれども。ぽバドは珍しさから声をかけられることは多くても、大きさや猟犬らしい見た目から触ってくれるヒトは少ないのです。ヒト好きではないけれど、苦手ではないぽバド。なのに物珍しさに観察されるだけだから、ぽバドは「なんか怪しい、なんか変」というまま終了。そんな悪循環が起きている事が少々悩みでもあった飼主。だからこの日の出会いが格別嬉しかったわけなのです。落ち着くまで待ち、慣れたところで触れてもらえた。すっかり緊張が解け、ぽーにちょっかいをかけ始めるバド。そんな様子をブログに載せていただいています →「そうたんママの親バカ日誌」話しているうちに分かったのですけれど、同じくアメブロ ブロガーさんだったのですょ～。そうたんママさんは、ラブとゴルさんと暮らしていたとか。そうたんも大の犬好きだというわけで。友人の犬たちに哀しい残念なことが多かったここ数日。子供に石を投げられていたり（自宅の庭でくつろいでいるだけなのに）、触ろうとしてくれた子供の父親に噛まれるぞと言われたり。（ぽバドより100倍ヒト好きな犬なのに）だけど、だけど、みんな～！こんな素敵な出会いもあるんだぞぉ～[6]そうたん、そうたんママ、ありがとう！",

    "images": [

    ],
    "text": "久しぶりに河川敷に行ってきた昨日のこと。ぽーのパッド、走ると時々血が滲んでいました。けれど先週後半くらいから良い感じ。というわけで、試しに以前アンドン達と遊んだ河川敷へ。カメラを持たずにiphone撮影。天気も良く、画質もばっちり。シャッタースピードも速いなぁ～こんな写真も撮れました。というか、バドくん。なんつー体勢になってるの[1]鳶を追いかけたり、バドと追いかけっこをしたり。ぽーのパッドは問題なしっこれで皆と遊べるね～（実は一番私が嬉しかったりする）[2]この日はわさびちゃんにも会えました。このブログを楽しんでくださっているとのことでありがとうございます～（あぁ、写真を撮り忘れてマシタ・・・）そして、アジリティの訓練をしていた方と、訓練話に花を咲かせてきました先輩飼主たちからのアドバイスや、先代犬との経験などからの我流しつけな私。だからしっかりと訓練を行っているヒトとの会話は、とてもためにもなるし、何よりも楽しい。と言っても、ぽバドは家庭犬ですから基本のみのしつけ。機敏に、且つ楽しそうにアジを行うシェパードくん。そんな彼も訓練前には「コイ・スワレ・マテ」から始めるそうです。先ずはそれらが出来る事から。この３つができれば、アジだってこなせちゃうそうな。（おぉ、ならばぽバドもできるやん（笑）あとは飼主の根気ですね～）常に「服従」ではなくメリハリが大切だよね～と意気投合。しっかり褒める、しっかり遊ぶ。そして必要なときにコマンドがぴしっと入るように。（「コマンドがぴしっと」については、ごにょごにょ・・だけど）dog actuallyに、とても解りやすい記事がありました。散歩時などの、犬との歩き方（歩かせ方）について。→絵と写真で見る訓練（４）脚側歩行脚側歩行は旅行先での観光や、人通りの多い場所などを歩く時に威力を発揮しますよね～。この歩き方も常に行う必要はないと私は考えています。（犬が自由気ままに歩き、飼主や周囲に危険が及ぶという場合はもちろん別だけど）必要なときに体側を歩かせることができれば良いのだ！飼主が周りを眺める余裕ができるし、何より犬と一緒に楽しめる何事も基本を知って、出来る上での応用ですよね～。と、何よりも自分たちに言い聞かせているのです、コレ呼戻しも、スワレなども脚側歩行も改めてがんばろう。ぽバドと私たちとの快適で楽しい暮らしのために[3]＊参考画像「不服顔でのマテ」",

    "images": [
      "https://stat.ameba.jp/user_images/20120413/12/rinbelu/6f/d9/j/o0400030011913215605.jpg",

      "https://stat.ameba.jp/user_images/20120413/12/rinbelu/9b/cd/j/o0400029611913215604.jpg",
      "https://stat.ameba.jp/user_images/20120413/12/rinbelu/74/de/j/o0399029211913226625.jpg",
      "https://stat.ameba.jp/user_images/20120413/12/rinbelu/e2/d8/j/o0400030011913215602.jpg",

    ],
    "text": "朝から砂浜へ行き、シャンプーもこなした今日。なのだけど、携帯を忘れたり諸々の事情で写真がない。（水没させたわけではないからねっ）というわけで、今日はバドの出生の秘密なんぞを。（もちろん、秘密などは無く、この表現を使ってみたかっただけ）ぽー＆バドは同じ犬舎出身。一頭のメスあたりの出産は１～２度まで、交配は２～３年に一度、というのが犬舎のポリシー。また犬舎にいる犬の総数も飼育できる範囲まで、等々、犬好き、犬ばかな私たちにとって、安心できる要素がたっぷりの犬舎なのです さて、こちらがバドの産みの母であるレティー。[1]彼女にとってバドたちは最後の子供。（photo by Ms.Chiaki）そしてそして、上に書いたような方針があるから、レティーはぽーの祖母だったりもするのです。ということは、バドがぽーの叔父さんになるのかしら。ヒトにあてはめると、とても可笑しいことになるこのとき生まれた子犬６頭のうち、そっくりな見た目で生まれたのがバドとトラッカー。[2]この写真は生後１週間ほどのもの。（photo by Ms.Chiaki）矢印をつけた２頭、どちらがバドでしょう～？正直言うと、飼主の私たちでもこの写真は難しい。でも、たぶんオレンジ色の方がバド。（たぶん、たぶん・・）もう少し大きくなった写真でいきましょうか。さぁ、どーっちだ？これは生後５０日頃のものですね～[3]え？後ろ姿じゃわからないだろーって？？（photo by Ms.Chiaki）そうですかぁ。ならば、正面写真を載せましょうと上の写真から４日後に撮られたものです。さぁ、どっちだー？[4]どうです～？そっくりでしょ～　　　　　　　　（photo by Ms.Chiaki）腕の白い部分の高さもほぼ同じ。頂いた写真を見返していて、気がついたのですが表情も似ている。骨格も似てるせいかもしれないけれど。生後２ヶ月のトラッカー。この時、まだバドはうちには来ていません。[5]ちなみに奥にいる大きな子がパパのタイガー。（photo by Ms.Chiaki）我家に迎えてからのバド。生後４ヶ月になっています。[6]どうです？似てるでしょ～バドを迎えに行って以来、トラッカーに会っていない私たち。トラッカーは犬舎に残りました。なので、里帰りが楽しみで仕方ない現在のトラッカー、親戚やファミリーの様子などを、こちらで見ることができます。もちろん、ぽーの同胎の子たちも良かったらどうぞです～。→ウィペットシンドローム＊追記＊ブリーダーの友人のわんこが行方不明だそうです。１歳５ヶ月 ボーダーコリー ハヤテくん特に関東近辺の方、ご協力お願いいたします！！↓飼主さんのブログです。http://inugoyanews.blog44.fc2.com/",

    "text": "ぽーさんがかなわぬ恋に落ちた週末。会うなりぴーぴーきゃぅきゃう、アナタしか見えない状態そんなぽーの切ない恋のお相手は、イタリアングレーハウンドの小次郎くん[1]そう、小次郎くん。去勢済みの男の子なのだ～遊び友達募集中！ということで、ぽバドに白羽の矢が小次郎の飼主さんは、mitomonさんのお友達。というわけで、この日はもちろんむぅさんも一緒。ホンモノ女子には目もくれず始終「こじろぉ～」なぽーさん[2]もちろんマウントしまくりで、情けな～い声と表情。（久しぶりに見たなぁ、その姿・・・）始め戸惑っていた小次郎が、ぽーにやめろと言うようになり、そしてさらにはぽーにマウントを試みる。（体格差があると可愛く見えちゃう。マウントというより、スモウだな）[3]♂なら未去勢、去勢犬を問わず相性に煩くなるぽー。なのだけど、どうやら小次郎のことはかなり好きらしい。怒られたり、マウントされると必ずドスの利いた声で返すぽー。なのだけど、小次郎相手だとその声もふにゃふにゃ～～～[4]だからこそ、これから遊び友達になれる可能性も期待も大後半はレスリングもどきをするようになったり、[5]ぽバドと３頭でのびのびと走る姿も披露。（じつは小次郎が追いかけられているだけだったり）[6]あれ？そういえば、レディむぎさんは？そう、むぅちゃんを知っている人ならば大抵想像できるその様子。お気に入りの木を見つけて来ては、一人で・・・[7]必死な顔で小次郎を追いかけるぽーと、それを真似るバドが側を駆け抜けても、ごりごりぺっと木齧りを堪能。いつでも砂浜では安定のむぅさん（但し、おやきがある場合は別）[8]せっかくだし記念撮影でも　ただでさえ、マテの制限時間3秒なぽバド。「こじろぉ～」なぽーの耳に聞こえるはずもなく、むぅさん１人が、mitomonさんを見つめてよい笑顔[9]よし、今だっ！ぱちりっと・・・[10]「てんでばらばら」って、こういうことを言うのねこちらの写真の方が、揃っているやんか[11]そうそう、一応フォローなのだけれど（←誰へのでしょ？？）ぽーがぴぃぴぃ鳴く程の恋に落ちた相手は小次郎で３頭目。そのうちの１頭はむぅさん、アナタなのもう１頭は同胎のレイル（去勢済み♂）なんだけどね～さて、この日はFCI四国インター（ドッグショー）が開催されていました。そろそろ向かおうかという頃に、砂浜でイタグレくんたちに出会う奥にいる子がモンクくん４歳、手前が卓造くん２歳。[12]名前の由来を尋ねたら、ある海外ドラマからだそうですょ～「あっ！」と思う方もいらっしゃるかもですね小次郎の飼主さんは初めて他の成犬イタグレさんに会えて大喜び♪そして私は２人の可愛さに悶え、同じビヨルキスカラーで親近感UP（というわりに写真がうまく撮れておらずですみません。。。）しばらく歓談の後、ショー会場へ。（本文長くなっているけど、写真もないのでこのまま続けます～）会場では、初めて見る犬種に会えて大喜びな私。チャイニーズクレステッドも居ました～（←mitomonさんから犬種名を聞いた）レオンベルガーにも初めて会い、撫でさせてもらった～そして知っている顔にも次々と出会う。お馴染みのバーニーズのアンドン家。マースくん一家とは二度目の対面。そして（まだまだこたつから出られないらしい笑）バニ夫くんのママとも ところで、写真がないワケですが、嬉しい対面や犬観察に夢中になっていたからだけ、ではないのです この日はバドにとって、初めてたくさんのヒト＆犬に会う機会。だからバドの様子に目を配るためだったのですょ～（ごにょごにょ・・）で、バドの様子はというとですね、２、３度ほど、「コワイよームリムリっ」スイッチが入りました。立ち止まったかと思うと、後ろ足が震えだす。そして尾をおなかにしまいこみ、腰を下げていやいやいやーと。体をぽんぽんっと軽く叩いて励ますと、すくっと立ち上がり歩き出す。会場を少しでも離れると、鳥のフンを物色したりしていつものバドに戻るのですけれどねぇぽーにとっても初めての人込み経験になったのが一昨年のショー会場。犬と遊びたいキモチが強くてうきうきしていたっけ。たしかぽーは生後８ヶ月。バドより２ヶ月小さい時でした。バドもまだまだこれから色んな体験をしようね～今朝はお疲れぽーさん、朝ご飯を食べず。（恋煩いではないとオモウ）雨なこともあり、ずーっと寝ています。バドはしっかりご飯を食べ、これまたずーっと寝ています。体力も精神力もたっぷり使ったものねぇ。今週末にはお客様を迎え、GWには旅をしてきます。今日はのんび～り過ごそう。昨日、お会いしたみなさま楽しい時間をありがとう～",

    "text": "朝ご飯も食べずに寝続けていたぽー。（バドはしっかり完食、そして寝る）昼にはのそのそ起きだし、ご飯ももぐもぐ。夜には２人そろって大騒ぎだった昨日。そして今日のすこぶる良い天気に気がついたのか、「さぁ、行きましょうか。散歩ですょー」と、出掛ける準備ばっちりなぽーさん。というわけで、パッドの怪我も治ったし彼女を呼んじゃおうまずは砂浜へ向かい、そしてみんなで呼んでみよう～！（ヒーローショー風に）さぁ、ご一緒に～うーみぃ～～～！うーーーみーーーーー！！[1]バーニーズじゃないみたいに撮っちゃったsoraumiさんの帰省で、パパの仕事に付き合う毎日なうみちゃん。（噂によるとおじいちゃんにも可愛がってもらいまくりらしいけど）さぁ、久しぶりに広々～っとぽバドと遊ぶのだ～[2]うみちゃんパパ（しんぺーちゃん）顔モザイク無しでo.k.とのことで加工なしです～車から降りるうみちゃんの、声を聞いただけで大喜びのぽー。（バドはまだ色々わかってない。・・まだ、なのか、性格のせいかは不明かも）うみちゃんも大はしゃぎ～なんだけど、暑い。ぽバドでも口を開けるくらいだから、うみちゃんはなおさら。そんなアチアチうみちゃん、私のかばんの側に座り込む。そして、給水ボトルにぱしんっと、手を置く・・というよりは叩いた。[3]水が飲みたい？と尋ねる私に、「たまたまやろ～」としんぺーちゃんすると今度は、ずずっと体を動かしボトルを抱え込む。[4]冷たいからか？と呟く私に、「たまたまやろ～」としんぺーちゃんで、試しに水をあげてみたら大喜びで飲んだうみちゃん、凄い～～～～～。一緒に遊ぶ時は必ずこのボトルを持って来ていた私。だからこれが水だと覚えていて、さらにアピールしたに違いないっだけど胃捻転とかコワイから、ほどほどにしようね、と、途中で私に取り上げられるかわいそうなうみちゃんぽバドは砂掘りをしたり、うみちゃんは砂浴びして目に砂を入れちゃったり。思いついたように３頭で走っては、各々のんびりしたり。[5]ぽー、うみ、バドのトリオはやっぱ落ち着くねぇ。（みなそれぞれ行動が笑えるけどネ）そして何より、うみちゃん嬉しそう（口元は暑いせいもあるだろうけどネ）[6]そして再び、「お水、ちょうだぁ～い」なうみ。この行動は何度かあったから、ぜったいわかってるとオモウのだ。[7]そして再び、バーニーズじゃないみたいに撮っちゃったというか、誰やのこの子soraumiさんが戻る頃には夕方に遊んだほうが良いかもなぁ。私やぽバドも今日はちょっと暑かった（←なんだこれ？）早くみんなで揃いたいね～あともうちょいだ！！～おまけ～カメラマンしんぺーちゃんと、モデル犬ぽー＆バド[8]どんな写真になってるか楽しみ～♪",

    "text": "１度会ったきりのあの人と（もちろん、わんこ絡み）、必然そして偶然に出会うことになった楽しい土曜日。まずは「必然」の出会いをするきっかけから。思い起こせば、あれは去年の５月。うみちゃん、むぅちゃんと川遊びに出掛けたある日。→三頭三様。～笑う犬～ドッグカフェ楓のランでほんのちょぴっとな時間だけ、ご一緒したポーちゃん＆シロさん一家。ぽーと同じ呼び名の芝犬「ポー」ちゃん。なんだか気になり探してみたら、ブログをされていたしかも彼女はとあるお店の看板犬。そこはなんと私たちが以前住んでいた近くでした。（＞アヒル母さん お互いにストーカーしてたら、これは両想い成立だよね）ブログから滲み出る、いや、溢れ出る、犬ばか好きっぷり同じ匂いを感じまくりなわけで・・・というわけで、それからはブログを通じてのお付き合いをさせて頂きまして ポーちゃんの飼主さんのアヒル母さんてば、うみぽーむぎに会おうと砂浜に何度も足を運んでくれていたり。そして先週は、まさかの入れ違いで、アポなしで突然お店に行っちゃいました。前置きが長くなりましたが、これが「必然」なワケなのです。さーて、ポーちゃん久しぶり～～[1]お店ではお客様のお出迎えから、お見送りまでをこなすポーちゃん。ヒト用の商品を扱っているお店だから、ぽバドの登場に、「犬のお客さんなんて聞いてないわょ～」なポーちゃん。しかもお店は彼女のテリトリーだものね～というわけで、ちょこっと一緒に散歩をしてみることに。早速のハイテンションなぽーに戸惑うポーちゃん[2]遠慮知らず猪突猛進バドに、やめてぇ～～なポーちゃん。（さっそく変顔、頂きました）[3]そうこうしているうちにお互いに慣れて来て、お店に戻る頃にはほんわか雰囲気も若干漂いだしたポーぽバド但し、ぽバドは初めての場所に探検する気満々だったりするけれど[4]アヒル母さんはもちろんのこと、スタッフの方々もわんこ好きびびりなバドが男性スタッフに甘えまくり、さらにはヒトに愛想なしのぽーまでもが自ら寄っていったりそんな様子などなど、アヒル母さんのブログはこちら。→はなこっぺん ーぽこぺんー飼主たちはようやく会えた嬉しさと、お互いの犬ばかっぷりを披露し合い盛り上がるふと気がつくと、ポーぽバドは思い思いの場所で、ちょっとふてくされつつ寝ていたり[5][6]次は砂浜で会うことを約束し、お店を出る私たち。ポーちゃん、アヒル母さん、ありがとうございました♪トモダチも誘うから、楽しみに、覚悟しておいてネ[7]さてさて、夕方から明日にかけては大雨予報。雨が降り出す前に、ひとっ走りしようかと砂浜へと向かう。そして、「偶然」の再会がそこで待っていたわけでして ぽーが生後７ヶ月の頃に出会ったあのコ。本文が長くなったので、そのお話は次回に～（＞nowappuさん ちょっと待っててね～）",

    "text": "さてさて、つづきです～翌日の暴風雨を予感させるような風が吹き始めた土曜の午後。それでも砂浜へと向かってみた私たち。なんだか、ガスってる？？いや、どうやらこれは風に煽られた砂で視界が曇ってるらしい。正直、これは帰りたい・・・だけれど、砂浜へ向かう道も覚えてしまったぽバドは、すでにテンション上がりまくりだったりする仕方ない、ほんのちょこっとだけ・・というわけで、５分ほど砂浜へ。風も砂も気にせず走り回るぽー＆バド。（逞しいなぁ～）そそくさと駐車場へと戻ろうとしたところ、向こうから黒っぽいフレブルを連れた人たちが。ん～あの子かなぁ～。でも、まさかこんな所で、しかもこんな日に来ていないよね～などと思っていたら・・「mickyちゃん？！」と呼ばれるワタシ。なんと、なんと、２年ぶりの再会なのですょ～のわちゃん、久しぶり～[1]そう、２年ぶり。ということは、バドは初めましてなのだ。だからなのか、一生懸命に自己紹介をするバド[2]大きなぽバドに囲まれちょっと困った、のわちゃん。女の子だし、ぽーが喧嘩をする心配もない。というわけで、せっかくだから強風吹きすさぶ砂浜へ戻っちゃお[3]やっぱり、リードで繋がれてなければ怖さも軽減されるよね風に負けない勢いで走り回る３頭。あぁ、なんだか懐かしいわ。この光景。。。。というのも、初めて出会った時の、２年前の写真を見てやってくださいな。（いつだったかにも紹介したことあったりするけれど）[4]中央にいるウィペットはぽーの幼馴染みのルーク。（ちなみにぽーの同胎レイルの兄の名もルークだったりする）ルークは少し遠い場所に引越したのでなかなか遊べなくなったけれど、バドを交えて同じような光景が見られるなんて～～２年前、ということはぽーは生後７ヶ月！なんだか細いなぁ～のわちゃんはこの頃、２歳くらいでしたっけ（ごめんネ、忘れてしまった）[5]のわちゃんちのブログがとってもステキなのですょ。内容がぎゅっと詰め込まれたタイトルと写真で綴られたブログ。そのタイトルセンスに脱帽。トリコになってマス→のわのブログ（最近では「海苔乗り」とか。もう楽しすぎなのだ）次は天気の良い日に遊びたいねぇ。そうそう、この日どれだけ強い風が吹いていたのか。[6]曇っているせいもあるのですが、画面が白っぽいのは砂のせい。そして、砂地自体が風で左上に向かって流れているのがわかります？普段ならこんな日に絶対来ないのだけどね～何かが呼び寄せたのだ、きっと[7]ちなみに、３頭ともブリンドルだったりほんっと楽しい週末だったなぁ～（redさん、声をかけてくれてありがとね～♪）",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
