    "text": "みなさま、お元気ですか～？ノロわれて以来、モチベーションがさがってしまいまして。。気がつけばブログの更新が週１とな。これはいかん！というわけで、お久しぶりどす～。週末はぽバドを連れて高原へ。走りまわってすでにごキゲン顔なぽバド。[1]ぽー＆バドの性格・行動が全くチガウこと、それは周知の事実。（↑“周知”なんていえるほどまったく有名ちゃうし～）この日も面白いほどに、ぽバドの性格差が現れました。いまにも雨が降りそうな、そんな天候のおかげか原っぱも公園も貸切。童心に返り、ひとり遊具で遊んでみる飼主。そんな私に、それぞれに分かりやすい反応を示すぽー＆バド。[2]はしゃぐ飼主につられて滑り台の上へとやって来る、ぽー＆バド。試しに「降りてごらんょ」と、ぽんぽんっと軽くタッチしてバドを促してみる。すると・・・[3]流石バド。迷う素振りすら見せずに降りていきマシタ。初めてのヒトやイヌと対峙する時は尻込みするけれど、こういうことに関しては臆すことなくへっちゃらなのよね～[4]そんな私たちの様子を、眉を下げ不安そうな顔で見つめるぽー。（実際、眉はないのだけれどね。困ったカオになってマスね。）[5]ぽーにも声をかけてみるけれど、何やらぽそぽそごにょごにょと言うばかり。[6]さんざん悩んだ末に『来た場所から戻ります』と、滑り台を使わずとも降りられることを覚えていたぽーさん。（裏側は階段や段差もなく、丘からそのままアプローチできるのです）[7]イヌと対峙する時は猪突猛進だけれど、こういうことに関してはとても慎重になるのよね～みなさまのわんこたち。ぽー派、バド派、どちらでしょ？そして、飼主に似るといわれる飼い犬たち。我家ではどちらかと言えば、あえて言うならば、ぽー：たっつー バド：わたし かなぁと。さてと。懲りない飼主、別の遊具でも遊んでみた。そちらの遊具は３段ほど板を登る仕組み。ぽーも登ることはしたけれど、滑り台はやはり嫌らしい。飛び降りることもせず、来た道をそのまま引き返す。たっつーが、ぽそりと呟く。「ぽーは賢いのだけどなぁ。ネタ的には真面目でおもしろくないなー。」（・・・まじめだからこその面白さがあるのだけどね～）[8]さてさて一方、バドは後ろなんぞは振り返ったりしません。常に前向きなのだ。前しか見ません。いや、見てません。[9]バドにがしがし押され、急いで降りてみてもこの調子。[10]さぁ、どっちだ～？どちらかというと、ぽー？ それとも、バド？",

    "text": "先週の金曜日、つまり２１日のできごと。ぽーがもじょり、バドがわ～ぃと遊んでいた日。[1]怪我をしやすいと言われるウィペット。何度かケガを経験しているぽーに比べ、天性の運動神経のおかげか病院知らずだったバド。けれども、バドが犬生初のケガをしました。（ぽバドの場合、数日で治る傷は“ケガ”に入れませんー）左後肢を痛めたのですが、診察の結果は「打撲による炎症」かなと。なんだぁ～ただの打ち身かぁ～という感じなのですが、バドだけに色々と良い経験になりました。昨日（27日）河川敷で走らせた後も問題なく、わさびちゃんにも出会えて大喜びだったぽー＆バド。（わさび母さん、それもあってあんなに大はしゃぎだったんですょ～）[2]ほぼ完治だなと。ほっとしたところで、備忘録。（ずばり、長いです。読み辛くてスミマセン・・）さてさて、時間を戻して・・・２１日のこと。河川敷でたっぷり遊んだぽバド、帰宅後すぐに昼寝タイム。（この時点ではまだ、バドのケガに気がついていない飼主）２時間後、左後肢をなんとなくかばいながら歩き始め、さらに時間の経過とともに足をあげたままにするなど、その様子がヒドくなってきた。今までぽーの場合だと、バドの遊びに乗らなかったり、大人しくしたりしてケガの程度がなんとなく判断できたのです。ところがですねぇ、さすがバドなのだ。ぽーに向かって飛びかかるわ、あげく片足で走りまわる。痛いの？それとも違和感があるだけなの？？[3]バドならば骨折していても走るんじゃないかとオモッタ。腰を痛めたのかとも心配していたけれど、夜になり、かかとのすぐ下が腫れてきた。腫れの程度からも骨折ではなさそうで、ちょっと安心な飼主たち。矢印の付近は骨と骨の隙き間になっており、窪んでいるように見えます。その凹みがわからなくなるほどに腫れていたのです。（この写真は正常な状態の左後肢）[4]翌日の午後に病院の予約が取れたので、それまでなるべくできるかぎり、安静にさせる努力をする飼主たち。[5]等々と、そんな経緯を聞きながら、バドの左後肢をcheckする先生。「よくこの腫れに気がつきましたねー」だって～実は・・高速に乗って３０分の病院へ向かう頃には、腫れもかなりひき、足をかばう様子もましになっていたんですよね～けれど、バドだから一応診てもらうことにしたのです。バドだから、ね。（←この理由を伝えるのが難しかったー）腫れている箇所を触りつつバドの表情を伺う先生に、一番腫れているときでも反応しなかったことを伝える。「バドくん、我慢強いんですねぇ」ぁ”ー・・・飼主２人そろって口ごもる。「えーと、あのですねぇ。なんと言いますか、わかってないというか。。。だから連れて来たんデス。」（楽しい、嬉しい＞＞＞痛い なのよね。決して、あフォなワケではない！）触診でもレントゲン（麻酔なし）でも骨折の疑いはナシ。打撲による軟部組織や筋組織などの炎症、ということデシタ。翌日にはさらに腫れはひき、そして今に至る。というわけです。ほんとヨカッター。こういったケガも「バドの怪我」も初だったので、良い経験になりました。そういえば、よくあることだけど、、、ぽーがバドに体当たりしたので、あの時かなーと。ケガをした瞬間に気がついてやれなかったことも反省なのです。やっぱねぇ、バドはいつも元気いっぱいがバドだからね～[6]◀おまけ▶ 昨日の河川敷にて。わさびちゃんに出会えて歓びのもじょもじょを披露するぽー[7]◀診療料金メモ▶ 初診料 1,500 X線検査１ 3,000 X腺検査２ 2,000 抗炎症剤（プレビコックス227） 1,300 1/2錠／日x3日分 支払計（保険50%） 4,095 ＊翌朝、下痢をしたため錠剤は初日のみ服用 バドの体重 18.1kg。 ちなみにぽーは18.6kg。かなりバドの方が小さいのに500g差しかないのかぁ。（小さくないってー、という声が聞こえる）ほんと、ウィペットの見た目と体重は比例しないですねぇ。",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
