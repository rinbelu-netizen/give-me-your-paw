    "text": "週末のこと。サイトハウンド祭り開催なのだ～と、いっても３頭だけどね[1]他のクループでも言えることなのかもですが、とにかくサイトハウンドは独特の気質を持っています。たいていの方がイメージする『イヌ』とはちょっとチガウ。（私達がよく知っているサイトハウンドは、ぽー＆バドだけなのでもちろんあてはまらないコもいるでしょうけど。）[2]イヌがするであろう行動を期待していると肩すかしをくらう。だからこそ「そうそう、あるよね～♪」なんて会話がこれまた楽しいウィペットとサルーキではまた異なる特徴があるけれどネ。数ある特徴。その中のひとつがサイトハウンドの「スイッチ」のんびり匂いをかいだり、歩いたりしていたはずが、突如「スイッチ」が入りテンションはmaxに周りが見えなくなるほど走り回り、はしゃぎまくるのです。その「スイッチ」のきっかけは飼主にも予想できないのだ。そしてこの日、レオンくんのスイッチが突如はいった[3]スイッチのきっかけは、なんと相方。ヒト嫌いではないけれど、尻尾を振り甘えるような犬種でもない。だからこれはかなり嬉しい出来事なのですょ～[4]なのだけど、嬉しくないコもいたりなんかする。飼主へのヤキモチか、または「ボクと遊べょ」なのか。飼主の意識がレオンに向くと、チンピラに豹変するぽー[5]さっきまでこんな笑顔で遊んでたくせに。飼主のガラが悪いのばれるからやめておくれょ[6]ドーベルマンやゴールデンなどを飼っていたというヒトに、ウィペットの特徴を話すと「飼うの難しそうだ」と言われたことがある。いやいや、非常に飼いやすいイヌですょ。（少なくとも私達にとっては。）だって必要な事はほぼ自分で考えて行動してくれるイヌですから。コマンドはマテ・オイデ・オスワリくらいで十分かも。[7]後は、イヌたちが飼主を見て勝手に覚えてくれます。（もちろん、トイレコントロールもそれなりにしたけれど）柔軟性があり、状況判断も得意かもしれません。だってね、実はイヌ見知りなレオンくん。二回目の対面とはいえ、わさわさぽバドに初めはちょっと緊張顔。[8]ところが、後半はほんわり和み顔になってきたもんねレオンくんからぽバドを誘って走り出すこともしばしば。[9]そういえば、まだ状況判断できないコがいるのでした体当たりをして、追いかけっこ遊びを止めてしまう無邪気なバドあーっ、カラーを噛んどるやないか耳にもすり傷とかできていると思うのだ。ごめんね・・・[10]飼主同様、マイペースなぽー＆バドだけどまた遊ぼうね。よろしくですっ[11]そしてまだ会いたいのに会えてないサイトハウンドがいるのですサイトハウンド祭り、ますます盛り上げるぞ～",

    "text": "昨日のこと。２月７日。バドはまるっと生後8ヶ月になりました顔つきも体もまだまだ幼くて、子犬感が抜けないバド。だけれど、写真を見返すとしっかり成長しておりました。（あれ？あんまりわからないですかね～）8kgだった体重も、今は15.9kg。倍になりましたょ～[1]そして飼主の期待に応え、変顔もばっちりです月曜の雨降りで運動不足だった２人を砂浜へ。車に乗込みつつ連絡した、そんな急な誘いにも関わらず来てくれたネオちゃん[2]カメラ持たずでiphone撮影の、思いつき砂浜遊び。３頭ともが誰かこないか入り口を眺めたりするのは、いつも大勢で遊んでいるからなのでしょうかねぇ頭数が減ればイヌたちも勝手が変わるらしい。[3]ぽーさんてば、ネオちゃんを独り占めしたくなったらしいおしりに手をかけアピールそんなぽーの様子を遊んでいると勘違いしたバドが邪魔をする。邪魔をされ、ぽーは半ば本気でバドに怒る。女の子へのマウントを飼主が許すはずもなく怒られるぽー。いつもとチガウ様子に困惑するネオちゃん。と、今まで見ない光景になった砂浜となりましたそれでも走ったりとしっかり遊んで大満足のぽー＆バド。帰宅後、ぽーはストーブの前ですぴすぴ睡眠。バドは・・・そうか～まだ遊ぶのかぁ～～[4]＊ペットフード、おやつ選びは慎重に！カビの生えたおやつによる被害が出ています。→イヌのために。",

    "text": "ぽバドをsoraumi家に預け、行方をくらましていた飼主たち。無事に帰宅、ぽー＆バドとのんびり過ごしております（相方は仕事だけれどね）そしてなんと今日の記事は珍しく、ぽバド登場せずだったり私達の訪問先は、東京の友人宅。ナゼか観光地に行かない私は東京タワーすら見たことがない。けれど今回はスカイツリーが「見えた」ぞ～[1]さてさて、友人達と合流するまで時間もある。急遽、ぽバド大好き夫婦の嫁を呼び出し待ち合わせ。向かった先は、「代々木公園のドッグラン」平日は、やはりあまり来ないようですねぇ・・それでも帰り際に初めてビズラに出会いちょっとテンションUP。とっても元気な子でかわいかったなぁ～さて次の目的地は、ウィペット専用のグッズを扱っているお店pim:liko。ハーネスやカラーなど愛用させてもらっているのです。店長さん（？）の１０歳になるウィも大きめらしく、でかウィペット談義に花を咲かせてきました～お店を見たうえでのネットショッピングはなんだか嬉しいのだ。そしてふと我にかえると、こんなとこで良かったのかしら？という場所に付き合わせていたわけであっという間に訪問予定の友人一家と合流の時間。０歳の頃から毎週のように会い、２歳になる頃までずっと成長を見ていたこの子。と～ってもキュートな女の子に成長していてたまらず感動。会った瞬間に「micky？」だなんて・・う、嬉しすぎるじゃないか[2]翌日は子供たちの手をひきながら浅草を観光。浅草寺では揃って「凶」を引く強運の持主な相方と私[3]「舟に乗っても風はなく、月はあっても雲に隠れ・・」負 X 負は最強の運勢に変換されるから大丈夫なのだ！！と、開き直ったところで念願の、東京の蕎麦に舌鼓をうつ[4]お酒の縁がもとで知り合った私達だからこその、珍しいお酒＆ネタたっぷり焼酎と軍鶏鍋な夜会えなかった分の話を、高速回転で喋った気がしマス。[5]実はワタシが着付講師をすることになった、着物師匠との出会いもこちらの夫婦がきっかけだったりするのです。まったりしっかり大切な友人たちとの時間を過ごせた東京。そしてそれも、な～んにも心配せずにぽー＆バドを預けられたからこそなのだ。天候にも恵まれた東京滞在。飛行機の到着をいつもの砂浜で待っていてくれるのは、いつものトモダチたち。長くなったので、一旦休憩なのだ・・",

    "text": "なんと、本日２回目の更新なのだ～飼主たちがあはは♪と楽しくやっている間のぽー＆バドの様子（写真提供はもちろんsoraumiさん）そらちゃん＆うみちゃんのおもちゃを全てひっぱりだし遊ぶのはバド。初日はなかなか昼寝もせずsoraumiさんをストーキングするのはぽー。[1]うみちゃんと３頭でわちゃわちゃ仲良くやっていたり、仕事に行くしんぺーちゃんをお見送りしたり[2]うんうん。２人が予想以上に良い子だったみたいで嬉しいぞ。だからね、たまには相方のことも見送ってあげてね♪たいてい布団の中で寝たままなのにって、チョット拗ねてたぞうみちゃんを預かったときに感じたけれど、この生活馴染んできたなぁ～と思う頃にお迎えの日がやってくる。「今、渋谷～。これから羽田に向かうねん」と、帰る間際になって東京住まいの弟にメールを入れる薄情な姉。次はもっと早くに連絡をすること約束しました苦手な人込みと電車乗り継ぎで実はすでに酔い気味なワタシ。飛行機は好きだけれど離陸が嫌い。最高の気分で空の上なのだ（二日酔いではないはず。。。）「窓の外を見てごらん」相方の声に目を開けると・・わぁ～ぉ！一瞬で気分爽快、テンション復活ゲンキンな私。だってね。窓の外にはよく晴れた空に、くっきりと浮かぶ富士山が[3]雪が飛ばされ山肌の見えていた富士。ところがこの一週間で見事な雪化粧になったそうなのです。日本アルプスも全てはっきり見えて酔いもさめた！！降下時にナントカ袋とにらめっこしようかと思ったけどネいつもの砂浜でわさわさ兄弟の相手をしてくれていたのは、ネオちゃん、むぎちゃん。そしてもちろん、うみちゃん。（みんないつもありがと～～）わんこトモダチが砂浜に来れば、100m先からだって見つけちゃうぽー＆バド。のはずなのに、歩けども、歩けども、気がついてくれない・・・「ぽーちゃん～～バド～！お迎え来たょー」皆の声がはっきり聞こえる場所で、ようやく気がついたのはバド。出発時には全く気にしていない様子だったバド。うちに来て４ヶ月が経ち、どこまで飼主として、安心できるヒトとして認識されているのだろうか笑顔で走り寄りぴょんぴょん飛びついてきた ふだんは飛びつき禁止だけど、こんなときはいいのだ～砂浜を離れる時には「一緒に帰るよね？」なんて顔をしちゃって、もぉ～～～～さて、バドが跳ねてる間も全く気がつく様子のないぽーさん。あれは全ての状況に拗ねていた、と飼主たちは感じていますひとりぽっちでふらふらと草むらの物色を続けるぽー。だから皆が呼んでも見向きもしない。相方が小さな声で名前を呼んでみる。ぴこーんとぽーの耳が立ち、仁王立ち再び相方が名前を呼んだところで、全速力で駆けて来る。一目散に、わたしの元へ。そして、その後、相方に飛びつき、いつものように足の間をくぐり抜け甘えるぽー。（えーと、相方の威厳のため一部修正しております。え？できてない？？）帰宅後はまったりのんびりな飼主たちとぽー＆バド。感動の再会でちょびっと拗ね気味相方も、左腕をバドに取られ、[4]前足を相方の腕から絶対にどけないぽーに顔の筋肉ゆるみっぱなし。しかもぽーなんて、寝惚けまなこで飛び起きても、足は離さずだったもんね～[5]次の遠出は必ず一緒に連れて行くからね。どこだろうが、どんな方法を使ってでもね～ふふふ",

    "text": "ペットはモノやおもちゃではない。（ホントはね、おもちゃだって大切に扱うべきですょ）なぜ突然こんな書出しにしたかと言うと、２月６日に書いた記事の後日談があるためです。（実際には継続中ですが。）あら、なんのお話？という方は手間を取らせますが、ぜひその該当記事を読んでくださいませ。→イヌのために。さて、私も記事にしましたし、至る所でその話題が広まったところで、メーカーの代理人から彼女のもとへ文書が届いたそうです。以下に、届いたという文章を、れいぢーさんの記事から抜粋。・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・◆貴殿が ブログ、Twitter、mixi等に記事を掲載されている事が判明しました。その中に事実と異なる内容が記載されていたので、ご注意下さい。◆事故発生の原因は、脱酸素剤の封入忘れによるものであり、原材料に原因があった訳ではありません。本事件後、検品を行い、脱酸素剤が全品に封入されている事が確認出来たので現在販売している商品は安全です。貴殿は、弊社の商品が危険であり、さらなる被害が発生するかのような表現ですが現在販売している商品は安全です。◆貴殿は、カビの生えた商品によって手術が必要になったとの旨を記載していますが因果関係は不明です◆貴殿から弊社に対し、カビの検査をしてほしいと要望をお聞きした事はありません。◆弊社では貴殿のお電話、日時、内容を記録しております。◆以上の通りですので、至急 ブログ、ツイッター、mixiに関しては削除、及び訂正記事を掲載してください。速やかに削除、訂正がない場合は、大変遺憾ながら然るべき手続きをとります。◆また、安易に転載等を行った第三者にも責任が発生する可能性があるのでご注意ください。・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・彼女はこれらのことを皆に知らせるため、記事にしました。そして沢山の人が記事を削除したようです。この文章を読む大多数の人が違和感を感じるのではないだろうか。原因である脱酸素剤の封入忘れと、その対応については一項目に記す。あとの項目は全て・・・いちいち書くのも面倒なほど「なんじゃこりゃ？」な内容。私は記事を削除せず残すことにしました。（れいぢーさん気苦労増やすかもだけど、、ごめんね。）というよりも、削除する理由がないのですよ。読者数の少ない、たぶん限られた人しか見ていないこのブログ。だけれど不特定多数の人が見られる環境にあるため、そもそも「安易に転載」を行うことなど決してしない。今回のような内容ならとくに十分悩み、考えたうえで載せているのです。だからこそ、リンクの許可は出しましたが、私の方から転載をお願いすることもしていません。そして当事者でないからこそ、メーカー名や商品名は直接書かず、彼女の記事を読みに行ってもらうようにしていました。イヌのために、奮闘する飼主をバカにしすぎです。ネット上に広まった情報を、全てなかったことにするのは難しいでしょう。今でも検索すれば商品名もすぐわかる。メーカー直売ではないですが、商品はオンラインショップでも扱われています。ブログなどチェックしたということはネットに不慣れでなかったはず。該当記事は現在読めないけれど、改善の気配が見えず拉致もあかないため、もしもの被害を防ぐため広めることを彼女は先方に伝えていましたよ。さて、彼女は上の文章を皆に伝えるため記事にしました。そして悔しい思いを別記事で書き綴ったところ、また文章が届いた。『会社名を出さなくても 一連の流れで、当社の事だと分かるので今回の事に関する話題は 今後控えてください』もうね、開いた口が塞がらない。メーカーのどこにそんな権限があるというのだ。全て『後の祭り』ですから。要因のひとつは、一番の原因は、問い合わせをされた段階で、納得のゆく対応をしなかったことなのだ。どう考えても、誰が聞いても、つまらないお金目的のクレーマーではなかったのに。それなのに、代理人を立てたのはどちらなのだ。原因が、たった一度の「脱酸素剤の封入忘れ」だけなら、そして検査なり納得のゆく会話ができていれば、またその商品を購入するヒトもいたかもしれないのにね。[1]",
    "truncated": false,

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
