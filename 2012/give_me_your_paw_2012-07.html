    "text": "soraumi家からずーーっと借りているプレシジョンのサークル。ぽーはパピーの頃に飛び越えて脱出したことがあります。そのサークルの高さは107cm。ウィペットの跳躍力が高いことは有名で、出身犬舎では運動場のフェンスを3m以上で作っているほど。それなのに、バドの留守番用に購入したサークルは高さ９０cm。８枚のフェンスを自由自在に組み合わせることができ、出入り口は２枚のフェンスをナスカンで止めるだけ。バドが立ち上がればこんな位置になるから、ジャンプすればかるーく脱走できる高さなのです。[1]だけれど賢いバドくんはそんな脱出方法は選択しないのだ。入った場所から出る、それがバドの流儀なのだ。そんなわけだから、ひたすらナスカンのある場所を前足で、鼻で押し続ける。留守から帰るとサークルが変形していること度々。たいていは驚かないのだが、昨日はちょっと違った。４時間ほどの留守の後、帰宅してみたら。。あら、バドくんかわい～部屋の前でお出迎えしてくれるの～。[2]いやいや。こんな状態は、オカシイから。この位置にサークルがあるなんてありえないのだが。よくもまぁ、ここまで動かしたものだー。右隅に写っている黒い物体は、１枚目の右隅にあるスピーカーなのです。バドってば、重さ11kgあるサークルを２m強も動かしたのだ。驚愕が大笑いにかわり、写真を撮っていると、またもやせっせと扉を開けようとがんばり始めるバド。[3]高さ1m以上の塀には、ひらりと飛び乗ったりするのにね～。これからもバドには、「出入り口はここ」な流儀を貫いて頂こう。",

    "date": "2012.07.11",
    "title": "つながる。",
    "tags": [
      "ぽー",
      "バド",
      "日常",
      "お友達",
      "2012年7月"
    ],
    "images": [
      "https://stat.ameba.jp/user_images/20120711/14/rinbelu/38/25/j/o0400029912073575329.jpg",
      "https://stat.ameba.jp/user_images/20120711/14/rinbelu/a1/ca/j/o0400029912073635913.jpg",
      "https://stat.ameba.jp/user_images/20120711/14/rinbelu/bc/55/j/o0399029112073581047.jpg"
    ],
    "text": "ぽバドとのんびり散歩をしている途中、分かれ道で足を止めて私の顔を見上げるぽー。[1]こっちに行こうか～、と片側の道を指で指し示す。すると「はーぃ♪」と返事をしたかのような態度で、軽い足取りで、示した方へと歩き始めるぽー。そんなやりとりをしている時、きっと私はゆるみっきた顔をしているとオモウ。言葉を話さない動物たちとつながる瞬間。信頼関係ができてきたことに気がつく度に、私の犬ばか度は上がっていくのです。もちろん、初めからそんなやりとりができるわけでなく、ぽーを迎えてからの２年半の間に築いてきた信頼関係。まだぽーとは２年半かぁ。そしてバドはたったの１０ヶ月。これは・・・数年後にはテレパシーを使ってるかもしれないな[2]なーんて、こんなことを書いていしまった訳は、前回の記事で供血のお願いをしたエイドリアンのことがあったから。アドルフママさんのブログによると、彼女は大阪の病院から、地元である和歌山の病院へ転院するそうだ。未だ原因不明のままらしいけれど、内蔵からの出血もとまり移動が可能となったらしい。昨日は缶詰を量は不明だけれど食べ、自力で体を動かしたそうな。輸血で命を繋ぐしかない彼女が食事を摂ったわけですょ。現在、生後10ヶ月のエイドリアン。飼主RYOCKYさんが彼女を迎えたのが去年の９月頃らしい。私たちがバドを迎えた日は2011年９月20日。なんと、過ごしている時間が全く同じというわけだ。RYOCKYさんは犬を飼うのが初めてだそうな。・・・５年後、10年後、20年後。時間を積み重ねる毎に犬との繋がりは深くなる。（と、私は感じています）どうか原因が判明し、治療へと進めますように。完治できる病気でありますように。もし治療がずっと続くのであれば出来るだけ、飼主さんとエイドリアンにとって負担の少ないものになりますように。時間とともに変化する彼女の容態。情報が混乱したりもしているらしく、これからの最新の情報は、RYOCKYさんのブログとアドルフママさんのブログにて。私もこっそり応援を続けていくつもりです。明日からはまた普段通りの、Hey buddy , give me your paw!に戻ります。本日ラストの写真は、昨日、河川敷にて乾燥ミミズに全身で挨拶中なバドを。[3]RYOCKYさんが7/10のブログに書いていた最後の一文を抜粋。元気なエイドリアンを彼が抱きしめられる日がきますように。＊みなさん愛犬を抱きしめてますか？もう我が家は抱きしめるほんの少しの衝撃すら危険な状況です。みなさん愛犬を抱きしめて下さいね。みなさんが愛犬を抱きしめる事が出来るのは、我が家ではもう「奇跡」です。7/10 RYOCKYさんのブログより",
    "truncated": false,
    "comments": []
  },

    "tags": [

    "images": [
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/d9/3b/j/o0400043012075093922.jpg",
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/b6/e6/j/o0400030012075093923.jpg",
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/7a/02/j/o0399026712075093487.jpg",
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/cb/12/j/o0399026712075093490.jpg",
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/13/99/j/o0399026012075093489.jpg",
      "https://stat.ameba.jp/user_images/20120712/13/rinbelu/4f/3e/j/o0399026712075093488.jpg"
    ],
    "text": "ぽー＆バドはウィペットという犬種です。ソファやふかふかした場所で寝るのが好きな犬種で、硬い床では座ることすらしません。そんなウィペットに関しての定説通り、ぽーは余程のことが無い限り床に直接座ることはありません。（但し、大雑把飼主に育てられれば薄いタオル１枚あればO.K.なのだ）柔らかい場所を求め、暑い季節でも押入の毛布に座っていたり。（但し、飼主達に放置されて拗ねているせいだったりする）[1]　（2010年７月19日撮影。ぽー生後11ヶ月～）私たちの信じていた【ウィペット】に関する数々の常識。「ちがうょー。みんなそれぞれなんだょー」それを教えてくれるのが、それがバドなのだ。もちろん、バドだって硬い場所より柔らかい方が好き。けれどもだ。暑いときはそんなこと気にしてらんない。暑ければ、畳や板の間に好んで寝ちゃうのがバドなのだ。[2]今年は暑がりなバドと過ごす初めての夏がやってくる。というわけで、Radicのクールアルミジェルマットを買ってみた。[3]３サイズあるうちの最も大きいLを選択。放熱性の高いアルミパックに冷却ジェルが入っているらしい。何が便利って、冷蔵庫などで冷やす必要がなくそのまま使えること。付属のコットン地のカバーは４つに仕切られていて、それぞれにアルミパックを入れるようになっている。（総重量4.8kgとちょっと重い。が、ぽバドに比べたら軽～～い）[4]程よい柔らかさもあるのでソファの上でも使用可能。試しに寝てみたら、ゆっくりじんわりひんやり～～・・・・知らぬ間に３０分が経過していました。もちろん、肝心のバドは気に入った様子で好んで使用してマス。（↓これは写真を撮るため、わざと座らせてみた捏造写真）[5]ぽーも気に入ったようで、好んで寝るように（捏造ではありませんー）というわけでさらにもう一枚を購入。大きめぽーが寝るとこんな感じ。[6]冷蔵庫や氷水で冷やして使う事も可能だそうな。けれども常温使用を推奨しており、冷え過ぎに注意とのことです。短毛なぽバドは冷やさずこのままが適温の様子。キャンプや旅先にも持って行くぞ～",

    "text": "今朝は久しぶりに砂浜へ。砂浜では海開き式典の真っ最中。去年は台風被害で海水浴場はクローズのまま。今年は賑わうかしらん。式典を眺めつつ邪魔にならない場所までテクテク移動。雨のおかげで、砂浜は若干湿気を帯びて硬めの踏み心地。乾いているときよりは踏ん張りもきくかしら。[1]昨日は海が荒れたのか、波打ち際の砂が若干えぐられている。３m近く垂直飛びもできるのに、慎重にそろりと降りるぽー。そんなぽーを不思議そうに見ているバドがこれまた面白い。（遠いので拡大してみたー）[2]しかし、面白いことをするのはバドの専売特許なのだ。不安定な体勢で、よろめきながらのおしっこタイム。何もわざわざそんなとこでしなくても・・・[3]ぽー＆バド、波の音に合わせ踊る。[4]原っぱや河川敷でも楽しそうに遊ぶけれど、砂浜遊びが特に嬉しそうなのは楽しい出来事が多いからかしら。蒸し暑いのと、嬉し楽しで、今日もぽーの笑顔は全開。[5]＜エイドリアン情報＞抗癌剤治療が始まったようです。まだ病名の特定には至っていないけれど、まだまだ安心できる状況ではないけれど。飼主さんも、エイドリアンもがんばれ。",

    "text": "友人の店で開催されるイベントの案内が届いた。来場記念品は「スマホポーチ」だそうな。いわゆる、スマホを水濡れなどから守る便利グッズですね。なんや！私が２回もiPhoneを水没させたからかっ？！（私はもうすでに防水ケース持ってるもんねーっっ）なーんて、半分本気の半分冗談で笑ってたら、ほんとだったという真実。わーぃ。記念品選びに貢献したぞぅ～そんな私は、防水ケース持たずに川遊び。（水没はさせてないぞー！）ぽバド、今年２回目の川遊びなのだ。川遊びのプロ、ボーダーコリーのNEOちゃんも一緒。[1]川の中からぽバドを誘う、ネオちゃん＆ネオかーさん。そんなふたりに背を向け、川に入ることを拒否するぽバド。[2]だけれども、ネオちゃんの居る場所が気になり、ネオかーさんの投げるもの（石）が気になり、けっきょく、ばしゃばしゃと川の中へと突き進むのがバドなのだ（ネオかーさんに褒められさらにテンション）そんなバドを見て、川岸でさらに足を突っ張るのがぽーなのだ。[3]初めの壁を乗り越えれば、あとはもうバドの時間。自由きままに川の中を走りまわるバド。ライフジャケットを必ず着せることを飼主は決意する。（リードも要るかも。笑顔で流されていきそうだワ・・）[4]飼主が呼んでみても、溺れているふりをしてみても、自ら川の中へ入ることはしなかったぽー。ところが、沖縄ではバドを助けるために川へ飛びこむという変化を見せたぽー。兄としてのプライドなのか、それともバドのそばへ行くためのなのか。川岸をうろうろしていたぽーが行動を起こした。[5]と、やっぱり自由自在に川へ、とはいきませんでしたとさ。しかしぽーの挑戦は、ここで終わりではなかったのだ！歩かずに飛び跳ねながら川の中を移動していたバドが、川底の砂に足をとられ頭から水中へと突っ込んでいる間に・・それを見て私とネオかーさんが笑っている間に・・再びそろりそろりと川の中へと進み、いつの間にか中州へ渡りきっていたぽーさん。（ちなみに手前にいるバドは頭からずぶ濡れになってマス）[6]私のそばへと戻ってきたぽーは、初めの緊張顔とは異なり、にまにま顔でちょっと満足気。実はちょっとどころではなく、私の想像以上に、テンション上がっていたらしくこのあと原っぱで大爆走。[7]ぽバドと会うまでにすでに２時間ほど遊んでいたネオちゃん。さらに一緒に追いかけっこもして流石におつかれさま。適正体重に近づいてさらに持久力UPしたね～また川で、原っぱで、そして海でも遊ぼうね。[8]",

    "text": "お客さまをお見送りする頃、既に深夜近くになっていた土曜日。先に床についた主人と一緒に眠りにつくのはぽー。シャワーを浴びる私を扉前でじっと待つのはバド。髪を乾かす私を、時々鼻先でつついて邪魔をする。眠そうに目をしょぼしょぼさせながら小さな声で泣くバド。つまり、バドが訴えている内容は、「ねむいょー早く寝ようょー」ということなのだ。ぽーと寝ておいでょ、と促すのだが、途中まで移動してまた私のそばへと戻ってきては泣く。可愛いやら、可笑しいやら・・多頭飼いのみなさん、２頭目ってこんな感じですか？？さてさて、翌日は最近お気に入りの高原へ。下界が３０℃を超える夏日でも、そこは21℃の快適空間。足場のよい広ーい原っぱで、どれだけ快適かはぽーのこの表情で。[1]少し背の高い草も生えているから、目を傷つけないようにね。走る姿に、体型に惚れ込んだウィペットという犬種。我が犬ながら、惚れ惚れするなぁ～～（バ飼主炸裂なのだ～）[2]茂みに隠れ野生化したぽー。ではなく、茂みに隠れているたっつーを探すぽー。草が邪魔なので垂直飛びをして、上から探しているところなのです。賢い～と褒める私もバ飼主、犬相手にかくれんぼするたっつーも・・[3]来月で３歳になるぽー。バドの方が体力もあり、運動神経も良いけれど、まだぽーの方が走るスピードは速いのかしら。追いつけなくなるとギャウギャウ言いながら走るバド。今回は一眼で撮ったから、その顔がよく撮れました。肉眼ではスピードが速すぎて細かな表情はよく見えないのです。それにしても、バド・・必死すぎ。[4]その顔、まるでT-rexではないか。[5]またここへ遊びに来よう。トモダチも誘おうか。うん、そうしよう。[6]",

    "text": "「砂浜はもうやめたの？」と、聞かれることの多くなったぽバド。いやいや、やめてません～。といよりも、やめられなーぃ。家からも近く、のびのび～っと走れて、周囲への気配りも最低限ですむ砂浜。やめられませんです、はい。というわけで、昨日は10日ぶりの砂浜でした。[1]いきなり走らせるのではなく、ウォーミングアップかね先ずは歩く。そして、走る時間も体調や様子を見て決める。走り終わった後も、クールダウンのために少し歩く。とはいえ、どれくらいが適度なのか分からない。[2]飼主とぽーだけで遊んでいた頃に比べると、遥かに運動量が増えている。しかもほぼ毎日、どこかで走りまわっているぽー＆バド。もしかしたら、スポーツ選手として捉えるべきかもしれない。通常の犬を飼うための知識だけでは足りないのではないかしら。[3]６月の診察では幸いにも、関節など異常は見られなかったぽー。今のうちだ。今のうちに何か対策をしておきたい。というわけで、こんな本を読み始めました。[4]春頃から半手作り食を食べ始めたぽバド。彼らの運動量に合う栄養を、食事を摂れているのだろうか。ウォーミングアップ、クールダウンなどの正しい知識が欲しい。そのような、私たちの知りたいことが詰まっていそうな本なのだ。サイトハウンドの骨格イラストなんかも詳細に載っていて、読み応えのひじょーにありそうな本。但し、辞書を片手にだから数ページづつしか進みません。[5]第一章では「過剰な運動は労作性横紋筋融解症を引き起こす」と。なんだ？その病気は？と、ネット検索。馬やアスリートに多い病気で、筋収縮など様々な症状が起き、最悪の場合には昏睡、死亡・・・・という具合だから余計に読み進まない状態なのですが。。。ここに書けるくらいに、しっかりと理解できたら紹介していく予定です。ウィペット飼いの皆さんにとっては、あたりまえやん～という内容もあるかもだけど・・・理解できたら、上から目線でえらそーに語りますから、待っててネ仲良しで、遊び大好きなぽー＆バド。いつまでもその足で、その心臓で好きなだけ走れるように。君たちのためなら何だってやるぞ。だって、バ飼主だもんね～。[6]",

    "text": "週末毎の恒例になりつつある高原散歩。[1]いつもは涼しい原っぱだけれど、この日は暑くて車の影で涼をとるコも出没するほどで。[2]それでも「山の上＝涼しい」ことに味をしめた私たち。淡路島の山にも登ってみました。（車で登れる場所、限定だけれど）地図を見て物色してみるも、淡路の山は高くても標高600mだったー。それでも山の上は、木陰は涼しいぞ。[3]暑さがましならば、ぽバドのテンションも上がります。[4]さらに涼を求めて、水のある場所へ行ってみる。こちらには不動明王をお祀りしているお堂があり、なんと、犬連れなのに入れていただけました。涼しかった～（←喜ぶのそこ？！）もちろんしっかりお参りしてきました。[5]水分補給はこめまに、肉球が焼けないよう歩く場所にも気をつける。そんな飼主の気配りをよそに、涼し気な、大きな水たまりに好奇心そそられるぽー＆バド。[6]さらに涼しい場所に移動しましょうか。ということで、犬O.K.のカフェ「ラウーベ」さんへ。[7]ドッグランもあり、床は天然木と犬の足にも優しいカフェ。８個ほどあるテーブルのうち、ほとんどがローテーブル。そして犬連れ客は私たちだけで、小さな子供連れが多い。というわけで、入口近くの背の高いテーブルに座ってみました。ぽバドがテーブルの下で大人しくしてくれていたので、犬がいることに気がついていない人達もいたかも。[8]店内撮影の許可も得たけれど、ほぼ満席だったので遠慮しちゃいました。数年ぶり？数十年ぶりのパフェを戴く。[9]会計に行った主人を待つぽーさん。中・大型犬連れの場合は特にこの席がお勧めかも。見た目で驚かれることの多いぽバドにとっても良い席でしたコーヒーも美味しかったし、次はランチを食べにこよう。＊補足 わんこメニュー、係留フックはなさそうでした～[10]＜おまけ＞この週末は二日とも山の上で昼食をとった私達（手作りではなくコンビニね♪）そしてある蝶に好かれた私。ずーっと手や腕に止まったままで。。自宅庭でも数匹の蝶が羽化し、今年はなにやら蝶に縁があるようです。さて、そんな人好きの蝶を眺める好奇心旺盛なバド。いまにも飛びかかりそうな雰囲気ですが・・[11]実際はどんなだったかは、動画でじっくりとどぞ～。",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
