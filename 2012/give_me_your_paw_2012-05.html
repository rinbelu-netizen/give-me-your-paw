    "text": "4/28 関空10:05発ー那覇12:10着 JAL2573便ぽバドを託すのは出発の３０分前。水を飲ませたり、トイレをさせる時間、何よりのんびりする時間を作るため少し早めに家を出るさすが早朝。渋滞もなく８時前にすんなり到着。飼主たちのチェックインを済ませたら、貸出し＆手持ちクレート２個のチェックも済ませてしまえ。というわけで、その後は空港隅の緑を見つけてのんびりまったり[1]そしていよいよ、ぽバドを預けなければいけない時刻。カウンターへ向かうまでに、やたらすり寄り甘えるぽー。さすが飛行機体験犬。何やら不穏な空気を感じとっているようだバドは誘導されるがまま、すんなりとクレートに入る。そしてぽーは数回抵抗した後、諦めたようにクレートへ。[2]手持ちクレートにはネットをかけ、貸出し用はこのまま貨物室へ。（どんなネットかはぽー空を飛ぶ。往路編にてどうぞ～）厚い雲に覆われた空。離陸後すぐにカクンと機体が下がったりなんぞして、ぽぉ～バド～っと騒いでるうちに那覇空港に無事到着。（騒いでたのは離着陸が苦手なワタシだけだったり）ペットは手荷物受取エリアにて、係員が直接運んで来てくれる。伊丹ー青森では、手荷物より先に運ばれてきた。今回はエコノミーで後方の座席。大急ぎで受取場所へ向かうと、着いてすぐにベルト脇の扉からバドが登場～[3]ぽーはどこ？と尋ねたら、すでに出口近くに運ばれていた。２頭とも緊張のせいで若干呼吸が荒い。それでもクレートから出すと、すぐに落ち着き水も飲む。（その後もおなかを壊すなどの、目立つ体調変化もなくほっと一安心）さてさて、そのまま空港内のレンタカー送迎場所へ。大型バスとOTSレンタカーのプラカードを持っているヒトを発見。そうそう、昨日の記事でちょろっと書きましたが、営業所まではクレートに犬を入れておかなければいけない。手持ちクレートは大きめサイズ。事前に家で何度か試してみたりしつつ、２頭一緒に入れることに決定。営業所まで１５分、ちょっとがんばってもらいましょう[4]どうやら犬連れ沖縄旅行は小型犬が多いらしい。クレートに入れてからバス内に乗せるよう指示される。２頭合わせて36kgほど（スミマセン。私は力になれマセン・・）手伝ってもらえますか？とお願いしたら、周りのお客さまに気をつけつつバス内でクレートに入れてもよいことにしばらくとってもお利口に、ガマンしていたぽバド。ところが、狭いわ暑いわでストレスが溜まってきたぽーさん。こんな格好になりながら「狭いねんっ」とバドに八つ当たり[5]ぽバドのためにせっせと風を扇ぎ入れる飼主２人。犬好きでないヒトが見たらさぞかし滑稽な姿だったことでしょネでもまぁ、その甲斐あってか落ち着きを取り戻すぽバド。無事に車を借り、さぁいよいよ沖縄観光スタートなのだ～・・・to be continued",
    "truncated": false,
    "comments": []
  },

    "text": "さて、ここからは観光編。さくさくーっと進めるぞ～！（そうしたい・・じゃないと終わらない～）むら咲きむらや沖縄ワールドなど、犬O.K.な施設が意外とある沖縄。だけれど、私達は遺跡探訪や散策を目的に沖縄を巡ることに。初日に目指すは世界遺産でもある「勝連城（かつれんぐすく）」そして全長5kmの海中道路を渡り、各島へ渡る予定。[1]空港から勝連城までは高速を使って約1時間。沖縄本島は南北直線距離にして約107km。周囲は約560kmだから、どこにも寄らなければ１日で一周できちゃうと、そういえば。嘉手納基地で戦闘機やtouch-and-goを見たのですが、どこを走っても、米軍関連施設がどこまでも続く沖縄本島。基地問題は答えを出すにはとてつもなく難しい問題ですし、そもそも知識をほとんど持たない私が書ける内容ではない。無いのだけど・・フェンス越しに見える（私には）目的不明な広い広い芝生。ぽバドを走らせたーい！と、思っちゃいマシタ。。さて、勝連城は鎌倉初期前後に築かれたといわれる城。琉球王国時代には強大な勢力を持ち、王府に対し謀反を起こし、その結果滅ぼされたそうです。小高い山の上に築かれたその姿は要塞そのもの。[2]奥に見えるのは「ウシヌジガマ」。ウシヌジ＝敵から身を隠す場所、ガマ＝洞窟の意味らしいけれど、実際は礼拝所だったとか。木の根が遺構に絡みつく風景は、カンボジアを思い出すなぁ・・[3]頂上からは360度パノラマが広がる。のだけれど・・・この写真を撮ったがために、バドに悪いクセを覚えさせてしまった。これ以降、向こうが崖だろうが、塀があると飛び乗るように[4]この日、梅雨入り宣言されてしまった沖縄。と言っても沖縄では、雨は降ったりやんだりで観光には問題ない。海中道路を渡ってからは、海岸でひとっ走りもできちゃう。[5]海水まじりの砂浜で走ったぽバドは見事に砂まみれこの時点で１６時頃だっただろうか。大変な勘違いに気がつかないまま、呑気に宿へ電話を入れる。「１時間後くらいに向かいます～。」とネ。サーフサイドB＆Bへ到着後、直ぐにわんこ用シャワーを借りる。（上の地図ではさらに北の位置になります。）写真は別の日に撮ったものだけど、壁にはフックもあり、お湯も出る。犬用バスタオルも借りることができ、至れり尽くせりなのだ。[6]そしてツインの部屋はとても広く大型犬だって余裕のスペース。電子レンジに冷蔵庫、中庭には洗濯機もあるから長期滞在に快適な宿。あまりの居心地よさに沖縄滞在中いつの間にか、宿に戻ることを「家に帰る」と言っていた私[7]今日の夜ゴハンはどうしようか～なんて、のんびりしていたら・・・友人から電話が入り、それからはもう怒濤の一日になったわけで。→ハイタイ！どんな結婚式だったのかが想像できる写真をココで一枚[8]こちらの男性、酔ってふざけてみた私達の友人ではありません。会場となったホテルの、披露宴での司会者さんなのだ。この格好と楽しいトークで式を盛り上げていました～突然に、慌ただしく宿に置いていかれることになったぽバド。私達が知れる範囲ではおとなしく待っていてくれた様子。それも預かり部屋が快適だったからかも。その部屋の様子はまた改めて。[9]＜4/28 部屋の前にて荷物を運ぶたっつーを見守るぽバド＞",

    ],
    "text": "てんやわんやとなった式の後（誰がそうした）、たっつーには私の分まで、さらなる祝いの席へ参加してもらった。（俗に二次会、三次会などと呼ぶ）だから沖縄で迎える彼の２日目は、ものの見事に二日酔いよーしっ、運転はワタシに任せたまえしんどい～と唸るたっつーを乗せ、北に向け舵をとる。先ず目指すは本部町の『備瀬』という地区。[1]と、その前に道の駅 許田にてbrunch タイム。沖縄に来たらやっぱこれでしょ～と、私はタコライスを選択。（実は家でも作る程タコライスが好きなだけ。翌日も食べたぞー）そしてたっつーは、タコカレー＆コーラで回復を目指す。[2]沖縄滞在中の昼食は道の駅が多かったかも。テラス席がほぼあり（屋根のある場所も多い）犬O.K.の可能性が高い。他にはスーパーで沖縄らしい総菜を選び、部屋食という選択肢も。そうそう、滞在中に更新したぽーとうちなんちゅ。この話はこちらの道の駅 許田での出来事でした。つまり朝から宿に戻るまで、ずーっと車の中匂ってたんだワ「沖縄らしい町並みをのんびり歩きたい」そんな私達の要望に、宿のオーナーさんが教えてくれた場所が備瀬。沖縄では古くから防風林として植えられているフクギ樹齢３００年になるものもあるとか。備瀬では集落のほとんどがフクギに囲まれており、それが並木道として観光名所ともなっているようです。[3]雨も陽射しも避けられるから、のんびり歩くには快適集落まるごと並木道なので、分かりやすいよう順路表示まである。なんだけど・・木々の間から見える古民家には人が住んでいるわけで。ココまで観光化されていると住む方は落ち着かないだろなぁ[4]水牛車にばったり遭遇。水牛や馬車で村を案内してくれるそうな。ジャマになってもいけないので、そーっと脇を通り抜けようとしたら・・ぽバド、びびって腰がひける[5]特にぽーが怖がって暴れました。ごめん、もうちょい気をつけてあれば良かったネ。ところで、知る人ぞ知る、私はなんちゃって着物着付講師。そんな私が見ておきたい、行っておきたい場所がありました。それが大宜味村 喜如嘉（きじょか）の芭蕉と芭蕉布。芭蕉布会館では、人間国宝である平良敏子さんが、機械を一切用いず芭蕉から・・・なーんて、色々書きたかったけれど、うんちくを傾けるのやめておきます。だってー行ってみたら、閉館日だったんだもん～悔しいからレンタカーと会館を記念に写してキタ。[6]↓ちなみにこれが芭蕉。茎を煮たり、裂いたりしごいたり、何度も手を加え細い糸にするのです。・・・とーっても大変なのょ、きっと。（実際の行程を見た事は無いけど）[7]さてと、かなり北部の方まで来たわけだ。（と言っても、沿岸部を通らなければ許田から大宜味村まで40～50分ほど）旅をすると必ず「端っこ」にtouchしたくなる私たち。せっかくだもの、沖縄最北端 辺戸岬に行っちゃおうさらに1時間程の道のりを海岸に沿って走ってみる。途中「ヤンバルクイナ横断注意」の看板があったけど、撮れなかった前日に本土復帰４０周年記念イベントが行われていた沖縄。アメリカ統治時代、県は復帰を願い辺戸岬からのろしを上げたそうだ。[8]たっつーが向かう先にあるのは、「祖国復帰闘争碑」。1972年沖縄返還の際に建てられたそうです。（本文を読むと平和とは何だろうかと、深く考えてしまう・・・）[9]さて、天気の良い日には与論島や沖永良部島も見えるそうな。どうですか、ぽーさん？見えますか？？[10]そういえば、ここで他の観光客にドーベルマンだと言われたのでした。誰がって、ぽバドが。犬種を聞かれ答えたら「あら、違うわ～」と。そりゃ違いますょ～ でもね、ちなみに、他の場所でも再び間違えられたのです。この話をあるドベ飼主さんに伝えたところ、ウィペット（グレハン）に間違えられるドーベルマンがいるそうな。写真を拝見させて頂いたら、確かに、間違えられるかも！というコで・・と、ととと、、、、脱線してしもうた（ただでさえ本文が長いのに！）えーと、そうそう。辺戸岬ですでに時刻は1６時近く。そのまま来た道を引き返し、スーパーで総菜を買い宿へ。翌日の午後にはカヤック体験もあるため、早めに休んだのでした～充分長くなったけれど、ここでもうひと情報。サーフサイドB&Bのわんこ預かり部屋。建物まるごとドッグルームになっていて、中には部屋が２つ。壁には防音壁が貼られ、エアコン完備。タオルや水入れも各部屋にある（但し、水入れは小型犬サイズかも）[11]大小様々な大きさのケージが各部屋に5~6個くらいだったか。私の身長155cmだからかなり広めなのが分かるかしら。鍵もそれぞれについていて、24時間好きな時に使えます。[12]あくまでも「一時預かりのための部屋」なので、犬の世話や管理等は飼主が行いましょう～。実際のケージのサイズや、条件などはこちらにて→ドッグルーム結婚式で留守にする際、ぽバドそれぞれに１個ずつ借りました。これらの写真は別の日に撮影したのですが、やはりぽーは入る事を拒否なのでバドに入ってもらいました。（どぉ？かなり広いでしょ～）[13]さて、次回はいよいよ（？）犬連れカヤック体験編～",

    "text": "前日に三矢本舗で買ったサーターアンダギーで始まる３日目の朝（私は田芋とプレーン味が気に入った！）犬には泳ぎの得意な犬種と、そうでない犬種がいる。ウィペットなぽバドは体型からしても、間違いなく後者。カヤック遊びのコースとしては２種類選ぶことができ、無人島を目指す海コースと、マングローブ林を抜ける川コース。（サーフサイドB&Bはカヤック体験可能な、一石二鳥お宿なのだ～）幸いにしてぽバドは（好きではないけれど）泳ぐ事ができる。だけれど初めてのカヤックで大海原はチョット・・川ならば陸も近いし、というわけでマングローブコースを選択。と、その前にカヤック遊びは午後からなのだ。それまでは宿から車で５分の、犬もO.K.なビーチに行こうところで、沖縄では犬禁止のビーチが多いらしい。だけれども心配ご無用なのだ 宿で貰えるパンフレットに、犬O.K.な飲食店もビーチも載っているから少し離れた駐車場に車を停め、ビーチ沿いの歩道を歩く。「ここから、ビーチに降りられるかもっ」と騒ぐ海好きな私。[1]犬ってね～ほんと飼主の真似をするのですねぇ。だって、ほらね [2]で、しかもぽーさん。私の足をおもっぱ、踏んでいるのですけど[3]もう少し歩けば階段があるのだけれど、我慢しきれず鎖のない場所からビーチへと降りる。はしゃぐ私と（仕方なく）相手をしてくれる従順な犬たち[4]さすが！私との付き合いが長いぽー、嫌な予感は的中～そして呼ばれるがまま私のそばへとやって来た、従順バドくん。ひと泳ぎさせられるはめとなる。（泳げることの再確認なのですよっ）[5]こんなことしてたら、犬の信頼を失いかねないよねー ま、私たちは大丈夫だけどっ！！・・・ね？？だよね？？？そろそろ宿へ戻ってお昼ゴハンにしましょうか。屋台風のお弁当屋さんで、タコライスと100円そばをお持ち帰り。「100円そば」とは、沖縄そばと具の入ったカップに、熱々の出汁を注いでもらう簡単メニュー。沖縄のお弁当屋さんではけっこうお馴染みなメニューらしい。これがかなり美味しい！・・なのだけど、写真撮り忘れたランチタイムサービスでスープをつけてもらったり、タコライスのごはんをたっぷり詰めてくれたりとサービス満点。ほんと美味しかったのに、タコライスの写真が美しくない[6]お店の場所ですが。。恩納村の御菓子御殿～マンゴハウスの間、民家の隅に建てられた小さな屋台風の店舗でした。（ヒドい説明だ・・）満足な昼食を宿の中庭でとったあとは、ぽバドにライフジャケットの試着。おっ！バドくん、なかなか似合うじゃないか[7]でもこの後、おぇーとかなってたね。ベルト閉めすぎたかな泳ぎの得意でない犬種なこともあってか、念入りにライフジャケットを選んでくれるオーナーのゆーすけさんそれでも、大きめウィペットなこのコたち、なかなかぴったりと合うサイズがない。（次は手持ちのを用意しよう。え？次？！）というわけで、大きめぽーには大型犬用のセサミジャケット[8]んーライフジャケットを知ってるからか、表情がびみょーやねそしてこの後、ぽーが宿の中庭から早足で表通りへと脱走（宿は奥まった場所にあり、車も関係者しか入ってこないから安全なのだ）何事かと飼主２人で追いかけたら、おしっこタイムでした。ぽーってば、なんてかしこいのぉ～～～♪中庭はタイル貼りだから、土を目指して移動したわけですネ。[9]さてさて犬の準備はできました。お次ぎはヒトの準備。泳ぐような川ではないので、どんな服でもO.K.とのこと。うーむ。絶対にぽバドが川へ落ちるとみた。というわけで、水着の上にラッシュとショートパンツを着込む。午後からは雨が降り出しそうな空模様、だけど陽も時々射すので帽子も。出発の時刻まで休憩したら、いざ出陣ゆーすけさんの車の後をついて、金武町の億首川を目指す。（最終日にもこの川を訪れたので、地図はその時に載せる予定～）[10]・・・さて、と、はい。大抵の方はお分かりかと長い。調子に乗って長くなってしまったー読むの飽きるだろな～、などと心配しながら綴っていたこの紀行。昨日「おもしろいよー」「楽しみにしてるよー」と、とっても嬉しいメールやらを頂いて・・調子に乗り書き過ぎた～続きは、可能ならば今日中に更新できるようがんばりまーす",

    "text": "程なくして億首川の河口に到着。ゆーすけさんと一緒にカヤックを車から降ろす。ダイビングでもそうだけど、道具は自分で準備したいよね[1]なーんて、ほんの数メートルの距離を、運ぶのみなんだけどネ。あ・・それよりも、私は写真を撮ってるだけで何もしてなかったワパドルの扱い方、カヤックへの乗込み方、そして川へ落ちた場合の対処法などの説明を受ける。ボートは漕いだことあるけれど２人ともカヤックは初めて。でも、たぶん後方の人が重要なはずよね。というわけで、たっつー＆ぽーが後方に、私とバドが前に座って（ラクをしよう）がんばろう～（これ以降の写真はゆーすけさんから頂いたものです）[2]なかなか良い感じではないか。このままスイスイ～っと行きましょうゆーすけさん、私たちの優雅な姿をもっと撮ってくださいな～・・あれ？犬の数が増えている。３頭も飼ってたっけバドによく似たコがふたり。。。[3]はい！２枚の写真をつなげただけです～バドってば、ずーっと舟の上を行ったり来たりうろうろ。漕げません。ジャマになるわ、気になるわで、進まない見かねたゆーすけさんからの素敵なアドバイス。「１度、落ちてみたら嫌になって大人しくなりますよー」おぉ、なるほど！それはあるかも！！あ”・・でも、バドだからなぁ。（と、飼主２人同時に思う。そして、アナタも思ったはず。）したいがままさせてみたら、数秒で川の中へとドボンっ残念な事に落ちた場所は、バドの足でもつくような深さだった。仕方なく泥水と一緒に私の足元へと引き上げる（水着でよかったー）そしてナゼかまた、後方に居るバドくん。[4]そんなバドにぽーはうんざり。ぽーが叱ってみても聞きやしない。そしてまた直ぐにドボンと落ちていくバド。ここは深そうだなぁ～と振り返った私の目には、ナゼか川面に向かって落ちて行くぽーの後ろ姿。後で聞いた話だけれど、ぽーは落ちるはずのない状態で落ちたらしい。しかも必死で泳ぐバドを押していたらしい。ということは？ということは、そうなのだ！！ぽーはバドを助けようとしたのだ！！もぉ～ぽーってば、感動して涙が出ちゃいそうやん～でもねその後は、何度バドが落ちようと決して助けに行こうとはせず、びしっと良い姿勢で座っていたそうな（↓良い姿勢？？）[5]深いところで落ちようとも、やはり凝りなかったバド。舟の縁に足をかけたり、足元見ずに後ずさったり。そりゃ、落ちるよね。何度も、何度も。数えられないほど。ゆーすけさんもあまりのバドの自由っぷりに大笑い。落ちた瞬間に頭まで沈んだとき、「あ。。沈んだ」と思わず漏らしていた様子が可笑しくて、帰宅後も幾度となく我家でのネタになっていることは秘密です（ショック受けてないか心配してくれたけれど、んなこたーない！バドだもん。）そして目論みはずれ、私１人で漕ぐことになったぞー おかげで真剣に漕いだからチョット慣れたぞ。（写真のような体勢じゃたっつーが漕げるはずもないものねぇ。）潮が引き舟を進めることができなくなり、マングローブ（の森）を通り抜けることができなくなった私たち。だけどね、犬連れだもの。思うように行かないのが常なのだ。そしてそれもまた、ぽバドとの楽しい思い出になっている。引き返そうとした頃、スコールが降ってきた。いつもなら嫌がるような大雨なのに、戻ることが分かったのか。ぽーの表情がチョット和んでいるようにも見える[6]宿までの道のり、ずっと笑いっぱなしだったような記憶犬も飼主もシャワーを終えるとしばらく休憩。この日の夜には犬O.K.の居酒屋へと繰り出す予定。さてさて、長くなったし、もうこの際だ。さらに分割しま～すマングローブについても書いておきたいこともあるし。木の名前ではないのですょ～というわけで、つづく。。。",

    "text": "シャワーを終え、部屋で一息ついたとたんに外は雷雨。またしてもなんてラッキーなタイミング。沖縄滞在中ずっとこんな調子で雨の合間に観光ができているなぁ雨雲レーダーをチェックしたところ、２時間ほどで止みそう。犬連れO.K.な居酒屋さん、沖縄ダイニング 海の家へ電話をいれる。中型犬２匹（時々、大型犬扱いになるけど）＆大人２名、そして、雨が止んだ頃に行きます～とのんびり気分で告げてみる。そんなことを言われた店員さん、「えーと私たちも空模様を見ておきますけれど、一応時間知らせてくださーい。準備もあるので～」あ、、、ですよね～あまりにもまったりし過ぎて、てきとーになってマシタそして２時間後、予定通り雨雲は去り私たちは店に居る。外観を撮り忘れたのですが、店内から出入口に向かっての写真を。[1]海に沈む夕日を眺めながらの晩餐、そして木の床は犬たちの足にも優しくて嬉しい（写真がザンネンな出来だー）[2]私たちが居る間は他に犬連れ客は来ず、本来はとても気を遣う状況なのだけれど、テーブル同士の距離もたっぷりあるので、お酒が入って多少注意力散漫になってもそこそこ安心でしたお店スタッフの中で特に犬好きなおねーさんがいらっしゃり、手が空けばぽバドに話しかけてくれるほどの歓迎ぶり。おかげでぽバドも私たちも、のんびりとくつろげました[3]そして気になる料理ですが・・・これがまた、どれも量がたっぷりで沖縄もずくなんて、ラーメン鉢くらいの器に入ってました。注文した料理のほんの一部ですが、もずくにアオサなど天ぷら盛合わせ、泡盛飲み比べセット、そしてこれだけは何がなんでも外せない、海ぶどう～（もずくの天ぷら、帰宅してからも作ったぞー）[4]２時間ですでに食べ過ぎ、ぽバドも疲れてるし帰りましょう宿まで（車で）たった５分の距離を、快く承諾してくれた代行業者サン。その名は運転代行「元気」。次回もぜひお願いしますっ（え？次って？！）あ、ちなみに料金は８００円でした～帰宅後は・・あ、宿でした。そう、宿に戻ったら明日までのんびり休みましょう。ちなみにベッドの上は犬禁止ですょー だけど、ちょうどベッドの間はぽバドがすっぽり納まる広さなのだ。[5]カヤックに居酒屋と、得意ではないことに付き合ってくれてありがとうぽバドが一緒だから私たちはさらに楽しいのだょ～うん、キミたちもきっと留守番よりはいいよね？だよね？？[6]翌日はちょっと行っておきたい場所があるのだ。たぶん、というか、確実に観光地ではないのだけれども・・・（沖縄旅行の参考には全くならない場所だと思います～）後２日分（もしかしたらまた増えるのか？いや、どうでしょか。）、犬連れ沖縄紀行はもう少し続きます～あ、マングローブについて書き忘れてた・・また次の更新時に書くぞー",

    "text": "先ずはお知らせ。沖縄紀行４日目も分割になりま～す（分割しても長いぞー）４日目のとりあえずの予定順路は、OIST→おんなの駅にてbrunch→読谷やちむんの里（陶芸の里）→嘉手納基地→紗利真（生地屋さん）[1]さて、OIST（おいすと、と呼んでください）とは何ぞや？「沖縄科学技術大学院大学 Okinawa Institute of Science and Technology」頭文字を取ると『OIST』ということなのです。直接ではないけれど、私たち２人にとって縁のある大学。他のどの観光地よりも、テンション上がった気のする場所[2]（実はNAISTなるものもありまして、そこで知り合ったわけなのです）まず驚いたのがあまりにも広～～～～過ぎるその敷地。山１つが大学の敷地になっていて、谷を渡る為の橋まであったりする。[3]教員・学生の半数以上が外国人で、授業も研究も英語で行うそうな。地図には日本語があるけれど、それ以外の場所では全て英語表記。CAUTION venomous HABU snakes とかネ。何もかも規模がNAISTとは違い過ぎて、大きな立体駐車場があることにもテンションあがっちゃう[4]山の上だから、海も見える。そうそう堀もありましたョ。センター棟から研究棟への渡り廊下、なんなのこの長さと景観は（とか言いつつ、写真のメインが重機だったりするけれど）[5]学生の入学は今年秋からだそうで、学生宿舎を建築中でした。（今は研究員がすでにお仕事中）受付で申請すれば建物内の見学もできるそうですので、興味のある方、犬連れでない方はぜひどうぞ～興奮もしたので、さらにオナカすきました。OISTから車で10分、おんなの駅 なかゆくい市場へ到着。ここでも店舗外のテーブルを利用させていただきます。注文をたっつーに任せて、私はぽバドの世話を。あら、店の前にウォーターサーバーがあるじゃないか。ちょっとお水を拝借しちゃおう～バドはがぶがぶ飲み、ぽーはひと舐めしてみて嫌な顔。どうしたのかしらと思いボウルの中身をよく見たら、水ではなく麦茶でした[6]飼主たちはこんなメニューを選択。とろっとろ～な軟骨に、大人な風味の炙りアグー各店舗毎に味の異なる沖縄そば。食べ比べしたいけど、ソーキそばばかりはちとしんどいかな～（沖縄そばの中でも、豚あばら肉を乗せたものがソーキそばなのだそう）[7]そういえば、すっかり書き忘れていたけれど、初日に中城PAでも沖縄そばを食べていたのでした。かつお出汁のスープに、好きなだけのフーチバー（ニシヨモギ）を。あっさりめのスープによもぎの香りが最高でした～[8]で、後から知ったのですが、この『めん処 玉家』さん。第二回沖縄そば王決定戦で優勝した、地元では有名なお店だそうな。あら、取り寄せもできるワ・・・買っちゃおうかな満腹になったところで、読谷 やちむんの里へ。（公式HPが見当たらず、見やすそうなページのリンクを貼ってみました）おんなの駅からは30分強くらいかな、近いですねぇ。まずはシーサーとご挨拶 [9]ところで、沖縄滞在中に様々なシーサーと出会いました。個性的で可愛いシーサー達が、屋根や門の上で家を守る。そんな中で写真を撮らせていただけたものだけ、ご紹介～[10]ん？何かチガウの混ざってました？？ところで、やちむんとは焼物のこと。読谷やちむんの里、実は米軍の不発弾処理場跡地だったそうです。今では多くの窯元やギャラリーが集まる、のんびりとした小さな村こんな大きな登り釜もあったりなんかして、景色とギャラリーを楽しみつつ歩いたら数時間は経ってしまいそう。[11]里の奥までやって来たのだが、さらにその奥が気になり観光が散策へと早変わり[12]そろりそろりと忍び足で後をつけるものが居ることを、のんびりお気楽に歩く私たちは気がつかず・・・[13]お、珍しく、バドだけ気がついた。（私の無様は後ろ姿は見ないでネ）[14]その正体はブリンドルカラーのネコ～とてもヒト懐こいコで、犬を連れていないたっつーだけ撫でまくり[15]うーむ、ネコを触れなかったことを思い出したぞ。やさぐれ気分になったので、続きはまた次回～（ふてくされはモチロン冗談・・かもしれないない）",

    "text": "やちむんの里＆寄り道を終えた私たちは、15分ほど走って道の駅かでなへと到着。展望フロアから、米軍基地嘉手納の飛行場を見るが、建物内に入る必要があるためぽバドは車待機。蒸し暑い日だったので、たぶん滞在時間は１０分もない。それでも、touch-and-goの訓練を見ることができた（うーむ。私のカメラではよくわからないなー）[1]戦前の町の様子、米軍基地が出来たことによる影響なども、ここの学習展示室で学ぶことができます。そして、旅客機と戦闘機の音の比較を知ることができる５月15日は沖縄復帰の日。米軍関連施設の74%が沖縄におかれているそうだとか。これについて行われたNHKの世論調査。全国規模の調査で「おかしい」と答えたのは、沖縄県内での調査と比べると半分以下だったそうだ。私たちもそうだけれど、「観光」と「住む」ことの違い。沖縄県のHPから米軍基地マップを拝借。初日の記事でも書いたけれど、本島は（がんばれば）1日で1周できるのだ。[2]沖縄ではYナンバーの車がとっても多い。（平仮名部分がYなのです）これって米軍関係者が日本国内で調達した私用車なんですって。この後、向かうお店でも感じたけれど、米軍と経済は切り離せない関係なのだろう。だけれども、安全保障を考えるなら必要な場所が他にもあるような・・なーんて、知ったようなことを書いてシマッタさて、と、話をお気楽紀行に戻すとしましょう基地見学の後に行った場所は、生地屋さんの紗利真。恩納村のMANGO HOUSE（かりゆしウェア店）で教えてもらったお店。生地を購入して母にシャツを作ってもらっちゃぉ～、という魂胆だったのだが・・・よくよく考えると、徳島でかりゆしは派手すぎだった。なのでポケットやアップリケ程度にと、端切で購入。[3]上で米軍との経済うんちゃらと書いたワケですが、値段がyard単位だったのです。おまけに米ドルの値札までも。（国内では、生地1m辺りの金額で購入しまーす）で、周りを良く見たらアメリカンの親子連ればかり、というワケこの時点でまだ時刻は13時ころ。（お昼ゴハンどうしたんだっけ？）まだ時間もあるし、宿に向かいつつ残波岬へ行ってみることに。ところが、後部座席が何やら騒がしい。ぽーの機嫌が悪く、バドに文句を言っているのだ。「こらー起きろぉー マウントさせろ～」って。暑かったり、疲れてきたりでごキゲンナナメなご様子。ちょうど視界に良さげな風景が現れたので寄り道。そこは小さなざわわの道。（つまりサトウキビ畑と海が見える道）車も来ないしフリーで歩くとご覧の通り、キゲン直りました～[4]そういえば、こうして誰もいないところでのんびりと、歩いていなかったものねぇ。って、どこへ行くのお２人さん[5]調子を取り戻したところで、残波岬に向けて移動再開。約３０mの岸壁が2kmほど続く、東シナ海に面した岬なのだ。あわわわ、車を降りるなりハイテンションのぽバド[6]広い駐車場とフードコートなども設けられた残波岬周辺。そして、いこいの広場にはぽバドと同じ細身の動物が。[7]そういえば、ここでもドーベルマンと間違えられたのだった。バドから生えているのは残波岬灯台。登ることもできるそうです。[8]今ではのんびり平和な観光ができる場所ですが、1945年4月1日。米軍がこの岬を目印にして、読谷村海岸から上陸したそうだ。ちなみに1945年３月26日から沖縄戦となったようです。どこへ行っても戦争の影がついてまわる沖縄。バドみたく「バドだょ～」と、笑っていれば平和なのにねー（それは流石にちょっとアフォすぎ）[9]ちなみにぽバドの背後で明るい未来を指差す銅像。1372年琉球初、朝貢で明に渡った秦期（たいき）の像。豪族らしいですが詳細は不明、しかし「商売の神様」となったようですョ。スーパーでお惣菜とビールを買い込む。暑いのでエアコンかけて私とぽバドは車待機。そうそう、車を借りる際に尋ねれば良かったと思ったこと。それは、鍵を２本借りられないかということ。そうすれば、エンジンをかけたままぽバドだけで車待機できたのだ。車でたっつーを待っている間、バドは後部座席を占領。あーぁ、いつも遠慮しちゃってぽーは不憫な子。。[10]なんて思っていたけれど、しばらくして振り返って見たら立場逆転。しかもバドは足のやり場がなかったのか、後ろ足を首にかけたまま[11]あーぁ、バドも不憫な子だワ。。そうこうしているうちに、宿へと到着。そして旅行当日に更新した、ベランダでの沖縄最後の晩餐となるわけです[12]宿の近所を散歩したりもしているのですが、それらは番外編などで紹介しようかなと思ったり（また増やすのか）それでは、お次ぎはいよいよ沖縄最終日。（分割になるかなー、なるだろな。。）お時間ありましたらまた見にきてやってくださいませ～",

    "text": "いよいよ沖縄旅行も最終日を迎える。17:05発の飛行機、レンタカー会社へは15時までに。時間がやってくるまでは、のんびり沖縄を楽しもう荷物を部屋から車へと全て積み終えたら、オーナーのゆーすけさん＆看板犬ティーラと記念撮影（この様子は番外編にて～）そしてまず向かうは3日目にカヤックをした億首川。舟ではあまりにてんやわんやだったため、歩いてマングローブを眺めよう！という作戦なのだ[1]億首川河口へは宿から下道を走って３０分。マングローブを堪能したら、金武ICから高速を使い南部へと向かう予定。あいにく最終日は朝からしっかりな雨だけれども、やはりラッキー間もなく弱まるぞ。（雨雲レーダーcheck！）ほんの少し車で待機していたら、歩ける程度の小雨になった。[2]右手にはぽバドが泳いだ落ちた川、左手には田芋畑が広がる。手持ちのガイドブックには載っていなかったが、ここには宿泊や様々な体験学習のできる施設があるらしい。→ネイチャーみらい館マングローブの中には遊歩道が何本も通されている。（それぞれに見所があるようなのだが、雨のため制覇できず）[3]ところで、マングローブとは木の名前ではないそうな。熱帯や亜熱帯地方の海岸線や河口域、つまり、海水と淡水が混じり合う汽水域に生育する植物群の総称、らしい。沖縄本島では４種類のヒルギ科植物が見られるそうだが、なんとこの億首川ではそれら全てを観察することができるのだ（ちなみにオヒルギ・メヒルギ・ヤエヤマヒルギ・ヒルギモドキ）花の色や葉と根の形などで見分けるそうなのだが・・・[4]遊歩道にあった解説と、足元に落ちていた種を撮ってみた。樹上で発芽した後に、種（胎生種子）は川面に落ちる。干潮などによって泥地に突き刺さり、そしてようやく根を伸ばすことができるそうな。ちなみに「ヒルギ」を漢字で書くと、「漂木」なんですって。[5]満足したところで、沖縄自動車道へと向かい伊芸SAにてbrunchタイム。たっつーはアグー焼肉定食、私は（ナントカ）牛丼。レストランなのだが、自分達で運べば外のテーブルでの飲食可とのこと。[6]お肉の香りに惹かれているコは、この後、ベンチに顎を乗せたり、ぺたっと寄り添ったりしていた。肉をもらえず拗ねたのか～と思い笑っていたら、どうやらリードがベンチの足に絡まり動けなかったらしい[7]さて、ここからの目的地は喜屋武岬。その前に、座席をJクラスへ変更してもらうために空港へと向かう。（ツアー契約の場合、航空会社の窓口でないと変更できないらしい）[8]空港までは50km強ほどを走り、結局、隣同士の空席がなく変更できず。そして、電話で聞けば良かったのだと後から気づくバ飼主たち空港から南へと伸びる（小禄？）バイパスを通り、喜屋武岬方面へ。観光本の地図では、途切れている部分があったけれど繋がっていました。（上の地図、赤いラインで繋げてみました～わかりにくいかも）今から13年前の７月。家族と南部を巡ったことのある私。喜屋武岬への看板を見つけられず、四苦八苦して運転した記憶。ガイドの地図だけを頼りに海岸線の狭い道を走り、ようやく見つけたのはたしか、木の板に手書きの小さな看板。10年以上経ち、今はメイン道路の標識にも記されている。看板の指示通り脇道に入ると・・あ、なんだか懐かしい風景かも岬の手前３分程のところ、具志川城跡に立ち寄ってみる。（私も初訪問）[9]こちらは築城13世紀頃と推定される城跡。昭和47年に国の史跡として認定され、2000年から13年計画で修復作業を行っているそうだ（wikipediaより）そういうわけで、通路らしき部分にはシートが敷かれているのみだし、石垣の石は無造作に転がりどこが何やら状態。[10]喜屋武岬もそうだったけれど、GWにしては観光客が全くいない。なのでぽーだけフリーにして、片手を空け慎重に降りて行くたっつー。（バドは離すと崖から飛び降りかねないからね～）[11]人込みの苦手な私たち（ぽバドも）にとっては、穴場だったかも。そしてここからの眺めが豪快、且つ、オモシロイのだ。左手には珊瑚礁の面影残るごつごつとした岸壁。[12]右手に目をやると、潮が引いているためかこんな光景が。[13]もいっちょ大きな岩が波により浸食を受けている。[14]時間があれば、ぼ～っと眺めておきたい風景だった。・・・それにしても、13年計画って間に合うんやろか？？喜屋武岬は島民たちが米軍に追いつめられ、逃げ場を失って身を投じたことで知られる場所。海岸ではひめゆり学徒隊が集団自決しているそうだ。[15]13年前、ひめゆりの塔にある資料館で、学徒隊だった女性から様々な話を伺うことができた。配給のおにぎりが戦況の悪化とともに数が減り、ピンポン球サイズひとつが１日の食事となったこと。栄養不足により月経が無くなったことや、昼夜問わず看病した負傷兵たちのことなど。。。戦争当時は15～19歳だったわけだから、今は若くても82歳。私たちは時間がないこともありひめゆりの塔へは行かず。。もし沖縄旅行中に年配のボランティアガイドさんに出会ったら、話を伺ってみることをおすすめします。沖縄行きを考えているなら、１年でも早く訪れた方が良いかもしれない。さて、岬の駐車場らしき広場の脇を少し歩くと喜屋武岬灯台がある。初日の記事で載せた写真はここで撮ったもの。[16]と、それにしてもまたまた長くなっていますねぇ、この紀行。いつになれば空港に向かうのやら。まだまだ、つづきます～[17]",

    "text": "時刻は13時過ぎ、タイムリミットまであと僅か。ぽバドを連れて歩ける場所、というわけで平和記念公園へ。管理事務所で犬の入園について尋ねてみたところ、周囲に注意してくれればO.K.とのこと。（正しくは、咬まないようにと言われたのだが、何かあったの？）園内mapを開くと、とにかく広いということが一目でわかった。時間もないため「平和の灯」を目指して歩くとこに。[1]写真奥に見える石碑は「平和の礎」。国内外を問わず沖縄戦の戦没者24万人余の名が刻まれているそう。そして正確な犠牲者数は不明。途方もない数字だ。（マイナー地域比較だけれど徳島市の人口は26万人）[2]この広場の中央、写真中央に「平和の灯」があるのだが、平和学習の小学生たちが勉強中のため、遠くから眺めてみた。[3]あら？たっつーサン。子供たちからサインでもねだられているの？？[4]なーんて、ザンネンながら主役はそう、ぽバド～正確にはバドなんだけどネ。学習を終え、ぽバドに気がついた子供たちが集まってきたのだ。ここまではよくあることなのだが、それ以降がひじょーに楽しかった。まぁ、ぽーはひじょーに楽しくなさそうな顔してるけど[5]大抵は距離を置きつつ、あれやこれやと質問攻めにあうだけなのだが、沖縄小学生の反応はチガッタのだ。とにかく触りたいらしい怖がられてばかりだったので、それはとっても嬉しいだけれども、ぽーは小学生が怖いのだ。しかも、吠えてしまう。というわけで、安全を確証できる（時々びびりな）バドくんを[6]で、ここでたっつーが囲まれている写真に戻るわけなのです。見えないけれどたっつーの足元にバドがいる。大人気ぶりに怖がるヒマがなく、されるがままだったそうなひとしきりバドを撫でた子供たち。なんとお次ぎは、ぽーにロックオン「なんで吠えるの？咬まないなら触ってもいい？」えーと、えーと咬まないけどね、吠えたときに牙があたってケガすることもあるわけョ・・とかなんとか説明しているうちに、私とぽーの前には子供たちがずらーっと整列耐えきれなくなったぽーが、わわんっと吠えて解散となりましたそれにしても、こんな沢山の子供たちに撫でてもらえるなんて。おかげでバドはかなり子供慣れ、ヒト慣れした気がします思いのほか時間が差し迫っていて、すぐにレンタカー会社へ。（ちなみに、平和の灯はけっきょく見ていない）空港までは再び大型バスに乗込んでの移動となる。そして今回は、クレートに入れずに良いと言ってもらえた他のお客さんから離れた、最後尾の席に座りましょう。ぽーはたっつーの膝の上でおとなしく。[7]バドは私の膝上で窓から見える沖縄の海を楽しむ。飛行機もこうして乗れればよいのにねぇ（揺れた時とか、その他諸々のことを完全無視した発言デス）[8]那覇空港ではスマイルサポートカウンターでペットの手続きを行う。バドはきょろきょろわーぃぽーは「何かイヤな予感がする」と言っている。[9]嫌なことがあると、バドにマウントをすることがあるぽー。しかしだなー、ぽーさん。犬の行動だから仕方ないとはいえ、ココは注目を浴びる場所なのだ。飼主はチョット恥ずかしいぞ。[10]預ける時間（出発30分前）になるまで、トイレもかねて外に行こう。けれども2F出発フロアにはアスファルトしかない。1Fに降りれば緑があるけれど、降りる手段はエレベーターのみ警備員さんが1Fには犬のトイレもありますよと教えてくれ、同行のもとエレベーターへと乗込む。一緒に乗る事になった一般客にぽバドが無反応だったおかげか、戻るときは警備員同行無しでO.K.とのこと設備の整った空港だなぁ～と感動していたら、なんと犬のトイレとはこれでした[11]写真では読めないかもしれないけれど、「ペットの皆さん、ご使用はご遠慮ください。」とまで書いている。うーむ。せっかく案内していただいたけれど、補助犬のトイレ事情は知らないけれど、やめてねって書いてるし・・というわけで、植え込み探して移動しましたぷぃーんとひとっ飛びして、あっという間に場所は関空荷物受取所のほぼ中央部にある看板。ここで待っていればよいらしい。奥にある扉からきっと出てくるに違いない、とガン見しながら待つ。[12]飛行機に乗せておいてナンですけど、やはり姿を見るまで心配なのですょ。伊丹空港や青森空港では、手荷物よりも先に運ばれてきました。なのに、来ない。手荷物が流れ始めても、来ないのだ。ベルトの側で荷物を待つたっつーと、何度も目を合わせる係員さんにペットが運ばれてくる扉を尋ねると、目の前の扉ではなく看板から一番遠い場所だった。たっつーにジェスチャーで伝え、次はその扉をガン見。すると・・・開いたーっ！！！[13]心配で倒れそうになっていた私たちとはうらはらに、素敵な笑顔で「どちらのワンちゃんですか～？」と聞く係員さん。この待ち時間、関空ではデフォルトでしょうか。機体の大きさによっても変わるのか。あぁそんなことどうでもよい。ほんと、よかったーーー[14]そしてぽバドの様子は、行きよりも格段に落ち着いている。そういえば、ぽーは青森の際は到着時に鳴いてたものね。コレは・・いざというときは、また飛行機を使えるな（懲りないなー）[15] ＜4/28 関空にて＞さてさて、次回で沖縄紀行、完結となりま～す",

      "https://stat.ameba.jp/user_images/20120521/18/rinbelu/00/95/j/o0399026711985655924.jpg",
      "https://stat.ameba.jp/user_images/20120521/18/rinbelu/13/21/j/o0399026711985683336.jpg",
      "https://stat.ameba.jp/user_images/20120521/18/rinbelu/26/f5/j/o0400024611985683335.jpg",

    "text": "今回で沖縄紀行もラストとなりました～「完結編」というか、書ききれなかったことのおまけ編デス。ところで皆さん、犬連れ旅の時って散歩はどうしてますか？トイレのための散歩ではなく、のんびり歩く散歩のことです。（って、何のことやねんてね）観光などで十分な距離を歩いてたとしても、ぽバドと目的なくのんびり歩きたくなっちゃう私たち。そんな私たちなので、気になるのが宿周辺の環境。沖縄滞在中の４泊を過ごしたSurfside B&B。国道やバイパスから、脇道にちょこっと入った丘の上。袋小路にな場所のため、車の往来の心配もない。（写真向かって左が宿入り口）[1]宿の前の坂を数十メートルほど下れば、こんな場所。[2]上の写真から東南方面（写真手前）に歩くとすぐにバイパスへと出る。そして正面に見えるのは米軍基地のフェンス。[3]さすがにバイパスは車の往来も激しい。というわけで、宿から西北方面へ向かってみましょう～。真っすぐ歩くと200mほどで国道に出てしまうので、敢えて脇道へ。するとそこは畑の間を通る、まさしく求めていた道[4]住んでるとこと変わらないかも♪と、ぷらぷら歩いていると、宿から300mほどでローソンにも行けちゃう。（私たちにとっては近いのだ～）しかも宿からはこんな景色を楽しめたりもする、そんなお宿デシタ[5]さて、ぽーと挨拶を交わしているこのコ。[6]うざうざ兄弟のぽバドの勢いに、チョット困ってたこのコ。[7]先月５歳を迎えた看板犬のティーラちゃん。とーっても人が大好きで、たっつーに撫でられるその姿は、もはやラブラドールではなくなっている[8]そしてこの宿には隠れキャラのわんこがいるのだ。結局、たっつーはぶなぴちゃんには会えなかったのだっけか。私は会えたのだけど写真は撮れなかったー。次回だな。（え？次？！）友人が結婚式に招待してくれたからこそ、実行できた沖縄犬連れ旅。（それを私たちってば、あやうく。。。以下略）以前ぽーを乗せたフェリーに比べると、飛行機の方が負担は少ない。とは思っていても、やはり心配なのは変わらないのですけどね～それでも、沖縄へ一緒に行って良かったですョ次に沖縄へ向かうときは、時期をずらそうと考えています。（え？次？！）今年のGWは例年より涼しかったそうですし（タクシー運転手さん談）、スコールや曇り空のおかげで快適ではありました。だけれど、天気がよくなると初夏のような暑さなのですよね～さて、〆の写真はSurfside B&Bのオーナーゆーすけさんと。モザイク無しにしてみたら、写真も恥ずかしがって小さくなりました（んなワケないやろってネ。クリックで大きくなりまーす）[9]ようやく完結させられたけれど、終えるとなると寂しいかも長い記事を、根気よく読んでくださった皆様、ありがとうございました～！さ～て、次はどこへ行こうかな～",

    "text": "沖縄紀行を書き終え、２度目の旅から戻った気分です。ぽバドのリアルな日常を綴らずだった２週間ほど。彼らがどんな様子だったのか、先ずはぽーからご紹介～[1]何やら右肩付近を気にしているぽー。実はですねぇ、、、5月12日土曜。怪我をさせてしまいました。友達わんこ＆ぽバド、３頭そろって仲良く山の中へ。戻ってきたぽーの右肩付近はぺろーんと。。。[2]縫合が必要な怪我だと、一目で分かる状態。縫う場合はとにかく時間との勝負だと聞いていたので、たっつーが車を取りに走り２０分後には病院へ到着。十数針縫うことにはなりましたが、幸いケガは表皮だけ。そしてこれらの写真は抜糸直前のものなのです。ぴろんと飛び出たカサブタが気になるのか、痒くなってきたのか。だけど、びみょーに届かないらしくて苦労してます、ぽーさん。[3]抜糸までに必要な日数は飼主の管理次第で決定。山へ入るまでに止められず、ケガはもちろん飼主の責任。そして早く治してやるのも、飼主の責任。徹底して管理したぞーというか、本犬は傷口に届かないのだけどネ。ほら、諦めた～[4]ぽーの行動よりも、バドが舐めてカサブタ剥がそうとすることや、遊びたがって飛びかかるのを見張ることに神経費やしましたーバドの運動欲求を満たすため、別散歩をする毎日。そこでバドくん、新たな遊び＆技を覚えましたョ。それはまた次回にでも聞いてやってくださいな～そして今朝。近くへ行く用事もあったため、ついでにリハビリ兼ねて砂浜でひとっ走りさせてきました～しかも小雨で砂は湿っている。ラッキーなコンディション。（湿気た砂ではぽーがずりずりしないからなのだ～）久しぶりの砂浜は、とても楽しい光景になっていました。長～い砂浜の中央辺りでは、何台もの重機がお仕事中どうやら夏の海水浴に向けて、砂浜の修復をしているらしい。[5]手前のオレンジ色した重機。これ、ダンプカーなんですょ～普通のよくあるタイヤではなく、キャタピラ履いてるのです。クローラーダンプというのかな。こんなの初めて見た～～と、ととと、思わず話が脱線しちゃった。このダンプ２台が何度も往復しては砂を運んでいるのだ。呼戻しがきくとはいえ、さすがにここで遊ばせるわけにはいかない。なのでかなり距離をとってからフリーにする。無茶をしないよう、よーく観察しながら遊ばせてみる。２人とも嬉しそうだ～～～うむ、やはりぽーの身体能力が少ーしだけ落ちているなぁ。[6]で、バドの歯があたったのか、ぽーは歯茎からちょぴっと出血。ん～ぽバドのケガを完全に防ぐのはやっぱムリだな。というより、出血もすぐに止まったしこれはケガに入らないな。うん。やっぱこれだけ遊ばせて、しかも２頭だもんね。ケガするのも仕方ないワ。満足顔のぽバドを連れ、重機を眺めながら駐車場へ。たぶん私はぽーと同じ顔をしながら、重機を見ていただろな～[7]おっと、書き忘れていました。２３日水曜に無事に抜糸を終えています。傷跡も残りにくそう～",

    "text": "ぽーが怪我をしていた数日間のバドの様子は？包帯巻いて任侠風になったぽーの枕になっていたり。（すべすべ、ほんのりあったかくてきもちよさそぅ）[1]ぽーが病院に行っている間、寂しくてトイレシート破壊してみたり。（片付けの邪魔をするから、さらに隔離され中～）[2]寝ていたり。（詳しい説明は略～）[3]遊びたい盛りのバドは、体力を持て余していくばかり。「遊ぼ～♪」とおもちゃを飼主におしつけるバド。すると、思うように遊ばせてもらえないぽーが拗ねるというわけなので、ぽバド別々に散歩に出掛ける毎日。しかし、歩くだけでは満たされないバドの遊びたい欲求。そして反比例してすり減る飼主たちの体力ある日、ファミリー犬のブログを見ていて思い出した。そういえば。ぽーが数回遊んだきりで、放置していたアレがうちにもあるではないか～ それはコレ[4]ぽーも遊びはするのだけど持って帰ってこないし、訓練する根性も（飼主に）なかったので放置していたフリスビー→遊び方おもちゃ大好きバドならもしかして、ということで投げてみたら・・[5]持って帰ってきた！（手元ではなく、飼主の周囲２～３m以内にだけど）何度投げても、妙なくわえ方していても戻ってくるバド[6]教えてもないのに凄～い♪なんて、思ったけど、そういえばっ！飼主が投げたおもちゃを持って来るよう、屋内でも屋外でも意識して遊んでいたのでした～それがフリスビーにも反映されたのですねぇパピーの頃はおもちゃがあると独り遊びしかできなかったバド。→一緒に遊ぶと楽しいのだ。飼主やぽーと遊ぶと楽しいことを教えたくて、密かにがんばっていたのでした！（つまり、今はその理由をすっかり忘れていた）それが今や、遊びたい時にはおもちゃをおしつけてくるようになり、フリスビーも持って来れるようになっていたのだ～（手元じゃないけどね）[7]日頃の積み重ねって、こんな形でこんなところでも現れるのだなぁ。何よりも、持って来てくれると飼主がとってもラクなのですだけれども、フリスビー遊びには困ったことが幾つかある。それはもう、たいそうフリスビーが気に入ったご様子のバドくん。疲れようが、足が若干ふるふるしようが、キラっキララな目で、「投げてっもっと投げてっ」[8]飼主が意識して休憩させないと、いつか倒れるワ。・・倒れてもフリスビーを追いかけていそうだけどネそして、初日は地面に落ちたフリスビーを拾うだけだったのが、翌日には胸でトラップするようになり（サッカーもできちゃうかも）、今や数回に一度は空中キャッチを成功させるまでになりましたもうちょっと柔らかい素材のものに換えないと危険な予感なのです。というわけで、ウィペット向きなおすすめのものご存知でしたら、教えてやってくださ～い。",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
