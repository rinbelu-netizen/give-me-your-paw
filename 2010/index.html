<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey buddy, give me your paw! 絵日記帳 - 2010年</title>
<style>
  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --border: #e8dfd0;
    --text: #4a4238;
    --text-muted: #9a9082;
    --accent: #c98a5e;
    --accent-bg: #f5e6d8;
    --accent-text: #8a5a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  header {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 20px;
    text-align: center;
  }
  header h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0 0 8px;
    color: var(--text);
  }
.site-banner {
    width: 100%;
    max-width: 600px;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(74, 66, 56, 0.15);
    margin-bottom: 16px;
  }
    header p {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }
  .month-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .month-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .month-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .month-card .month-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
  }
  .month-card .month-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .month-card .month-count {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
    background: var(--accent-bg);
    color: var(--accent-text);
    white-space: nowrap;
  }
  footer {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <img class="site-banner" src="../banner.jpg" alt="Hey buddy, give me your paw! ぽー&amp;バドと徳島の砂浜にて">
  <h1>Hey buddy, give me your paw! 絵日記帳</h1>
  <p>ウィペットのぽー＆バドと暮らす日常あれこれ ― 2010年7月〜12月のアーカイブ</p>
</header>

<main>
  <div class="month-list">
    <a class="month-card" href="give_me_your_paw_2010-07.html">
      <div>
        <div class="month-name">7月</div>
        <div class="month-sub">2010年7月</div>
      </div>
      <span class="month-count">22件</span>
    </a>
    <a class="month-card" href="give_me_your_paw_2010-08.html">
      <div>
        <div class="month-name">8月</div>
        <div class="month-sub">2010年8月</div>
      </div>
      <span class="month-count">31件</span>
    </a>
    <a class="month-card" href="give_me_your_paw_2010-09.html">
      <div>
        <div class="month-name">9月</div>
        <div class="month-sub">2010年9月</div>
      </div>
      <span class="month-count">37件</span>
    </a>
    <a class="month-card" href="give_me_your_paw_2010-10.html">
      <div>
        <div class="month-name">10月</div>
        <div class="month-sub">2010年10月</div>
      </div>
      <span class="month-count">25件</span>
    </a>
    <a class="month-card" href="give_me_your_paw_2010-11.html">
      <div>
        <div class="month-name">11月</div>
        <div class="month-sub">2010年11月</div>
      </div>
      <span class="month-count">21件</span>
    </a>
    <a class="month-card" href="give_me_your_paw_2010-12.html">
      <div>
        <div class="month-name">12月</div>
        <div class="month-sub">2010年12月</div>
      </div>
      <span class="month-count">23件</span>
    </a>
  </div>
</main>

<footer>
  ウィペットのぽー、そしてバド・うめとの日々の記録。
</footer>

</body>
</html>
