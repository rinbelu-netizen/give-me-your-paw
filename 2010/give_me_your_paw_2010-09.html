  {
    "date": "2010.09.27",
    "title": "９月１７日 里帰り旅〜初日",
    "tags": [
      "ぽー",
      "出会い",
      "旅行",
      "2010年9月"
    ],
    "images": [
      "https://stat.ameba.jp/user_images/20100927/16/rinbelu/7e/d7/j/o0499039910770550445.jpg",
      "https://stat.ameba.jp/user_images/20100927/16/rinbelu/83/d7/j/o0499047110770550446.jpg",
      "https://stat.ameba.jp/user_images/20100927/16/rinbelu/5e/db/j/o0500033310770550447.jpg"
    ],
    "text": "予定走行距離 530km。目的地 犬舎。お宿 ぽー→犬舎。長時間ドライブのとき、悩むのがごはんをいつどれくらい与えるか。最近は酔うこともなくなり、どちらかというと空腹で吐くことが多いかも。という訳で、朝6時に普通の量を食べさせ8時過ぎに出発。車に乗れば寝ようとするのですが、やはり眠りは浅い様子。[1] なんだか態度がデカいですねぇ。今日は初めて私達と離れて、犬舎でのお泊まりです。疲れてる方が淋しがらずに寝られるよね～と、（実は必要なかった）心配をしつつ無事に犬舎に着きました。車を停めた途端、犬舎内からお迎えの声が。いつもなら建物内から吠えられると、中に入るのを少し躊躇するぽー。ところが、今回はなんとくんくん鳴いてさらに大喜び。（もしや覚えてるの！？）挙句、犬舎前でブリーダーさんと話していると、早くみんなのとこ行きたい～～と猛アピール。あまりの必死アピールで人同士の積もる話もそこそこに、先ずはフェンス越しにご対面。[2] それはこんな感じでした。もぉ、みなさん大興奮。後ろで取っ組み合いしてるし（笑）ぽーはというと怖がることもなく、やはり「早くみんなのとこ行くーっ」という感じ。これはもう大丈夫そう。てなわけで、いざ犬舎の中へ・・・後はもう、動き速すぎ＆私達も嬉しすぎで写真がぶれまくりです。[3] 体色がグレーぽいのがぽーです。しばらく遊ばせた後、犬舎にぽーを置いて夕食にむかいました。いつもなら「え～どこ行くの～ぴぃぃぃぃ」となるはずが、この日は全くの無視。私達が出かけたことすら気がつかなかったかも。甘えん坊がましになったかと心強く嬉しく思う。けれどなんか腑に落ちないぞぽーさん。環境の違いのせいか夜ご飯はあまり食べなかったものの、夜は鳴かずに大人しく犬舎で過ごせていたそうです。鳴き続けて迷惑かけちゃったり、ぽーが不安な思いをするよりはいいかな。第一関門突破でございます。翌日は、お昼過ぎまで犬舎で大騒ぎ。その後は第二の関門『フェリー』体験です。犬舎での様子を含め、続きはまたあした・・・",
    "truncated": false,
    "comments": []
  },
  {
    "date": "2010.09.27",
    "title": "９月１８日 里帰り旅〜２日目（犬舎編）",
    "tags": [
      "ぽー",
      "出会い",
      "旅行",

    ],
    "images": [
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/36/aa/j/o0500033310770650818.jpg",
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/7a/50/j/o0499048710770675439.jpg",
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/c8/bb/j/o0500033310770682186.jpg",
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/6b/f5/j/o0499035110770682185.jpg",
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/eb/09/j/o0500044010770675441.jpg",
      "https://stat.ameba.jp/user_images/20100927/18/rinbelu/7b/e3/j/o0499034910770696102.jpg",
      "https://stat.ameba.jp/user_images/20100927/17/rinbelu/b2/e5/j/o0500033310770682184.jpg",
      "https://stat.ameba.jp/user_images/20100927/18/rinbelu/c4/a1/j/o0500033310770714068.jpg"
    ],
    "text": "予定走行距離 215km。新日本海フェリー 7時間。目的地 新潟港→秋田港。宿 フェリー船内。2日目の朝。迎えに行ったら喜んでくれるかな。あんなに楽しそうだったし、犬舎から出たがらなかったらチョット哀しいねぇ。などなど、主人と話しつつ犬舎へ。実際はというと・・・私達の顔を見ると、一瞬明るい表情になり「ぴぃ～」で、その後はご覧の有様です。[1] ふつ～に混ざってる（笑）朝ごはんはあまり食べず、少し吐いたそうです。（掃除ありがとうございます～）でも、もうすっかり犬舎の一員みたい。ならば、と犬舎の子たちと同じように、ドッグショーでのポーズを取ってもらいましょう。ではぽーより2ヶ月年上のタイガーくんにお手本を見せて頂きましょう～[2] うーん、さすがっ！！こうして犬舎の子は遊んでいる間に毎日練習しているそうです～こちらは、ぽーのママ。ぽーさん成長して、とってもママ似なことが判明。[3] そしてぽーのパパ、めちゃめちゃ甘えん坊のゴッドマン。性格はパパに似たのかも・・うざいところも（笑）[4] 人の足の間に入ることが好きなこの子はレティ。ぽーのおばあちゃんです。[5] そしてこの渋い子はおじいちゃんのハマー。実は私、ハマー大好きなんです。[6] 他にも紹介しきれなかった子が居ます。以前はわかならなかったのですが、みな個性豊かで特徴盛り沢山。そしてぽーの兄弟親戚に会えること、改めてシアワセだなぁと感じました。私達が初めて『ウィペット』に出会ったのもこの犬舎。ぽーを迎えに来たとき、この子たちに出会って思ったこと。それは「ウィペットって、けっこう大きいかも！」でした。ところがぽーと一緒に里帰りして、「みんなこんなに小さかったの！？」とびっくり。まぁご存知の通り、ぽーがでかいんですけどね～ぽーが太っているのではなく、『健康的に大きい』だけですので問題無し。[7] 手前から ぽー、たんぽぽ（妹）、ゴッドマン（父）です。遠近法のせいでぽーが大きいかも？いえいえ、これをご覧下さい。[8] ぽーさん1人だけなんかチガウ。普段そばに居るのが一頭だけだと判らないものですね～。ウィペット特有の（？）癖など気になることも尋ねたりして、とっても有意義な里帰りになりました。ぽーも楽しかったようですし万々歳。しかし今回の記事が長過ぎて、新潟港に着けそうにもありません～過酷なフェリー旅はまたあしたということで・・・",
    "truncated": false,
    "comments": []

    "text": "予定走行距離 215km。新日本海フェリー 7時間。目的地 新潟港→秋田港。宿 フェリーあざれあ。物怖じ知らずのぽーさん。すっかり犬舎の子になってしまったので、みなと遊ばせておいて私達はお土産屋さんへ。さらに地元産豚のとんかつに舌鼓。[1] 柔らかくてジューシーでこれが豚肉！？という美味しさでした～そして、ついに犬舎を後にする時刻がやってきました。嬉しかったのは初めぽーに吠えていた子たちが、「あれ？どこ行くの？」と寂しそうに鳴いたり追いかけてくれたりしたこと。また近いうちに帰りますよ～出航時間は23:30。ぽーもいるためかなり余裕を持って新潟港近くに到着。先ずは昨晩今朝と小食だったぽーのごはんタイム。がっつり食べました。立ち寄ったのが『新潟県立鳥屋野潟公園』ここはめちゃめちゃ良い公園でした。犬の散歩もO.K.で、専用水飲み場なども設けられています。広くて整備もきちんとされていてスバラシイ。木立の中にこんな小川があり、探検気分も味わえる。[2] 後ろに見えるのが公園の名称にもなっている「鳥屋野潟」さすが新潟県。これが県立の公園だなんて～とびっくりでした！[3] さてさて、乗船時間は22:50。ネットで予約済みのため、さくっと受付を済ませ港にて待機。[4] 同乗者の私とぽーは別の入口から乗船のため、主人とはしばしの別れ。ぽーはもちろんフェリー初挑戦。そして私は犬を連れての乗船は初めて。乗り場まで行くのもどきどきですよ～熱～い視線を感じつつ、みなさんが乗り終わるまで待つこと数分。[5]「よしっ！行くぞっ！！」エスカレーター、17kgのぽーを抱っこして登りました～やはり鳴き声を考慮してか、ペットルームは船尾のかなり奥。左手に見えるドアがそうです。航行中のペットの居場所はここのみというルール。[6] 船内受付の営業時間内ならばいつでも、ケージの鍵を受取り犬の様子を見に行けるというシステム。今回は23:30～5:50までの航海ですが、終日営業とのことでした。でもね、ただでさえ「ぴぃぴぃ」ぽーなんです。側にいると絶対、諦めてくれない。しかも私達も眠れない。心を鬼にしてケージに入れなければ。ケージの素材はたぶんステンレス。H67×W57×D90。大きめのぽーですが、それでもゆったりサイズです。色んな子が齧ったんでしょう、扉付近には歯形や凹みが。トイレや食事のための通路は巾90cmくらい。中央のケージ2つは棚が歪んでいて、少し傾いていました。そのため歪みのない一番奥、下段のケージを利用。一番手前には、黒柴さんがいます。ぽーの手が見えてる・・主人が手を近づけると、ぎゅぅ～っと握られたそうです。[7] ペットルームのドアを閉めた途端、「ひぁ～ん！ひゃぁ～～～ん！！」・・・・・柵を齧って歯が折れないだろうか、柵の間に首がはさまって・・・悪い想像が尽きません・・・ぽーも我慢、そして私達もガマンです。でも、しばらくしてこっそり部屋の前までは行っちゃいました。部屋が見えない位置からも声が聞こえていたので、もしかしたらずっと鳴いていたかもなぁ。港で待っている間に、犬を車内に残すという人に出会いました。航行中は車両甲板に降りられません。ペットルームのケージよりは、車内の方が広いし慣れているかも。でも車両甲板の空気の悪さを考えると、うーん・・・車両甲板への立入りを許可してくれる場合がある、と個人のHPで紹介されているものを出発前に見つけていました。でも新日本海フェリーは原則禁止なのですよ。犬連れにとって嬉しいのは、やはり「一緒」ですよね～小さな子ならキャリーに入れて、船室まで同船できる会社もあるそうです。部屋まで連れて行ければ、飼い主も犬もゆっくりできるのになぁ。で、私達が利用した部屋はというと・・・長距離ドライブということもあって、なんと「特等和室」にしてみました～。[8] 荷物が美しくないなぁ。ユニットバスや浴衣、アメニティもついています。しかし・・・古い。床の間の壁紙はがれちゃってるし。プライベートが保たれるのは良いですね～窓に障子があると普通の宿みたいですが、開けるときちんと「船の窓」[9] 翌朝は4:50頃に部屋鍵の回収が来るそうです。ほとんど寝れないじゃないか。鍵の回収前にぽーを見に行こう、と目覚ましをセットしてなんとか眠りについた私達でした。どうかぽーも眠れていますように・・・・",

    "text": "予定走行距離 150km。目的地 青森の実家。宿 もちろん実家。揺れのためかぽーが気になってか、寝たのかどうかわからないままの4時。ぽーを見に行くとぜーぜー言っている。確かにペットルームがちょっと暑い。給水ボトルを置いたのだけど、外れてしまっていました。すぐに水をあげるとかぷかぷ飲む。緊張もあってのどが乾いてたかな。隣の黒柴さんも暑そう。ケージの外から水を差し出したけれど、飲んでくれません。（飼い主さん早く来て～）[1] この子は苫小牧まで行くそうです。がんばれよ～いよいよ秋田港到着。ぽーは車に乗った途端、爆睡開始です。やはり眠れなかったのかな～。しばらくしたら意外に元気。私たちと一緒に居られて安心したのが大きいのかもですが。もしかしたらまたフェリー利用出来るかな・・・それにしても、雨は降ってるけれど、陸地ってスバラシイ～[2] 主人の実家、家の中で犬を飼ったことがありません。それなのにぽーを連れての帰省です。ほんと恵まれています、私たち。犬か、鹿か、ハイエナか、と話題だったぽーさん。体の大きさにすこし驚かれつつも甘えんぼうだったり吠えないことから、かわいい～とやっぱり人気者。2歳の甥にとっては、ちょっと怖い存在のぽー。でもね、こんな感じで一緒におもちゃ見てます。[3] 実は甥っこは気がついてないだけなんですけれどね～（笑）3日前、この子の弟くんが誕生しました。そこでぽーを実家に置いて会い行くことに。まだね、お互いに慣れていないので、ぽーさんはバリケンで大人しくしてもらいましょう。寝ぼけてるせいか、静かにしているぽー。これなら安心ね。出かけてしばらくすると、実家からSOSが。。ぽーがあまりに悲痛な声で泣くので、かわいそうに思ってバリケンから出してくれたそうです。ところが！！ぽーさんみんなに向ってわんわん、玄関にむかってぴぃぴぃの大騒ぎだそうで・・・ぽーが寝ている間に妹夫婦などなども集まり、実家の人口密度が増していました。起きたら私たちはいない、知らない人が居るわで、パニックになったようです。もう少しのんびりしてから出かけるべきでした。しかし数時間後にはすっかり慣れて、家族と遊んで夜ご飯もがっつり食べたぽー。ぽーと一緒の里帰りはこうして順調に進んでいます。",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
