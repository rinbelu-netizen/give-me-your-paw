    "text": "目的地目前で迷っていた私たちを、ブリーダーさんが発見してくれ無事に犬舎に到着。さぁ、いよいよ対面です。な、なんだ、この子たちは。かわいい、かわいすぎます。写真で見るより遥かにかわいい。[1]（感動のあまり写真がヒドい）ぽーの兄弟たちに群がられ、髪をかじられる。おなかをみせてひっくり返る子を撫で回す。もう言葉通り、人も犬も『わーわーきゃーきゃー』状態です。肝心のぽーはというと・・・少し寄って来てはするりとかわす。甘えたかと思うとまたまたスルリ。なんだかもじもじしていて、私たちも同じくモジモジ。ブリーダーさんもそんなぽーの様子に、「なんだかいつもと違うなぁ（笑）迎えに来たのがわかったのかな～」お見合いってこんな感じなのかしら～なんて思いつつ、他の子を撫でながら、視線はぽーに釘付け。夜遅くまでわんこ談義に花を咲かせ、翌日もぽーを含め子犬や大人の子たちとしっかり遊ばせて頂きました。「どうですか？ぽーのこと気に入って頂けました？」き、気に入らない理由なんてありませんっ。そんなこんなの「ぽーとの出会い」シリーズ、まだもう少し続くかもです・・・[2]『ぽーのお父さん（向って右）』筋骨隆々でかっこいいんです。とくにおしりの筋肉たまりません。[3]『ぽーのお母さん（向って右）』とても育児熱心なママ。これからのぽーの世話は任せてね。中央は弟くん、左はぽーです。",

    "text": "週末のこと。『龍馬伝 特別展』のチケットを母からもらったので、ふらっと出かけることにしました。高知まで行くとなると一日仕事です。ぽーは自宅で留守番か、とも考えたのですがなにせこの猛暑。もしエアコン切れたら～～などと気になって観光どころでないので、連れて行くことにしました。ぽーは高知で評判の良い動物病院にて、預かってもらうことに。初めての「知らない場所」での半日預かり体験です。たいていの子たちは、動物病院キライですよね。ぽーはどちらかというと『好き』なんです。ワンコや他の動物たちに会えることが楽しいようで。病院に着くとぽーは、いつものように他のわんこたちに興味津々。看護士さんたちはみな、動物好きそうでひとまず安心。ゲージ見学かねて、診察室の奥へぽーと一緒にGO。ゲージは病院によくあるもので、一番下の段でした。ぽーのバリケンより広い。自由にはなれないけれど、まぁなんとか我慢してもらおうかなぁ・・・などと考えつつぽーを見ると、何かを察知したらしい。尻尾をおなかにつけて後ろ足がくがく。ふむ。ぽーはけっこう記憶力が良いんですよね。ここでムリに入れると、ゲージが嫌いになるかも。しかも病院も嫌いになってしまうかも。看護士さんたちにお願いして、ちょっと時間を頂くことに。ここで、ぽーをゲージに入れるための秘策を初公開！それは、私がゲージに入っちゃう。ふふふ。過保護かもですけれど、この方法かなり効果あるんですよ。嫌がったり怖がったりしている所に私が先に行くと来るんです。案の定、ぽーも入って来ました。2人でゲージに腰かけ、入口前で主人が落ち着く。震えも止まり、顔つきも穏やかになってしばらくしたところでそっとゲージを離れました。さらに離れると、さすがに鳴きましたがヒドくはない。看護士さんたちから「大丈夫よ～ちゃんと迎えにきてくれるよ～」と声をかけられ鳴きかたも控えめに。あとは振り向かず、観光に繰り出した私たちでした。迎えに行ったときの様子はまた次回にでも。どんな方法が一番よいのかはわかりませんが、結果としてぽーの初預かり体験は成功したかな～何事も経験と慣れですよね。過保護気味だと自覚もあるのですが、やはり最初が肝心かと。そんな感じでこれからも、色々チャレンジしていきますよ。ぽーさん、覚悟してね[1]",

    "text": "週末のことの続き。四国統一を目指していた長曽我部氏、幕末の志士たちの偉業にふむふむと相槌を打ち、藁焼きかつおに舌鼓を打っていたぽーのお預けタイム。[1] 病院に迎えに行くと、意外と落ち着いている様子。看護士さんがゲージを開けるとき、飛び出しを防ぐため部屋の扉を締めていましたが、これまた大人しくリードをつけてもらっています。う～ん、良い子ではないか～私たちの手にリードが渡るとそそくさと病院を出ようとしたり、わたしの足の間にばふっと頭を挟み込んだりしてましたけどね（笑）ちょうど陽も落ちてきてすこし涼しくなりました。4時間の閉じ込めストレス発散もかねて、南国SAドッグランへ。友人から聞いていたのですが、ここは水飲み場や専用ゴミ箱などが設置されており、足を洗うためのシャワーまでついています。草が少し伸びていたけれど、広さも十分。しばしの間、貸し切りでのんびりリラックス。[2] そこへヨークシャテリアを連れたおばさまがやってきた。わんこ大好きぽーを抑えつつ、2人が入って来るのを待つ。するとそのおばさま、ぽーを見るなりわんこを抱き上げた。まぁ、よくあることです。ぽーの風貌からか大きさからか、慌てて我が子を抱き上げる飼い主さん。「こんにちは～うちの子、わんこと遊ぶの大好きなんですよ～」（たいていこれで安心してもらってます）でもなぁ、なんだかぽーの様子がおかしいぞ。いつもと違い、そわそわ落ち着きがない・・・「そのこ男の子？うちの子、生理が終わったところなのよ～」・・・・・なんですと？いま、なんとおっしゃいましたか？犬は出血が止まってから本格的排卵開始でなかったっけ？今まさにオトコの子、おっけー期間じゃないですか。何故そんな状態の子をランに連れてくるんですか。ラン内から出る気配もないおばさま。ここに居てもぽーがかわいそう。なんだか腑に落ちないまま、ランを出ることにしました。ぽーを中央に3人で歩いていても、初預かり体験、かつお、龍馬まで全て吹っ飛ばすイヤな気分。ぷんすか憤慨しながら歩いていると、ぽーがにこにこ顔で私たちの手を交互にぺろぺろ舐める。・・・そっか。ぽーにとっては病院から出られて、私たち3人一緒にいられることが何より嬉しいことなんだ。ぽーのおかげで「今日は楽しかったね～」と笑顔で、帰路につけた私たちなのでした。[3]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
