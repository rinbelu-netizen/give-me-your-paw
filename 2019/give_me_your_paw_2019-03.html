<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey buddy, give me your paw! 絵日記帳 - 2019年3月</title>
<style>
  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --border: #e8dfd0;
    --text: #4a4238;
    --text-muted: #9a9082;
    --accent: #c98a5e;
    --accent-bg: #f5e6d8;
    --accent-text: #8a5a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 16px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .controls {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-btn {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
  }
  .tag-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .count {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .entry-title {
    font-size: 16px;
    font-weight: 500;
  }
  .entry-date {
    font-size: 12px;
    color: var(--text-muted);
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
    margin-bottom: 12px;
  }
  .photo-grid a {
    position: relative;
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: var(--accent-bg);
  }
  .photo-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-grid .num {
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 1px 5px;
    border-radius: 8px;
  }
  .no-photo {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .truncated-note {
    font-size: 12px;
    color: var(--accent-text);
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 6px 10px;
    margin: 0 0 12px;
    display: inline-block;
  }
  .entry-text {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 12px;
    white-space: pre-line;
  }
  .entry-text b {
    color: var(--accent-text);
    font-weight: 500;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--accent-bg);
    color: var(--accent-text);
    cursor: pointer;
    border: none;
  }
  .comments {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .comments-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .comment {
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-bg);
  }
  .comment-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .comment-meta .author {
    color: var(--accent-text);
    font-weight: 500;
  }
  .no-results {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Hey buddy, give me your paw! 絵日記帳</h1>
  <p>ウィペットのぽー＆バド（＆うめ）と暮らす日常あれこれ ― 2019年3月 ※ss-blogブログ・archive.orgより復元</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="キーワードで探す（例: 震災、ドッグラン、うみちゃん）">
  <div class="tag-filter" id="tagFilter"></div>
</div>
<div class="count" id="count"></div>

<main id="main"></main>
<p class="no-results" id="noResults">該当する記事が見つかりません。</p>

<script>
const entries = [
  {
    "date": "2019.03.29",
    "title": "品川台場。",
    "tags": [
      "出掛ける",
      "2019年3月"
    ],
    "images": [],
    "text": "快晴の2019年3月21日のこと。\nぽー&バド、なんとお台場にやってまいりました〜！\nその目的はショッピングやグルメでもなく、ましてやバドの向こうに見えるレインボーブリッジでもなく・・・\n続きはこちらから〜↓\nそれはズバリ、「品川台場」 ですっ！\n品川台場とは、江戸防衛のため江戸幕府が築いた海上要塞。\n1853年のペリー来航を機に幕府が計画した台場の数は11基。\n土を海上に運び、人工島を造り、砲台を立てるのだ！ペリーが再びやって来る1年後までに造るのだーー！！\nそして翌年、ペリー艦隊が品川沖近くまで来た頃、完成していた台場の数は僅か5つ。\nこれはあるアプリの江戸時代の地図。海の上に浮かぶ黒い点々が台場。江戸城を護る位置にあるのがよく分かる！！\nこの倍の台数が欲しい！と思うけれど、それでもすぐ側に砲台は嫌ですよねぇ。\nペリー艦隊は江戸城近くに停泊することはせず横浜まで引き返し、そこからのペリー上陸&交渉となったそうです。\nあるアプリのこの地図、江戸の様子を現代の地図と重ねて見られるのです。そのアプリのリンク貼っておきますー「大江戸今昔めぐり」\n左は古地図に現代の地名等を重ねたもの、右は現代の地図と古地図を重ねたもの。現代では殆どが埋立地の一部となり姿を消していることもよく分かります。\nだけれども、二つの台場が国の史跡として遺されているのだ！\nそして、なんだか前置きが随分と長くなったけれど、史跡公園として整備された品川台場、そこが私たちの目的地なのでした〜\nお出かけ楽し〜♪と歩く、ぽバドの後ろに見える緑地を目指します！\nお台場海浜公園を通り抜け、台場公園に向かっててくてく。\n台場への入り口までやってきました。目の前には立派な石垣。\n補修はしているけれど、当時のままという石垣。海浜公園側の布積みと海側の乱積み。なぜ積み方が違うのかーーわからず。\n階段を登り、土塁の上へ。この写真に写っているのは1/3かそれ以下の範囲です。あまりに広くて入りきらない〜\n土塁下へ降りてからパノラマで撮ったものを。見え辛いけれど、右のほうにぽーとたっつーがいます。\n正面にあるのは陣屋跡。それにしても、こんな大きさのものを1年で5つとは！(造りかけの台場も含めると合計7つだそう)\n周囲には弾薬庫跡や建物があった痕跡など色々と。こちらはかまど跡。江戸時代のものではなくレプリカだそうな。\n再び土塁の上へ戻る。これまたレプリカだそうなのですが、砲台と後ろに見えるレインボーブリッジがなんとも不思議な感じ。\nせっかくだし、ぽバドの記念撮影をしておこう♪\nせっかくだし、バドと背景で遊んでみよう♪♪♪\n土塁には何本も下へと降りる道があり、そこから登ったり降りたり。けっこう高さがあるのでなかなか良い運動にもなります笑\nこの階段を降りきった右手に波止場があり、そこが当時の出入り口。\n封鎖されている上に草が茂ってわかりづらい。なので、上から見てみよう。\n石垣と波止場に、橋とビル群。現代と昔の入り混じった光景、好きだなぁ〜\nここから視線を左手方向にやると、当時の姿そのままに遺されている第6台場が。\n立ち入り禁止だけれど、レインボーブリッジの遊歩道から見ることができるとか。行きたい。だが、暑い！ぽバドに無理させたくないのでここで終了〜(遊歩道ではケージやカートならばペットの通行可とのこと）\nぽバドと江戸散策 、本格的に暑くならないうちに次はどこへ行こう。",
    "photosLost": true,
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
