    "text": "ある日の正午頃、ぽバドは汐入駅前におりました。\nそして駅前の地図看板にはこんなメモが貼られておりました。\n続きはこちらから〜⇩\nぽバドと一緒に汐入へ行ったのは、実は3月28日のこと。\n25日に横須賀港へ就航したばかりのコレを見に行くためなのデシタ。\nコレとは、護衛艦「いずも」〜っ！！  今回は遠くから眺めるだけー。\n写真をまとめてはいたものの、ずーっと書きそこねておりまして。　　『マダカ？ 日の目を見る日はくるのか？』と、写真フォルダがデスクトップでずーっと訴えておったのですョ。\nというわけで、ようやく、書けましたん〜〜！＼(*^▽^*)/ﾜｰｲ♪\n「いずも」は遠くからでも、大きかった！ステキやったー♪\nちょうどこの日の2週間ほど前には、友人のおかげで「ひゅうが」の内部まで見学♪むふふ〜面白かったなぁ〜♪♪♪　→　鉄塊見学〜前編。　〜後編。\n「ひゅうが」見学時には、ぽバドはほとんどが車で留守番。三笠公園の方へは以前に歩いたので、今回は汐入の南側を探索してみることに。\n東海道から浦賀へ抜けるための「浦賀道」なるものがあるらしいのデス。・・・という情報はあとから知ったもので、　　　　　　　この日はとにかく南側を目指してみたわけです(笑\n踏切を渡り、いかにも山を削ってつくりました！という感じの急斜面の住宅地へ。\n『道』は必ずどこかに繋がっているのだ！という気持ちで歩く(笑\n全体図が撮れてないからココでイメージを伝えられないけれど、 とにかく道も狭いし傾斜もきつい。(←そういえば、こういうの多いわね笑)\nが、この付近の家からの見晴らしは絶対に最高だとオモウ！！\n基地を隠すためなのか、道沿いには胸丈くらいの生垣があるけれど、背伸びをすれば「いずも」を見ることもなんとか出来るなり♪\nさらに道を行けば 登れば、「うらが道」の案内をはっけん。\n頂上付近に行けば見晴らしもよくなるかと思いきや、やっぱり生垣はあるよネ。\n写真中央に潜水艦が見えまする。ん〜この付近にトモダチがいればナー。　おうち訪問させてもらって景色を眺めたい・・・ｴﾍ♪\nそれにしてもこの付近は道や石垣など、年季が入った雰囲気で面白い。ということで、帰宅後に調べてみたらばなんと。\n海軍用地として使用されていた頃のフランス式レンガ積みの壁や、関東大震災後に有り合わせの資材で補修した壁があったりと、 それは実に歴史深い地域だったらしい！\nそして下の写真でたっつーがこれから歩こうとしている道も。\n『久松橋』という明治10年の道標が遺されている古い橋なのデシタ！\nその道標は降りきったところにあったようなのだけれどその時は気がつかず...だが、しかし！写真はかろうじて残せていたのだ〜♪\nそれはこの道を支える柱がとてもコワイ状態なことにたっつーが気付いたから。　確かに『橋』ですなぁ。それにしても、補修はせんのやろか...\nさてさて、さらに先へと進むと細く長い石段が。　　どうやらこの階段を登った先にお寺があるっぽい。\n気になる。行きたい。でも犬を連れてるしなーと悩んでいたら、偶然にもこの階段途中のおうちに住んでいるという方とお話ができまして。\nなんでもそのお寺では洞爺丸の犠牲者を慰霊しているとか。洞爺丸といえば青函連絡船。つまり、青森。 それはやっぱり参拝しておきたい。(実家が青森ですからねん）\nというわけで、こちら『萬蔵寺』さん。\n石段を登った先に建っているお寺だけあって、とても見晴らしの良い場所。洞爺観音菩薩の背景はスッキリ青空で。\nお参りのあとは、ふもとへ向かいましょー\n途中で通りかかったBBQグリルのあるアメリカナイズな庭では、年老いたピットブルさんが日向ぼっこ。ん〜汐入オモシロイ。\nふもとまで降りたらば、ぷらっと歩いてどぶいた通りへ。        (今回は案内図を写真に撮ったった！！)\nネイビーバーガーを食べてみようということになり、お店を探しつつうろうろと。ココ、『モアイモ食堂』で take out に決定〜！\n店内はイヌNG。待っている間どうぞと出して頂いた椅子に座る・・・　　と、やはりたっつーの膝に座りたがるぽー。　どう見ても、不安定デス(笑\n三笠公園の近くにあるベンチで頂きまーす！私はタコスを頼んだような...ここのネイビーバーガー、また食べたいなぁとこの間から我家で話題になってマス。\n三笠公園のトイレを借りぽバドの元へ戻らずに、　建物の陰に隠れてみた私を慌てて追いかけてくるバドの図(笑\nそうそう、ダイエーの駐車場に車を停めたのデシタ。どぶいた通りの鞄屋さんで買物をしたら無料駐車券をもらったのデシタ。\nポートマーケットで魚を買って、ディアラ横須賀店に行ってみたのもこの日だったかしら。 なんでも汐入付近では空き家を貸し出す取組みを行っているとか。　　・・住んでみたいナー。でも車を置く場所に困りそうなのよねー\nと、何を言っているんでしょね（笑\nと、そんなこんなの今更な3月の思い出記録♪",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
