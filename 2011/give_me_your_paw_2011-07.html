    "text": "相方の友人から近況報告がきました。彼と会ったのは３年前だったかもっと前か。全く違う分野に進んでいたけれど、動物好き・犬好きが嵩じて『犬の訓練士』へ転身した彼宮城県仙台市にあるドッグカフェでしつけ教室を開いています。今日はそのカフェの話題にお付き合いください。と、同時にこの話題とは関係のないぽー画像を[1] 私はその店を訪れたことがありません。そのためこれから書くことは、友人から聞いた話や店のブログに書かれていた内容などになります。カフェは山の中にあり広いドッグランもある。そのランの片隅にはプレハブが十数棟。（もちろんエアコン完備）そこで生活をしているのは家族と一緒に住めないペット達。そして飼主がわからないままの保護された犬猫たち。７月７日の時点で２５２頭。そう、東日本大震災で被災した犬猫達です。友人を含め彼らは動物保護団体ではありません。ドッグカフェやラン、しつけ教室を経営しつつ、Ｍシュナなどのブリーダーをしているお店なのです。犬が好きで、動物が好きで何かしたい。友人もこんなに頭数が増えると予想していなかったそうです昨今「動物保護」といえば悪い噂がついてまわり、正直にいうとすこーし心配していました友人が居る場所だからこそ、ブログを隅々まで拝見し他サイトからも情報を集めちゃいましたそしてようやく今日紹介することにしたわけです[2] コトバを使って多くは語らず、その代わりに犬猫たちの写真で埋め尽くされたブログ。それは家族を預けている飼主さんに見てもらうため。飼主がわからず「仮名」をつけた子の本当の名を知るため。写真は語ります。カフェに来た当初は不安げな顔だった子も皆、表情が明るく活き活きとしているのです。飼主さんがお迎えに来たときの表情にかなうものはないですけれど保護され飼主不明の子達の情報がこちらにあります。→ここにいるよ＆あいたい津波に流されたのか泥まみれだった子。人気のない町中をうろついていた子。飼主に会えないまま亡くなってしまった子。写真とともに保護した場所や状況。体重など身体的特徴、性格などが記されています。同時に行方不明中で飼主が探している犬猫の情報もあります。「亡がらでもよいので連絡してください」私もリンが半年間行方不明になったとき同じ事を思いました。しあわせなことに彼は元気に帰ってきてくれたけれど。もし心当たりがあれば、どんな些細なことでもよいので連絡をお願いします。一日でも早く飼主が見つかりますように。そして迷子の子たちが家族と再会できますように。なによりも「日常」が彼らに戻りますように。[3] 預かりや保護することになった状況。被災地でのペット事情など。こちらのブログからたくさんのことを考えさせられました。それらは長くなるのでまた次回に・・・",

    "text": "先日、紹介させて頂いた、仙台市のドッグカフェで保護されているペット達のこと。そこでしつけ教室を開いている相方の友人。実際に現状を見て肌で感じ、たくさんの動物たちの世話をしくてれいる彼。彼が先日の記事にコメントを寄せてくれました。伝聞や想像で書き連ねていた私の文章より、とても重みがあり胸にひびきます。コメント欄に置いておくのはもったいないので、前半部分を除きそのままこちらに載せさせて頂きました。ーーーーーーーーーーーーーーーーーーーーーーー本日も仙台は大変暑く，いくら各プレハブにエアコンが設置されているとはいえ，この暑さで体調を崩してしまったワンコ達も若干数おります。最初の子たちを保護してきたときにはまだ雪が舞う日もありましたが，気が付いたら梅雨明けなんて・・・あっという間の４ヶ月でした。また気が付いたら雪が降っているんだろうなーって感じです。あの子たちのお世話をしてばかりいて，家の子たちとの時間をとっていないかな？と最近反省です。あの子たちの様子を見ていると，お言葉の通り「しつけ」は大切だと再確認しましたが，飼い主のためと思っていたものが，実は犬自身のためだったんだなということに気付きました。しかしいまだに「しつけ」や「訓練」というものは，いうことを聞かない子のための「罰」的な意味合いで考えている人も中にはいることも事実です。「ほら，いうこと聞かないから先生のところに預けるよ」って。しつけも大事ですが，それ以上に飼い主さん達の意識を変えていく方法を最近よく考えます。今回の出来事は，こんな感じでいろいろ考えるきっかけになりました。長々と書いてしまいましたが，これからもいろんな方々にこちらの現状を是非紹介して下さい。ーーーーーーーーーーーーーーーーーーーーーーーーーーーー「しつけ」といえば、先日遊んでいた時に非常に理不尽で不可解なことがありました。書かないつもりではいたのですが、教訓もかねて残しておくことします。３～４歳の兄弟２人と小型犬を連れた家族連れが砂浜にやって来ました。注意しつつ様子を見ていたところ、子供たちが私たちの方へ駆け寄ってくる。イヌに向かって走り寄らせるのはキケンだなぁと思いつつ、怖くないのね、イヌを触りたいのね～それはけっこうなことだ、なんて呑気に構えていたのですが・・・傍に来るなり、なんと両手でイヌの背を叩いたのです。親は止めようとしていましたが、それでも止めずさらに砂をかけてきたりとエスカレート。ぽーもおしりをつねられ、口の中に手をつっこまれました。みなそれぞれよくしつけられたわんずたち。彼らが去るまで、されるがままじっとガマンしていました。ぽーに至ってはしつけの賜物というより彼の性格のおかげですけれどこの噓のような話は、現実に起きたのです。飼主たちみな、不可解すぎて呆然。親のしつけについて話題にしたいのではありません。突然の暴力をふるわれたイヌたち。もしわんずが反撃していたら、イヌと飼主の責任になっていたかもしれないのです。例えどんな理由があったとしても。彼らの母親が連れていた小型犬。私たちのわんずの傍にいるときは、挨拶をしようともせず凍ったように固まっていました。いったいどんな生活を送っているのだろう。子供たちがその子より大きいイヌでも平気だということは、まだトラブルが起きてないのかもしれません。そのうち堪忍袋の緒が切れるると思うょ。でもそのときあの子はどうなってしまうのだろう。そしてもしかしたら、散歩中の見ず知らずのイヌが私たちと同じ目に遭うかもしれない。まさか撫でる、触る以外の目的で近寄る子供がいるなんて。事故が起きていたらと思うと、ぞっとする。こんな理不尽で不可解なことに遭遇して、「咬まないしつけ」の大切さをとてもとても痛感。（いや、ぽーの場合やはり性格のおかげなのだけど）そして友人のコトバ。「犬のためのしつけ・訓練」何の為に行うのか。どのようなしつけを施すのか。誰のために「しつけ」るのか。・・・あぁ、思い出しながら書いたから乱文になってしもうたぽーを眺めて気分を癒すことにします[1] ぽーさん～～手が絡まってるではないか～[2]",

    "title": "ぽー空を飛ぶ。〜往路編〜",
    "tags": [

    ],
    "images": [
      "https://stat.ameba.jp/user_images/20110720/17/rinbelu/ba/aa/j/o0400025711362369783.jpg",
      "https://stat.ameba.jp/user_images/20110720/15/rinbelu/44/bf/j/o0399026711362144311.jpg",
      "https://stat.ameba.jp/user_images/20110720/15/rinbelu/79/fa/j/o0399026711362144314.jpg",
      "https://stat.ameba.jp/user_images/20110720/15/rinbelu/ce/ac/j/o0400026611362144313.jpg",
      "https://stat.ameba.jp/user_images/20110720/17/rinbelu/54/a6/j/o0400025511362315448.jpg",
      "https://stat.ameba.jp/user_images/20110720/17/rinbelu/f2/c7/j/o0399026211362315446.jpg",
      "https://stat.ameba.jp/user_images/20110721/12/rinbelu/5a/e4/j/o0399026711363859283.jpg",
      "https://stat.ameba.jp/user_images/20110721/12/rinbelu/c1/3c/j/o0399026711363859284.jpg",
      "https://stat.ameba.jp/user_images/20110721/12/rinbelu/ce/65/j/o0399026711363859285.jpg",
      "https://stat.ameba.jp/user_images/20110721/12/rinbelu/aa/29/j/o0399026711363859288.jpg",

      "https://stat.ameba.jp/user_images/20110721/12/rinbelu/37/25/j/o0399026711363891294.jpg"
    ],
    "text": "JALの「ペットとおでかけサービス」を利用しての飛行機初挑戦サイトには利用案内・料金から、機内での様子も載っています。しかし実際に利用してみないとわからないのですよねぇ。ぽーさんにがんばっていただきました路線は大阪伊丹→青森。座席数７６のエンブラエルE170。小型ジェット旅客機で１時間２０分の旅フェリーもかなり不安でしたが時間は短い。けれども犬を飛行機に乗せるなんてやはり心配ネットや問合せでせっせと情報集め。ANAの方がペットに優しいという情報もありましたが、「応対したスタッフの違い」も大きいかもです。利用したのはJALのみなのでわかりませんけれどぽーと飼主の体験談ということでよろしくです～さてさて、朝のうちに四国を出発した私たち渋滞に巻込まれつつも出発の１時間以上前に空港へ到着。ぽーさん、初めての場所にキョロキョロうきうきしてマス[1] チェックインカウンターでは荷物だけを先に預け、ぽーの料金を支払い、同意書へのサインを済ませておく。出発３０分前にぽーを預けることになります。料金：¥5,000/クレート１個＊但しXLサイズを超える場合は貨物扱いとなり、料金や条件などが異なってきますので確認してください。[2] 少しでもぽーが安心できるかもと、手持ちのバリケンを用意しました。（＊空港でクレートのレンタルも有。事前予約が必要）給水器を取付けて良いそうですが短時間であることと、もしこぼして体を濡らすとストレスになりそうなので付けませんでした。盲導犬や聴導犬ならば２Fへの立入りもO.K.ペットは１Fのフロアなら歩かせてもよいとのことでした。とはいえ犬が苦手な人もいるでしょうし、隅っこのベンチで時間までのんびり過ごします。犬の輸送が珍しいことや、ウィペットのぽーが珍しかったり、犬好きだったりとたくさんのヒトに声をかけてもらいました。そうこうしている間に出発３０分前。ぽーにはその場でバリケンに入ってもらいましょう抵抗せずすんなり入り、今のところ落ち着いている様子。相方と２人でバリケンをカートに乗せカウンターへ。[3] わんこ用タグを受取り、バリケンにはFragile シールが貼られます。なーんて実は「犬用」シールではなく、預荷物と同じタグシール＆『こわれもの注意』シールなのですさてこれから先はもう係員さんまかせなのだ。少し離れたところからちょこっと様子を見守ります。いまいち状況が掴めずきょとんとしているぽーさん。[4] 緑のネットはもしバリケンが壊れたとき、犬が外に出ないようにするためのものだそうです。[5] 搭乗口へ向かいつつ、階段の上からもすこし眺めてみる。ぽーは私たちを探してきょろきょろしています。時々「ぴぃ～」と鳴くけれど、フェリーでの様子と比べれば心配のない程度[6] 搭乗用通路からも眺めてみましたが、残念ながら機体や通路がジャマになり確認できず。個人的に苦手な離着陸、そしてぽーのこと。ぽーも、相方も、私もがんばろ～～ドキドキうがうがしている間に青森空港到着です貨物を降ろす様子を通路からじっと見守る。知らないヒトからはかなりの飛行機マニアに見えただろうなぁ[7] そして、そして、ぽーが乗ってましたぁ～～～[8] 貨物はちょうど通路の下を通過。[9] 上の写真を撮影後、大急ぎで荷物受取口へ預荷物が流れるより先に、脇にある職員用通路から・・・運ばれてきました～[10] ぽーの様子はといいますと、鳴いてはいませんでしたが口が開き呼吸が速い。ちょうど病院などで緊張しているときと同じ状態でした。空港建物の外へ運び出し、ぽーを狭いバリケンから出す。水を与えるとこくこく飲みました。飲む余裕があるのならさらに安心なのだ相方と空港でちょこっと走って気分転換。すぐにいつものぽーに戻りました[11] 往路では何が起きているのかを理解できていなかったかもしれません。復路ではみなさんご存知、台風マーゴンに向かって飛びますそしてぽーは飛行機２度目の挑戦。気になる貨物室の気温などについては、調べた内容や空港で聞いた話などを復路編にて書きます。義弟のお迎えで約１時間後には実家へ到着。家族・親戚、お隣さんと庭でバーベキューぽーもお肉をもらってがっつり夜ご飯を食べました。飛行機なんかに乗らされたうえ、１年ぶりの実家と大人数の歓迎。ハードな一日だったでしょうけれど、食欲も落ちずでほんとヨカッタ。ぽーさん私たちのためにがんばってくれてありがとう[12] うむ、やはり何か文句言ってるカオですね～",
    "truncated": false,
    "comments": []

    "tags": [

    "images": [
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/09/7a/j/o0399026711370007561.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/24/43/j/o0399026411370006778.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/c9/57/j/o0399026711370008032.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/03/33/j/o0399026711370006780.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/2d/fb/j/o0400026011370006779.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/85/17/j/o0399026711370008031.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/2a/41/j/o0399026711370007554.jpg",
      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/8f/2b/j/o0399026311370007556.jpg",

      "https://stat.ameba.jp/user_images/20110724/10/rinbelu/b4/ff/j/o0399026711370007555.jpg"
    ],
    "text": "昨日のこと。台風6号の襲来後、初めて砂浜へ行ってきました。様々な物が散乱しているため暗くなってから行くのは危険ですょ～[1] 見慣れたはずの海岸は、全く知らない砂浜に様変わり波に洗われて波うち際は姿をよく変えていたけれど、ここまで地形が変わってしまうとは・・・海開きをしたばかりの月見ケ丘海浜公園は『遊泳禁止』状態。海中や砂浜に岩石などが飛び出しキケンなためだそうです。写真のように一抱え程ある石が所々に。石というよりケーソン？（コンクリートブロック）ですねぇ。[2] 監視塔も流され倒れているけれどパーツが足りない。[3] 海の底から打上げられたらしき貝や魚、小石などもごろごろ。この貝はもちろん中身入ってます（ちなみに私の足サイズは23cm程）[4] この海岸は砂浜と平行して草地が広がっているのですが、草地と砂浜の間に大きな段差ができています。ごっそりと砂浜が波に持っていかれたかのよう。[5] 以前に上と近い場所で撮影したものがあったので比較。７月５日にうみちゃん＆むぅちゃんと遊んだときのものです。[6] 根元に切り倒した痕の残る木が段差の上にありました。流されて来たのか、ここに生えていたのか覚えていないけれども。滑らかな斜面だったのに、膝丈から腰高までの段差ができてしまった。[7] 草地の奥までも波が来ていたようです。台風が来ていた当日の様子を考えると恐ろしすぎ[8] 暗くなるとヒトも犬も足元が非常にキケンです。自然の驚異を感じ愕然としている飼主たち。そしてぽーはいつもの通りうひょうひょ走り回る。[9] いつもと違う撮影方法にしたら足が面白くなりマシタ[10]",

    "date": "2011.07.25",
    "title": "ぽー空を飛ぶ。〜復路編1〜",
    "tags": [
      "ぽー",
      "おでかけ",
      "グッズ",
      "2011年7月"
    ],
    "images": [
      "https://stat.ameba.jp/user_images/20110721/13/rinbelu/b1/b5/j/o0399026711364004146.jpg",
      "https://stat.ameba.jp/user_images/20110721/13/rinbelu/c6/17/j/o0400027111364004147.jpg",
      "https://stat.ameba.jp/user_images/20110721/14/rinbelu/15/0f/j/o0399026711364085770.jpg",
      "https://stat.ameba.jp/user_images/20110721/14/rinbelu/80/6e/j/o0399026511364085769.jpg",
      "https://stat.ameba.jp/user_images/20110721/15/rinbelu/c2/e4/j/o0399026711364104467.jpg",
      "https://stat.ameba.jp/user_images/20110721/15/rinbelu/f6/5c/j/o0400025411364104466.jpg"
    ],
    "text": "まずは飛行機の貨物室についてから。JALでは各機体の貨物室についてPDFでダウンロードでき、場所や容量、温度などを確認できるようになっています私たちが乗った機体はエンブラエルE170。前方と後方の２カ所に貨物室があります。温度調節スイッチはないようですが、前方貨物室のみ『２５℃』。確かにぽーは前方貨物室に乗せられていたその他に調べた内容としては、客室から貨物室に向かって空気が流れ、気圧は客室と同じく0.8気圧。青森空港のカウンターで応対してくれた係員さんによると、貨物室は客室よりも少し温度が低いそうです。人が乗っていませんからそのせいかもですね照明がないため飛行中の貨物室は真っ暗。機械類に近い位置にあるため、客室より振動や騒音を感じるかもしれないそうですそして荷物の量にもよるらしいのですが、クレートはなるべく進行方向に向かって置き、他のペットと隣り合わせや向かい合わせにならないように配置。飛行中に不安などからクレート内で暴れる子もいるそうです。話の様子からクレート内が大変なことになっていたらしい・・・ぽーの場合は怪我もなくクレート内にも変化はナシしかし台風で揺れ、真っ暗な貨物室。復路ではぽーの様子に多少変化がありました。往路と同様に荷物を預けチェックインを先に済ませる。台風の四国上陸に伴い、前日から四国発着の便は相次いで欠航その頃、青森の空はこんなに青かったのですょ～～[1] 建物の外の探索や、自動ドアにびっくりしたりと、出発までをなるべくのんびりと過ごしました。[2] さて、時間がきてしまった「ハウスっ」とクレートに入るよう促すも、そっぽを向いて聞こえないフリ・・やはり覚えているのか、嫌なのだよね。それでも軽くお尻を押すと自らクレートに入りました。「ぴぃーぴぃ～」と小さな声で泣きながら運ばれるぽー。こちらの係員さん、そこまで気を遣わなくても～と、こちらが恐縮するくらいとてつもなく丁寧に扱ってくれました[3] 検査員さんまでもがぽーを見守ってくれています。[4] 到着時と同様にぽーを乗せた車が見えるかもしれない。搭乗通路の窓へ駆けつけると発見～[5] もしかしたら台車のまま運ばれたのかしら。ぽーを預けてからヒトの搭乗までは20分程度ありました。ぎりぎりまで建物内にいたのかどうかまでは不明ですけれど、青森空港では往路ともに運ばれる様子を確認。係員さんが機内へよいせと、積みこむ様子まで見ることができました。[6] そして私たちが機内へと乗込むとき、なんとぽーの声が聞こえました少し太い声で「わんっ！わんっ！！」『ここから出せ～こんにゃろ～』と言っている気がした・・・往路では吠えていなかったのか、声は聞こえませんでした。台風に向かって飛ぶ復路。着陸ができない場合は青森空港に引返すか、関西国際空港に着陸すると出発前にアナウンスがありましたもし関空に降ろされた場合は、ぽーもいるのでどうしようもできない。相方が伊丹空港へ車を取りに電車で向かおうか鳴門大橋が通行止めだとどちらにせよ帰れない。そうだ！瀬戸大橋があるじゃない・・・あぁ、すでに通行止め。さらに西のしまなみ街道を利用するか、そもそも高速は通れるのか会社を休み、私の実家の奈良で一晩泊まるかぁ～～～～思わぬところに難関が生じた、『ぽー空を飛ぶ～復路編～』長くなるので続きはまた明日にでも～",
    "truncated": false,
    "comments": []
  },

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
