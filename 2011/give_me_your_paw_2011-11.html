    "text": "昨日のこと。「またあそぶー」なバドの宣言通り再び砂浜へ本日のメンバーはお馴染みNEOちゃん＆うみちゃん。そして、あのコはだ～れだ？？（ネオちゃん写ってなくてゴメン～）[1] うひょうひょコンビに追われているコはanちゃん。５月に会って以来なようやくの再会もちろん相棒donくんも一緒です。アンちゃん＆ドンくん久しぶり～[2] 「あれ？？？」と思った方はよくわかっていらっしゃる上の写真はうみちゃん＆ドンくんデシタ[3] バドは初対面のアンちゃんと意気投合で追いかけっこを楽しむ[4] うひょうひょコンビはまもなく、うひょうひょトリオになる予定[5] お茶目なネオちゃんはひとりひとりに「あそぼ～」のお誘い[6] のんびり休憩好きなはずのドンくんも走りまわっちゃう[7] 見慣れた光景、うひょうひょコンビ揃うとなんだかほっとする[8] やんちゃ姫＆やんちゃ坊主がにやりと狙いをつけるはドンくん[9] ぽーはおしり、ネオちゃんは耳が気になるらしい[10] 実は遊びの前半、ぽーはマズルガード装着されていました。再会してすぐドンくんに闘志を燃やしたためなのですけれども時間が経つにつれ、ぽーの様子に変化が起き始めました。「かまわないょ～」andon母の言葉に私の緊張ほぐれたためか、のんびりほんわか性格なドンくんのおかげか。いつもの遊びトモダチが一緒だからなのか。様々な状況重なってのことか、他に要因があるのか。最終的にはマズルガードを外せるようになり、しかもぽーってばドンくんに「あそぼー」アピールをするまでに。（たまにガウってたけど・・・）「さっき怒ってたよね？？」困惑ドンくんが可愛いすぎです[11] ぽーの新たな一面を知ることができ、密かに大感激な飼主相手がいてこその行動ですし、ここまでのんびり観察できたことも、anndon母さん、そして皆があたたかく見守ってくれたおかげデス。ほんまありがとぉ～～～～闘志を燃やすぽーと困るドンくんの間を「ちょいとごめんょ～」と、通り過ぎるネオちゃん＆バドに笑らわせてもらうこと度々そしてうみちゃんは突然ママの背後でうねうねし始める。[12] そのまま「目に砂が入っちゃったよぅぅ～～」と、顔をこすりながらの砂撒きあげブレイクダンスを披露。（もちろん、さらに砂をかぶっちゃいます）困ってるはずなのだけれど、その様子に思わず大笑い＆わんずも見に来るほどで[13] 発見と感激が盛り沢山となったこの日、イヌたちをさらに愛しく感じる一日となりました～",

    "text": "「子犬」といえばイタズラがつきもの。特に歯の生え変わる時期は色んなものをかじってみたり、見るもの全てがおもちゃだったり、運動能力の限界をわからずどんくさーいことをしたり。ところが、ぽーはとても大人しい子犬でしたトイレシートやクッションを破壊したりもあったけれど、それらは全て留守番をさせていた時の出来事。「やっぱ子犬なのよね～」と実感させてくれるのがバドそしてそのいたずらにもどこかオチがあったりと、笑わせてくれるのは末っ子故のことなのか。さて、今朝のこと。雨降りの日は子犬なバドも睡眠時間が増えます。おとなしく寝ているなぁ～と眺めてみれば、そこにあるはずのない見慣れぬオレンジの布が[1] 彼が敷いてるオレンジの布は、先日砂浜で着せていた服。そういえば昨日洗濯して、どこかにひょいっと置いた気がするなぁ雨の日に限ってナゼか洗濯物を増やしちゃうバド。そういえば明け方シーツに胆汁を吐いたなぁ～（まぁこれも仕方ないことなのですけれどネ）普段は別の場所にいてもわざわざトイレまで移動するお利口バド。けれど、ある雨降りの日には畳んでいる最中の洗濯物にしたっけ先日はワタシのお気に入りの低反発敷布団にも粗相。トイレまで行こうとして我慢できなかったのか、広範囲に続くおしっこの道がバドの焦り具合を物語る。ぽーも何度かこの敷布団に吐いちゃってるしね。２人の遊び場としても利用していてカバーはぼろぼろ。というわけで、もういいや無事な部分をクッションにしちゃえ[2] どうだ、ぽー？低反発だぞ。この敷布団で寝るの好きだものね そうですか。鼻の置き具合も良いですか～～[3] カバーをかけた低反発敷布団だったモノの上で、今日もまたおもちゃをカジカジするバドなのでした[4]",

    "text": "昨日に引き続き、バドのイタズラ遍歴です と、そうえいば昨日は2011年11月11日でしたね。「わんわんわんわんわんわんっの日だ～」と朝から騒いでいたら、相方がぽそりと「それじゃ無駄吠えの日やなぁ（笑）」うむ。うちの相方はよくぽそりと面白いことを言うのですさて、最近はしなくなってしまったけれど、飼主が出掛けたとき、サークル内で独りにされたとき、抗議なのかまず始めにバドが行う仕事がありました。それはトイレシートを破ること。けれど排泄は必ずトイレシート（または付近）にするお利口バド。＊但し、雨の日は別。しばらくして、おしっこしたい、うんちもしたくなったバド。さぁ困ったぞ、弱ったぞ。トイレシートがありませんどうやら困り、悩んだバドが選んだ方法は・・・[1] トイレ「トレー」におしっこもぬーこもしてしまえ。バドの葛藤ぶりを想像すると笑えて仕方のない飼主おもちゃが大好きで、常におもちゃを探し遊ぶバドは、歯が生え変わっても何かをカジカジ・・・・ある日、聞き慣れない音がしてバドの様子を覗き見る。そんなかわいい顔したってダメですょ。それはね、おもちゃじゃないから返しなさい[2] 寝ているとき以外は、数分～数秒おきに何かを拾ってくるバドさんヘンなものさえ食べなければ、怪我さえしなければかまわないさ。だって、イタズラも子供のうちだけだもの。ぽーは飼主の困ることをまったくしません。バドもそのうちそうなるんだものね～って、あれ？そうだよね？バドは違うのかな・・ぽーはどう思う？バドのイタズラは大きくなればなくなるのよね？・・え、えーと[3]",

    "text": "昨日のこと。ひろ～い場所での疾走やトモダチわんことの遊び。そんな楽しさ喜びを知ってしまったぽー＆バド。てくてく「散歩のみ」ではモノタリナイのですというわけで、ネオちゃん遊びましょ～[1] ネオちゃん＆ぽーのレスリングを眺めるだけだったバド。今回はなんと一丁前に参戦、さらにネオちゃんをあむっ[2] 楽しんでるからよいょ～と言ってもらってるけれど、２対１は卑怯だとオモウ。しかも女の子相手だぞそれでも遊び慣れてるから安心して見てられるのだけどね♪さて、ここからは三頭三様なトモダチの出迎え姿をしばし観察ハーディングもどきを行うぽー。本家本元ボーダーコリーのネオちゃんはじっと待機。とりあえず走ってみるバド。[3] ぽーはやっぱりそのまま待機。ネオちゃんは伏せをして接近を待つ。トモダチの少し手前で引き返して来るバド。[4] やっぱりそのまま待機のぽー。そろそろ良い？とかーさんにお伺いするネオちゃん。再び走り出そうか考え中のバド。[5] この後はそれぞれ思い思いに挨拶を交わす。やってきたトモダチは先月末以来の久しぶりむぅちゃん[6] 砂浜といえば、コレナノヨ。あぁ、幸せ木を独りでこっそりカミカミ・・だけど、必ずバドに邪魔されちゃうのよね～[7] 誕生日を翌日に（今日やん！）控えていたネオちゃんいつも追いかけっこ写真ばかりだけど、彼女も表情豊かなコなのです。カメラ苦手らしいけれどがんばってみたぞ～じっと見つめる先にはネオかーさん＆おやつ[8] 写真撮られてる～てへっなネオちゃん。[9] トモダチと遊ぶの楽しいょ～な笑顔[10] もっともっとかわいい表情するのだけどな～とにもかくにも、誕生日おめでとう！！これからも楽しい毎日、幸せ犬生を送ろうね～～",

    "text": "青森の実家からりんごが届きました～入っていたのは「王林」と「葉とらずりんご」。[1] ・・・「葉とらず」ってなにそこで調べてみました～「葉とらずりんご」とは：葉を摘み取っていないりんご。そのままやん！って、違うのだ。それだけではないのだ。葉が残っていることでしっかり光合成を行った樹は栄養もたっぷり。その栄養が果実に行き渡るため糖度も高く蜜たっぷりになる確かにね、蜜がたっぷりでうまいんです～ところで、りんごが赤くなるのは日光にあたるためなんだそう。よくある真っ赤なりんごは色形をよくするために袋をかぶせ葉を摘む。そして収穫前に一気に陽にさらしてキレイな赤色にするのだそうな。一方、葉とらずりんごは果実が日光にあたりにくいため色は悪い。が、味は最高なのです（でも、そんな悪くないよね？）無知だったワタシ。そうだったのかと、目から鱗です・・あら。また、宅配がキタ。モニターで確認すると初めて見るドライバーさん。重そうな荷物だぞ（たぶん、ぽー＆バドのフードだ～）「重いので玄関に運びましょうか？」なんて、いつもの会話をしてから（あれを）何とかすれば良いか。そんなつもりで玄関を開けた途端、つつっと無言で入ってきた荷物を置こうとして、玄関ホールに居るものが視界に入ったらしい。「おっ」と一声発し、後ずさりで慌てて玄関の外へ。彼が目にした光景はコレ[2] 大きな変わった犬がいるっという感じだったのかしらねぇ。きっとこれからは声をかけるようになることでしょう玄関内に入ってきたヒトに対して吠えることもしないぽー。このときはさらに眠気もありちらっと一瞥しただけでした。田舎らしいフレンドリーな人が多いのに、このドライバーさんはとても無愛想だったなぁ。それにしても驚いた姿がちょっと可笑しかったしかし、そこに居たのが番犬にならないぽーで良かったネさて、りんご食べようっと[3]",

    "text": "昨日のこと。いつもの砂浜に黒いもふもふなコ達がいる[1] 集まっていたのは、うみちゃん・アンちゃん＆ドンくん。そしてバニオくんだ～やったぁ～～と喜び勇んで乱入なのだ[2] みなそれぞれ思い思いにわいわいがやがや戯れて・・いるのだけど、様子のチガウ子がひとり居るようです[3] 安全地帯（ママの足元）で様子を伺うバニオくん。そう、この日は人見知り＆犬見知りな彼の砂浜デビューなのだ～それを知ってか知らずか、なぜか彼のまわりで大騒ぎのわんず[4] もぉやだょ～と言わんばかりのこの姿。本人はたいへんな状況なのだろうけど、そんな姿もかわいすぎ～[5] 普段の散歩でも全く飼主のそばを離れないそうな。あ・・そういうコをもうひとり知っているなぁ幾つになっても変化が起きちゃうのもイヌの面白いところ。バニオくんも、すこーし飼主の側を離れられるようになりました。（腰がひけてるような気もするけど、よくがんばった！）[6] 「変化」といえば、ぽー＆バドの話も幾つかあります。文章とイメージ図、時々本物写真でお届けしま～すさて、ドンくんには強気なぽーさん。時折、睨みを利かせていたけれど、あっけなく撃沈[7] マイペースで大雑把な性格だけれど妙なとこで繊細だったりする。顕著に現れるのが小競り合いをしたとき。しょぼーんと、ひたすら凹むのです普段は率先して遊びの輪に入るぽーですが、独りぽつんと遠くで皆を傍観。[8] 放っておいたらとぼとぼと独りで散歩に行ってしまいます。追いかけて「ぽー、おいでぇぇ～」と優しく呼ぶ。すると嬉しそうに戻ってきては、体を寄せて甘えるぽー。機嫌やテンションが戻るまでこの繰返しなのですまぁ、飼主としては普段と違うこの甘えっぷりが可愛いのですけどね子犬なバドは、そんな兄ちゃんの様子には気がつかない気にしない。おもちゃの宝庫な砂浜であっちへうろうろ、こっちで物色最も気に入ったのは「干物になったあなご」埋めても捨てても掘り返されてくる哀れなあなご。飼主は少し考えつつも、海へむかってぽ～んと放り投げてみた[9] はい。。飼主も、アナタもきっと想像した通り。嬉し楽しなバドくんは大喜びであなごを追いかけてどぼんバドの初泳ぎはこんなカタチで行われちゃいましたぽーと同じくカラスなど鳥が気になるウィペットなバド。凹み中のぽーと一緒にこの日もカラスを追いかけ走りだす。ぽーはいつも途中で追うのをやめ戻ってくる。それを見て一度は足を止めたバド。が、飛んでいるカラスに向かって再び走り出した見晴らしもよい長～い砂浜だからこそ傍観している飼主も、さすがにこれ以上行かせるわけにはと動き出す。すると飼主の近くまで戻っていたぽーが全力疾走でバドの元へあっという間にバドの正面に回り込み、群れから離れた羊を追うように飼主の元へ連れ戻した。偶然かもしれないけれど、いつもの遊びとは違う動きだったのですょ。「バドを連れ戻したのだ！」と、飼主は確信しているのですつらつらと書いてみたら、主にぽーの変化でしたね遊ぶたびにぽー＆バドの仲も、彼ら自身にも生じる変化。もちろん一緒に遊んでいる子達にも変化が起きているのですが。どうしてもぽー＆バドのことばかりになる親ばかいぬしです本日ラストの写真は海に入った直後のドンくんで近いうちにまた遊ぼうね～[10]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
