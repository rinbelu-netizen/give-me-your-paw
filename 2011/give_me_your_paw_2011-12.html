    "text": "昨日のこと。むぅちゃんママこと、mitomonさん。うみちゃんママこと、soraumiさん。アンドン母こと、あん＆どんさん（そのまんまだ～）。この日、彼女達と一緒に向かったのはこんなトコロ[1] イヌたちがいなーい！！それもそのはず、「料理教室」に行ってきました～・甘エビ、モンゴウイカのタルタルイクラ添え・フレッシュトマトとアンチョビのスパゲッティーニ・チキンのクリーム煮込み 生ハム添えバジル風味これらのメニューを習得あん＆どんさんは生ハムを剥がす先生が笑いのツボに入ってしまい、（ひじょーに剥がしにくくて、うつむき格闘する姿がいやはやなんとも・・）soraumiさん＆mitomonさんは野菜の切り方がまずい～、と先生に笑われる・・・私、わたくしは茹でていたイモの存在をすっかり忘れ、ぐらぐら揺れる鍋の火を先生に止めさせた程度ですょそんなこんなで、見事完成家でも作るぞぅ～[2] 満腹おなかを抱えながら次に向かった場所はみうちゃんち。彼女のおうちにはラブリーな毛のないコたちがたくさん。しかし、今回の訪問目的はハチュたちではないのだ[3] ８月生まれの蘭丸くん。だんなさんのマラソン完走がきっかけで迎えることになったので、「Runmaru」と書いてらんまるくんなのだ～とても小さくってもふもふで、まるでぬいぐるみまだ体重1.3kgということだから・・10頭でようやくバドの大きさっ[4] 乳歯も小さくて、まるで爪楊枝でつんつんされてる程度なのだ。たくさん遊んで、色んな経験して大きくなるんだぞ～[5] と、こんな様子で朝から遊びほうけていた飼主。ということは、バドの留守番時間は最長記録を更新したわけで。ドキドキしつつ帰宅してみるが、飼主の困ることなんにもせずで大喜びでぽー＆バドと一緒に走り回っちゃうみんな疲れたところで暖かい部屋の中へ。しばらくすると、ストーブの前にはかわいい２人の姿が[6] 数分でぽーが移動してしまったけれど、初めての行動。イヌ時間ではほぼ一日の留守番。寂しかっただろうなぁ～しかし、この接近具合はうれしすぎるワ[7]",

    "text": "昨日のこと。毎度お馴染みとなりましたバーニー'sのみんなと集合～（手前から うみ・どん・あん）[1] そういえば、soraumiさんが何気に面白かったのだ車内にぽー＆バドを残し、車から降りて来た彼女に挨拶、、したのだけれど、視線は私を通り越し、車内のぽー＆バドを凝視「び、び、びよるきすーっ？！」彼女が目を奪われていたのは、ぽー＆バドのnewカラー。車内にいて見えにくいはずなのに気がつくとは！ずっと気になってる商品だったそうなのだけど、おもしろすぎやっぱね、わんこは飼主に似るのですょ（自分にも返ってくるけど）BJORKISの首輪については後日改めてご紹介しま～す。さてさて、ぽー＆バドはこの日もごキゲンで皆と大はしゃぎ広～いグランドを駆け回り、走って、走って・・[2] すっ転んで・・[3] セクシーポーズでみんなに笑いのプレゼント[4] 遊びたいのか優劣つけたいのか、時折ドンくんに挑むぽー。コドモや女の子たちはそんな２頭の間を敢えて通り抜けてゆく[5] さいきんこのペアで遊ぶ姿が増えてきたアンちゃん＆バド。なんだか似ている、この写真のふたり[6] ちょっと休憩のドンくん。と、後ろに誰かいる、ダレだ？[7] それはうみちゃん。ナゼかこの日はドンくんにず～っとすりすりというか、目が・・目がコワイょ～（撮ったのワタシだけど）[8] もいっちょ。台詞つけたらこうなりました～[9] と、何やらぽーが口をむぐむぐさせている。なんか食べた？と、見てみると・・歯が１本折れていました[10] じんわり血が滲む程度で、いつ折れたのか情けないことに分からない。首輪などがあたり欠けてしまったのか、気がつかない間にヒビが入っていたのか。。。痛みもないようで、帰宅後はごはんもしっかり食べ元気。嫌いだし怖いところな病院。今日は遊び疲れたし、翌朝に行きましょうか・・・相方にメールをした後、「麻酔かも、抜糸かも～」とぽー＆バドの産みの親に電話してみる。（産んでないけど正しくは、ブリーダーさん）アドバイスと励ましを受け気合い入れ直しそして翌朝、つまり今日（１２月１３日）病院行きました。結果は・・・処置せず放置でおっけー出血も、痛みもないのでこのまま経過観察。「いずれ落ち着くだろう」とのこと。これだけ遊ばせているのだもの怪我はよくしてあたりまえ。そもそも、転んだり、みんなにふっ飛ばされたり、溝に落ちてるのに骨折してないことがラッキーなのだ。（↑コレ、全部バドが経験したことだったりする）いつか麻酔を受けることになるかもしれないけれど、今回は回避できました。ほんと良かった。もし歯茎が腫れて炎症を起こしていたり、歯の変色が見られたら再度通院することになります。が、先生が診たところたぶん大丈夫なようです[11] 参考までに歯の写真を載せておきます。（クリックで拡大）上側の右犬歯の前、切歯を歯茎に平行に折りました。歯茎に向かって亀裂もはいりましたがぐらついてはいません。若干赤く歯髄が見えますが今は穴が開いているだけになっています。これからも大きい怪我をしませんように！[12]",

    "text": "BJORKISのカラーのこと。先日、soraumiさんを釘付けにしたビヨルキスの首輪。日本でも人気があるそうで、入荷したらすぐ売れちゃうほどなんだそうです私がこの商品を知ったきっかけは、胃捻転誇張症候群の記事で紹介したSMILES@LAのニコ＆ニヤちゃん。ぽー＆バドと同じく短毛・首が細めの彼女たちが愛用しています。クッションの入ったハーフチョークで、カラー・サイズともに豊富。ナイロン素材なのでじゃぶじゃぶ洗えちゃう。太さは２種類あり、反射素材のテープが仕様されています。何より嬉しいのは安いこと。（私が購入したショップでは2400円）縫製が雑なのですが耐久性に問題なさそうですし、大雑把な私は気になりませんでした[1] さて、ぽーが着けているのは4cm幅、色はアリスブルー。ぽーの表情がびみょーなのは・・ふんばり中だからです[2] バドのカラーは3.5cm幅、色はライム。服が濡れているように見えるのは影ではなく、友達わんこの水入れをひっくり返したからです[3] どちらも欲しかった色が品切れでこの色になったのですが、ナイスチョイス！似合ってる～と褒められてほくほくしてます（２人の表情がいまいちな写真を使ってしまったけれど・・）ところで実は、ハーフチョークカラー初体験な私なのです。初心者だからこその、気になったことを書きとめます。（ウィペットオーナー先輩方にとっては、たぶんあたりまえのことだとオモウんですけどネ・・）サイズは「最大値」と「最小値」で選ぶのですが、このカラーは後から調節ができないので購入前の計測がとても重要でした。私が購入したショップでは「頭回り」と「首のつけ根」を計るよう指示。しかし、ウィペットのような首が細長く、頭の小さい犬種は「つけ根」での計測だと確実に首輪抜けすると思います。なのでぽー＆バド用には、カラーをかける場所（顎下など）と頭回りでサイズを選びました。と言いつつ、ぽー用に丁度良いサイズがなく、若干大きい方を購入したのですがいつか抜けそうでドキドキです。安いしもう１本買っちゃおうかな～もうひとつおまけのグッズ紹介。pim:likoのバンテージサポーター。[4] ぽーは子犬のころから疾走するとほぼ必ず手根球を擦りむくのです。走り方や体型の違いなのかバドは全く手根球のケガはせず。しかし、ウィペットでこの部分をケガする子は多いみたいなのです。ルークレイル家からサポーターテープを頂いたのだけど、疾走する機会が度々なのでもったいなくてヒト用のサポーターと同じく伸縮性の素材で、足先から靴下のように履かせるので若干手間がかかります。が、しっかり手根球の保護をしてくれているので気に入ってます。走っているうちにずれちゃいますが、まぁそんなものかなとあ、そうそう。ぽーの折れた歯ですが経過良好です♪歯茎も異常がみられず本人も相変わらず気にしていません。みなさん、毎度ご心配おかけしましてすみませんです～～[5]",

    "text": "犬を飼い散歩に行くようになると、わんこ＆飼主さんの輪が広がっていきます私たちの散歩コースには畑や果樹園が多いため、そこで犬を飼っていなくても知り合いがどんどん増える。そんな近所のとある『畑のおじさん』が犬を飼うことになりましたはじめましてのシロさんです。パパは紀州犬、ママは黒芝なのだ～[1] 「そうかぁ～子犬の頃に『コロ』って名前がついちゃうんだなぁ～」と、もっふ～顔で相方がふと呟くほどころころしてます[2] 遊びたい盛りのシロはすすきの穂で簡単に釣れちゃう。（ぽーさん、なんて顔しているのだ。やきもちかしらん）[3] 体はシロより大きくても、同じく遊びたい盛りのコドモがもうひとり。バドだってすすきの穂で釣れちゃうのだ～[4] 動くもの、初めてみるもの、何でもおもちゃで興味津々なシロさん。ぽーの尻尾にじゃれて遊んでいたシロさん。ぽーの足の付け根になんだかぷらぷらするモノがあるぞ～～噛みつこうとしてやっぱり怒られる[5] まだ子犬なのでぽーがオスとしての威嚇をすることはない。ほぼ毎日会っているからこれからの変化が楽しみだったりもする。相性もあるだろうけれどネ。彼はこれからサルを追い払ったりして畑の番をする、たくましい和犬に成長してゆくのです。ぬくぬく過保護なぽー＆バドと環境も異なるからどうなるのかしら。物心ついていないコロコロなうちはたっぷり私たちと遊んでね[6]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
