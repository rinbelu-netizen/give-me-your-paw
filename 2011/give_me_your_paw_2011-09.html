    "text": "なんだかモノタリナイ週末でした～それもそのはず、うみちゃんが帰ったからなのです。[1] まぁね、うみちゃんにとってはおうちの方が良いだろけどネ初めて「大型犬」と暮らしてみた３日間。楽しかった～また預かっちゃうつもりですけどネ[2] たった３日ですが様々な発見がありました。改めて感じたことはサイトハウンドが犬っぽくないこと仕事から帰った相方を出迎えることのほとんどないぽー。その代わりうみちゃんは尻尾ぶんぶんでお出迎え。なんだかそんなことが妙に新鮮だったり。[3] 仲良しな２人だけれどやはりお互いに遠慮しているようす。相方の膝に座るのが日課のぽーがこの３日間は座りに行かなかったり。ストレスもあっただろうけれど、意外な一面を見つけたりで各飼主ともに楽しませて イタダキマシタそれにしても、イヌは飼主に似るのですねぇうみちゃんは朗らかで「天真爛漫」というコトバがぴったりな、ほんっと明るい子なのですそしてですねぇ、うみちゃんママがこれまた・・（さぁsoraumiさん、あのネタいきますょ～）「片側しかヒゲを切れなかったの～」とうみちゃんを預かった初日。家に連れ帰りよくよく顔を眺めてみる・・・はてさて、彼女が切ったのはどこのヒゲなのだろうか？[4] むぅちゃんママに写真を（ニヤニヤしながら）見せるも、「切ったのは眉毛かなぁ？？」とやはりわからない。よく聞き間違いをするワタシなので、また思い違いをしたのだろうか。でも、まぁいいや切っちゃおと、ちょきちょき。もしかしたら後日ネタにできるかもと、切ったことを知らせずコチラの写真を彼女に送信[5] その翌日にひなた＆はるた兄弟と会うことになったわけですが、うみちゃんママからは「ヒゲ切ってかわいくしておいてね～」いやいや～、もうすでに切ってるしその写真もアップで送ってるし～さすがうみちゃんママやわぁ～と大爆笑帰宅後に尋ねたら、「左側を切り揃えた」そうな。あ～たしかに、写真をよく見直したらそうかも！まね、切ったことに気がつかなかったのは、仕事で忙しかったからにしておきましょうかねそんなエピソードも含め楽しい日々なのでした。さて「イヌと飼主が似る」それは我家にも言えることなのだぽーはとてもマイペースなのです。遊びに飽きたら帰ろうとしたり、ベッドで一人寝始めたり・・・いやいや、これはきっと「ハウンド」グループの気質なのですょ。たぶん、ね。",

    "text": "９／１７～２０イベントだらけな怒濤の連休のこと。書きたい話題はたくさんあるのですが、なにせ時系列でしかまとめられない性分でして。ちょこっと気長におつきあいくださいませ１８日はぽーの家族ルーク＆レイルから誘いを受けて、長野県木曽にて開催されるルアーコーシングに初参加。ルアーコーシングとは電動モーターで疑似餌を引っ張り、それを犬に追わせ「犬の本能をくすぐる」スポーツ。犬も飼主も楽しめるドッグスポーツなのです。そして私たちにとっては、レースへの参加だけでなく会いたかった人、会いたかったウィペットたちにも会える素敵なイベント。と、そのまえに、開催日の前日はこれまた会いたい人と合流する大切な日。落ち合う場所は馬籠の宿「いろりばた」[1] ぽーに会うため渋滞のなかわざわざ来てくれたのは、あの人たちしかいません、そう「ぽー大好き夫婦」私たちとの感動の再会もそこそこにぽーと一緒にまったり。[2] 馬籠の石畳をのんびり散歩してちょっぴり観光も。そしてこのとき翌日のレースでご一緒することになる、SAMURAI_Granvilleくんの飼主さんに会いました～[3] このとき何も知らなかったのですが、グランビルくんはとてつもない俊足の持主だったのだ翌日、会場で撮った写真をどぞ～。[4] 同じウィペットだけれど走り方様々でとにかく楽しかった１８日。親戚ウィペットしか知らない飼主も、ぽーしか知らない友人夫婦も、そして犬大好きぽーもテンション上がりまくりな１８日。そしてなによりぽーの初レースはどうだったのか。というわけで・・つづく[5]",

    ],
    "text": "いよいよレース当日。会場に着くなりたくさんのわんこを見て、既にハイテンションぽー[1] ルーク＆レイル家（以下ルクレルで♪）からみなを紹介してもらって、私たちもぽーもさらにうひょうひょついにはブログのことも忘れ写真なんて撮ってるヒマな～いと、「適当に撮っといて～」と友人夫婦にカメラを預ける始末というわけで今回のブログは、友人が撮影してくれたおかげで書けるのです～[2] こちらはラッキーくん（右）＆つばめちゃん（左）兄妹。犬達の走る姿そして、ぽーのかわいい姿が見られま～すそしてブリジットちゃん（中右）＆レイチェルちゃん（中左）姉妹。こちらの姉妹も俊足の持主で、走る姿のなんと美しいこと[3] こちらの優しい顔立ちした彼は善くん。遠慮しらずの私たちはターフをお借りして、あげくぽーまで善くんのマットを借りてくつろいで・・・とほんとお世話になりました～ありがとうございます！！[4] そしてそしてようやく会えました、まめしば家の４姉妹ガーネットちゃん＆ヴィーナスちゃん。ワタシが撮った写真なのですが、つばさちゃんとクォーツちゃん写ってませんでしたしかもぽーのリードをルクレルパパに持ってもらってマスこの写真ではわからないあることで、彼女たちはさらにとってもかわいいのですよ～[5] そしてこちらは同じく西日本から参加したロデムくん＆マリーちゃん。６月に淡路島で出会ったワラビくんのお友達なのだ～さらにたくさんのウィズ＆飼主さんたちに出会い、テンション上がりっぱのわたしたち。それでもまだまだ、会いたい人たちがいるのだよなぁ。。。とか思いながらベンチで休憩中、ふらっとレイルママがどこかにお出かけ。しばらくして私の右背後から、レイルがぬっと顔をだす。「あら、レイル戻ってきたの～」と声をかけるも何か違和感・・振り返りレイルらしきコの全身を見て考える。この子はレイルじゃないぞ。誰だ、キミは！！というか、知ってるよぅ～～ロンくんではないですかぁ～～先日「会いたいねぇ～」とブログにコメントしたとこなのに～ルクレル家ってば内緒にしてるなんて憎いわ、もぉ～ロンくんとは、ぽーと同じくでかウィかもと噂だったり、血はつながってないのにぽーの兄弟レイルと似ていたり。と、何かと気になる存在のウィペットくんなのです会えちゃったというわけで集合写真なのだ～[6] 向かって右がロンくんで、ぽーの左がレイル。ルークさん・・・何してるのかしらぽーしか知らないヒトはウィペットってこんな感じ、と思ってるはず。しかし実はぽーさん、ちょこっと大きめなのですというわけで、小さくてかわいいコ代表（実は標準に近かったり）よろしく～さっきも登場したまめしば家のヴィーナスちゃん（だよね？）[7] モヨウはもちろん、顔も体型もさまざまなウィペットたち。走る姿もモチロン、こんなに楽しい犬種なのですょ～あ・・・・レースのこと全く書いてないワまーた、長くなってしまったなぁ・・というわけで、つづく～～と、明日にのばすと怒られそうなので（誰に？）、本日の午後に続きを更新できるようがんばりま～す",

    "text": "さてさてお待ちかねのルアーコーシング初挑戦。「ビギナー」「エキスパート」どちらかのコースにエントリーし、合計２回走ることができるそうな。ぽーはもちろん「ビギナーコース」で説明を聞くところによると、何かと飼主の行動が重要らしい。スタート時に犬を押し出すようなしぐさをすると、「プッシング」となり失格だとか。その他も色々と・・・ビギナーコースは練習もかねてなのでちょこっとだけ甘い。かもしれない。でも、あれこれ規定の難しいことワタシにはムリ～～というわけでスタートは相方にまかせたっ順番が来るまでは疾走する皆の様子を楽しませていただきます。ルアーをスタートさせる「Ready Go!」を聞くだけで、テンションのあがるルークさん。真剣にルアーを追うその視線までもがかっこいいぞ～[1] ルアーコーシングの目的の一つは、ルアー（疑似餌）を追いそして捕まえる喜びを与えること。つまり犬たちの本能を呼び起こし楽しませること。だからレイルもこんなに嬉しそうに走るのだね～[2] さて、いよいよぽーの順番が来ましたょ。ビギナーコースではまずルアーに集中させることを覚えさせます。そのためルアーを引くスピードも犬に合わせて変えるのだとか。ぽー＆相方がゴール地点から、ルアーと一緒にスタート地点へ向かう。ぽーってば、ルアーにわんわん吠えてやる気満々ではないかっ「良い集中力だ～」とか褒められて飼主も調子でてきたぞ～[3] あ、ちなみに私はゴール地点でこっそりぽーを捕まえる役です。なぜ「こっそり」なのかはルアーに集中して走っている犬が、飼主に気づくと「えへ」となってしまうから。さ～て、いよいよスタートさぁどうだ！！[4] なんと目線はしっかりルアーを捉え、見事に完走ですょ～７５mを6,691秒で走りました～これからが楽しみと言われ調子に乗った飼主たち。もし失格になってしまっても１回は走れたし、やってみちゃえ～とエキスパートコースに挑戦世の中そんなにうまくはいかないってばね～ビギナールールとは異なりルアーを見るのはスタート地点から。その時点ですでに集中力は無し＆帰ろうとしてじたばたぽーさんスタートはしたものの完全に流し走りで、ばっちりカメラ目線[5] ゴール間際では隠れてた私に気がつきこの表情というわけでタイムは8.539秒。[6] ルアーへの集中力は切れてしまったけれど２走目も完走！他の写真でもキョロキョロしてるけれどなんて嬉しそうなのだ～初参加では完走することが目標なのだ。飼主さんのところへ戻っちゃう子もいたりするそうです。ふむ、ぽーの場合は砂浜で飼主のこと気にせず遊んでるおかげだろうかそれにしても、ルアーコーシング楽しかった～ルーク＆レイル家のお二人さん！誘ってくれてありがとう～しかもサプライズありで、楽しいことづくしでした～ぽーが着ている黄色のハーネスも何気にレイルのを借りていたり。興奮しすぎのぽーさん、いつものハーネスだと脱いじゃうのですょウィペットオーナーとしても、ルアーコーシングの先輩としても、なにからなにまでお世話になりっぱ頼りまくりですそして実は、ルクレル家との旅がもう一日続いたりなんかするのです。１８日は同じ宿で一泊し、翌日はとある場所へ向かいます。というわけで、いよいよ登場しますょつづく・・・",

    "comments": []
  },

    "text": "ルクレル家と一緒に向かった場所。そこはルーク、レイルそしてぽーの故郷２歳になり♂の本能にも目覚め始めたぽー。犬舎の男の子たちと喧嘩にならないか心配していたのですが、去年の里帰りと同じくすぐに「犬舎の子」になってマシタ[1] ぽーが大きくて間違えちゃうかもですが、上の写真に写っているのはみな成犬ですょ～黒い耳が特徴のハマーはぽーのおじいちゃん犬舎のなかで最高齢で誰もがひれ伏す（そうなの？）イキガミサマそのハマーと一緒に、妹のたんぽぽを追い回すぽーさん。。。[2] ぽーの「女の子大好き」性格はおじーちゃん譲りなのだね。というかハマー、まだまだ元気で安心したよぅ～え？本題はまだかって？こちらの犬舎では６月に子犬が産まれています[3] この２頭は女の子でそれぞれ新しい家族が待っています。それでだ、遡ること１ヶ月ほど前。男の子たちにどこか良い縁来ないかな～という、つぶやきを聞いてしまった私たち。いつかはぽーの弟を迎えるつもりでいた私たち。[4] 毎朝毎晩ぽーも交えて家族会議。そして今回の里帰りが決定したわけなのですしかし犬舎に着いてもどの子を迎えるか決められない。だってね～どの子もかわいいんだもん「フィーリングで決めるのだ！」とアドバイスもらったけれど、抱っこしようが遊ぼうが頼りの直感も働かずで最終的にはぽーと子犬自身が決めてくれました。フェンス越しにぽーを連れてきたとき、真っ先に反応してそばに来た子。ぽーのbuddyとなる子なので「バド」です[5] ブルーブリンドルのぽーと、レッドブリンドルのバド。青ブリ＆赤ブリです（ブリンドルとは毛色のことです）物怖じしない肝の据わった子なのですょ～あの台風で長時間ドライブとなった帰り道も、ケージ内でわっさわさ遊び車酔いする気配もなければ泣きもしない。あ、一度だけ「おなかすいた～」と鳴いたっけすでにぽーと大はしゃぎして遊ぶ毎日です。それでも二頭とも今までと全く違う生活のため、馴染むまでもう少し時間が必要かも。私たち飼主もですけれど さて二頭の同時期の頃の写真を並べてみました。どちらがぽーかわかりますか～？って、簡単ですよね～（ワタシの父はわからなかったようですけど）[6] 今朝の撮れたて画像～「♂三頭眠る」[7] 玄関先でのぽー＆バド数時間毎に変化のある二頭。子犬を迎えると手はかかるけれど、楽しい。ひたすら楽しいのだブログタイトルもいつのまにか変えてました。これからも「Hey buddy , give me your paw!」をよろしくです",

    "text": "９月２０日 ぽー＆バド生活初日。長時間ドライブの疲れも見せず好奇心旺盛なバド。「不安？何それ？？これはなに？あれはなに？」一方ぽーさんは、旅の疲れとバドの登場で困惑気味。「この子、どうにかしてください・・・」[1] 元気いっぱいのバドだけど疲れてはいるはずなのだ。ということでサークルに強制収容。寝なさい[2] ９月２１日。２頭ともゴハンもしっかり食べ、おなかの調子もgood戸惑いを見せていたぽーも、バドの様子を自ら見に行くようになる。[3] おもちゃで釣りつつ一緒に遊んでみると、夕方にはお互いにちょっかいをかけたりして遊ぶようにソファの上で遊んだりなんかして、ぽーはバドを飛び越え八双飛び。（部屋が汚いので犬たちだけ見てくださ～い）しかしぽーってば、どうも甘い気がする・・・ぽーのおやつにバドが興味を示すと渡そうとしたり、「それは怒っても良いのでは？」とヒトが感じることでは怒らなかったり。それでも叱ることもあるから、ヒトはヒトなりの対応でがんばろう[4] ９月２２日。昨日遊んでからようやくいつもの表情や態度になってきたぽーさん。天気も良いしバドくん、庭に出てみましょうか。あぁ、このおしりがなんともいえず・・・かわいい[5] ぽーが襲ってるようにみえるかもだけど、おもちゃもごはんも簡単に明渡しちゃうぽーなのです。不憫な子（もちろん今後の生活のためにも飼主が許さないけど）[6] バドもへそ天で寝たりなんかして、お互いに馴染んできたかな～[7] ９月２３日。ワクチンプログラムやその他諸々の相談も兼ねて病院へ。子犬の頃は車に乗せると「吐く・よだれ・はなみず」だったぽーさん。バドは全く車酔いをせず泣きもせずほんっとラクな子だ～というか二人で落ち着いちゃったりして、かわいいのですけど[8] 病院の帰りにちょこっと家の外で遊ばせてみました。しかも飼主もどきどきな、バドくん初フリー遊びなのだ。「おいで」もわかるし、トイレシート使えるし（時々はずすけど）。やはり、そうなのだ。バドって天才かもしれない！！[9] 無邪気で怖いもの知らずのバドくん。いっぽう控えめ遠慮しがちなぽーさん。さて、これからどんな変化が訪れるのやら、とにかく楽しい毎日です[10]",

    "text": "ブログトップの画像を変えてみました。あまりのかわいさに眺めてしまい筆が進まない～～のんびり食事であいかわらずバドにごはんを取られそうになるぽー。ぽーが叱る様子もないので食べ終わる頃に、バドの食事タイムをとるよう変更してみました。そうしたらぽーさんてば、バドのフードを一緒にもぐもぐバドのフードはパピー用で種類も異なる。魔法の粉のように企業秘密なわんこの好む香りがするそうな。うーむ、ぽーのフードも変えるかなぁ・・・それよりパピーフードはカロリー高いしなんとかしないとそんなぽーですが、ようやくすこーしバドに強く主張するようになってきました。しかし飼主に叱られようがめげない懲りないバド子犬の教育は♂犬よりも、♀犬の方が厳しいらしい。ならば彼女たちのチカラも借りようではないかというわけで、週末のこと。突然の招集にも関わらずみんな来てくれました～[1] バドに遠慮して思うように遊べなかったストレスか、いつもよりハイパーなぽーに負けずに遊んでくれるネオちゃん[2] [3] 生後８ヶ月まだまだこれからのパールちゃんとも大はしゃぎ[4] もちろんうひょうひょコンビなうみちゃんとも追いかけっこ[5] 皆のことを「こわいょ～」と初めは震えていたバドですが、[6] いつの間にかちゃっかりおねーさんたちに挨拶まわり[7] 犬にとってはごく普通の行動なのだけれど、にーちゃんぽーの真似なのか、ハマーじーちゃん譲りの女の子好きなのかと考えるとちと面白い[8] 人見知り犬見知りむぅさん。そんな彼女がバドにとっては安心できる相手だったのか、木のとりあいっこ遊びをしていましたょ[9] [10] ネオちゃんも遊びに誘ってくれたりして、うみちゃんはバドにあたらないよう急ブレーキをかけてくれてたり。（彼女の体重を考えると急に止まるのは足に負担あったろうなぁ）[11] って、あれ？？？飼主の思惑とは違って全く叱られなかったねぇ。叱られるほどちょっかいかけたりしてないからかしら。バドがよく視線を向けていたのはぽーや私たち。まだ名前もしっかり覚えていない時だから、それはちょっと嬉しい発見皆との遊びに大忙しなぽーですが、バドのことも気にかけていた・・・かもしれないそういえば、鳶に頭上近くを旋回されました。よく砂浜で遊ぶけれどこんな経験は初めてのこと。帰宅後調べたところバドの体重はさすがに運べないようです。しかし、爪でひっかけられると大けがになる。相方と木を投げたりして威嚇しておいて良かったかも。[12] 「自然」といえばこの日の砂浜には「サメ」が落ちていました。ぽーがマーキングして主張していたのは皆には秘密（って、申告しちゃったけれど）[13] たくさんのわんこやヒトに出会い刺激たっぷりだったバドの一日。まったく食欲変わらずお通じ＆行動にも変化なしで、どうやらバドの逞しさは不変のようですただでさえかわいいパピーだから、犬好きならなおのこと。隠しちゃったけど友人達は、はじける笑顔でバドを抱っこ[14] そんな彼女達とうらはらにビミョーなバドの表情が笑えちゃう写真の撮り方が悪いだけ？あぁ、そうかもしれないねぇ～でもね、「かわいい」と思うだけじゃなく、「犬について」の考えをしっかり持つ犬友が側にいることに感謝なのです。家族として迎えたからには生活の、飼主人生の一部なのだもの。それは「犬」でなくても同じだけど。というわけで、これからもP－boysぽー＆バドをよろしく～",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
