    "text": "どもども、なんとなくお久しぶりです。着物イベントもなんとか終了し通常運転再開なのだ～わんずの世話を丸投げされていた相方が、「散歩中のバドがかわいすぎる」と悶えていたのはたしか週末。そうなのですバドは散歩中に、あどけない表情のまぁるい瞳で飼主をちらっ、ちらっと見るのです歩きながらなのでうまく撮れないのですが、疑似体験をどぞ[1] そして今朝は一週間ぶりに、砂浜へ行ってきました～楽しげだけれど２人ともヘン顔になっとる。[2] 先週9.4kgだったバドですが、なんと10.7kgに まだまだ小さく、筋肉もできていないし細いのですけれどねぇ。動物は遊びながら獲物を捕らえる練習をするそうですが、ぽーとバドの遊ぶ様子からそれを実感できちゃいます[3] さすがにこのまま首をぶんぶん振ることはありません 耳を掴まれるのが苦手なバドは時折「うきゃー」と鳴きます。[4] こんな写真ばかり載せていると、常にぽーが無茶をしているかのようですが・・あくまでも遊び、しかもオトナなぽーですから大丈夫怪我をさせることはありませんし、バドが鳴けばすぐに解放。するとまたバドが自ら向かって行く、という繰返しなのです[5] どちらかというと、バドの鋭い乳歯でぽーに所々すり傷ができています。ぽーの寝込みをバドが襲うこともしばしばですし あ！乳歯のことも書きたいのだった～また次回にしよっと。バドの成長によるものか、追いかけっこもサマになってきましたょ遊んでいる最中にぐうぜんハナつんの図。[6] こちらは先週の写真ですが、おもしろい画になったので ぽーはずりずりの真っ最中なのです。[7] ぽー＆バド、今日もとても良い顔になりマシタ しかし、これからも二頭で、トモダチたくさんとで、そして飼主たちと「楽しい」をたくさん経験するのだ～[8]",

    "text": "バドを迎えてちょうど１ヶ月。ぽーさん、バドとの暮らしはいかがですか？[1] もともと犬同士で遊ぶのが好きなぽー。そのためか翌日にはバドと遊んでいたように思います。しかし、のんびりしているところを邪魔されたり、ぱたぱたわさわさ騒がしいのは苦手[2] それでもぽーの怒りかたは中途半端で、その場を離れるかもしくは私たちに任せるつもりらしい。そんな様子だからぽーに怒られても懲りることのないバド 水を飲んでいるとき、バドが飲みに来るとすんなりと譲るのは今も同じ。ネットや本には「先住犬を優先」とあるけれど、それについてもぽーは気にしていないのかもしれない。やはり教科書やネット情報の通りではないですねぇ。なので我家はできる範囲で「平等」路線[3] 子犬だからか性格からか、ぽーには全く遠慮無しに見えるバド。他の子にしたことあるのにバドにはマウントを一切せずのぽー。上下関係がすでについているということだろうか[4] そんな穏やかぽーですが、遊びとなるとそれは別。ちょっとバドが鳴いたくらいじゃ手を緩めない[5] ある日、押さえ込まれてばかりのバドが反撃にでた。牙を剥き悪魔の顔で執拗にぽーにアタック。ところが、ぽーの本気な一喝であえなく撃沈なんだ、ぽーも本気で怒ることあるんだ。そうか、本気で怒られたらバドはわかるのだ。遊びの中ですでに上下関係がついていたのかもですね[6] まぁしかし、負けてばかりのバドは悔しいままだねぇ子犬なバドもかわいいけれど、早く成長して対等に遊べるようになるといいなぁ。しかしそうなると２人の関係はどうなるかしら遊び方も激しくなってきたふたり。テンションあがりそのうち怪我をしそうデス。飼主がタオルを投げる準備をしておかねば。１ヶ月後にはどんな生活になっているのだろ～[7]",

    "text": "昨日のこと。いつもの砂浜へやってきたぽー＆バド。ほどなくしてトモダチが到着。「行ってよいょ～」の合図とともに走りだすぽー。ところが、数十メートル先でぴたりと止まり伏せる。[1] そしてまた少し移動してはぴたり・伏せ・じーっと観察。ぽーに観察されていたネオちゃんも同様に、ぴたり・伏せ・じーっ。バドは意味がわからずまわりをうろうろ[2] 初めて見るぽーの行動に、みなでびっくりの大笑いの感動なぜなら、「ぴたり・伏せ・じー」の一連の動き。それはボーダーコリーのネオちゃん特有の行動だったからなのです。一緒に遊んでいるうちに覚えたのでしょうねぇしかし、遠いワ。あまりにも遠い位置から始めすぎだょ、ぽーさん。というか、バドどさくさにまぎれてゴミを拾うな～[3] 数分後にようやく対面を果たせたふたり。追いかけっこに海へどぼんの大はしゃぎはいつもの通り[4] さてさて、こちらではラブリー洋服むっちり背中の彼女が、ナゼか足の間にすっぽりと挟まっております[5] なぜこんなことになっているのかは、後ろに見える虎柄のおしりがヒントなわけでして・・・ネオちゃん＆ぽーの遊びに乱入しようとした虎柄の子[6] じゃまをするなと、追い出され、[7] 向かった先が木枝をひとり堪能中な彼女の元 いつしか興味は枝から、「コナイデ」と逃げる彼女に変わり、[8] いつまでも、どこまでも虎柄の子はついて行く。そして・・[9] こうなったというワケなのです[10] [11] ごめんねぇ、むぅちゃん。しかしだな、バドはあなたが好きらしい。なのでこれからもよろしく～またたくまに日は暮れて飼主達がまったり夕焼けを眺める頃。元気にまだまだ走りまわる影がみっつ。[12] 休憩しているネオちゃんのすぐそばを駆け抜ける兄弟。[13] いつの間にかバドもウィペットらしい走りになってきました[14] 手加減をしつつの遊びで消化不良気味だったぽー。思いっきり遊んで走って、大満足のごキゲンぽーになりマシタ。みんなありがとう～[15]",

    "text": "落差の激しい週末のこと（笑）。土曜の午前中は近所の愛宕山古墳へ。日本全国に同名の古墳があるそうですょ。こちらの古墳は全長６３.８mと小ぶりな前方後円墳。[1] 石室跡まで整備されたなだらかな道が１５０mほど。なかなかの快適散歩コースでした ただ近所のわんこたちに「貴様ら、何者だっ」と言われますけど[2] 午後からは、ご近所さんが足遣いをされている人形浄瑠璃の観劇に。写真O.K.の舞台だったのですが、それを知らずiphoneではうまく撮れず 他団体の演目での写真ですがどぞ[3] 黒子たちが人形の「頭・手・足」をそれぞれ担当して操り、そこへ太夫のナレーション＆台詞、三味線などの効果音＆BGMが加わる。全てが息ぴったりに合うことで、人形に魂が吹き込まれるわけですょ。な～んてえらそうなこと書いたけど、十数年前に文楽行ったきりなんですけどね古典だけでなく、創作も多くそれがまた面白く楽しかった～さて充実した一日となった土曜とはうってかわり、雨模様で予定していた庭仕事もできずの日曜。屋内でぽー＆バドと戯れ、ポテトチップス＆プレツェルを作りこんな調子[4] え？外が明るいって？ 気のせいですよぅ～～指示しなくてもゴハンの前でおとなしく座っておける良い子のぽー。こっそりサラミをぺろっと舐めてたの知ってるけどね[5] ただし、この良い子ぶりは飼主たちの前でだけ、なのです。友人・知人がいるときは「このヒトなら」と、カオのそばでふんすんふんすん鼻息ならしますので要注意。ぽーの良いとこだけバドが見習ってくれたら便利なのだけどなぁ～しかし、なんと恥ずかしい食卓風景なのでしょねぇ～月曜の今日はとっても良い天気ひまひま光線を送ってくるコがいるので、どこかへ連れて行こうかな。[6]",
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
