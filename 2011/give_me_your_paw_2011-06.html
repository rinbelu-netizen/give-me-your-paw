    "text": "今日のこと。いつもとは勝手のチガウ実家散歩days。先日のような森の公園に行ったり、ロング散歩をしてみたりけれども、どうも体力を持て余し気味のぽーさん。普段はどこまでも続く砂浜を走ったり、廻りを気にせずわんこ友達と遊んだり。そんなことを毎日のようにしているものなぁどこかないかしらと探したら「銀木犀」を発見実家からは高速を使いつつ４０分ほどです。ひと月に一週間のみOPENのドッグカフェ＆ドッグラン（しかも今月は明日まで開いてるやん～♪）お店のわんこはサルーキー３頭だしボルゾイもいたそうです。しかも５月には「サイトハウンド祭」なんてやっていたのだというわけで、行ってきました[1] 広い。とにかく広い。約1,000坪らしいですが、休憩用ベンチはランの隅っこ。さすがサイトハウンドオーナーさんが作ったランです[2] ２時間かけてここへ来ていたラブちゃんたち。[3] ぽーはこの数日間を取り戻すかのように大はしゃぎ[4] 広～～～いラン内をめい一杯使って走るぽー[5] 遊び始めはハーネスを着せたまま。広いランをひたすら走って遊ぶぽーとわんこたち。レスリング遊びをするふうでもないので油断してしまいました[6] 水たまりの泥でハーネスが汚れるとカフェに入れないワ～なんて考えで脱がせて遊ばせていたところ、ぽーの左側面にわんこが正面から追突歯があたりケガとなりました治療は局所麻酔で中（筋肉）を２針、そして表皮を５針。ケガ直後はキャンと鳴き痛そうでしたが、「帰りたくないーまだみんなと遊ぶ！」という状態でぽーは元気ですょ～皮膚の薄いウィペット。ケガをしやすいことも見聞きして知っていました。いつかは直面するかもと覚悟していた縫うケガ。幸いにもケガをした場所は、サイトハウンド多頭飼いオーナーさんのラン。同じような怪我をよくするということでとてつもなく心強かったです追突しちゃったわんこの飼主さんからは連絡先を頂きました。でも、犬同士だもの。楽しく遊んでいたのだもの。ましてや故意ではないのだもの。ハーネスを着せていたままであればケガせずに済んだかもです。ぽーは痛い思いもせず、皆で楽しく遊び続けられていたのにね遊ぶこと大好きで、こんなに笑顔爆裂になるぽーなのだ。[7] たくさん遊んでたらケガだってするのだ。そしてそんなケガをしないように気をつけるのが飼主のつとめ。８月で２歳になるぽーさん。反省＆勉強になりました。抜糸は約２週間後、とにかく治さないとね。いまのぽーさん、ちょっと任侠ぽぃ（疲れて眠いのでこんな表情です。心配なさらずに～）[8] あぁ、しかし遊びの予定たくさんあったのになぁ・・・みなさまこれから連絡いれますぅ～～",

    "images": [
      "https://stat.ameba.jp/user_images/20110613/14/rinbelu/28/47/j/o0399029711288094000.jpg",

    ],
    "text": "今日のこと。実家より戻ってまいりました[1] しばらくは「治療経過」ブログになりそうですが、のんびりお付き合いくださいませ～病院選び、行くタイミング、治療方針などなど。飼主としてこれらの判断・決断をすることはホント難しい そして病院に任せきらず、自分で調べておくことは常に必要だと改めて感じているところです。今日の写真とともに、経過を記述してみマシタ。6月８日水曜日 ケガをした当日。『同じような傷の場合には、いつも皮膚を引っ張り縫ってもらう』と、サイトハウンド飼いでもあるランのオーナーさんのお話。そのアドバイスを元に治療開始。抗生物質の錠剤を処方され、抜糸は１０日～２週間後。抜糸までとくに通院は必要なしとのことでした。[2] 6月11日土曜日 前日からうっすらと一部で血が滲み、５mmほど傷が開いたため同病院にて受診。炎症止め入りの塗り薬を処方される。6月１３日月曜日 出血も炎症もおさまったのですが傷口がさらに開いたこと、抜糸に備え傷を診てもらっておくため。さらに気になることを訊ねるため、いつも通っている病院で受診。なんと今まで使用していた塗薬はステロイド軟膏でした（説明書に記載されてたじゃないか）炎症には効果はあるが傷を治す効果はない。ということで、組織再生効果のある塗薬に変更。ついでに抗生物質の錠剤も止め、以前に処方されたことのある抗生剤に変更してもらいました。なぜなら、ごくごく僅かですがおなかが緩くなっていたから。１歳以降、何があっても何を食べてもおなかを壊さないぽー。そんなぽーが抗生剤と軟膏を処方されてからゆる～いのです。形もあるし気にする程度でないかもだけどこの際、変更っ[3] 傷口を下側にして寝たり、布団でごろごろずりずりしたり。散歩に出ればギャロップ程度には走っちゃう。おとなしくしない&できないで、傷口開いたのかと考えていたけれど。軟膏のせいもあったかもしれません怪我をした当初に通っていた病院。先生は無類の動物好き、犬好きなのです。炎症はたしかに治まったのです。傷の状態が今とは異なるので、11日の処置はその時点では正しかったのかもしれない。しかし、もう縫い直せないこともあり訊ねなかったけれど、縫い方はどうだったのかしらなんて考えちゃう。今の病院だってまだ１００％信頼できるわけではないけれど・・・けれども、なのだ怪我を回避できるよう努力してやれるのも飼主。病院を選ぶのも、治療法を選ぶのも飼主なのだ。傷痕が残るのは仕方ないとしても、とにかく早く治して遊ばせてやりたい治ったら河川敷や砂浜で思いっきり遊ぼうねぇ[4] いや、今はおとなしくしてておくれ",

    "text": "塗薬を変更し１日経過した今日。傷口も乾き経過良好です～～ケガの話ばかりもナンですので、本日はチガウ話題を。ぽーは『whippet（ウィペット）』という犬種です初めてウィペットを見るヒトからは、鹿やカンガルーと間違われたりするぽー。そういえば「犬ですか？」と聞かれたこともあったなぁところが『犬＝ウィペット＝ぽー』に慣れると、妙な現象が起きるようなのです・・・よく利用している地元の産直市場での出来事相方が市場の片隅に小屋と動物を発見しマシタ。「ぽーみたいな細い犬がいるょ～」おぉ、ほんまやぁ！しかも二頭もいるやん と、返答するワタシ。[1] 車を降り２人でわくわくしながら『細い犬』のそばへ～[2] 「・・・あれ？なんでしたっけ、この動物？？」[3] ですねぇ。ヤギさんだね どうやら私たちの脳は『細い動物＝犬』と、認識するようになったらしい[4] 子ヤギなんて細い犬にしか見えないじゃないか～もうね、『犬＝細い犬』にまでなっているかもですょ。これぞ「ウィペット症候群」（実はブリーダーさんのブログタイトルなのです）ヤギで埋め尽くされた本日のぽーブログ。〆は私の後ろでつまらなさそ～にしているぽーの姿をどぞ[5] ぽーさん、散歩に行こうか～～",

    "text": "塗薬＆抗生剤を変更して通院３日目。傷の具合も良いし、おなかも復活してきました～「走ること」「遊ぶこと」大好きぽー。けれどもさすが動物の本能か、自分の状態を解っているのか、ケガをしてからの数日は散歩も短めで帰ると言い出す状況デシタ。わんこに出会うと「遊ぼうょ～～」となるけれど全力疾走するとさらに傷口が開くので河川敷も砂浜も禁止。そろそろ体力を持て余し気味になってきたようです。なので今朝は少し長めの散歩をしてきました。[1] 傷口は１／３が開き、筋肉を縫った糸も見えている状況。皮膚がすでに乾き硬くなっているため縫い直しは不可能皮膚組織が再生し筋肉を覆い塞がるまでは走るの禁止なのだ。縫い目が解けたせいで治りも遅いのです「やはり軟膏のせいで傷口開いた可能性あるのでしょうか？」「多いにありえるなぁ。」「・・・正直、縫い方についてはどう思います？（聞いてしまった！）」「うーん、それは言えないなぁ。」あぁ、先生、ありがとうです。あの日に縫ってもらったこと自体は、あの時点では最善だったとかろうじて思えました[2] 今の病院は去年の秋にもケガでお世話になりマシタ。（そのうちブログに書く予定です）先日の日記にも書きましたがまだ100%信頼はできていません。が、納得のいく返答を頂いているおかげで、この病院に通っていてよかったと今のところ思えています。ケガや病気でお世話になるからこそ判っていくことかもなのですよねぇ。なるべくならお世話になりたくないけれど ところで、散歩中ずっと笑顔のぽーさん暑くて口が開いてるのもあるけど、なんだか嬉しそうやん～試しに歩いて来るぽーを連続撮影。[3] ふむふむ。[4] やっぱり笑顔じゃないかぁ～ぽーさん～～[5] ぽー～～～～[6] か、かわいすぎる・・・よしっ、１日でも早く治して走りに行こうっ",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
