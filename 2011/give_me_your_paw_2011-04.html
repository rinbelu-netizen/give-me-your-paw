    "text": "数日前から花梨の花が咲き始めました。[1] 日本にいる皆が春を楽しめるようになれればいいなぁ・・[2] 散歩を済ませ、用事をこなしていると雨が降り始めました。今日は外で遊べないねぇ。ということは？行こうか、動物病院へ。４月で犬といえば「狂犬病予防」フィラリア薬も忘れずに。暖かいこちらでは４月～１２月まで与えます。フィラリア抗原検査で採血されるので、ついでに血液検査も受けちゃおぅ。採血量は1ml。数秒間すこし震えていたけれど、ぽーはじっと我慢。上半身を抑えていたため見えなかったのですが、採血場所は左後脚の血管だったようです。そうそう、ココの血管は浮いててめちゃ採り易そうだったのよね。[3] 検査結果が出るまで診察室にて待機。ぽーさん、何やら不安げな面持ちですね[4] いえいえ、ご心配なくですょ～待合室から聞こえるわんこの声、隣の診察室に入るわんこの様子を伺っているのです[5] 幸いにも病院が平気なぽー。診察台の上はちょっと怖いところのようですが。瞬時にトップスピードを出すウィペット。心臓が大きく脈が遅い特徴があります。血液検査も基準値に収まらないかもしれない。そんなことも考え、健康な時に数値を知っておきたかったのです。血液検査の結果は『問題なし』ヘモグロビン数が多めですけれど・・朝からほとんど水分採っていないからかしら。記録も兼ねて羅列。（ ）は病院で示された参考正常値です。ウィペット♂ １歳７ヶ月 17.7kg 白血球数 13,000/μl 赤血球数 7480,000/μl ヘモグロビン数 44.8g/dl ヘマトクリット値 51.5% 血小板数 1560,000/dl 平均赤血球容積 68.8fl 血糖 104mg/dl (79~131) 尿素窒素 14.3mg/dl (9.1~31.9) クレアチニン 0.8mg/dl (0.5~1.4) ＧＯＴ 22U/l (16~49) ＧＰＴ 48U/l (23~89) ＡＬＰ 263U/l (68~318) これからは、これがとりあえずのぽーの基準値。個体差も犬種差もあるので、こうしてデータが一つあると少し安心です。データが少ないといえば、東京大学農学部 獣医動物行動学研究室にて、興味深い取組みが行われています。柴犬の常同障害（尾追い行動）を遺伝子上から探索するもの。そのために柴犬と飼い主さんたちに協力を求めています。採血、血統書コピーやアンケートなどの負担もありますし、柴飼いではないので強く勧めることもできません。が、心臓肥大と誤診されたり、麻酔に弱かったり（最近の麻酔薬では大丈夫らしいです）、基本データの少ないウィペット飼いとして、このような取組みがなされることを羨ましく思うのです。友人のペットも症例の少ない病気で不安な思いをしており、ついつい書いてしまいました。尾追い行動をする子だけでなく、しない子の遺伝子情報も必要です。興味を持たれた方はこちらを見てやってください。私がよく訪れるブログ→dog actually 実際に研究を行っているラボのページ→東大 獣医動物行動学研究室 ぽーさん、帰宅後にひと眠り。馬レバーを食べて再び爆睡中～",

    "text": "今朝のこと。いつもと違う場所での散歩。[1] 久しぶりの雨と強風のおかげで、空気も空も澄みとても気持ちが良いですねぇ[2] 穏やかな朝だなぁ～カラスが小競り合いをしているけれど、それもまた一興というわけで[3] おや、ぽーさん何かやっているょ？遠くて見えないけれど『警備艇』もいるのかな。[4] 河原にも大きな機械があるぞ。んーとても気になる・・・川岸に居た作業員さんに尋ねてみたところ、「川底と河原の地盤調査」だそうです。南海地震に備えてのことなのかさらに質問。河の地盤調査自体は珍しいことではないのだが、今までがいい加減な調査だったため、大地震に備え再調査しているとのことデシタ。[5] なるほど～たしかにボーリングっぽい作業のお邪魔をしたにもかかわらず、丁寧に説明頂きありがとうございました～海に接し河川の多いこの地域。今までいい加減だった、というお話は笑っちゃう。けれども今回の震災をうけて、この時期に改めて調査していることはちょこっと頼もしい。結果からどんな対策が講じられるのかな。何事もできるだけ、前向き、ポジティブに考えよう。飼い主が大きな機械に興味をそそられ、作業員さんの手をとめ話を聞いているその間。[6] ぽーは堤防の調査をしておりました",

    ],
    "text": "ぽーとの生活を初めて１年５ヶ月。室内飼いをしていると、常に犬の様子を見ることができ、信頼関係も早く築けるように感じます。リンとベルは外飼いでしたけれど、彼らとの生活は２０年近く。ぽーと同じ年齢の頃どうだったか記憶は曖昧ですが、これからのぽーとの暮らしを考えると楽しくて仕方ない[1]「私の横で眠るぽー」たかが犬、されど犬。様々な表情、行動がとてつもなく面白い[2]「シャンプー前の渋々ガックリなぽー」ニヤニヤしながらPCとリアルのぽーを眺めていると、dog actuallyにて興味深い記事が更新されていました。これから犬を飼う人はもちろん、すでに飼っている人も読んで一緒に考えよう。というわけでリンク貼りますネ→『犬を飼う覚悟』ドッグランやペットO.K.施設など、犬や飼い主同士が交流する機会も増加。犬を飼っている友達はもちろん、飼っていない友人とも貴重な時間を共有。そしてもしかしたら、訓練や躾がきちんと施された犬ならば、犬が苦手な人の恐怖心を僅かでも和らげるかもしれない。嫌いな人に好きになってもらうという意味ではなく、すれ違うときなどなるべく怖い思いをしないように。ホンネを言うと犬好きとしては、皆がわんこ好きになって欲しいですけれどね～私たちの躾ができていると言うより、ぽーの性格にほとんど助けられている犬生活。攻撃性はないけれど、制御できていない部分が多々あります。犬との暮らし、犬の居る生活。ぽーとの毎日をより楽しむための躾。しつけの為にはその犬の個性や、行動などを把握することも重要ですよね。というワケで、もっともっとぽーを理解するために、本日はこの辺りで失礼します～[3]",

    "text": "今朝のこと。工場見学へ行ってきました。ぽーはもちろんお留守番。[1] こちらは文政９年創業のお醤油屋さん。文政９年＝１８２６年 徳川家斉が江戸幕府将軍だった頃。現在のご主人は８代目だそうです。カメラを忘れてiphone撮影なのですが・・・[2] この柱はたぶん江戸時代のものだそうです。資料が残っておらず詳細は不明だとか。色々なお話を伺ったわけですが、ひとつだけご紹介。「うすくち醤油」について。濃口よりも塩分濃度が高いことは、皆さんご存知だと思います。原料はどちらも『大豆・麦・塩』。「うすくち」は色がつかないよう加工しているので、味や香りの面で濃口の方がお勧め、とのお話でした。その時に質問できなかったため、帰宅後に調べてみました。色がつかない加工とは？・麦を浅く煎る・酒を加える なるほど納得。二年熟成のお醤油をお土産に頂き、サシミ醤油とお味噌を購入。そして今晩のメニューは、焼きナス、焼きしいたけ、冷や奴にお刺身なのだ。さてさて、帰宅後すぐのぽーはこんな感じ。[3] チップスターの外箱が朝とは違う場所に（笑）びみょーに部屋が汚いな・・膝の上で甘えております[4] ぽーさん、お待たせ。雨も止んだし軽く散歩に行きましょうかね",

    "text": "昨日のこと。まんのう公園にドッグランができると聞き、オープン初日に行ってまいりました。こちらの公園自体も初めての私たち。先ずは北口料金所から入園。大人400円 駐車料金300円（普通車）デシタ。犬連れは『誓約書』が必要とのことで案内所へ。で、案内所はどこなん？？公園内を車で移動できるのだけれど、どこに向えばいいのやら広すぎる。初入園だしとりあえず、中央駐車場＆案内所を目指しましょうか。ランは「竜頭の丘」という北側エリア。こちらにも駐車場がありました。後でわかったのですが、竜頭の丘にも「案内所」があったみたぃ。同エリアで耐久マラソンが開催されており駐車場は混雑。ランナーの間をすり抜け案内所に向うことになるため、結果としては中央に行って良かったかも。『誓約書』の内容は、・犬はリードにつないでおくこと・糞の始末をする・貸しベビーカーに乗せない・トラブルは飼い主の責任・ペット同伴不可のエリアについてetc...全てあたりまえのルールですね～口頭にて「おしっこの後、水をかけてください」の注意。おしっこについての苦情が増えているためだそうです。書類には蓄犬登録した市町村の名前、鑑札番号、各ワクチン接種済の確認などを記入。さーて、いよいよ園内散策ですょ ランへと向う前に、エントランスを抜け見晴らしの良い場所へ。[1] 案内所を背にして撮った画像がコチラ 見えているエリア以外に、キャンプサイトもあるようです。[2] のんびり歩くこと１５分。ツキマシタ[3] 大型犬・小型犬エリアが設置されたドッグラン。小型犬エリアは大にぎわいで楽しそう でも大型犬エリアには誰もいない・・・[4] ウィペットは中型犬に分類されているけれど、ぽーはやっぱり大型犬エリアですよね～[5] フェンス越しに挨拶をして、ジャックラッセルテリアのジローくんが来てくれマシタ。いつもの高速SAランの3倍はある広さ。足場もよくテンション上がるぽーさん[6] そんな爆走ぶりにも関わらずわんこ達、次から次へと遊びに来てくれまして[7] ミモザちゃん＆ミッフィーちゃんのヨーキー姉妹（ミモザちゃん写真端っこでごめんネ）ぽけっとに入りそうなちっちゃさで、ぽーとの体格差にどきどきしていたのですが、なんと[8] 両サイドからぽーを追いかけたりと、見事な姉妹連携プレーも披露して元気いっぱい ぽーはご覧の通り大喜び[9] 他にもコーギーのクーカちゃんなどなど、たくさんのわんこ＆飼い主さんのおかげで、ぽーも私たちも楽しい一日でした こちらの公園、ランだけでなくのんびり散策も含め、かなり楽しめること間違いなしデス",

    "text": "２１日木曜日のこと。って、いまさらなのですが、どうしても書き残しておきたいことがありまして。地元紙のペット撮影会があると聞き、徳島市内へ行ってきたのです。（コレ本題ではないのです）バーニーズのうみちゃん、ワイマラナーのむぎちゃんと撮影会に臨みます。初めて会ったその日から、むぅちゃんの魅力にはまりこんだぽー。コマンド入らず制御できずだった初対面。今回はぽーの行動観察に集中してみようかと、あえてカメラを置いていきました。そのため写真は全て頂きものです。みんなありがと～～～３頭並んでの撮影。飼い主も写ると聞き焦る私たちですが、わんずのポーズ作りに必死でどうでもよくなりマシタ。一応ね、同じとこ見てますね[1] ラナンカフェさんのブログにも載せて頂いてマス。この後「ひょうたん島クルーズ」へ。わんこも乗れる遊覧船なのです。徳島市を囲む川を約３０分で周遊する観光船。（保険料１００円／人が必要です）１０名程が乗り込める船に犬３頭＆飼い主。そしてご一緒してくれた夫婦が一組。わんこと共にセレブに遊覧ですょ～[2] となるハズが、どたばた遊覧となりマシタ。出航時刻前に「船が出るぞ～～」と、船頭さんに促され慌てる私たち。ぽーの視線はむぅちゃんロックオン。先に乗り込んだ彼女を必死で追いかける。前足は甲板へ、そして後ろ足は川の中。はい、見事に落ちました。桟橋と船のスキマに、縦方向にすっぽりと。たまたま握っていたのか、落ちた瞬間掴んだのか記憶は定かではないけれど、片手でハーネスのベルトを掴み引き上げました。ハーネス脱げなくてほんと良かった。火事場の馬鹿力って出るものなのですね。後から気がついたのですが、片手で18kgを引き上げたのだワタシ。お騒がせぽーはというと、落ちたことなど全く気にせずこの調子[3] とはいえ、前回よりすこーし落ちついてきました。[4] むぅちゃんを撫でまわす余裕もありマシタ。コマンドも入るようになったし、あともうちょい。走っているときには運動神経の良いぽーですが、こんなことも起こるのだ。リンやベルは他の子との接触がほぼなく、ぽーを迎えてなかなか不可思議な体験をしております。特定の、しかもヒート中でもない女の子に夢中。他の♂わんこたちはどうなのでしょ しかし犬って、動物って可笑しいなぁ～うみちゃんにも励まされつつ（笑）、わふわふトリオの今後を楽しみたいと思いマス[5] というわけで、書き残しておきたい内容はコレなのでした。みうちゃん、むぅちゃんママ、うみちゃんママ、どもどもお騒がせいたしました～～～",

      "https://stat.ameba.jp/user_images/20110426/12/rinbelu/4e/b6/j/o0399053311188339125.jpg"
    ],
    "text": "昨日の日記で車内で待つぽーの様子を紹介しました。本日は別ver.の「待ってます」を この真剣な眼差し[1] 下から見ても真剣です[2] 車内にて私と一緒に相方を「待ってます」。[3] もといぽーは相方を捜しているのです[4] 後ろ姿でもあの眼差しが想像できてしまう[5] ところでぽーさん、私の存在を忘れていませんか？[6] まったく聞いてないワ",
    "truncated": false,
    "comments": []
  }
];

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
