    "text": "もうね、太陽がんばりすぎです食事量が２割ほど落ち、食べ方にも変化が起きているぽー。遊び疲れかと思っていたけれど夏バテかも。普段から食事タイムは朝夕の２回。わんこの食事風景ってそれぞれで面白いですよね～。リンとベルにも大きな違いがあったのですょ。リゾット風のものは食べにくい上に、中の方がまだ熱かったりで。（しっかり冷やしてあげようょ、飼主）食べるのがもともと下手なリンは、フードボウルの縁から舐めとるように食べる。そしてベルは、がしゃーんと、ボウルをひっくり返し床にばらまいた塊を食べていましたさてさて、話が逸れましたが、おなかがすいているときはがつがつ食べるぽー。ですが、食欲が落ちた場合はひじょーに怠慢食事になるのです。ある程度食べたら、その場を離れ・・[1] 部屋をぐるりと一周して、[2] ２、３口食べては再び部屋をぐるりと歩く、を繰返す。[3] 躾としては、「その場を離れたら片付ける」など色々あるけれど、まぁ体力落ちるのも困るし一周したら戻って食べますしねぇそれでもクッションに座ってしまえば没収なのだたくさん運動をしておなかがすいた時は、自ら台所そばでゴハンを待つほどなのですけどねぇ[4] というかだね、ぽーさん。「おいしいもの」を出しているのはワタシ達なのだょ",

    "text": "昨日のこと。むぅちゃん＆ネオちゃんと川遊びぽーにとっては水温が低かった５月の川遊びと比べると、気温・水温ともに快適でぽーも水につかって遊べるようです[1] 水に入るまで数年かかったというのが、信じられないほど余裕なむぅちゃんの泳ぎっぷり[2] そして川遊び大好きネオちゃんの華麗な泳ぎ[3] そしてぽーも泳ぎますょ～って、[4] 奥で静かに泳ぐむぅちゃんとナニカチガウ[5] ネオちゃんが、飼主たちもが皆で見守りたくなるほどの、[6] 激しい（ヒドい）泳ぎっぷり。どしたの、その水しぶき？泳ぎ方をわすれたのか[7] と思っていたけれど、さすがアスリートぽーさん。何度か泳ぎを繰返しいぬかきも安定。海に比べ浮力が小さいので戸惑ったのかしらねぇ。泳げるウィペットだけれど、ぽーの得意はやはりアレですよネ。陸にあがったネオちゃんを誘って、[8] はるか彼方へと追いかけっこの旅[9] 砂場を見つけてさらに大はしゃぎ。ネオちゃんまで変顔になってる[10] 休憩しなさいと言われたむぅちゃんは、[11] これまた大好きな『石拾い』を堪能中[12] たくさん遊んだらドッグカフェ楓でエネルギー補給。[13] 「イヌ」が変わるほど楓のおやきが好き過ぎのむぅさん[14] ぽーのおやつは河原に落ちてたイノシシの骨を・・[15] って、もちろん冗談ですとも体力使いひもじい子になっていたぽーは、おやきのお替わりもぺろりと完食。筋骨隆々で浮きにくいせいか泳ぎにかなりエネルギーを使うぽー。水に入ることも嫌がらず、どちらかというと皆と一緒に川で遊びたそう。というわけで帰り道、ドッグジュビリーにてライフジャケットげっと～[16] これでさらに快適安全に水遊びができるはず。いやぁ、楽しかった！みんなありがとう～～さぁて、ライフジャケットのお披露目はいつでしょうかね～～",

    "text": "「美那川キャンプ村」にてぽーと一緒の初キャンプ１８日宿泊予定を前線降下で雨予報のため、バンガローを借りさらに１７日泊に急遽変更。コテージもバンガローもペットO.K.な嬉しい山奥のキャンプ場。完全予約制で平日のみ役場にて予約受付の公営キャンプ場。というわけで（どういわけだ？）、キャンプだし設備なども多くを期待せず、トイレットペーパーをも持参して望んだキャンプ。でしたが、バンガロー内に電気は通り、トイレは綺麗、お風呂まである。管理人さんのがんばりで至れり尽くせりな快適すぎキャンプ場デシタ国道からそれ5kmほどはガードレールのない細い道。落石注意の看板もあるけれど離合場所は随所にあり意外に快適。[1] 手掘りトンネルもあったりで探検ムードも味わえたり[2] そうこうしている間に到着、一番端っこのバンガローを利用します。各棟毎にテーブルやベンチまであるではないか[3] 6畳の室内は寝袋２つならこんなにも広い！２穴コンセントと下駄箱に荷物棚、ハンガーラック＆ハンガーまで完備[4] 難点は駐車方法で、びょーな位置に杉があるのです駐車位置を確認してからバックで侵入するなりが必要デス。横一列に並んだバンガローの前には１００m程の河原が[5] なんだか間違い探しのような画像になっていますけれどもスギ苔の天然ベッドが気に入ったらしくぽーのくつろぎ場所はここに。さていよいよライフジャケット装着の時間ですょ～[6] 細い首周りは若干サイズオーバーですが、深い胸の部分もベルトで固定できなかなかのフィット感さぁて、泳いでみようか[7] ・・・ふははは というのもですね～ここは『流れ』のある川なのです。足先が小さく背の高いぽーにとってはさらに強く感じるでしょう。浮き輪などで流れに乗って遊ぶには楽しそうですがイヌだもの[8] 川の中にいる飼主たちをこうして心配気に眺めることしかできません。浅瀬で流れのゆるい場所ならば、水の中へ入るけれど険しく楽しくなさげなこの表情[9] 小さな小さな砂場を見つけてストレス発散・・・[10] そんなぽーを広場に案内なのだ～[11] 実はこの場所はテントサイトでして、奥に見える建物は２棟のみあるコテージ。ちょこっとここで走らせてもらったけれど、日中はやはり暑い木陰にもテントサイトはあるのですがスノコが狭く、こちらは２～３人用のテントを張るのが精一杯かもです。[12] 川遊びや探検を終えたらバーベキューの準備だ～１人で勝手に散歩に行かないようぽーは３０mリードで繋留。[13] やはり３０mは長過ぎるのか、自分で短くしたようですネ[14] 安く譲ってもらった特製骨付き肉でごきげんぽーなのでした[15] ・・・つづく",

    "text": "お待たせしました～後編ですさすが山中のキャンプ場。朝晩はぽーが寝袋に潜り込んでくるほどの涼しさデシタ。朝ゴハンを先にすませたぽーはクーハンで森林浴。うろうろしなくなったから今朝は３０mリードは無しでね。[1] クーハンのそのカタチ、まるで舟のようだねぇ。舟のサイズに比べてぽーの体がチョット大きいけど[2] おっと！忘れていました、キャンプ場のお風呂情報。お湯がはられている時間は一応、１８時～２２時頃。浴室は男女別、シャンプーなども完備でシャワー２つにカラン２つ。ちょっとした民宿より快適かもですょ～[3] 川遊び以外では吊り橋があり、これが意外に揺れるのです。ぽーはといえば全く平気でふつーに下を覗いていマシタ[4] そういえば台風６号で増水し、テントサイトも壊れたそうです。山や川でのキャンプは天気のチェックがやはり重要ですねぇ。もう一つ重要情報、河原では３人ともウシアブに襲われまくり。ぽーは特に毛のないおなかを狙われ３カ所ほど咬まれました管理人さん曰く、この辺りではお盆過ぎから増えるそうです。そして黒っぽいものに集まるので「白い」服を着ればましなのだそう。それでも川でもうひと遊びしてキャンプ場を後に。ちょこっと寄り道をして『大轟の滝』へ。[5] 滝へと続く遊歩道は草に覆われ通行不可能。しかたないので道路脇からしばし眺めてみる、がアツイ[6] 吊り橋でもそうでしたが、高いところへ行くと覗きたくなるぽー。[7] と、思ったかどうかはわからないけれど、表情・様子がまさしくそんな感じで面白かったのです「このまま帰るのもったいななぁ・・」とつぶやく相方。ならば！と、地図をひろげ指差すワタシ.（我家はアナログな地図で旅行派なのだ）[8] 小浜大橋を渡り、『ミニ四国八十八か所』とやらを巡ろうではないか（この時、まさかあんなことになろうとは思いもしなかったわけで）橋を渡り左折し県道３０８号を走る。「ミニ八十八カ所」らしきモノが何も無い。いや、それよりも何よりも困ったことが起きている。[9] 運転席側には切り立つ崖が迫り、助手席側には・・・何も無い。落石だらけだし、離合場所もないしで引返すこともできない[10] まさかの状況に苦笑するしかない私たち苦しまぎれなワタシのつまらない冗談で笑う相方に、「笑うな～手元がぶれて落ちる～」と焦ってみたり。「とにかくこの先に橋があって、そこから国道に戻れるから！」相方を励ましながら進むこと３０分。ようやく少し広い場所に出たぞ～・・・って、[11] というわけで、ここでUターンをして来た道を引返したわけで。ホントの「ミニ八十八か所」は県道沿いではなく川の対岸。桜谷トンネルの両端に案内があったりして、石仏が８８体あったりして、道も整備されてたりなんかするらしい・・・地図ではどう見ても黄色の県道より、白い対岸の道の方が狭そうじゃないかあぁでも、家に帰れてヨカッタ。ブログの更新できて良かったよぅ～そんなオチありのぽーと一緒の初キャンプ。お待たせしたうえに何がメインかわからない「後編」ですが、私たちにとってはこれまた楽しい夏の思い出になりマシタ次はわんこ友達とコテージなんぞを利用したいなぁ。[12]",

    "text": "相方の愛車はホンダのビート91'～96'年まで販売されていたオープンカー。以前ブログにも載せたことがありますが、幌をあげオープンにするとこんな感じ。[1] リアウィンドウは折り畳めるようシート状になっています。そしてこれが経年劣化で曇ったりヒビが入ったりするのです。３年前の写真ですが、こうなると後ろは全く見えません[2] 純正なら３万円弱、オークションなら５千円くらいであるけど面倒。そこで３年前に試みたのが「ビニールシートで代用作戦」これが意外にうまくいき最近まで使えていました。当時はミシンもなく手縫いでがんばったリアウィンドウですが、縫目がほどけ上から半分くらいがだら～んと恥ずかしい状態に今ならミシンもあるし楽々できるぞ～と、0.5mm厚ビニールシート＆厚地用糸を購入して合計６００円ほど昨日、ぽーが見守るなか昼からのんびり制作。[3] さてさて、このリアスクリーンの脱着が私的にはチョット面倒事。外側の幌と一緒に合計１０本のビスで車本体に固定されている。そのうち４本はトランクの内側にあるのだ。そして車内側にて幌とファスナーで止める仕組み。「ぴしっ！」とたるみなく張った状態なので、脱着の順序も重要でもね屋内作業は涼しいしミシンあるし、ぽーもいるしで楽ちんなのだ２時間少しで完成したぞと、さてビートにつけようか。ファスナーを先に閉めちゃうと、引っ張られすぎてビスが入らないのよね～。ビス１０個完了、はいっ！！ファスナーが閉っまりません～・・・ビニールシートをですね、「ぴしっ！」と張りながら縫ったせいでですね、ゆとりがなくなりファスナーに届かなくなりマシタあぁ、そういえば、３年前に手縫いをしたときはあえてたるみ取ったかもなぁ～～暑いし、なんだか急に土砂降りになるし蚊はいるし・・・[4] 気を取り直してもう一度。シートを必要な倍の１m買っておいてよかった普通の布と違ってたるみを持たせて縫うのが大変。まるめてみたり縫う順序をかえてみたりと悪戦苦闘。[5] 完成度が低くて納得いかないけれど、なんとか無事装着。中断したりもあり完成したのは１９時頃。[6] そして今朝「視界良好！恥ずかしくなーい」とご機嫌出勤な相方[7] だけど、だけど、やはり納得いかない仕上がりだ～～＊数年後のワタシへスクリーン縫うときは「ゆとり」をもたせることバイアスで裁つ。１６号針→細くしてみる。しかし数年後、この記事を書いたことを覚えているのだろうか。覚えているあいだにまた破れないかな～～",

    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>

</body>
</html>
