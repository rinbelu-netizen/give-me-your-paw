    "text": "昨日のこと。テレビを消し外へ出ると、すでに春がやってきていました。[1] そしてぽーと一緒にのんびり廻りを眺める。東日本で起きていることは夢だったのではと、錯覚してしまうほどの平穏な日常がありました。[2] けれども、情報源から離れても、やはり気になります。１２日に長野県でも大きな地震がありました。そちらの状況はどうなのでしょうか。東京の弟や千葉の友人からは、まだ余震を感じると聞いています。津波警報は日本全国を取り囲み、東北以外でもたくさんの方が犠牲になっています。わたしたちの住む県でも津波により、床上・床下浸水、漁船の転覆、養殖いけすの被害がありました。全国テレビではあまり報道されていない地域の状況。関東在住のウィペット仲間たちが、テレビや新聞以外の情報を知らせてくれています。彼らが実際に体験した様子。千葉の海沿いでは液状化現象が起きていました。訪れたことのある方も多いのではないでしょうか。たくさんの写真を掲載してくれています。まめしばのブログ。津波の被害を受けた茨城県日立市にて、身内の方が被害に遭われています。ロン！まめしばさんは看護士さんで、宮城の病院から食料・燃料のSOSを受けています。ロンママさんのご姉妹宅ではようやく電気が戻ったようです。それでも、家屋や子供たちのことに水の確保。想像するだけでも途方に暮れてしまいます。近いうちに起こると言われている、東海・東南海・南海地震。災害グッズを揃えるだけではなく、実際にどのような行動ができるか。そしてどう行動するかをも常に、考えておくべきだと気付かされました。東北での被害はとてつもなく甚大ではあります。が、東北地震ではなく『東日本』大地震なのです。",

    "text": "仙台港や青森などに物資が届いたと、今朝のニュースで流れていましたね。茨城・千葉ではボランティアが活躍。東北方面にも派遣されつつあるようです。登録人数も続々と増加中だとか。ボランティアをしていない私としては、ほんとうに頭の下がる思いです。ただ被災地ではまだ余震も続いています。水・食料に燃料も不足している。まだまだ想像を超える状況の現場です。災害ボランティアは『自己責任』が鉄則。万全の準備とともに、二次災害にも気をつけてくださいますように。日本獣医師会などで組織されている、『緊急災害時動物救援本部』こちらの情報によると、青森県・宮城県・仙台市・岩手県・福島県に、動物救援物資の拠点を確保したようです。もの言えぬ動物たちにも、ようやく救いの手が届きそうです。悪い知らせとしては高知県で津波により、養殖のハマチなどが大量に損害を受け、被害総額は今のところ２３億円とのこと。そして、１３日に新燃岳では再び噴火が起きています。ニュースは次々と新しいものが報告されますものね。各地で被害が起きており、そして災害地の復興には時間がかかるということ。忘れないようにしなければ。そのような中、一石二鳥の取組みがあるようです。（表現が不謹慎かもしれませんが・・・）『野菜サポーター』噴火被害を受けた宮崎野菜を買い、地震被害での炊き出しに使う。というものです。気になった方はどうぞ「野菜サポーター」で検索を。リンクを貼れば良いことなのですが、私のちっぽけなポリシーなのです。とくに募金や物資援助に関しては、簡単にアクセスしてもらうのではなく、ちょっとひと手間かけて考えて行動してもらいたいので。面倒なやつでスミマセン。では、ぽーのお話。さいきん体重を量っていなかったのですが、抱き上げると とっても重い。塊のような硬い重さなのですょ。体重測定の結果 17.9kg。17.5～.6kgをキープしていたのですが、また増えとるやん。運動量もさらに増えているしなぁ。健康だから良いのですけれどね。そして車内用に購入したクーハン。体も伸ばせる、あごも乗せられるで快適なようです。[1]",

(function() {
  const seen = {};
  entries.forEach(function(e) {
    const key = e.date;
    seen[key] = (seen[key] || 0) + 1;
    e.id = 'e' + e.date.replace(/\./g, '-') + '-' + seen[key];
  });
})();


// ---- render ----
const allTags = [...new Set(entries.flatMap(e => e.tags))];
let activeTags = new Set();
let keyword = "";

function highlightNums(text) {
  return text.replace(/\[(\d+)\]/g, '<b>[$1]</b>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderTagFilter() {
  const el = document.getElementById('tagFilter');
  el.innerHTML = allTags.map(t =>
    `<button class="tag-btn${activeTags.has(t) ? ' active' : ''}" data-tag="${t}">${t}</button>`
  ).join('');
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      renderTagFilter();
      renderEntries();
    });
  });
}

function matches(entry) {
  const tagOk = activeTags.size === 0 || entry.tags.some(t => activeTags.has(t));
  const kw = keyword.trim();
  const kwOk = kw === "" ||
    entry.title.includes(kw) ||
    entry.text.includes(kw) ||
    entry.tags.some(t => t.includes(kw));
  return tagOk && kwOk;
}

function renderEntries() {
  const main = document.getElementById('main');
  const filtered = entries.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} / ${entries.length} 件表示中`;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  main.innerHTML = filtered.map(entry => `
    <article class="entry" id="${entry.id}">
      <div class="entry-head">
        <span class="entry-title">${entry.title}</span>
        <span class="entry-date">${entry.date}</span>
      </div>
      ${entry.images.length > 0 ? `
      <div class="photo-grid">
        ${entry.images.map((src, i) => `
          <a href="${src}" target="_blank" rel="noopener">
            <img src="${src}" loading="lazy" alt="${entry.title} 写真${i+1}">
            <span class="num">${i+1}</span>
          </a>
        `).join('')}
      </div>` : entry.photosLost ? `<p class="no-photo">（写真は掲載されていましたが、保存されていないため表示できません）</p>` : `<p class="no-photo">（この記事には写真がありません）</p>`}
      ${entry.truncated ? `<p class="truncated-note">（＊続きは読めない）</p>` : ''}
      <p class="entry-text">${highlightNums(entry.text)}</p>
      <div class="tags">
        ${entry.tags.map(t => `<button class="tag-pill" data-tag="${t}">${t}</button>`).join('')}
      </div>
      ${entry.comments && entry.comments.length > 0 ? `
      <div class="comments">
        <div class="comments-label">コメント（${entry.comments.length}件）</div>
        ${entry.comments.map(c => `
          <div class="comment">
            <div class="comment-meta"><span class="author">${esc(c.author)}</span>${c.date ? ' ・ ' + esc(c.date) : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </article>
  `).join('');

  main.querySelectorAll('.tag-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTags = new Set([btn.dataset.tag]);
      renderTagFilter();
      renderEntries();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  keyword = e.target.value;
  renderEntries();
});

renderTagFilter();
renderEntries();
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({block: 'start'});
}
</script>
